<text x="79" y="716" class="h">Zasilanie i masa / Power and ground</text>
<text x="79" y="754" class="small">ESP zasil przez USB; VCC konwertera z 3V3.</text>
<text x="79" y="785" class="small">Nie łącz GND TTL z izolowanym SGND.</text>
<text x="79" y="816" class="small">Nie podłączaj VCC do portu falownika.</text>
<text x="79" y="855" class="small muted">Power ESP via USB; converter VCC from 3V3.</text>
<text x="79" y="886" class="small muted">Do not bridge TTL GND to isolated SGND.</text>
<text x="79" y="917" class="small muted">Never connect VCC to the inverter port.</text>
<text x="650" y="716" class="h">Transmisja / Communication</text>
<text x="650" y="754" class="small">A/B: jedna skręcona para. Terminacja 120 Ω</text>
<text x="650" y="785" class="small">według magistrali. Kierunek automatyczny:</text>
<text x="650" y="816" class="small">bez przewodu DE / RE i bez GPIO4.</text>
<text x="650" y="855" class="small muted">One twisted pair for A/B; terminate as needed.</text>
<text x="650" y="886" class="small muted">Automatic direction: no DE / RE or GPIO4.</text>
<text x="650" y="917" class="small muted">Default: 115200 • 8N1 • Modbus address 1.</text>
<text x="1222" y="716" class="h">Zakres / Scope</text>
<text x="1222" y="754" class="small">Tylko wskazane modele i port HIT-G3.</text>
<text x="1222" y="785" class="small">Dostosuj platformę ESPHome do S3;</text>
<text x="1222" y="816" class="small">domyślny YAML używa esp32dev.</text>
<text x="1222" y="855" class="small muted">Named hardware and HIT-G3 port only.</text>
<text x="1222" y="886" class="small muted">Adapt ESPHome board/platform for S3;</text>
<text x="1222" y="917" class="small muted">the default YAML targets esp32dev.</text>

<rect x="54" y="966" width="1692" height="84" rx="14" fill="#fff0cc"/>
<text x="79" y="1000" class="label" style="fill:#82521a">Przed pracą odłącz wszystkie źródła: AC, PV, bateria, EPS / GEN — zgodnie z instrukcją falownika.</text>
<text x="79" y="1033" class="small" style="fill:#82521a">Isolate all energy sources. A qualified person must verify absence of voltage. This diagram covers communication wiring only.</text>
<text x="54" y="1080" class="small muted">Autorski schemat / Original schematic • 2026-10-03 • Źródła połączeń / Wiring references: docs/WIRING_ESP32_S3.md</text>
