<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">ESP32-S3 → TTL / RS485 → Hoymiles HIT-G3 — six connections / sześć połączeń</title>
<desc id="desc">Logical wiring diagram, not physical pin placement. ESP32-S3-DevKitC-1 v1.1: 3V3 J1.1 to converter VCC; GND J1.22 to TTL GND; GPIO17 TX J1.10 to RXD; GPIO16 RX J1.9 from TXD. Isolated Waveshare TTL TO RS485 B: A+ to Hoymiles HIT-(5–20)L-G3 COM2 485_2+; B− to 485_2−. SGND unconnected in this example, never bridged to TTL GND. UART 3.3 V. Disconnect all inverter energy sources before wiring.</desc>
