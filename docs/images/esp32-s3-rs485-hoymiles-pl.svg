text{font-family:Segoe UI,Arial,sans-serif;fill:#173448}
.title{font-size:43px;font-weight:700}.sub{font-size:23px;fill:#526878}
.h{font-size:25px;font-weight:700}.label{font-size:23px;font-weight:600}
.small{font-size:20px}.muted{fill:#526878}.white{fill:white}
.wire{fill:none;stroke-width:7;stroke-linecap:round}.card{fill:white;stroke:#d8e2e9;stroke-width:2}
</style></defs>
