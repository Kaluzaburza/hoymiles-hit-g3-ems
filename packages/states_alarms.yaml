# Czytelne stany i alarmy. Dekodowanie odbywa się z surowych bajtów,
# dzięki czemu 32-bitowe maski błędów nie tracą precyzji w typie float.

text_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Inverter Work Status"
    id: workstatus_0
    register_type: read
    address: 0
    response_size: 2
    raw_encode: HEXBYTES
    icon: mdi:state-machine
    lambda: |-
      const size_t o = item->offset;
      const uint16_t value = (static_cast<uint16_t>(data[o]) << 8) | data[o + 1];
      if (value == 0x2490) return std::string("Niedostępne");
      switch (value) {
        case 0: return std::string("Inicjalizacja zasilania");
        case 1: return std::string("Czuwanie");
        case 2: return std::string("Test sieci");
        case 3: return std::string("Praca z siecią");
        case 4: return std::string("Awaria");
        case 5: return std::string("Praca wyspowa");
        case 6: return std::string("Bypass");
        default: return std::string("Nieznany stan (") + std::to_string(value) + ")";
      }

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "SW Fault"
    id: sw_fault_19
    register_type: read
    address: 19
    response_size: 4
    raw_encode: HEXBYTES
    entity_category: diagnostic
    icon: mdi:alert-circle-outline
    lambda: |-
      const size_t o = item->offset;
      const uint32_t value = (static_cast<uint32_t>(data[o]) << 24) |
                             (static_cast<uint32_t>(data[o + 1]) << 16) |
                             (static_cast<uint32_t>(data[o + 2]) << 8) |
                             data[o + 3];
      if (value == 0) return std::string("Brak błędu");
      if (value == 0x24902490) return std::string("Niedostępne");
      char buffer[48];
      snprintf(buffer, sizeof(buffer), "Kod błędu programu: 0x%08lX", static_cast<unsigned long>(value));
      return std::string(buffer);

