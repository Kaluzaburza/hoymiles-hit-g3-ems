  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Overview Battery Faults"
    id: battery_fault_code_30021
    register_type: read
    address: 30021
    response_size: 4
    raw_encode: HEXBYTES
    entity_category: diagnostic
    icon: mdi:battery-alert
    lambda: |-
      const size_t o = item->offset;
      const uint32_t value = (static_cast<uint32_t>(data[o]) << 24) |
                             (static_cast<uint32_t>(data[o + 1]) << 16) |
                             (static_cast<uint32_t>(data[o + 2]) << 8) |
                             data[o + 3];
      if (value == 0) return std::string("Brak błędów");
      if (value == 0x24902490) return std::string("Niedostępne");
      std::string result;
      auto add = [&](const char *name) { if (!result.empty()) result += "; "; result += name; };
      if (value & (1UL << 0)) add("Niskie napięcie baterii");
      if (value & (1UL << 1)) add("Wysokie napięcie baterii");
      if (value & (1UL << 2)) add("Niskie napięcie pakietu przy rozładowaniu");
      if (value & (1UL << 3)) add("Wysokie napięcie pakietu przy ładowaniu");
      if (value & (1UL << 4)) add("Niska temperatura ładowania");
      if (value & (1UL << 5)) add("Wysoka temperatura ładowania");
      if (value & (1UL << 6)) add("Niska temperatura rozładowania");
      if (value & (1UL << 7)) add("Wysoka temperatura rozładowania");
      if (value & (1UL << 8)) add("Za wysokie napięcie wejściowe (HV)");
      if (result.empty()) {
        char buffer[48];
        snprintf(buffer, sizeof(buffer), "Błąd w zarezerwowanym bicie: 0x%08lX", static_cast<unsigned long>(value));
        return std::string(buffer);
      }
      return result;

