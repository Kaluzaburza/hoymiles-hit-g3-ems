    lambda: |-
      const size_t o = item->offset;
      const uint16_t value = (static_cast<uint16_t>(data[o]) << 8) | data[o + 1];
      if (value == 0x2490) return std::string("Niedostępne");
      std::string result;
      auto add = [&](const char *name) { if (!result.empty()) result += "; "; result += name; };
      // W tym firmware aktywny bit oznacza błąd (potwierdzone stanami
      // działających DSP, licznika i BMS w logu), odwrotnie niż uwaga w PDF.
      if (value & (1U << 5)) add("Brak komunikacji DSP_PWR");
      if (value & (1U << 6)) add("Brak komunikacji DSP_SAF");
      return result.empty() ? std::string("Brak błędów") : result;

