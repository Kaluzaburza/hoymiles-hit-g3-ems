# Szybki podgląd najważniejszych wartości

globals:
  # Local monotonic timestamps are updated exclusively by successful FC03
  # callbacks. They prevent a derived Master balance from combining a fresh
  # LOAD sample with a PV/GRID value cached before a partial Modbus outage.
  - id: overview_master_pv_last_readback_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: overview_master_grid_last_readback_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # The last GRID/PV pair already consumed by an aggregate generation. Both
  # source callbacks must advance before another LOAD callback may commit.
  - id: overview_parallel_aggregate_committed_grid_readback_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: overview_parallel_aggregate_committed_pv_readback_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

# The single-inverter Overview FC04 block 30001-30020 uses the existing 5 s
# control poll. Its physical BAT/GRID/PV/LOAD evidence must fit the unchanged
# 15 s execution freshness budget even when slower read ranges share the bus.
sensor:
  # Monotonic evidence counter for the parallel-system power balance.  It is
  # deliberately event-driven: backup_load.yaml advances it only after a real
  # Master LOAD FC03 callback can combine fresh GRID and PV replies.  A write,
  # cached template value or partial Modbus cycle must never advance it.
  - platform: template
    name: "Parallel Aggregate Power Readback Generation"
    id: parallel_aggregate_power_readback_generation
    accuracy_decimals: 0
    update_interval: never
    force_update: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    id: pv_total_power_master_30001
    internal: true
    register_type: read
    address: 30001
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: U_DWORD
    force_update: true
    on_value:
      then:
        - lambda: |-
            // Publish the public overview state only after this FC03 source
            // really answered.  A 1 s template timer would otherwise make an
            // old cached Modbus value look fresh forever in Home Assistant.
            const uint32_t topology_readback =
                id(parallel_topology_last_readback_ms);
            if (!id(machines_type_6048).has_state() ||
                topology_readback == 0 ||
                static_cast<uint32_t>(millis() - topology_readback) > 60000U) {
              return;
            }
            if (std::lround(id(machines_type_6048).state) != 1) {
              id(pv_total_power_30001).publish_state(x);
            }

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "Overview Internal PV Total Power"
    id: internal_pv_total_power_30003
    register_type: read
    address: 30003
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: U_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "Overview External PV Total Power"
    id: external_pv_total_power_30005
    register_type: read
    address: 30005
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
