  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "Overview Smart Load Active Power"
    id: smart_load_active_power_30017
    register_type: read
    address: 30017
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    # Ten model zwraca rejestr 30017 z młodszym słowem jako pierwszym.
    value_type: S_DWORD_R

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    id: battery_soc_master_30020
    internal: true
    register_type: read
    address: 30020
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    value_type: U_WORD
    # Zachowaj jeden FC04 30001–30020; 30019 jest odczytany jako luka i
    # ignorowany w tym zakresie, a własną encję ma w states_alarms.yaml.
    reuse_previous_range: true
    force_update: true
    on_value:
      then:
        - lambda: |-
            const uint32_t topology_readback =
                id(parallel_topology_last_readback_ms);
            if (!id(machines_type_6048).has_state() ||
                topology_readback == 0 ||
                static_cast<uint32_t>(millis() - topology_readback) > 60000U) {
              return;
            }
            if (std::lround(id(machines_type_6048).state) != 1) {
              id(battery_soc_30020).publish_state(x);
            }

  # Encje poniżej zachowują dotychczasowe nazwy i identyfikatory Home
  # Assistant. Dla pojedynczego falownika publikują szybki blok 30001.
  # W trybie równoległym korzystają z wartości całego systemu udostępnianych
  # przez Mastera w blokach energii i licznika. Rejestry systemowe PV (2150)
  # i LOAD (2169) są typu U_WORD, więc ich zakres kończy się na 65 535 W.
  # Układy przekraczające ten zakres wymagają potwierdzonego systemowego
  # źródła 32-bitowego; sam U_WORD nie pozwala wykryć zawinięcia do zera.
  - platform: template
    name: "Overview PV Total Power"
    id: pv_total_power_30001
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    # This sensor is event-driven by the selected physical FC03 source below.
    # Its HA timestamp therefore describes a real poll, not a cached republish.
    update_interval: never
    force_update: true

  - platform: template
    name: "Overview Inverter Active Power"
    id: inv_active_power_30007
