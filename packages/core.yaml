# Rdzeń urządzenia ESPHome
substitutions:
  # Rozbudowana mapa diagnostyczna jest celowo odczytywana rzadziej. Dane
  # operacyjne głównego dashboardu korzystają z osobnego kontrolera 13 s.
  update_interval: 150s
  # Blok sterowania EMS 4300-4306 jest mały i może być bezpiecznie
  # odczytywany częściej niż pełna mapa rejestrów. Własny kontroler zachowuje
  # zgodność ze starszymi plikami głównymi, które nie definiują tych wartości.
  modbus_control_controller_id: hoymiles_modbus_control
  control_update_interval: 5s
  modbus_settings_controller_id: hoymiles_modbus_settings
  settings_update_interval: 20s
  # ESPHome 2026.9 no longer applies per-sensor skip_updates. Static internal
  # addresses retain their old ten-full-cycle (25 minute) diagnostic cadence.
  modbus_slow_controller_id: hoymiles_modbus_slow
  slow_update_interval: 1500s

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  min_version: 2026.9.0
  project:
    name: "hoymiles.energy-storage-modbus"
    version: "1.5.8rc2"

logger:
  level: WARN
  baud_rate: 0

api:
  # Nie restartuj falownika/mostka tylko dlatego, ze chwilowo nie ma klienta
  # API. Zamkniete sesje podgladu logow nalezy usunac restartem dodatku
  # ESPHome Device Builder, zgodnie z procedura w README.
  reboot_timeout: 0s
  encryption:
    key: ${api_key}
  # ESP32 domyślnie obsługuje 8 klientów API. Niższy limit 5 był osiągany
  # jednocześnie przez Home Assistant i diagnostykę ESPHome, co powodowało
  # chwilowe SocketClosedAPIError mimo prawidłowej pracy urządzenia.
  max_connections: 8
  listen_backlog: 8
  max_send_queue: 64
  batch_delay: 250ms

ota:
  - platform: esphome
    id: ota_esphome
    # Inherit the existing API key; never rotate it during an OTA migration.
    # Existing devices must already offer encrypted OTA before installing this.
    encryption:

sensor:
  - platform: uptime
    name: "ESP Uptime"
    id: esp_uptime
    type: seconds
    icon: mdi:timer-check
    update_interval: 60s
    entity_category: diagnostic
