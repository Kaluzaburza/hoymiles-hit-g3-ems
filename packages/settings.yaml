                  id: battery_max_charge_power_306
                  value: !lambda "return target_percent;"

# Lokalny zegar nie zależy od API ani event loop HA.  Po expiry rozstrzyga
# świeży pełny FC03; nigdy nie zapisuje Self-Use w ciemno.
interval:
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now_ms = millis();
          const bool soft_expired =
              (id(ems_control_lease_state) == 1U ||
               id(ems_control_lease_state) == 2U) &&
              static_cast<int32_t>(now_ms -
                  id(ems_control_lease_expiry_ms)) >= 0;
          const bool hard_expired =
              (id(ems_control_lease_state) == 1U ||
               id(ems_control_lease_state) == 2U) &&
              static_cast<int32_t>(now_ms -
                  id(ems_control_lease_hard_deadline_ms)) >= 0;
          if (soft_expired || hard_expired) {
            id(ems_control_lease_state) = 3U;
            id(ems_control_lease_nonce_valid) = false;
            id(ems_control_lease_state_text).publish_state(
                hard_expired ? "expired_hard_deadline_wait_readback" :
                               "expired_wait_readback");
            ESP_LOGW("ems", "Lease wygasł lokalnie; oczekiwanie na świeży FC03");
          }
          if (id(ems_control_lease_state) != 3U ||
              id(ems_control_write_pending))
            return;
          if (id(ems_control_last_readback_ms) == 0U ||
              static_cast<uint32_t>(now_ms -
                  id(ems_control_last_readback_ms)) > 15000U ||
              !id(ems_control_readback_generation).has_state()) {
            id(ems_control_lease_state_text).publish_state(
                "expired_wait_readback");
            return;
          }
          const bool complete = id(ems_mode_raw_4300).has_state() &&
              id(self_used_soc_readback_4301).has_state() &&
              id(backup_soc_raw_4302).has_state() &&
              id(force_charge_soc_readback_4303).has_state() &&
              id(maximum_charge_power_readback_4304).has_state() &&
              id(force_discharge_soc_readback_4305).has_state() &&
              id(maximum_discharge_power_readback_4306).has_state();
          if (!complete) return;
          auto encode = [](float value, float scale) -> uint32_t {
            return static_cast<uint32_t>(std::lround(value * scale));
          };
          const std::array<uint32_t, 7> physical = {
              encode(id(ems_mode_raw_4300).state, 1.0f),
              encode(id(self_used_soc_readback_4301).state, 1.0f),
              encode(id(backup_soc_raw_4302).state, 1.0f),
              encode(id(force_charge_soc_readback_4303).state, 1.0f),
              encode(id(maximum_charge_power_readback_4304).state, 10.0f),
              encode(id(force_discharge_soc_readback_4305).state, 1.0f),
              encode(id(maximum_discharge_power_readback_4306).state, 10.0f)};
          const auto &record = id(ems_control_lease_record);
          bool active_owned = record[0] == 1U && record[1] == 1U;
          bool predecessor_owned = active_owned && record[20] != 0U;
          bool fallback_matches = active_owned;
          for (size_t index = 0; index < physical.size(); index++) {
            active_owned &= physical[index] == record[6U + index];
            predecessor_owned &= physical[index] == record[20U + index];
            fallback_matches &= physical[index] == record[13U + index];
          }
          auto clear_record = [&](uint32_t kind) {
            const auto &identity = id(ems_control_identity_record);
            uint32_t identity_generation = 0U, identity_active_crc = 0U;
            std::memcpy(&identity_generation, identity.data() + 420U, 4U);
            std::memcpy(&identity_active_crc, identity.data() + 424U, 4U);
            auto hash_text = [](const uint8_t *data, size_t length) {
              uint32_t hash = 2166136261U;
              for (size_t index = 0; index < length; index++) {
                hash ^= data[index];
                hash *= 16777619U;
              }
              return hash;
            };
            const bool identity_matches = identity[0] == 2U &&
                identity_generation == record[5] &&
                identity_active_crc == record[27] &&
                hash_text(identity.data() + 4U, identity[1]) == record[2] &&
                hash_text(identity.data() + 132U, identity[2]) == record[3] &&
                hash_text(identity.data() + 260U, identity[3]) == record[4];
            bool proof_ok = false;
            if (identity_matches && (kind != 1U || fallback_matches)) {
              std::array<uint8_t, 472> proof = identity;
              uint32_t previous_epoch = 0U;
              std::memcpy(&previous_epoch,
                          id(ems_control_terminal_record).data() + 432U, 4U);
              const uint32_t epoch = previous_epoch + 1U;
              if (epoch != 0U) {
                const uint32_t fc03_generation = static_cast<uint32_t>(
                    id(ems_control_readback_generation).state);
                std::memcpy(proof.data() + 428U, &kind, 4U);
                std::memcpy(proof.data() + 432U, &epoch, 4U);
                std::memcpy(proof.data() + 436U, &fc03_generation, 4U);
                for (size_t index = 0; index < 7U; index++)
                  std::memcpy(proof.data() + 440U + 4U * index,
                              &record[13U + index], 4U);
                uint32_t crc = 0xFFFFFFFFU;
                for (size_t index = 0; index < 468U; index++) {
                  crc ^= proof[index];
                  for (uint8_t bit = 0; bit < 8; bit++)
                    crc = (crc >> 1) ^ (0xEDB88320U &
                        static_cast<uint32_t>(-(static_cast<int32_t>(crc & 1U))));
                }
                crc = ~crc;
                std::memcpy(proof.data() + 468U, &crc, 4U);
                std::array<uint8_t, 472> verify{};
                proof_ok = id(ems_control_terminal_preference).save(&proof) &&
                    global_preferences->sync() &&
                    id(ems_control_terminal_preference).load(&verify) &&
                    verify == proof;
                if (proof_ok) id(ems_control_terminal_record) = proof;
              }
            }
            std::array<uint32_t, 28> cleared{};
            std::array<uint32_t, 28> verify_cleared{};
            const bool ok = id(ems_control_lease_preference).save(&cleared) &&
                global_preferences->sync() &&
                id(ems_control_lease_preference).load(&verify_cleared) &&
                verify_cleared == cleared;
            id(ems_control_lease_record) = cleared;
            id(ems_control_lease_state) = ok ? 0U : 5U;
            id(ems_control_lease_state_text).publish_state(
                !ok ? "hold_store_clear_failed" :
                (!proof_ok ? "disarmed_terminal_proof_unavailable" :
                 (kind == 1U ? "restored" : "disarmed_ownership_released")));
            return ok;
          };
          if (fallback_matches) {
            clear_record(1U);
            return;
          }
          if (!active_owned && !predecessor_owned) {
            // Off-Grid, a local/cloud change or an unattributed forced block
            // revokes ownership.  Do not reassert our previous command.
            clear_record(2U);
            return;
          }
          auto result = std::make_shared<std::string>("unknown");
          id(ems_write_complete_block_4300_4306)->execute(
              static_cast<float>(record[13]),
              static_cast<float>(record[14]),
              static_cast<float>(record[15]),
              static_cast<float>(record[16]),
              static_cast<float>(record[17]) * 0.1f,
              static_cast<float>(record[18]),
              static_cast<float>(record[19]) * 0.1f,
              id(ems_control_readback_generation).state, true, result);
          if (*result == "accepted") {
            id(ems_control_lease_state) = 4U;
            id(ems_control_lease_state_text).publish_state("restoring");
          } else if (*result != "previous_write_pending") {
            id(ems_control_lease_state) = 5U;
            id(ems_control_lease_state_text).publish_state(
                "hold_restore_not_dispatched");
            ESP_LOGE("ems", "Restore lease nie wszedł do transportu: %s",
                     result->c_str());
          }

text_sensor:
  - platform: template
    name: "EMS Control Lease State"
    id: ems_control_lease_state_text
    update_interval: never
    entity_category: diagnostic

sensor:
  - platform: template
    name: "EMS Safety Lease Protocol Version"
    id: ems_safety_lease_protocol_version
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: return 2.0f;

  # Autorytatywna generacja odczytu bloku EMS. Jest inkrementowana wyłącznie
  # przez cykliczny odczyt FC03 rejestru 4300, nigdy przez lokalny zapis.
  # Home Assistant używa jej razem z poniższymi lustrami read-only, aby
  # odróżnić fizyczny odczyt Modbus od optymistycznego echa encji number.
  - platform: template
    name: "EMS Control Readback Generation"
    id: ems_control_readback_generation
    accuracy_decimals: 0
    update_interval: never
    force_update: true
    entity_category: diagnostic

  # Te liczniki są publikowane wyłącznie przez sensory FC03 poniżej. Odpowiedź
  # na FC06/FC10 i lokalne echo encji number/select nie mogą ich zwiększyć.
  - platform: template
    name: "GCF Control Readback Generation"
    id: gcf_control_readback_generation
    accuracy_decimals: 0
    update_interval: never
    force_update: true
    entity_category: diagnostic

  - platform: template
    name: "Battery Charge Power Readback Generation"
    id: battery_charge_power_readback_generation
    accuracy_decimals: 0
    update_interval: never
    force_update: true
    entity_category: diagnostic

  # Surowy stan EMS jest tylko odczytywany. Zapis wykonuje poniższy select jako
  # jeden atomowy blok FC10 (4300-4306), tak jak przycisk Save w aplikacji S-Miles.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    id: ems_mode_raw_4300
    name: "EMS Mode Readback Code"
    force_update: true
    entity_category: diagnostic
    register_type: holding
    address: 4300
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            const uint16_t mode = static_cast<uint16_t>(x);
            switch (mode) {
              case 0:
                id(ems_mode_4300).publish_state("Autokonsumpcja (Self-Use)");
                break;
              case 3:
                id(ems_mode_4300).publish_state("Off-Grid");
                break;
              case 4:
                id(ems_mode_4300).publish_state("Ładowanie z sieci");
                break;
              case 5:
                id(ems_mode_4300).publish_state("Rozładowanie do sieci");
                break;
              default:
                ESP_LOGW("ems", "Nieznany tryb EMS odczytany z rejestru 4300: %u", mode);
                break;
            }

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Self-Use SOC Readback"
    id: self_used_soc_readback_4301
    register_type: holding
    address: 4301
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  # Rejestr 4302 należy do trybu Backup, a nie do Pure Off-Grid. Jego fizyczny
  # odczyt pozostaje częścią atomowego potwierdzenia całego bloku 4300-4306.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Backup SOC Readback"
    id: backup_soc_raw_4302
    register_type: holding
    address: 4302
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  # Niezależne, read-only lustra rejestrów zapisywalnych. ModbusNumber publikuje
  # żądaną wartość po wysłaniu komendy; te sensory zmieniają się dopiero po
  # następnym rzeczywistym odczycie bloku 4300-4306 z falownika.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Force Charge SOC Readback"
    id: force_charge_soc_readback_4303
    register_type: holding
    address: 4303
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  # Oddzielne lustra nastaw bezpieczeństwa. Sensory (nie zapisujące encje
  # select/number) są źródłem generacji udanego odczytu FC03.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "GCF Enable Readback Code"
    id: gcf_enable_readback_258
    register_type: holding
    address: 258
    value_type: U_WORD
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "GCF Maximum Export Power Readback"
    id: gcf_export_soft_limit_ratio_readback_259
    register_type: holding
    address: 259
    value_type: S_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: return x * 0.1f;
    force_update: true
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            // 259 zamyka zgrupowany odczyt FC03 258-259.
            const float generation =
                id(gcf_control_readback_generation).has_state() &&
                        id(gcf_control_readback_generation).state < 16000000.0f
                    ? id(gcf_control_readback_generation).state + 1.0f
                    : 1.0f;
            id(gcf_control_readback_generation).publish_state(generation);

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Battery Max Charge Power Readback"
    id: battery_max_charge_power_readback_306
    register_type: holding
    address: 306
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: return x * 0.1f;
    force_update: true
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            const float generation =
                id(battery_charge_power_readback_generation).has_state() &&
                        id(battery_charge_power_readback_generation).state < 16000000.0f
                    ? id(battery_charge_power_readback_generation).state + 1.0f
                    : 1.0f;
            id(battery_charge_power_readback_generation).publish_state(generation);

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Maximum Charge Power Readback"
    id: maximum_charge_power_readback_4304
    register_type: holding
    address: 4304
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: return x * 0.1f;
    force_update: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Force Discharge SOC Readback"
    id: force_discharge_soc_readback_4305
    register_type: holding
    address: 4305
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Maximum Discharge Power Readback"
    id: maximum_discharge_power_readback_4306
    register_type: holding
    address: 4306
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: return x * 0.1f;
    force_update: true
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            // 4306 jest ostatnim elementem zgrupowanego FC03 4300-4306.
            id(ems_control_last_readback_ms) = millis();
            const float generation =
                id(ems_control_readback_generation).has_state() &&
                        id(ems_control_readback_generation).state < 16000000.0f
                    ? id(ems_control_readback_generation).state + 1.0f
                    : 1.0f;
            if (id(ems_control_write_pending)) {
              const float generation_before =
                  id(ems_control_write_generation_before);
              const bool newer_generation =
                  generation > generation_before ||
                  (generation_before >= 16000000.0f && generation == 1.0f);
              if (newer_generation) {
                auto valid_range = [](float value, float minimum, float maximum) {
                  return std::isfinite(value) && value >= minimum && value <= maximum;
                };
                const bool complete =
                    id(ems_mode_raw_4300).has_state() &&
                    id(self_used_soc_readback_4301).has_state() &&
                    id(backup_soc_raw_4302).has_state() &&
                    id(force_charge_soc_readback_4303).has_state() &&
                    id(maximum_charge_power_readback_4304).has_state() &&
                    id(force_discharge_soc_readback_4305).has_state() &&
                    valid_range(id(ems_mode_raw_4300).state, 0.0f, 5.0f) &&
                    valid_range(id(self_used_soc_readback_4301).state, 10.0f, 100.0f) &&
                    valid_range(id(backup_soc_raw_4302).state, 60.0f, 100.0f) &&
                    valid_range(id(force_charge_soc_readback_4303).state, 10.0f, 100.0f) &&
                    valid_range(id(maximum_charge_power_readback_4304).state, 0.0f, 100.0f) &&
                    valid_range(id(force_discharge_soc_readback_4305).state, 0.0f, 100.0f) &&
                    valid_range(x, 0.0f, 100.0f);
                auto encode = [](float value, float scale) -> uint16_t {
                  return static_cast<uint16_t>(std::lround(value * scale));
                };
                const bool matches = complete &&
                    encode(id(ems_mode_raw_4300).state, 1.0f) ==
                        id(ems_control_write_expected_4300) &&
                    encode(id(self_used_soc_readback_4301).state, 1.0f) ==
                        id(ems_control_write_expected_4301) &&
                    encode(id(backup_soc_raw_4302).state, 1.0f) ==
                        id(ems_control_write_expected_4302) &&
                    encode(id(force_charge_soc_readback_4303).state, 1.0f) ==
                        id(ems_control_write_expected_4303) &&
                    encode(id(maximum_charge_power_readback_4304).state, 10.0f) ==
                        id(ems_control_write_expected_4304) &&
                    encode(id(force_discharge_soc_readback_4305).state, 1.0f) ==
                        id(ems_control_write_expected_4305) &&
                    encode(x, 10.0f) == id(ems_control_write_expected_4306);
                if (matches) {
                  id(ems_control_write_pending) = false;
                  id(ems_control_write_mismatch_reported) = false;
                  id(ems_control_write_mismatch_generation) = 0.0f;
                  ESP_LOGI("ems", "Potwierdzono fizyczny zapis FC03 pełnego bloku 4300-4306; generacja=%.0f",
                           generation);
                } else if (complete && id(ems_control_write_mismatch_reported)) {
                  const float mismatch_generation =
                      id(ems_control_write_mismatch_generation);
                  const bool newer_than_mismatch =
                      generation > mismatch_generation ||
                      (mismatch_generation >= 16000000.0f && generation == 1.0f);
                  if (newer_than_mismatch) {
                    id(ems_control_write_pending) = false;
                    id(ems_control_write_mismatch_reported) = false;
                    id(ems_control_write_mismatch_generation) = 0.0f;
                    ESP_LOGE("ems", "Zapis 4300-4306 nie uzyskał zgodnego ACK; bariera zwolniona dopiero po kolejnej kompletnej generacji FC03, ponów zmianę");
                  }
                } else if (complete) {
                  id(ems_control_write_mismatch_reported) = true;
                  id(ems_control_write_mismatch_generation) = generation;
                  ESP_LOGW("ems", "Bariera zapisu 4300-4306 pozostaje aktywna: nowszy FC03 jest kompletny, ale niezgodny");
                } else if (!id(ems_control_write_mismatch_reported)) {
                  ESP_LOGW("ems", "Bariera zapisu 4300-4306 pozostaje aktywna: nowszy FC03 jest niekompletny");
                }
              }
            }
            if (!id(ems_control_write_pending) &&
                (id(ems_control_lease_state) == 1U ||
                 id(ems_control_lease_state) == 2U ||
                 id(ems_control_lease_state) == 4U)) {
              auto encode_lease = [](float value, float scale) -> uint32_t {
                return static_cast<uint32_t>(std::lround(value * scale));
              };
              const bool lease_complete =
                  id(ems_mode_raw_4300).has_state() &&
                  id(self_used_soc_readback_4301).has_state() &&
                  id(backup_soc_raw_4302).has_state() &&
                  id(force_charge_soc_readback_4303).has_state() &&
                  id(maximum_charge_power_readback_4304).has_state() &&
                  id(force_discharge_soc_readback_4305).has_state() &&
                  id(maximum_discharge_power_readback_4306).has_state();
              const std::array<uint32_t, 7> physical = {
                  encode_lease(id(ems_mode_raw_4300).state, 1.0f),
                  encode_lease(id(self_used_soc_readback_4301).state, 1.0f),
                  encode_lease(id(backup_soc_raw_4302).state, 1.0f),
                  encode_lease(id(force_charge_soc_readback_4303).state, 1.0f),
                  encode_lease(id(maximum_charge_power_readback_4304).state, 10.0f),
                  encode_lease(id(force_discharge_soc_readback_4305).state, 1.0f),
                  encode_lease(x, 10.0f)};
              const auto &record = id(ems_control_lease_record);
              bool active_matches = lease_complete && record[0] == 1U &&
                  record[1] == 1U;
              bool fallback_matches = active_matches;
              bool predecessor_matches = active_matches && record[20] != 0U;
              for (size_t index = 0; index < physical.size(); index++) {
                active_matches &= physical[index] == record[6U + index];
                fallback_matches &= physical[index] == record[13U + index];
                predecessor_matches &= physical[index] == record[20U + index];
              }
              auto clear_lease = [&](const char *state, uint32_t kind) {
                const auto &identity = id(ems_control_identity_record);
                uint32_t identity_generation = 0U, identity_active_crc = 0U;
                std::memcpy(&identity_generation, identity.data() + 420U, 4U);
                std::memcpy(&identity_active_crc, identity.data() + 424U, 4U);
                auto hash_text = [](const uint8_t *data, size_t length) {
                  uint32_t hash = 2166136261U;
                  for (size_t index = 0; index < length; index++) {
                    hash ^= data[index];
                    hash *= 16777619U;
                  }
                  return hash;
                };
                const bool identity_matches = identity[0] == 2U &&
                    identity_generation == record[5] &&
                    identity_active_crc == record[27] &&
                    hash_text(identity.data() + 4U, identity[1]) == record[2] &&
                    hash_text(identity.data() + 132U, identity[2]) == record[3] &&
                    hash_text(identity.data() + 260U, identity[3]) == record[4];
                bool proof_ok = false;
                if (identity_matches && lease_complete &&
                    (kind != 1U || fallback_matches)) {
                  std::array<uint8_t, 472> proof = identity;
                  uint32_t previous_epoch = 0U;
                  std::memcpy(&previous_epoch,
                              id(ems_control_terminal_record).data() + 432U, 4U);
                  const uint32_t epoch = previous_epoch + 1U;
                  if (epoch != 0U) {
                    const uint32_t fc03_generation =
                        static_cast<uint32_t>(generation);
                    std::memcpy(proof.data() + 428U, &kind, 4U);
                    std::memcpy(proof.data() + 432U, &epoch, 4U);
                    std::memcpy(proof.data() + 436U, &fc03_generation, 4U);
                    for (size_t index = 0; index < 7U; index++)
                      std::memcpy(proof.data() + 440U + 4U * index,
                                  &record[13U + index], 4U);
                    uint32_t crc = 0xFFFFFFFFU;
                    for (size_t index = 0; index < 468U; index++) {
                      crc ^= proof[index];
                      for (uint8_t bit = 0; bit < 8; bit++)
                        crc = (crc >> 1) ^ (0xEDB88320U &
                            static_cast<uint32_t>(-(static_cast<int32_t>(crc & 1U))));
                    }
                    crc = ~crc;
                    std::memcpy(proof.data() + 468U, &crc, 4U);
                    std::array<uint8_t, 472> verify{};
                    proof_ok = id(ems_control_terminal_preference).save(&proof) &&
                        global_preferences->sync() &&
                        id(ems_control_terminal_preference).load(&verify) &&
                        verify == proof;
                    if (proof_ok) id(ems_control_terminal_record) = proof;
                  }
                }
                std::array<uint32_t, 28> cleared{};
                std::array<uint32_t, 28> verify_cleared{};
                const bool ok = id(ems_control_lease_preference).save(&cleared) &&
                    global_preferences->sync() &&
                    id(ems_control_lease_preference).load(&verify_cleared) &&
                    verify_cleared == cleared;
                id(ems_control_lease_record) = cleared;
                id(ems_control_lease_state) = ok ? 0U : 5U;
                id(ems_control_lease_nonce_valid) = false;
                id(ems_control_lease_state_text).publish_state(
                    !ok ? "hold_store_clear_failed" :
                    (!proof_ok ? "disarmed_terminal_proof_unavailable" : state));
              };
              if (id(ems_control_lease_state) == 1U) {
                if (active_matches) {
                  id(ems_control_lease_state) = 2U;
                  id(ems_control_lease_state_text).publish_state("armed_confirmed");
                } else if (predecessor_matches) {
                  id(ems_control_lease_state) = 3U;
                  id(ems_control_lease_nonce_valid) = false;
                  id(ems_control_lease_state_text).publish_state(
                      "expired_retarget_not_confirmed_wait_readback");
                } else {
                  clear_lease("disarmed_start_not_confirmed", 3U);
                }
              } else if (id(ems_control_lease_state) == 2U && !active_matches) {
                if (predecessor_matches) {
                  id(ems_control_lease_state) = 3U;
                  id(ems_control_lease_nonce_valid) = false;
                  id(ems_control_lease_state_text).publish_state(
                      "expired_late_predecessor_wait_readback");
                } else {
                  clear_lease("disarmed_ownership_released", 2U);
                }
              } else if (id(ems_control_lease_state) == 4U) {
                if (fallback_matches) {
                  clear_lease("restored", 1U);
                } else if (active_matches || predecessor_matches) {
                  id(ems_control_lease_state) = 3U;
                  id(ems_control_lease_state_text).publish_state(
                      "expired_restore_retry_wait_readback");
                } else {
                  clear_lease("disarmed_ownership_released", 2U);
                }
              }
            }
            id(ems_control_readback_generation).publish_state(generation);

select:
  - platform: template
    name: "Tryb EMS"
    id: ems_mode_4300
    entity_category: config
    # Odczyt 4300 publikuje stan. Brak lokalnego cyklu zapobiega sztucznemu
    # odświeżaniu encji pomiędzy rzeczywistymi odpowiedziami FC03.
    update_interval: never
    options:
      - "Autokonsumpcja (Self-Use)"
      - "Off-Grid"
      - "Ładowanie z sieci"
      - "Rozładowanie do sieci"
    lambda: |-
      if (!id(ems_mode_raw_4300).has_state()) return {};
      const uint16_t mode = static_cast<uint16_t>(id(ems_mode_raw_4300).state);
      switch (mode) {
        case 0: return std::string("Autokonsumpcja (Self-Use)");
        case 3: return std::string("Off-Grid");
        case 4: return std::string("Ładowanie z sieci");
        case 5: return std::string("Rozładowanie do sieci");
        default: return {};
