# Sieć równoległa falowników (parametry statyczne).
#
# Port Modbus Mastera nie przekazuje zapytań kierowanych bezpośrednio do
# adresów urządzeń Slave. Rejestry 6050/6055/... opisują wewnętrzną sieć
# równoległą, ale nie są dodatkowymi urządzeniami na zewnętrznej magistrali
# RS485. Dla bloku EMS 4300-4306 używamy sprawdzonego systemowego broadcastu
# pod adresem 0. Konwerter ESP32, Master i każdy Slave muszą jednak fizycznie
# korzystać z tej samej zewnętrznej pary A/B; wewnętrzna sieć równoległa nie
# przekazuje broadcastu z przewodu dochodzącego wyłącznie do Mastera. Wynik
# potwierdzamy późniejszym fizycznym FC03 z Mastera. Jest to potwierdzenie bloku
# Mastera, nie osobny ACK każdego Slave. Pozostałe rejestry 258/259/306
# pozostają fail-closed na Master/Slave.

globals:
  # Lokalny znacznik pochodzi tylko z odpowiedzi FC03 obejmującej 6048-6049.
  # Unsigned subtraction zachowuje się poprawnie również po zawinięciu millis().
  - id: parallel_topology_last_readback_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

sensor:
  - platform: template
    name: "Parallel Topology Readback Generation"
    id: parallel_topology_readback_generation
    accuracy_decimals: 0
    update_interval: never
    force_update: true
    entity_category: diagnostic

  # Numeric 0/1 is intentional: the HA proxy integration currently exposes
  # ESPHome sensors, but not ESPHome binary_sensors.  Keeping the capability
  # in the supported sensor domain makes the fail-closed gate observable by
  # both the generated package and the integration catalog.
  - platform: template
    name: "EMS Verified Hardware Readback Supported"
    id: ems_verified_hardware_readback_supported
    accuracy_decimals: 0
    update_interval: 1s
    force_update: true
    entity_category: diagnostic
    lambda: |-
      if (!id(machines_type_6048).has_state()) {
        return 0.0f;
      }
      const uint32_t last_readback = id(parallel_topology_last_readback_ms);
      if (last_readback == 0 ||
          static_cast<uint32_t>(millis() - last_readback) > 60000U) {
        return 0.0f;
      }
      const float machine_type_raw = id(machines_type_6048).state;
      if (!std::isfinite(machine_type_raw)) return 0.0f;
      const int machine_type = static_cast<int>(std::lround(machine_type_raw));
      if (std::fabs(machine_type_raw - machine_type) > 0.01f) return 0.0f;
      if (machine_type == 0) return 1.0f;
      if (machine_type != 1 ||
          !id(number_of_machines_master_and_slave_6049).has_state()) {
        return 0.0f;
      }

      const float count_raw = id(number_of_machines_master_and_slave_6049).state;
      if (!std::isfinite(count_raw)) return 0.0f;
      const int count = static_cast<int>(std::lround(count_raw));
      if (std::fabs(count_raw - count) > 0.01f) return 0.0f;
      // Modbus address 0 reaches every unit physically attached to this
      // external bus.  The internal 6050/6055/... addresses are diagnostic
      // topology data and do not replace the required shared A/B wiring.
      return count >= 2 && count <= 10 ? 1.0f : 0.0f;

  # Ustawienia spoza wspólnego bloku EMS nie mają potwierdzonej semantyki
  # broadcastu. Ta osobna zdolność chroni zapisy GCF 258/259 i limitu 306.
  - platform: template
    name: "Direct Register Verified Readback Supported"
    id: direct_register_verified_readback_supported
    accuracy_decimals: 0
    update_interval: 1s
    force_update: true
    entity_category: diagnostic
    lambda: |-
      if (!id(machines_type_6048).has_state()) return 0.0f;
      const uint32_t last_readback = id(parallel_topology_last_readback_ms);
      if (last_readback == 0 ||
          static_cast<uint32_t>(millis() - last_readback) > 60000U) {
        return 0.0f;
      }
      const float machine_type_raw = id(machines_type_6048).state;
      if (!std::isfinite(machine_type_raw)) return 0.0f;
      const int machine_type = static_cast<int>(std::lround(machine_type_raw));
      if (std::fabs(machine_type_raw - machine_type) > 0.01f) return 0.0f;
      return machine_type == 0 ? 1.0f : 0.0f;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Machines Type"
    id: machines_type_6048
    register_type: holding
    address: 6048
    accuracy_decimals: 0
    value_type: U_WORD
    force_update: true

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Number of Machines (Master and Slave)"
    id: number_of_machines_master_and_slave_6049
    register_type: holding
    address: 6049
    accuracy_decimals: 0
    value_type: U_WORD
    force_update: true
    on_value:
      then:
        - lambda: |-
            // 6049 zamyka zgrupowany odczyt FC03 6048-6049.
            id(parallel_topology_last_readback_ms) = millis();
            const float generation =
                id(parallel_topology_readback_generation).has_state() &&
                        id(parallel_topology_readback_generation).state < 16000000.0f
                    ? id(parallel_topology_readback_generation).state + 1.0f
                    : 1.0f;
            id(parallel_topology_readback_generation).publish_state(generation);

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 1 (Master Device)"
    id: communication_address_1_master_device_6050
    register_type: holding
    address: 6050
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 2 (Slave Device 1)"
    id: communication_address_2_slave_device_1_6055
    register_type: holding
    address: 6055
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 3 (Slave Device 2)"
    id: communication_address_3_slave_device_2_6060
    register_type: holding
    address: 6060
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 4 (Slave Device 3)"
    id: communication_address_4_slave_device_3_6065
    register_type: holding
    address: 6065
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 5 (Slave Device 4)"
    id: communication_address_5_slave_device_4_6070
    register_type: holding
    address: 6070
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 6 (Slave Device 5)"
    id: communication_address_6_slave_device_5_6075
    register_type: holding
    address: 6075
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 7 (Slave Device 6)"
    id: communication_address7_slave_device_6_6080
    register_type: holding
    address: 6080
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 8 (Slave Device 7)"
    id: communication_address8_slave_device_7_6085
    register_type: holding
    address: 6085
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 9 (Slave Device 8)"
    id: communication_address9_slave_device_8_6090
    register_type: holding
    address: 6090
    accuracy_decimals: 0
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_slow_controller_id}
    name: "Communication Address 10 (Slave Device 9)"
    id: communication_address10_slave_device_9_6095
    register_type: holding
    address: 6095
    accuracy_decimals: 0
    value_type: U_WORD

text_sensor:
  - platform: template
    name: "Parallel Topology"
    id: parallel_topology
    icon: mdi:lan
    update_interval: 5s
    lambda: |-
      if (!id(machines_type_6048).has_state()) {
        return std::string("Oczekiwanie na wykrycie sieci");
      }
      const float machine_type_raw = id(machines_type_6048).state;
      if (!std::isfinite(machine_type_raw)) {
        return std::string("Nieprawidłowa topologia");
      }
      const int machine_type = static_cast<int>(std::lround(machine_type_raw));
      if (std::fabs(machine_type_raw - machine_type) > 0.01f) {
        return std::string("Nieprawidłowa topologia");
      }
      if (machine_type == 0) return std::string("Falownik pojedynczy");
      if (machine_type == 1) return std::string("Master");
      if (machine_type == 2) return std::string("Slave");
      return std::string("Nieznana topologia");

  - platform: template
    name: "Parallel EMS Control Status"
    id: parallel_ems_control_status
    icon: mdi:lan-check
    update_interval: 5s
    lambda: |-
      if (!id(machines_type_6048).has_state()) {
        return std::string("Oczekiwanie na wykrycie sieci");
      }

      const float machine_type_raw = id(machines_type_6048).state;
      if (!std::isfinite(machine_type_raw)) {
        return std::string("Nieznana topologia");
      }
      const int machine_type = static_cast<int>(std::lround(machine_type_raw));
      if (std::fabs(machine_type_raw - machine_type) > 0.01f) {
        return std::string("Nieznana topologia");
      }
      if (machine_type == 0) {
        if (!id(ems_verified_hardware_readback_supported).has_state() ||
            id(ems_verified_hardware_readback_supported).state < 0.5f) {
          return std::string("Zablokowane - nieaktualny odczyt topologii");
        }
        return std::string("Gotowe - sterowanie bezpośrednie");
      }
      if (machine_type == 2) {
        return std::string("Zablokowane - ESP32 podłączone do Slave");
      }
      if (machine_type != 1) {
        return std::string("Nieznana topologia");
      }
      if (!id(number_of_machines_master_and_slave_6049).has_state()) {
        return std::string("Oczekiwanie na wykrycie sieci");
      }

      const float count_raw = id(number_of_machines_master_and_slave_6049).state;
      if (!std::isfinite(count_raw)) {
        return std::string("Nieprawidłowa liczba falowników");
      }
      const int count = static_cast<int>(std::lround(count_raw));
      if (std::fabs(count_raw - count) > 0.01f) {
        return std::string("Nieprawidłowa liczba falowników");
      }
      if (count < 2 || count > 10) {
        return std::string("Nieprawidłowa liczba falowników");
      }
      if (!id(ems_verified_hardware_readback_supported).has_state() ||
          id(ems_verified_hardware_readback_supported).state < 0.5f) {
        return std::string("Zablokowane - nieaktualna topologia broadcastu EMS");
      }
      return std::string("Gotowe - broadcast EMS, odczyt Mastera");
