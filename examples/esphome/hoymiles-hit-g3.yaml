# Public ESPHome entry point for EMS for Hoymiles HIT-(5–20)L-G3.
# Copy this file to your ESPHome directory and adjust substitutions/secrets.
# Read the README wiring section before connecting the converter:
# automatic-direction modules need TX/RX/GND, while MAX3485/MAX485 modules
# with DE and /RE use the root hoymiles-inverter-flow-control.yaml instead.
# For parallel EMS, continue the same external RS485 A/B bus from the converter
# to the Master and every Slave; address-0 broadcast is not relayed by a
# Master-only connection.

substitutions:
  name: "hoymiles-hit-g3"
  friendly_name: "Hoymiles HIT G3"
  device_description: "Hoymiles HIT xxL G3 energy storage inverter (Modbus V2.4)"

  modbus_controller_id: hoymiles_modbus
  modbus_fast_controller_id: hoymiles_modbus_fast
  modbus_control_controller_id: hoymiles_modbus_control
  modbus_settings_controller_id: hoymiles_modbus_settings
  modbus_inverter_address: "1"
  baud_rate: "115200"
  fast_update_interval: "13s"
  control_update_interval: "5s"
  settings_update_interval: "20s"
  update_interval: "150s"

  uart_tx_pin: "GPIO17"
  uart_rx_pin: "GPIO16"
  board: "esp32dev"

  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  fallback_password: !secret fallback_password
  api_key: !secret api_key

esp32:
  board: ${board}
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

dashboard_import:
  package_import_url: github://Kaluzaburza/hoymiles-hit-g3-ems/examples/esphome/hoymiles-hit-g3.yaml@v1.5.8RC2
  import_full_config: true

logger:
  level: INFO
  logs:
    modbus: WARN
    modbus_controller: WARN

packages:
  hoymiles_hit_g3:
    url: https://github.com/Kaluzaburza/hoymiles-hit-g3-ems
    ref: v1.5.8RC2
    refresh: 1d
    files:
      - packages/core.yaml
      - packages/network.yaml
      - packages/modbus_connection.yaml
      - packages/parallel_network.yaml
      - packages/settings.yaml
      - packages/system.yaml
      - packages/states_alarms.yaml
      - packages/inverter.yaml
      - packages/grid.yaml
      - packages/backup_load.yaml
      - packages/generator.yaml
      - packages/pv.yaml
      - packages/battery.yaml
      - packages/energy_flow.yaml
      - packages/meters.yaml
      - packages/overview.yaml
      - packages/diagnostics.yaml
