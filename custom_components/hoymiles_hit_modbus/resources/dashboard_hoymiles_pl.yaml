      - type: markdown
        title: RCEm — decyzja i plan ochrony eksportu
        entity_id: sensor.hoymiles_hit_rcm_voltage_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
          {% if plan is not none %}
          {% set windows = plan.attributes.risk_windows | default([], true) %}
          {% set window_details = plan.attributes.risk_window_details
             | default([], true) %}
          {% set planned = plan.attributes.planned_grid_discharge_kwh
             | default(0) | float(0) %}
          {% set horizon = plan.attributes.risk_surplus_horizon
             | default('missing') %}
          {% set horizon_labels = {
            'today': 'dzisiaj', 'tomorrow': 'jutro', 'none': 'brak',
            'missing': 'brak danych' } %}
          **Tryb:** {{ 'obserwacja — brak zapisów do falownika'
             if is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on')
             else 'aktywna regulacja globalnej mocy ładowania baterii' }}<br>
          **Wynik:** {{ states('sensor.hoymiles_hit_rcm_voltage_plan') }}<br>
          **Bieżące działanie:** {{ plan.attributes.action | default('brak') }}<br>
          **Najwyższe napięcie:**
          {{ plan.attributes.maximum_voltage_v | default(0) }} V<br>
          **Średnia 10 min:**
          {{ plan.attributes.rolling_10m_voltage_v | default(0) }} V<br>
          **Ryzyko napięciowe:**
          {{ plan.attributes.voltage_risk_score_percent | default(0) }}%<br>
          **Najbliższe przewidywane okno ryzyka:**
          {{ plan.attributes.next_risk_start | default('brak') }}<br>
          **Prognoza użyta do następnego okna:**
          {{ plan.attributes.selected_forecast_kwh | default(0) }} kWh ·
          {{ horizon_labels.get(horizon, horizon) }}<br>
          **Przewidywana nadwyżka PV w oknie ryzyka:**
          {{ plan.attributes.expected_risk_surplus_kwh | default(0) }} kWh<br>
          **Chroniony minimalny SOC domu i rezerwy:**
          {{ plan.attributes.protected_minimum_soc_percent | default(0) }}%<br>
          **Wolne miejsce potrzebne na szczyt:**
          {{ plan.attributes.required_headroom_kwh | default(0) }} kWh<br>
          **Dostępne wolne miejsce:**
          {{ plan.attributes.available_headroom_kwh | default(0) }} kWh<br>
          **Brakujące wolne miejsce:**
          {{ plan.attributes.headroom_shortfall_kwh | default(0) }} kWh<br>
          {% if planned > 0.1 %}
          **Zaplanowane poranne rozładowanie do sieci:**
          {{ planned | round(2) }} kWh<br>
          **Docelowy SOC po porannym rozładowaniu:**
          {{ plan.attributes.pre_discharge_target_soc_percent | default(0) }}%<br>
          **Automatycznie dobrana moc rozładowania:**
          {{ plan.attributes.pre_discharge_power_kw | default(0) }} kW ·
          {{ plan.attributes.pre_discharge_power_percent | default(0) }}%<br>
          **Czas do dzisiejszego okna ryzyka:**
          {% set minutes = plan.attributes.minutes_to_risk %}
          {{ ((minutes | int(0)) // 60) ~ ' h ' ~ ((minutes | int(0)) % 60) ~ ' min'
             if minutes is number else 'brak dzisiejszego okna' }}<br>
          {% else %}
          **Poranne rozładowanie:** nie jest potrzebne lub brak dzisiejszego
          okna ryzyka.<br>
          {% endif %}
          **Docelowy maksymalny SOC przed szczytem:**
          {{ plan.attributes.target_soc_before_risk_percent | default(0) }}%<br>
          **Zalecany globalny limit ładowania:**
          {{ plan.attributes.recommended_charge_limit_percent | default(0) }}% ·
          {{ plan.attributes.recommended_charge_power_kw | default(0) }} kW<br>
          **Zalecany bieżący limit eksportu:**
          {{ plan.attributes.recommended_export_limit_percent | default(0) }}%<br>
          **Szacowana bezpieczna moc eksportu:**
          {{ plan.attributes.estimated_safe_export_power_kw
             if plan.attributes.estimated_safe_export_power_kw is number
             else '— (brak produkcji lub eksportu)' }}
          {{ 'kW' if plan.attributes.estimated_safe_export_power_kw is number else '' }}

          {% if is_state('input_boolean.hoymiles_rcm_advanced_view', 'on') %}
          ---
          **Historia:** {{ plan.attributes.history_days | default(0) }} dni ·
          {{ plan.attributes.history_samples | default(0) }} próbek<br>
          **P90 napięcia dla bieżącego kwadransa:**
          {{ plan.attributes.historical_p90_voltage_v | default(0) }} V<br>
          **Źródło profilu PV:**
          {{ plan.attributes.pv_profile_source | default('profil zastępczy') }} ·
          pewność {{ plan.attributes.pv_profile_confidence_percent
             | default(0) }}%<br>
          **Profil odbiorników:**
          {{ plan.attributes.load_profile_mode | default('profil zastępczy') }}<br>
          **Zapotrzebowanie domu w oknie ryzyka:**
          {{ plan.attributes.expected_risk_load_kwh | default(0) }} kWh<br>
          **Naturalne miejsce zasilając dom przed szczytem:**
          {{ plan.attributes.expected_natural_headroom_kwh | default(0) }} kWh<br>
          **Nieuniknione ładowanie do chwili szczytu:**
          {{ plan.attributes.unavoidable_charge_before_risk_kwh | default(0) }} kWh<br>
          **Efektywny twardy limit eksportu:**
          {{ plan.attributes.effective_export_cap_percent | default(0) }}%<br>
          **Powtarzalne okna ryzyka z ostatnich czterech dni:**
          {% if window_details %}
          {% for window in window_details %}
          - {{ window.start | default('—') }}–{{ window.end | default('—') }} ·
            nadwyżka {{ window.expected_surplus_kwh | default(0) }} kWh ·
            wymagane miejsce {{ window.required_headroom_kwh | default(0) }} kWh
          {% endfor %}
          {% elif windows %}
          {% for window in windows %}
          - {{ window }}
          {% endfor %}
          {% else %}
          - Nie wykryto jeszcze powtarzalnego okna wysokiego napięcia.
          {% endif %}
          {% endif %}
          {% endif %}

