# Dashboard Home Assistant dla Hoymiles Energy Storage
#
# Wklej CAŁĄ zawartość do edytora surowej konfiguracji nowego dashboardu.
# Responsywny interfejs Aurora, animowany przepływ, wykresy i podsumowania
# są dostarczane razem z integracją i nie wymagają dodatkowych kart HACS.
# Dashboard używa stabilnych identyfikatorów proxy tworzonych przez integrację
# Hoymiles HIT xxL G3 Modbus. Nie zależą one od nazwy urządzenia ESPHome.
# Karty harmonogramów EMS wymagają pakietu home_assistant/hoymiles_ems_scheduler.yaml.
# Obejmuje wszystkie aktywne encje; pominięta jest tylko jedna encja oznaczona
# w ESPHome jako disabled_by_default (opisana w zakładce Sterowanie).

title: Hoymiles Energy Storage
views:
  - title: Start
    path: start
    icon: mdi:view-dashboard
    type: sidebar
    badges: []
    cards:
      - type: custom:hoymiles-aurora-energy-card
        pv_entity: sensor.hoymiles_hit_overview_pv_total_power
        load_entity: sensor.hoymiles_actual_load_power
        grid_entity: sensor.hoymiles_hit_overview_grid_total_active_power
        battery_entity: sensor.hoymiles_hit_overview_battery_power
        battery_soc_entity: sensor.hoymiles_hit_overview_battery_soc
        battery_current_entity: sensor.hoymiles_hit_battery_current_bms
        battery_capacity_entity: sensor.hoymiles_hit_battery_capacity
        ems_mode_readback_entity: sensor.hoymiles_hit_ems_mode_readback_code
        battery_self_use_floor_entity: sensor.hoymiles_hit_ems_self_use_soc_readback
        battery_charge_target_entity: sensor.hoymiles_hit_ems_force_charge_soc_readback
        battery_discharge_target_entity: sensor.hoymiles_hit_ems_force_discharge_soc_readback
        battery_max_soc_entity: number.hoymiles_hit_maximum_soc
        battery_min_soc_entity: number.hoymiles_hit_minimum_soc
        inverter_entity: sensor.hoymiles_hit_overview_inverter_active_power
        ems_mode_entity: select.hoymiles_hit_ems_mode
        forecast_today_entity: sensor.hoymiles_solcast_forecast_today
        forecast_remaining_entity: sensor.hoymiles_solcast_forecast_remaining_today
        forecast_tomorrow_entity: sensor.hoymiles_solcast_forecast_tomorrow
        average_load_entity: sensor.hoymiles_load_average_4_days
        cav_temperature_entity: sensor.hoymiles_hit_cav_temp
        battery_path_temperature_entity: sensor.hoymiles_hit_bat_ths_temp
        pv_today_entity: sensor.hoymiles_hit_pv_total_energy_today
        pv_to_load_today_entity: sensor.hoymiles_hit_pv_to_load_energy_today
        pv_to_battery_today_entity: sensor.hoymiles_hit_pv_to_battery_energy_today
        pv_to_grid_today_entity: sensor.hoymiles_hit_pv_to_grid_energy_today
        grid_import_today_entity: sensor.hoymiles_hit_grid_energy_buy_today
        grid_to_load_today_entity: sensor.hoymiles_rce_grid_to_load_today
        grid_to_battery_today_entity: sensor.hoymiles_grid_to_battery_today
        inverter_image: /local/hoymiles-inverter.png
      - type: custom:hoymiles-aurora-status-card
        setup_entity: sensor.hoymiles_hit_setup_status
        system_entity: sensor.hoymiles_hit_overview_system_work_status
        inverter_entity: sensor.hoymiles_hit_inverter_work_status
        meter_entity: sensor.hoymiles_hit_meter_link_status
        battery_entity: sensor.hoymiles_hit_battery_link_status
        parallel_entity: sensor.hoymiles_hit_parallel_ems_control_status
        alarm_entities:
          - entity: sensor.hoymiles_hit_sw_fault
            name: "Błąd oprogramowania"
          - entity: sensor.hoymiles_hit_hw_fault
            name: "Błąd sprzętowy"
          - entity: sensor.hoymiles_hit_battery_fault_code_bms
            name: Błąd baterii (BMS)
          - entity: sensor.hoymiles_hit_overview_battery_faults
            name: Błędy baterii
          - entity: sensor.hoymiles_hit_overview_dsp_power_faults
            name: Błędy DSP mocy
          - entity: sensor.hoymiles_hit_dsp_safety_faults
            name: "Błędy DSP zabezpieczeń"
          - entity: sensor.hoymiles_hit_arm_communication_faults
            name: "Błędy komunikacji ARM"
          - entity: sensor.hoymiles_hit_arm_peripheral_faults
            name: "Błędy urządzeń peryferyjnych ARM"
          - entity: sensor.hoymiles_hit_arm_system_faults
            name: "Błędy systemowe ARM"
        details_path: stany-alarmy
      - type: custom:hoymiles-zebra-entities-card
        title: Sterowanie EMS
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_ems_control_owner
            name: Steruje teraz
          - entity: sensor.hoymiles_tariff_charge_status
            name: Tanie ładowanie
          - entity: binary_sensor.hoymiles_ems_control_conflict
            name: Konflikt sterowania
          - entity: select.hoymiles_hit_ems_mode
            name: Tryb pracy
          - entity: sensor.hoymiles_hit_parallel_ems_control_status
            name: "Gotowość sterowania EMS"
          - entity: sensor.hoymiles_hit_number_of_machines_master_and_slave
            name: "Wykryta liczba falowników"
          - entity: button.hoymiles_hit_clear_fault
            name: "Wyczyść alarmy falownika"
      - type: custom:hoymiles-aurora-history-card
        title: Moc — ostatnie 24 godziny
        hours_to_show: 24
        entities:
          - entity: sensor.hoymiles_hit_overview_pv_total_power
            name: PV
            color: "#2DE083"
          - entity: sensor.hoymiles_actual_load_power
            name: Dom
            color: "#FF5D73"
          - entity: sensor.hoymiles_hit_overview_grid_total_active_power
            name: Sieć
            color: "#FFC857"
          - entity: sensor.hoymiles_hit_overview_battery_power
            name: Bateria
            color: "#3EA6FF"
      - type: custom:hoymiles-aurora-frame-card
        accent: cyan
        view_layout:
          position: sidebar
        card:
          type: markdown
          title: "☕ Wesprzyj rozwój projektu"
          content: |-
            Projekt jest rozwijany niezależnie i testowany na rzeczywistych
            instalacjach. Twoje wsparcie pomaga rozwijać bezpieczną automatykę
            EMS/RCE, sprawdzać kolejne konfiguracje falowników i tworzyć lepszą
            dokumentację.

            Jeśli integracja oszczędziła Ci czas lub pomaga lepiej wykorzystać
            energię, możesz wesprzeć jej dalszy rozwój:

            [**☕ Postaw kawę autorowi**](https://buycoffee.to/kaluzaaa)
  - title: RCE i Wyniki
