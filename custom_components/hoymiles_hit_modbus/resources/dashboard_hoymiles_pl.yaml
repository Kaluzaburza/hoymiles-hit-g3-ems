            name: Następny planowany cykl
          - entity: timer.hoymiles_battery_balancing_hold
            name: Pozostały czas przy 100% SOC
          - entity: sensor.hoymiles_battery_balancing_slow_charge_power
            name: Bieżący limit dla wolnego ładowania
