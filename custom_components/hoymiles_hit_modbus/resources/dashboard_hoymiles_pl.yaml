          - entity: sensor.hoymiles_rcem_headroom_shortfall
            name: Brakujące wolne miejsce w magazynie
          - entity: sensor.hoymiles_rcem_natural_headroom_before_risk
            name: Naturalne miejsce zasilając dom przed szczytem
          - entity: sensor.hoymiles_rcem_planned_grid_discharge
            name: Zaplanowane poranne rozładowanie do sieci
          - entity: sensor.hoymiles_rcem_pre_discharge_target_soc
            name: Docelowy SOC porannego rozładowania
          - entity: sensor.hoymiles_rcem_pre_discharge_power
            name: Automatycznie dobrana moc rozładowania
          - entity: sensor.hoymiles_rcem_recommended_battery_charge_limit
            name: Zalecany globalny limit ładowania
          - entity: number.hoymiles_hit_battery_max_charge_power
            name: Rzeczywisty globalny limit ładowania baterii
          - entity: sensor.hoymiles_rcem_recommended_export_limit
            name: Zalecany limit eksportu
          - entity: number.hoymiles_hit_maximum_export_power_limit
            name: Rzeczywisty maksymalny limit eksportu
          - entity: sensor.hoymiles_hit_maximum_charge_current
            name: Maksymalny prąd ładowania BMS
          - entity: sensor.hoymiles_hit_overview_battery_soc
            name: SOC magazynu

      - type: markdown
        title: Zasady bezpieczeństwa
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        view_layout:
          position: sidebar
        content: |-
          W czasie normalnej regulacji automatyka pozostaje w **Self-Use**. Łączy
          prognozę Solcast na dziś i
          jutro, rzeczywisty profil LOAD z czterech dni, chronione potrzeby domu,
          SOC, pojemność magazynu i historyczne napięcia L1/L2/L3. Od prognozy
          PV odejmuje zużycie domu, a dopiero pozostałą nadwyżkę traktuje jako
          energię wymagającą miejsca w magazynie.

          Najpierw odejmuje miejsce, które powstanie naturalnie, gdy dom będzie
          zasilany z baterii przed szczytem. Jeżeli nadal brakuje pojemności,
          opcja **Poranne rozładowanie** może wcześniej przełączyć EMS na Grid
          Discharge i sprzedać wyłącznie obliczony brak. Moc dobierana jest z
          ilości kWh oraz czasu pozostałego do okna, z 30-minutowym zapasem.
          Cykl kończy się po osiągnięciu docelowego SOC albo wcześniej, gdy
          najwyższa faza wzrośnie do 248,4 V lub średnia 10-minutowa do 249,2 V.
          Nigdy nie schodzi poniżej chronionego SOC domu i rezerwy.

          Funkcja porannego rozładowania wymaga aktywnego GCF, rzeczywistego
          limitu eksportu większego od 0%, braku blokady sprzedaży i wyłączonego
          trybu obserwacyjnego. Nie zmienia GCF ani **Maximum Export Power Limit**;
          korzysta z wartości zastanej i limitu zgodnego ze zgłoszeniem. Po
          zakończeniu odtwarza wcześniejszą maksymalną moc rozładowania, próg SOC
          oraz tryb Self-Use.

          Przed przewidywanym szczytem RCEm nadal ogranicza **Battery Max Charge
          Power**, aby nie napełnić magazynu za wcześnie. Jeżeli poranne
          rozładowanie pozostaje wyłączone lub eksport ma limit 0%, pole
          **Zaplanowane poranne rozładowanie** działa wyłącznie poglądowo.

          Opcjonalna regulacja eksportu zmienia wyłącznie **Maximum Export Power
          Limit**. Nigdy nie przekroczy mniejszej z dwóch wartości: limitu
          zastanego przy uruchomieniu oraz pola **Maksymalny eksport zgodny ze
          zgłoszeniem**. Przykład: falownik 20 kW i limit 50% oznacza maksymalnie
          10 kW eksportu. RCEm nie włącza GCF — użytkownik robi to świadomie w
          ustawieniach falownika.

          Nie zmienia asymetrii trójfazowej, Q(U), P(U), współczynnika mocy ani
          progów zabezpieczeń. Najwyższa z faz L1/L2/L3 zawsze ma pierwszeństwo.

          RCE, ładowanie taryfowe i RCEm 253 V+ wzajemnie się wykluczają.
          Wyrównywanie magazynu oraz ręczne plany EMS mają pierwszeństwo.

          Podczas pierwszych testów pozostaw przełącznik **Tylko obserwacja**
          włączony. Wyłączenie go pozwala regulatorowi zmieniać limit ładowania
          najwyżej o 10 punktów procentowych na minutę, a limit eksportu o 5–15
          punktów zależnie od napięcia. Przy 253 V eksport może zostać natychmiast
          ograniczony do 0%, a magazyn użyje pełnego bezpiecznego limitu BMS.

  - title: Wyniki sprzedaży — archiwum
    path: zyski
    icon: mdi:cash-multiple
    type: sidebar
    subview: true
    badges: []
    cards:
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          # ⚡ Instalacja pracuje na Twój wynik

          {% set revenue = states('sensor.hoymiles_rce_revenue_daily')
             | float(0) %}
          {% set energy = states(
             'sensor.hoymiles_rce_grid_export_energy_daily') | float(0) %}
          {% set average = revenue / energy if energy > 0 else 0 %}

          **Dzisiaj sieć przyjęła {{ energy | round(2) }} kWh**, a wyliczony
          przychód według cen RCE wynosi **{{ revenue | round(2) }} PLN**.
          Średnia uzyskana cena to **{{ average | round(3) }} PLN/kWh**.

          Każda sprzedana kilowatogodzina jest rozliczana z ceną obowiązującą
          w chwili eksportu. Liczniki okresowe zachowują dane po restartach
          Home Assistanta.
      - type: glance
        title: 💰 Przychód ze sprzedaży energii
        columns: 2
        show_name: true
        show_state: true
        state_color: true
