          - entity: input_number.hoymiles_rce_requested_discharge_power
            name: Moc rozładowania do sieci
          - entity: input_boolean.hoymiles_rce_dynamic_soc_enabled
            name: Automatycznie wyliczaj minimalny SOC
          - entity: input_number.hoymiles_rce_soc_safety_margin
            name: Korekta bezpieczeństwa SOC (+)
          - entity: input_boolean.hoymiles_sale_block_enabled
            name: Włącz blokadę sprzedaży
          - entity: input_datetime.hoymiles_sale_block_start
            name: Początek blokady
          - entity: input_datetime.hoymiles_sale_block_end
            name: Koniec blokady
          - entity: input_boolean.hoymiles_rce_advanced_view
            name: Dane zaawansowane (tryb ekspercki)
      - type: conditional
        view_layout:
          position: sidebar
        conditions:
          - entity: input_boolean.hoymiles_rce_advanced_view
            state: "on"
        card:
          type: custom:hoymiles-zebra-entities-card
          title: RCE — konfiguracja zaawansowana
          show_header_toggle: false
          state_color: true
          entities:
            - entity: input_text.hoymiles_solcast_forecast_today_entity
              name: Własna encja Solcast — dzisiaj
            - entity: input_text.hoymiles_solcast_forecast_tomorrow_entity
              name: Własna encja Solcast — jutro
            - entity: input_text.hoymiles_solcast_forecast_day_3_entity
              name: Własna encja Solcast — dzień 3
            - entity: input_number.hoymiles_rce_fallback_daily_load
              name: Zużycie dobowe przed zebraniem historii
      - type: custom:hoymiles-zebra-entities-card
        title: RCE — decyzja automatyki
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hoymiles_rce_status
            name: Stan automatyki
          - entity: sensor.hoymiles_hit_rce_optimized_plan
            name: Decyzja optymalizatora
          - entity: sensor.hoymiles_rce_dynamic_minimum_soc
            name: Chroniony minimalny SOC
          - entity: sensor.hoymiles_rce_available_energy_now
            name: Energia dostępna ponad rezerwę
          - entity: sensor.hoymiles_rce_planned_battery_export
            name: Planowany eksport z baterii
          - entity: sensor.hoymiles_rce_ending_battery_soc
            name: SOC na końcu horyzontu
      - type: vertical-stack
        cards:
          - type: custom:hoymiles-rce-chart-card
            title: RCE — dzisiaj
            entity: sensor.hoymiles_rce_day
            plan_entity: sensor.hoymiles_hit_rce_optimized_plan
            current_price_entity: sensor.hoymiles_rce_current_price
            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
          - type: custom:hoymiles-rce-chart-card
            title: RCE — jutro
            entity: sensor.hoymiles_rce_day_tomorrow
            future_data: true
            plan_entity: sensor.hoymiles_hit_rce_optimized_plan
            current_price_entity: sensor.hoymiles_rce_current_price
            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
      - type: markdown
        title: Wymagane źródło prognozy
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rce_advanced_view
            state: "on"
        view_layout:
          position: sidebar
        entity_id:
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - sensor.hoymiles_rce_reserve_status
          - sensor.hoymiles_rce_dynamic_minimum_soc
        content: |-
          Automatyka wymaga zewnętrznej integracji
          **Solcast PV Forecast** producenta **BJReplay**:
          [instalacja i konfiguracja](https://github.com/BJReplay/ha-solcast-solar).

          Wymagane są prognozy **Forecast Today** i **Forecast Tomorrow**.
          Jeżeli Solcast udostępnia **Forecast Day 3**, integracja wykorzysta ją
          automatycznie do wyceny energii, którą warto zachować po końcu
          48-godzinnego rynku. Brak tej encji nie blokuje pracy. Encje są
          wykrywane automatycznie w polskiej i angielskiej wersji HA; w razie
          niestandardowych nazw można wpisać dzisiaj i jutro u góry.

          Algorytm symuluje bilans co 30 minut od teraz przez dzisiejszą noc,
          cały kolejny dzień i następną noc do **90 minut po wschodzie**.
          Najpierw odkłada poza sprzedażą rezerwę awaryjną Self-Use, korektę
          bezpieczeństwa oraz pełne przewidywane zużycie domu do końca
          najbliższej chronionej nocy. Prognozowane PV przed zachodem nie
          pomniejsza tej nocnej rezerwy. Dopiero pozostałą energię przydziela
          do najdroższych dostępnych bloków RCE dzisiaj lub jutro.

          Cena sprzedaży nie jest ustawiana ręcznie. Optymalizator porównuje
          pełny wynik finansowy wszystkich dostępnych bloków w horyzoncie,
          wybiera najwyższe ceny i uwzględnia naturalny eksport PV, koszt
          zużycia baterii oraz wartość energii zachowanej na kolejny dzień.
          Wcześniejsze rozładowanie wykona tylko wtedy, gdy zwiększy wynik netto
          lub utworzy miejsce w baterii przed późniejszą nadwyżką sprzedawaną
          taniej.

          Moc systemu jest liczona jako **moc jednego falownika × automatycznie
          wykryta liczba falowników × ustawiony procent rozładowania**.
          Do zebrania co najmniej 24 godzin historii używane jest awaryjne
          zużycie dobowe z pola u góry. Następnie algorytm uczy się maksymalnie
          z 28 pełnych dni: większą wagę nadaje dniom ostatnim, odrzuca
          pojedyncze skoki oraz buduje osobne profile 48 półgodzinnych bloków
          dla dni roboczych i weekendów. Ostatnie cztery dni pozostają szybkim
          zabezpieczeniem po świeżej instalacji. Faktyczne pokrycie i wybrany
          model są pokazane w diagnostyce.

          Rezerwa jest wyznaczana konserwatywnie z przedziałów **P10/P50/P90**
          Solcast i z błędu prognozy zmierzonego w poprzednich dniach. W ciągu
          dnia korekta porównuje prognozę z produkcją rzeczywistą, ale nie
          obniża ochrony domu na podstawie krótkiej próbki po wschodzie.

          Pole rezerwy Self-Use nie jest zmieniane. Pozostaje energią dostępną
          poniżej normalnego progu wyłącznie podczas zaniku sieci.
      - type: markdown
        title: Plan rozładowań RCE
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - sensor.hoymiles_rce_automatic_price_floor
          - sensor.hoymiles_rce_optimization_gain
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
          {% if plan is not none %}
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set dates = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_dates') %}
          {% set export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'expected_export_kwh') | float(0) %}
          {% set battery_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                             'planned_battery_export_kwh')
                                             | float(0) %}
          {% set pv_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                        'natural_pv_export_kwh') | float(0) %}
          {% set baseline_export = states(
               'sensor.hoymiles_rce_self_use_baseline_export') | float(0) %}
          {% set battery_revenue = state_attr(
               'sensor.hoymiles_rce_discharge_plan',
               'planned_battery_revenue_pln') | float(0) %}
          {% set pv_revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                         'natural_pv_revenue_pln') | float(0) %}
          {% set revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'estimated_revenue_pln') | float(0) %}
          {% set price_floor = states(
               'sensor.hoymiles_rce_automatic_price_floor') %}
          {% set gain = plan.attributes.net_optimization_gain_pln
             | default(0) | float(0) %}
          {% set preview = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'plan_is_preview') %}
          {% set scope = state_attr('sensor.hoymiles_rce_discharge_plan',
                                    'planning_scope') %}
          **Horyzont:** {{ dates }}<br>
          **Zakres cen:** {{ 'dzisiaj i jutro'
             if scope == 'today_and_tomorrow'
             else 'tylko dzisiaj — jutro zostanie dopisane automatycznie' }}<br>
          **Tryb planu:** {{ 'podgląd — automatyczne rozładowanie jest wyłączone'
             if preview else 'aktywny' }}<br>
          **Automatyczna cena graniczna planu:** {{ price_floor
             if price_floor not in ['unknown', 'unavailable'] else 'brak sprzedaży' }}
          {{ 'PLN/kWh' if price_floor not in ['unknown', 'unavailable'] else '' }}<br>
          **Korzyść optymalizacji netto:** {{ gain | round(2) }} PLN<br>
          **Najbardziej opłacalne okresy wybrane przez algorytm:**<br>
          {{ periods or 'Brak danych do przygotowania planu.' }}

          **Łączny plan:** {{ minutes // 60 }} h
          {{ minutes % 60 }} min ({{ states('sensor.hoymiles_rce_discharge_plan') }}
          bloków po 30 min)<br>
          **Zaplanowany eksport sterowany od teraz:** {{ battery_export | round(2) }}
          kWh → {{ battery_revenue | round(2) }} PLN<br>
          **Nadwyżka prognozowana przy pozostawieniu Self-Use:**
          {{ baseline_export | round(2) }} kWh<br>
          **Nieunikniona nadwyżka PV pozostała po optymalizacji:**
          {{ pv_export | round(2) }}
          kWh → {{ pv_revenue | round(2) }} PLN<br>
          **Łączny przyszły eksport od teraz:** {{ export | round(2) }} kWh<br>
          **Łączny przyszły szacunkowy przychód:** {{ revenue | round(2) }} PLN

          {% if is_state('input_boolean.hoymiles_rce_advanced_view', 'on') %}
          ---
          **Jakość danych:** {{ plan.attributes.data_quality_score | default(0) }}/100
          ({{ plan.attributes.data_quality_level | default('brak oceny') }}){% set issues =
          plan.attributes.data_quality_issues | default([], true) %}{% if issues %}
          · uwagi: {{ issues | join(', ') }}{% endif %}<br>
          **Prognoza dzisiaj P10 / P50 / P90:**
          {{ plan.attributes.forecast_today_p10_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_today_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_today_p90_kwh | default('—', true) }} kWh<br>
          **Prognoza jutro P10 / P50 / P90:**
          {{ plan.attributes.forecast_tomorrow_p10_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_tomorrow_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_tomorrow_p90_kwh | default('—', true) }} kWh<br>
          {% set day3_entity = plan.attributes.forecast_day3_entity | default(none) %}
          {% set day3_configured = plan.attributes.forecast_day3_configured_entity
             | default(none) %}
          {% set day3_status = plan.attributes.forecast_day3_status | default(none) %}
          {% set day3_fresh = plan.attributes.forecast_day3_data_fresh | default(none) %}
          {% set day3_age = plan.attributes.forecast_day3_age_seconds | default(none) %}
          {% set day3_reason = plan.attributes.forecast_day3_data_reason | default(none) %}
          **Day 3 — encja:**
          {{ day3_entity if day3_entity not in [none, '', 'not_enabled',
             'not_available', 'unknown', 'unavailable'] else 'brak wykrytej encji' }} ·
          konfiguracja:
          {{ day3_configured if day3_configured not in [none, '', 'automatic',
             'unknown', 'unavailable'] else 'automatyczna' }}<br>
          **Day 3 — status / świeża:**
          {{ day3_status if day3_status not in [none, ''] else 'brak statusu' }} /
          {% if day3_fresh is none %}brak danych{% elif day3_fresh %}tak{% else %}nie{% endif %}<br>
          **Day 3 — wiek ze znakiem:**
          {{ ((day3_age | float(0)) | round(1)) ~ ' s'
             if day3_age is number else 'brak znacznika czasu' }} · powód:
          {{ day3_reason if day3_reason not in [none, ''] else 'brak informacji' }}<br>
          **Pewność prognozy / udział wariantu ostrożnego:**
          {{ plan.attributes.forecast_confidence_percent | default(0) }}% /
          {{ ((plan.attributes.forecast_uncertainty_risk_weight | default(0))
              * 100) | round(0) }}%<br>
          **Model odbiorników:** {{ plan.attributes.load_profile_mode
             | default('tryb awaryjny') }} ·
          {{ plan.attributes.recorder_load_history_days | default(0) }} dni historii<br>
          **Fizyczna moc planu:** żądana
          {{ plan.attributes.requested_export_power_kw | default(0) }} kW · dostępna
          {{ plan.attributes.maximum_export_power_kw | default(0) }} kW · źródło limitu:
          {{ plan.attributes.physical_limit_source | default('brak') }}<br>
          **GCF:** {{ 'włączone' if plan.attributes.gcf_enabled | default(false)
             else 'wyłączone' }} · limit
          {{ plan.attributes.gcf_export_limit_percent | default('—', true) }}%<br>
          **Koszt zużycia baterii w planie:**
          {{ plan.attributes.battery_wear_cost_pln | default(0) }} PLN ·
          **korzyść netto:** {{ plan.attributes.net_optimization_gain_pln
             | default(0) }} PLN<br>
          **Wzrost przychodu brutto przed kosztem baterii:**
          {{ plan.attributes.gross_optimization_gain_pln
             | default(plan.attributes.optimization_gain_pln | default(0)) }} PLN<br>
          **Dodatkowa rezerwa po horyzoncie (deficyt dnia 3):**
          {{ plan.attributes.terminal_energy_target_kwh | default(0) }} kWh ·
          {{ plan.attributes.terminal_energy_target_reason
             | default('brak danych o przyczynie') }} · wartość
          {{ plan.attributes.terminal_energy_value_pln | default(0) }} PLN
          {% endif %}

          Dane przyszłego planu nie zawierają energii sprzedanej wcześniej
          dzisiaj. Eksport zrealizowany jest rozdzielany wyżej na sprzedaż
          sterowaną RCE i naturalną nadwyżkę w trybie Self-Use.

          Automatyka wróci do **Autokonsumpcji (Self-Use)** po zakończeniu
          wybranego bloku, po osiągnięciu minimalnego SOC albo po wyłączeniu
          przełącznika. Blokada sprzedaży wyklucza wskazane godziny z planu.
          {% endif %}
      - type: custom:hoymiles-aurora-finance-card
      - type: custom:hoymiles-responsive-stack-card
        minimum_width: 320
        gap: 12
        cards:
          - type: custom:hoymiles-aurora-frame-card
            accent: pv
            card:
              type: statistics-graph
              title: Przychód — ostatnie 30 dni
              chart_type: bar
              period: day
              days_to_show: 30
              hide_legend: true
              fit_y_data: true
              stat_types:
                - change
              entities:
                - entity: sensor.hoymiles_rce_revenue_total
                  name: Przychód
                  color: "#2DE083"
