        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set recorder_average =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_average_4d_kwh') %}
          {% set recorder_days =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_history_days') | int(0) %}
          {% set coverage =
            state_attr('sensor.hoymiles_load_energy_last_4_days',
                       'age_coverage_ratio') | float(0) %}
          {{ (is_number(recorder_average) and recorder_days >= 1)
             or (is_number(states('sensor.hoymiles_load_energy_last_4_days'))
                 and coverage >= 0.24) }}
        state: >-
          {% set recorder_average =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_average_4d_kwh') %}
          {% if is_number(recorder_average) %}
            {{ recorder_average | float(0) | round(2) }}
          {% else %}
            {% set total =
              states('sensor.hoymiles_load_energy_last_4_days') | float(0) %}
            {% set coverage =
              state_attr('sensor.hoymiles_load_energy_last_4_days',
                         'age_coverage_ratio') | float(0) %}
            {% set history_days = [[coverage * 4, 1] | max, 4] | min %}
            {{ (total / history_days) | round(2) }}
          {% endif %}
        attributes:
          history_days: >-
            {% set recorder_days =
              state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                         'recorder_load_history_days') %}
            {% if is_number(recorder_days) and recorder_days | int(0) >= 1 %}
              {{ recorder_days | float(0) | round(2) }}
            {% else %}
              {% set coverage =
                state_attr('sensor.hoymiles_load_energy_last_4_days',
                           'age_coverage_ratio') | float(0) %}
              {{ ([coverage * 4, 4] | min) | round(2) }}
            {% endif %}
          energy_in_history: >-
            {% set recorder_energy =
              state_attr('sensor.hoymiles_hit_rce_optimized_plan',
