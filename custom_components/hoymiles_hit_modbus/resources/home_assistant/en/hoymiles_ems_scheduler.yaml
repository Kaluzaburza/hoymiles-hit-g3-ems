                      or is_state(
                        'input_boolean.hoymiles_rcm_pre_discharge_active', 'on'))
                    else 0)
             + (1 if is_state('input_boolean.hoymiles_discharge_cycle_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_charge_cycle_active', 'on') else 0)
              + (1 if is_state('input_boolean.hoymiles_battery_balancing_active', 'on') else 0) %}
          {% set export_owner = is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'on') %}
          {% set foreign_running =
               (1 if is_state('input_boolean.hoymiles_rce_discharge_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_tariff_charge_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_discharge_cycle_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_charge_cycle_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_battery_balancing_active', 'on') else 0) %}
          {{ configured > 1 or running > 1
             or (export_owner and foreign_running > 0) }}
        attributes:
          configured_automatic_modes: >-
            {{ [
              'RCE' if is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on') else none,
              'Tariff' if is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on') else none,
              'RCEm' if is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state('input_boolean.hoymiles_rcm_shadow_mode', 'off')
                       else none
            ] | reject('equalto', none) | list | join(', ') }}

      - name: "Hoymiles RCEm Risk Window Active"
        unique_id: hoymiles_rcm_risk_window_active
        icon: mdi:transmission-tower-export
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                        'risk_window_active') is not none }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                        'risk_window_active') | default(false, true) }}

      - name: "Hoymiles Battery Balancing Apply Authorized"
        unique_id: hoymiles_battery_balancing_apply_authorized
        icon: mdi:shield-check-outline
        state: >-
          {% set tx = 'sensor.hoymiles_battery_balancing_transaction' %}
          {% set cycle = state_attr(tx, 'cycle_id') %}
          {{ states(tx) in [
               'SNAPSHOT_VALID', 'APPLYING', 'OPERATIONAL', 'SLOW',
               'HOLD_ARMING', 'HOLDING']
             and state_attr(tx, 'snapshot_valid') | bool(false)
             and state_attr(tx, 'snapshot_cycle_id') == cycle
             and state_attr(tx, 'owner') == 'balancing'
             and is_state(
               'input_boolean.hoymiles_battery_balancing_active', 'on')
             and is_state(
               'input_boolean.hoymiles_battery_balancing_enabled', 'on')
             and state_attr(
               'sensor.hoymiles_ems_control_owner', 'owner_code') == 'balancing'
             and is_state('binary_sensor.hoymiles_ems_control_conflict', 'off')
             and is_state(
               'binary_sensor.hoymiles_battery_balancing_control_data_ready',
               'on')
             and not (
               is_state(
                 'sensor.hoymiles_battery_balancing_abort_request', 'PENDING')
               and state_attr(
                 'sensor.hoymiles_battery_balancing_abort_request',
                 'cycle_id') == cycle) }}
        attributes:
          cycle_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}

      - name: "Hoymiles Battery Balancing Restore Authorized"
        unique_id: hoymiles_battery_balancing_restore_authorized
        icon: mdi:shield-refresh-outline
        state: >-
          {% set tx = 'sensor.hoymiles_battery_balancing_transaction' %}
          {% set cycle = state_attr(tx, 'cycle_id') %}
          {{ states(tx) in [
               'ABORT_REQUESTED', 'RESTORING', 'RESTORE_FAILED',
               'SNAPSHOT_VALID', 'APPLYING', 'OPERATIONAL', 'SLOW',
               'HOLD_ARMING', 'HOLDING']
             and state_attr(tx, 'snapshot_valid') | bool(false)
             and state_attr(tx, 'snapshot_cycle_id') == cycle
             and state_attr(tx, 'owner') == 'balancing'
             and is_state(
               'input_boolean.hoymiles_battery_balancing_active', 'on')
             and state_attr(
               'sensor.hoymiles_ems_control_owner', 'owner_code') == 'balancing'
             and is_state('input_boolean.hoymiles_discharge_cycle_active', 'off')
             and is_state('input_boolean.hoymiles_charge_cycle_active', 'off')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
        attributes:
          cycle_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}

      - name: "Hoymiles Battery Balancing Due"
        unique_id: hoymiles_battery_balancing_due
        icon: mdi:calendar-alert
        availability: >-
          {{ states('input_datetime.hoymiles_battery_balancing_last_completed')
               not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set last = states(
               'input_datetime.hoymiles_battery_balancing_last_completed') %}
          {% set midnight = as_timestamp(last[0:10], as_timestamp(now())) %}
          {% set days = states(
               'input_number.hoymiles_battery_balancing_interval_days')
               | int(30) %}
          {{ is_state('input_boolean.hoymiles_battery_balancing_enabled', 'on')
             and is_state('input_boolean.hoymiles_battery_balancing_active', 'off')
             and as_timestamp(now()) >= midnight + days * 86400 }}

      - name: "Hoymiles Battery Balancing Control Data Ready"
        unique_id: hoymiles_battery_balancing_control_data_ready
        icon: mdi:battery-check-outline
        state: >-
          {% set soc = states.sensor.hoymiles_hit_overview_battery_soc %}
          {% set load = states.sensor.hoymiles_actual_load_power %}
          {% set current = states.sensor.hoymiles_hit_maximum_charge_current %}
          {% set voltage = states.sensor.hoymiles_hit_battery_voltage_bms %}
          {% set max_power =
            states.sensor.hoymiles_hit_ems_maximum_charge_power_readback %}
          {% set force_soc =
            states.sensor.hoymiles_hit_ems_force_charge_soc_readback %}
          {% set ems_code =
            states.sensor.hoymiles_hit_ems_mode_readback_code %}
          {% set ems_generation =
            states.sensor.hoymiles_hit_ems_control_readback_generation %}
          {% set topology_generation =
            states.sensor.hoymiles_hit_parallel_topology_readback_generation %}
          {% set uptime = states.sensor.hoymiles_hit_esp_uptime %}
          {% set machine_type = states('sensor.hoymiles_hit_machines_type') %}
          {% set machine_count = states(
            'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
          {% set bms_fault = states(
            'sensor.hoymiles_hit_battery_fault_code_bms') %}
          {% set overview_fault = states(
            'sensor.hoymiles_hit_overview_battery_faults') %}
          {% set inverter_status = states(
            'sensor.hoymiles_hit_inverter_work_status') %}
          {% set readback_supported = states(
            'sensor.hoymiles_hit_ems_verified_hardware_readback_supported') %}
          {% set soc_reported = soc.last_reported
               if soc.last_reported is defined else soc.last_updated %}
          {% set load_reported = load.last_reported
               if load.last_reported is defined else load.last_updated %}
          {% set current_reported = current.last_reported
               if current.last_reported is defined else current.last_updated %}
          {% set voltage_reported = voltage.last_reported
               if voltage.last_reported is defined else voltage.last_updated %}
          {% set max_power_reported = max_power.last_reported
               if max_power.last_reported is defined else max_power.last_updated %}
          {% set force_soc_reported = force_soc.last_reported
               if force_soc.last_reported is defined else force_soc.last_updated %}
          {% set ems_reported = ems_generation.last_reported
               if ems_generation.last_reported is defined
               else ems_generation.last_updated %}
          {% set topology_reported = topology_generation.last_reported
               if topology_generation.last_reported is defined
               else topology_generation.last_updated %}
          {% set uptime_reported = uptime.last_reported
               if uptime.last_reported is defined else uptime.last_updated %}
          {% set soc_age = as_timestamp(now()) - as_timestamp(soc_reported, 0) %}
          {% set load_age = as_timestamp(now()) - as_timestamp(load_reported, 0) %}
          {% set current_age = as_timestamp(now())
               - as_timestamp(current_reported, 0) %}
          {% set voltage_age = as_timestamp(now())
               - as_timestamp(voltage_reported, 0) %}
          {% set max_power_age = as_timestamp(now())
               - as_timestamp(max_power_reported, 0) %}
          {% set force_soc_age = as_timestamp(now())
               - as_timestamp(force_soc_reported, 0) %}
          {% set ems_age = as_timestamp(now())
               - as_timestamp(ems_reported, 0) %}
          {% set topology_age = as_timestamp(now())
               - as_timestamp(topology_reported, 0) %}
          {% set uptime_age = as_timestamp(now())
               - as_timestamp(uptime_reported, 0) %}
          {% set topology_valid = is_number(machine_type)
             and is_number(machine_count)
             and (machine_count | float(0)) == (machine_count | int(-1))
             and (((machine_type | int(-1)) == 0
                   and (machine_count | int(-1)) == 1)
                  or ((machine_type | int(-1)) == 1
                      and (machine_count | int(-1)) >= 2
                      and (machine_count | int(-1)) <= 10)) %}
          {% set hard_valid = topology_valid
             and is_number(readback_supported)
             and (readback_supported | float(0)) > 0.5
             and is_number(ems_code.state)
             and (ems_code.state | int(-1)) in [0, 4, 5]
             and states('sensor.hoymiles_ems_hardware_mode')
               in ['self_use', 'grid_charge', 'grid_discharge']
             and is_number(soc.state)
             and is_number(load.state)
             and is_number(current.state)
             and is_number(voltage.state)
             and is_number(max_power.state)
             and is_number(force_soc.state)
             and is_number(ems_generation.state)
             and is_number(topology_generation.state)
             and is_number(uptime.state)
             and (soc.state | float(-1)) >= 0
             and (soc.state | float(101)) <= 100
             and (soc.state | float(0)) | abs < 1000000000
             and (load.state | float(-1)) >= 0
             and (load.state | float(0)) | abs < 1000000000
             and (current.state | float(0)) > 0
             and (current.state | float(0)) | abs < 1000000000
             and (voltage.state | float(0)) > 0
             and (voltage.state | float(0)) | abs < 1000000000
             and (max_power.state | float(-1)) >= 0
             and (max_power.state | float(101)) <= 100
             and (force_soc.state | float(-1)) >= 0
             and (force_soc.state | float(101)) <= 100
             and bms_fault == 'No error'
             and overview_fault == 'No faults'
             and inverter_status in ['Standby', 'Grid test', 'On-grid operation']
             and not is_state('binary_sensor.hoymiles_ems_control_conflict', 'on')
             and is_number(states(
               'sensor.hoymiles_battery_balancing_bms_safe_charge_power'))
             and (states(
               'sensor.hoymiles_battery_balancing_bms_safe_charge_power')
               | float(0)) > 0
             and is_number(state_attr(
               'sensor.hoymiles_battery_balancing_slow_charge_power',
               'self_use_percent'))
             and (state_attr(
               'sensor.hoymiles_battery_balancing_slow_charge_power',
               'self_use_percent') | float(0)) >= 0.1
             and is_number(state_attr(
               'sensor.hoymiles_battery_balancing_slow_charge_power',
               'grid_charge_percent'))
             and (state_attr(
               'sensor.hoymiles_battery_balancing_slow_charge_power',
               'grid_charge_percent') | float(0)) >= 0.1 %}
          {% set freshness_valid = soc_age >= -5 and soc_age <= 120
             and load_age >= -5 and load_age <= 120
             and current_age >= -5 and current_age <= 300
             and voltage_age >= -5 and voltage_age <= 300
             and max_power_age >= -5 and max_power_age <= 300
             and force_soc_age >= -5 and force_soc_age <= 300
             and ems_age >= -5 and ems_age <= 180
             and topology_age >= -5 and topology_age <= 180
             and uptime_age >= -5 and uptime_age <= 180 %}
          {{ hard_valid and freshness_valid
             and is_state('binary_sensor.hoymiles_ems_execution_ready', 'on') }}
        attributes:
          soc_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_overview_battery_soc %}
            {% set reported = item.last_reported
                 if item.last_reported is defined else item.last_updated %}
            {{ (as_timestamp(now()) - as_timestamp(reported, 0)) | round(1) }}
          bms_charge_limit_percent: >-
            {{ states(
              'sensor.hoymiles_battery_balancing_bms_safe_charge_power') }}
          failure_class: >-
            {% set soc = states.sensor.hoymiles_hit_overview_battery_soc %}
            {% set load = states.sensor.hoymiles_actual_load_power %}
            {% set current = states.sensor.hoymiles_hit_maximum_charge_current %}
            {% set voltage = states.sensor.hoymiles_hit_battery_voltage_bms %}
            {% set max_power =
              states.sensor.hoymiles_hit_ems_maximum_charge_power_readback %}
            {% set force_soc =
              states.sensor.hoymiles_hit_ems_force_charge_soc_readback %}
            {% set ems_code =
              states.sensor.hoymiles_hit_ems_mode_readback_code %}
            {% set ems_generation =
              states.sensor.hoymiles_hit_ems_control_readback_generation %}
            {% set topology_generation =
              states.sensor.hoymiles_hit_parallel_topology_readback_generation %}
            {% set uptime = states.sensor.hoymiles_hit_esp_uptime %}
            {% set machine_type = states('sensor.hoymiles_hit_machines_type') %}
            {% set machine_count = states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
            {% set readback_supported = states(
              'sensor.hoymiles_hit_ems_verified_hardware_readback_supported') %}
            {% set topology_valid = is_number(machine_type)
               and is_number(machine_count)
               and (machine_count | float(0)) == (machine_count | int(-1))
               and (((machine_type | int(-1)) == 0
                     and (machine_count | int(-1)) == 1)
                    or ((machine_type | int(-1)) == 1
                        and (machine_count | int(-1)) >= 2
                        and (machine_count | int(-1)) <= 10)) %}
            {% set hard_invalid = not topology_valid
               or not is_number(readback_supported)
               or (readback_supported | float(0)) <= 0.5
               or not is_number(ems_code.state)
               or (ems_code.state | int(-1)) not in [0, 4, 5]
               or states('sensor.hoymiles_ems_hardware_mode')
                  not in ['self_use', 'grid_charge', 'grid_discharge']
               or not is_number(soc.state) or (soc.state | float(-1)) < 0
               or (soc.state | float(101)) > 100
               or (soc.state | float(0)) | abs >= 1000000000
               or not is_number(load.state) or (load.state | float(-1)) < 0
               or (load.state | float(0)) | abs >= 1000000000
               or not is_number(current.state) or (current.state | float(0)) <= 0
               or (current.state | float(0)) | abs >= 1000000000
               or not is_number(voltage.state) or (voltage.state | float(0)) <= 0
               or (voltage.state | float(0)) | abs >= 1000000000
               or not is_number(max_power.state)
               or (max_power.state | float(-1)) < 0
               or (max_power.state | float(101)) > 100
               or not is_number(force_soc.state)
               or (force_soc.state | float(-1)) < 0
               or (force_soc.state | float(101)) > 100
               or not is_number(ems_generation.state)
               or not is_number(topology_generation.state)
               or not is_number(uptime.state)
               or states('sensor.hoymiles_hit_battery_fault_code_bms')
                  != 'No error'
               or states('sensor.hoymiles_hit_overview_battery_faults')
                  != 'No faults'
               or states('sensor.hoymiles_hit_inverter_work_status')
                  not in ['Standby', 'Grid test', 'On-grid operation']
               or is_state('binary_sensor.hoymiles_ems_control_conflict', 'on')
               or not is_number(states(
                 'sensor.hoymiles_battery_balancing_bms_safe_charge_power'))
               or (states(
                 'sensor.hoymiles_battery_balancing_bms_safe_charge_power')
                   | float(0)) <= 0
               or not is_number(state_attr(
                 'sensor.hoymiles_battery_balancing_slow_charge_power',
                 'self_use_percent'))
               or (state_attr(
                 'sensor.hoymiles_battery_balancing_slow_charge_power',
                 'self_use_percent') | float(0)) < 0.1
               or not is_number(state_attr(
                 'sensor.hoymiles_battery_balancing_slow_charge_power',
                 'grid_charge_percent'))
               or (state_attr(
                 'sensor.hoymiles_battery_balancing_slow_charge_power',
                 'grid_charge_percent') | float(0)) < 0.1 %}
            {% set soc_age = as_timestamp(now()) - as_timestamp(
              soc.last_reported if soc.last_reported is defined
              else soc.last_updated, 0) %}
            {% set load_age = as_timestamp(now()) - as_timestamp(
              load.last_reported if load.last_reported is defined
              else load.last_updated, 0) %}
            {% set current_age = as_timestamp(now()) - as_timestamp(
              current.last_reported if current.last_reported is defined
              else current.last_updated, 0) %}
            {% set voltage_age = as_timestamp(now()) - as_timestamp(
              voltage.last_reported if voltage.last_reported is defined
              else voltage.last_updated, 0) %}
            {% set max_power_age = as_timestamp(now()) - as_timestamp(
              max_power.last_reported if max_power.last_reported is defined
              else max_power.last_updated, 0) %}
            {% set force_soc_age = as_timestamp(now()) - as_timestamp(
              force_soc.last_reported if force_soc.last_reported is defined
              else force_soc.last_updated, 0) %}
            {% set ems_age = as_timestamp(now()) - as_timestamp(
              ems_generation.last_reported
              if ems_generation.last_reported is defined
              else ems_generation.last_updated, 0) %}
            {% set topology_age = as_timestamp(now()) - as_timestamp(
              topology_generation.last_reported
              if topology_generation.last_reported is defined
              else topology_generation.last_updated, 0) %}
            {% set uptime_age = as_timestamp(now()) - as_timestamp(
              uptime.last_reported if uptime.last_reported is defined
              else uptime.last_updated, 0) %}
            {% set freshness_valid =
               soc_age >= -5 and soc_age <= 120
               and load_age >= -5 and load_age <= 120
               and current_age >= -5 and current_age <= 300
               and voltage_age >= -5 and voltage_age <= 300
               and max_power_age >= -5 and max_power_age <= 300
               and force_soc_age >= -5 and force_soc_age <= 300
               and ems_age >= -5 and ems_age <= 180
               and topology_age >= -5 and topology_age <= 180
               and uptime_age >= -5 and uptime_age <= 180 %}
            {% if hard_invalid %}hard
            {% elif not freshness_valid
                  or not is_state(
                    'binary_sensor.hoymiles_ems_execution_ready', 'on') %}soft
            {% else %}ready{% endif %}
          reason_code: >-
            {% set soc = states.sensor.hoymiles_hit_overview_battery_soc %}
            {% set load = states.sensor.hoymiles_actual_load_power %}
            {% set current = states.sensor.hoymiles_hit_maximum_charge_current %}
            {% set voltage = states.sensor.hoymiles_hit_battery_voltage_bms %}
            {% set max_power =
              states.sensor.hoymiles_hit_ems_maximum_charge_power_readback %}
            {% set force_soc =
              states.sensor.hoymiles_hit_ems_force_charge_soc_readback %}
            {% set ems_code =
              states.sensor.hoymiles_hit_ems_mode_readback_code %}
            {% set ems_generation =
              states.sensor.hoymiles_hit_ems_control_readback_generation %}
            {% set topology_generation =
              states.sensor.hoymiles_hit_parallel_topology_readback_generation %}
            {% set uptime = states.sensor.hoymiles_hit_esp_uptime %}
            {% set machine_type = states('sensor.hoymiles_hit_machines_type') %}
            {% set machine_count = states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
            {% set readback_supported = states(
              'sensor.hoymiles_hit_ems_verified_hardware_readback_supported') %}
            {% set topology_valid = is_number(machine_type)
               and is_number(machine_count)
               and (machine_count | float(0)) == (machine_count | int(-1))
               and (((machine_type | int(-1)) == 0
                     and (machine_count | int(-1)) == 1)
                    or ((machine_type | int(-1)) == 1
                        and (machine_count | int(-1)) >= 2
                        and (machine_count | int(-1)) <= 10)) %}
            {% set soc_age = as_timestamp(now()) - as_timestamp(
              soc.last_reported if soc.last_reported is defined
              else soc.last_updated, 0) %}
            {% set load_age = as_timestamp(now()) - as_timestamp(
              load.last_reported if load.last_reported is defined
              else load.last_updated, 0) %}
            {% set current_age = as_timestamp(now()) - as_timestamp(
              current.last_reported if current.last_reported is defined
              else current.last_updated, 0) %}
            {% set voltage_age = as_timestamp(now()) - as_timestamp(
              voltage.last_reported if voltage.last_reported is defined
              else voltage.last_updated, 0) %}
            {% set max_power_age = as_timestamp(now()) - as_timestamp(
              max_power.last_reported if max_power.last_reported is defined
              else max_power.last_updated, 0) %}
            {% set force_soc_age = as_timestamp(now()) - as_timestamp(
              force_soc.last_reported if force_soc.last_reported is defined
              else force_soc.last_updated, 0) %}
            {% set ems_age = as_timestamp(now()) - as_timestamp(
              ems_generation.last_reported
              if ems_generation.last_reported is defined
              else ems_generation.last_updated, 0) %}
            {% set topology_age = as_timestamp(now()) - as_timestamp(
              topology_generation.last_reported
              if topology_generation.last_reported is defined
              else topology_generation.last_updated, 0) %}
            {% set uptime_age = as_timestamp(now()) - as_timestamp(
              uptime.last_reported if uptime.last_reported is defined
              else uptime.last_updated, 0) %}
            {% set freshness_valid =
               soc_age >= -5 and soc_age <= 120
               and load_age >= -5 and load_age <= 120
               and current_age >= -5 and current_age <= 300
               and voltage_age >= -5 and voltage_age <= 300
               and max_power_age >= -5 and max_power_age <= 300
               and force_soc_age >= -5 and force_soc_age <= 300
               and ems_age >= -5 and ems_age <= 180
               and topology_age >= -5 and topology_age <= 180
               and uptime_age >= -5 and uptime_age <= 180 %}
            {% if is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') %}
              off_grid
            {% elif is_state('binary_sensor.hoymiles_ems_control_conflict', 'on') %}
              control_conflict
            {% elif not topology_valid %}
              invalid_topology
            {% elif not is_number(readback_supported)
                  or (readback_supported | float(0)) <= 0.5
                  or not is_number(ems_code.state)
                  or (ems_code.state | int(-1)) not in [0, 4, 5]
                  or states('sensor.hoymiles_ems_hardware_mode')
                     not in ['self_use', 'grid_charge', 'grid_discharge'] %}
              communication_failure
            {% elif not is_number(soc.state) or (soc.state | float(-1)) < 0
                  or (soc.state | float(101)) > 100
                  or (soc.state | float(0)) | abs >= 1000000000 %}
              bms_data_invalid
            {% elif not is_number(current.state)
                  or (current.state | float(0)) <= 0
                  or (current.state | float(0)) | abs >= 1000000000
                  or not is_number(voltage.state)
                  or (voltage.state | float(0)) <= 0
                  or (voltage.state | float(0)) | abs >= 1000000000 %}
              bms_data_invalid
            {% elif states('sensor.hoymiles_hit_battery_fault_code_bms')
                    != 'No error'
                  or states('sensor.hoymiles_hit_overview_battery_faults')
                    != 'No faults' %}
              bms_fault
            {% elif states('sensor.hoymiles_hit_inverter_work_status')
                    == 'Fault' %}
              inverter_fault
            {% elif states('sensor.hoymiles_hit_inverter_work_status')
                    not in ['Standby', 'Grid test', 'On-grid operation'] %}
              communication_failure
            {% elif not is_number(load.state) or (load.state | float(-1)) < 0
                  or (load.state | float(0)) | abs >= 1000000000 %}
              load_data_invalid
            {% elif not is_number(max_power.state)
                  or (max_power.state | float(-1)) < 0
                  or (max_power.state | float(101)) > 100
                  or not is_number(force_soc.state)
                  or (force_soc.state | float(-1)) < 0
                  or (force_soc.state | float(101)) > 100
                  or not is_number(ems_generation.state)
                  or not is_number(topology_generation.state)
                  or not is_number(uptime.state) %}
              communication_failure
            {% elif not is_number(states(
                    'sensor.hoymiles_battery_balancing_bms_safe_charge_power'))
                  or (states(
                    'sensor.hoymiles_battery_balancing_bms_safe_charge_power')
                      | float(0)) <= 0
                  or not is_number(state_attr(
                    'sensor.hoymiles_battery_balancing_slow_charge_power',
                    'self_use_percent'))
                  or (state_attr(
                    'sensor.hoymiles_battery_balancing_slow_charge_power',
                    'self_use_percent') | float(0)) < 0.1
                  or not is_number(state_attr(
                    'sensor.hoymiles_battery_balancing_slow_charge_power',
                    'grid_charge_percent'))
                  or (state_attr(
                    'sensor.hoymiles_battery_balancing_slow_charge_power',
                    'grid_charge_percent') | float(0)) < 0.1 %}
              bms_limit_invalid
            {% elif not freshness_valid
                  or not is_state(
                    'binary_sensor.hoymiles_ems_execution_ready', 'on') %}
              data_stale
            {% else %}ready{% endif %}
      - name: "Hoymiles RCE Planned Export Slot"
        unique_id: hoymiles_rce_price_above_threshold
        icon: mdi:calendar-check
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_slot_planned') is not none }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_slot_planned') | default(false, true) }}

      - name: "Hoymiles Tariff Planned Charge Slot"
        unique_id: hoymiles_tariff_planned_charge_slot
        icon: mdi:battery-clock-outline
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                        'current_slot_planned') is not none }}
        state: >-
          {% set plan = 'sensor.hoymiles_hit_tariff_charge_plan' %}
          {% set action = state_attr(plan, 'current_action') %}
          {% set remaining = state_attr(plan, 'current_run_remaining_minutes') %}
          {% if state_attr(plan, 'status_code')
                not in ['ready', 'insufficient_cheap_window'] %}
            false
          {% elif not state_attr(plan, 'current_slot_planned')
                | default(false, true) %}
            false
          {% elif not is_number(remaining) or (remaining | float(0)) < 7 %}
            false
          {% elif action == 'grid_support' %}
            {{ state_attr(plan, 'current_run_start_eligible') is sameas true }}
          {% else %}
            {{ action in ['battery_charge', 'grid_support_and_charge'] }}
          {% endif %}
        attributes:
          raw_plan_selected: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'current_slot_planned') | default(false, true) }}
          current_action: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'current_action') | default('none', true) }}
          suppression_reason: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'current_run_suppression_reason')
               | default('no_current_plan', true) }}
          remaining_minutes: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'current_run_remaining_minutes') }}

      - name: "Hoymiles RCE Reserve Ready"
        unique_id: hoymiles_rce_reserve_ready
        icon: mdi:shield-check-outline
        state: >-
          {% set status = state_attr(
            'sensor.hoymiles_hit_rce_optimized_plan', 'status_code') %}
          {{ status in ['ready', 'waiting_for_market', 'home_protected'] }}

      - name: "Hoymiles Sale Block Active"
        unique_id: hoymiles_sale_block_active
        icon: mdi:transmission-tower-off
        availability: >-
          {{ states('input_datetime.hoymiles_sale_block_start')
               not in ['unknown', 'unavailable', 'none']
             and states('input_datetime.hoymiles_sale_block_end')
               not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set start_parts =
            states('input_datetime.hoymiles_sale_block_start').split(':') %}
          {% set end_parts =
            states('input_datetime.hoymiles_sale_block_end').split(':') %}
          {% set start = (start_parts[0] | int(0)) * 60
                       + (start_parts[1] | int(0)) %}
          {% set finish = (end_parts[0] | int(0)) * 60
                        + (end_parts[1] | int(0)) %}
          {% set current = now().hour * 60 + now().minute %}
          {% set in_window =
            (start < finish and start <= current < finish)
            or (start > finish and (current >= start or current < finish)) %}
          {{ is_state('input_boolean.hoymiles_sale_block_enabled', 'on')
             and start != finish and in_window }}
        attributes:
          configured_window: >-
            {{ states('input_datetime.hoymiles_sale_block_start')[0:5] }}
            –
            {{ states('input_datetime.hoymiles_sale_block_end')[0:5] }}

timer:
  hoymiles_battery_balancing_hold:
    name: "Battery balancing — remaining time at 100% SOC"
    duration: "02:00:00"
    restore: true
    icon: mdi:timer-sand-complete

  hoymiles_battery_balancing_watchdog:
    name: "Battery balancing — cycle time limit"
    duration: "24:00:00"
