  - id: hoymiles_battery_balancing_hard_stop_capture
    alias: "Battery balancing — independent hard-stop capture"
    description: >-
      A short queue independent of the physical worker. It durably stores
      the highest precise reason and performs no Modbus write.
    mode: queued
    max: 100
    max_exceeded: error
    triggers:
      - trigger: state
        entity_id: input_boolean.hoymiles_battery_balancing_enabled
        to: "off"
        id: user_disabled
      - trigger: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        to: "off"
        id: owner_lost
      - trigger: state
        entity_id: binary_sensor.hoymiles_ems_control_conflict
        to: "on"
        id: control_conflict
      - trigger: state
        entity_id: sensor.hoymiles_hit_battery_fault_code_bms
        not_to: "No error"
        id: bms_fault_code
      - trigger: state
        entity_id: sensor.hoymiles_hit_overview_battery_faults
        not_to: "No faults"
        id: bms_overview_fault
      - trigger: state
        entity_id: sensor.hoymiles_hit_inverter_work_status
        not_to:
          - "Standby"
          - "Grid test"
          - "On-grid operation"
        id: inverter_fault
      - trigger: template
        value_template: >-
          {% set value = states(
            'sensor.hoymiles_hit_maximum_charge_current') %}
          {{ not is_number(value) or (value | float(0)) <= 0
             or (value | float(0)) | abs >= 1000000000 }}
        id: bms_current_invalid
      - trigger: template
        value_template: >-
          {% set value = states(
            'sensor.hoymiles_hit_battery_voltage_bms') %}
          {{ not is_number(value) or (value | float(0)) <= 0
             or (value | float(0)) | abs >= 1000000000 }}
        id: bms_voltage_invalid
      - trigger: template
        value_template: >-
          {% set value = states(
            'sensor.hoymiles_battery_balancing_bms_safe_charge_power') %}
          {{ not is_number(value) or (value | float(0)) <= 0
             or (value | float(0)) | abs >= 1000000000 }}
        id: bms_safe_limit_invalid
      - trigger: template
        value_template: >-
          {% set machine_type = states(
            'sensor.hoymiles_hit_machines_type') %}
          {% set machine_count = states(
            'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
          {{ not (is_number(machine_type) and is_number(machine_count)
             and (machine_count | float(0)) == (machine_count | int(-1))
             and (((machine_type | int(-1)) == 0
                   and (machine_count | int(-1)) == 1)
                  or ((machine_type | int(-1)) == 1
                      and (machine_count | int(-1)) >= 2
                      and (machine_count | int(-1)) <= 10))) }}
        id: topology_invalid
      - trigger: template
        value_template: >-
          {{ is_state(
               'binary_sensor.hoymiles_battery_balancing_control_data_ready',
               'off')
             and state_attr(
               'binary_sensor.hoymiles_battery_balancing_control_data_ready',
               'failure_class') == 'hard' }}
        id: control_data_hard
      - trigger: state
        entity_id: sensor.hoymiles_battery_balancing_transaction
        to: "INVALID"
        id: lifecycle_invalid
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hoymiles_battery_balancing_watchdog
        id: watchdog_finished
    # Automation-level variables are rendered at trigger admission, before a
    # queued run can wait. They therefore retain the exact transition and cycle.
    variables:
      frozen_transaction_state: >-
        {{ states('sensor.hoymiles_battery_balancing_transaction') }}
      frozen_transaction_cycle: >-
        {{ state_attr(
          'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
      frozen_invalid_reason: >-
        {{ trigger.to_state.attributes.invalid_reason
           if trigger.id == 'lifecycle_invalid'
              and trigger.to_state is defined
              and trigger.to_state is not none
           else 'lifecycle_invalid' }}
      frozen_hard_reason: >-
        {% if trigger.id == 'owner_lost'
              and trigger.to_state is defined
              and trigger.to_state is not none
              and trigger.to_state.state == 'off' %}
          ownership_lost
        {% elif trigger.id == 'control_conflict'
              and trigger.to_state is defined
              and trigger.to_state is not none
              and trigger.to_state.state == 'on' %}
          control_conflict
        {% elif trigger.id == 'user_disabled'
              and trigger.to_state is defined
              and trigger.to_state is not none
              and trigger.to_state.state == 'off' %}
          user_disabled
        {% elif trigger.id in ['bms_fault_code', 'bms_overview_fault']
              and trigger.from_state is defined
              and trigger.to_state is defined
              and trigger.to_state is not none %}
          bms_fault
        {% elif trigger.id in ['bms_current_invalid', 'bms_voltage_invalid'] %}
          bms_data_invalid
        {% elif trigger.id == 'bms_safe_limit_invalid' %}
          bms_limit_invalid
        {% elif trigger.id == 'inverter_fault'
              and trigger.to_state is defined
              and trigger.to_state is not none %}
          inverter_fault
        {% elif trigger.id == 'topology_invalid' %}
          invalid_topology
        {% elif trigger.id == 'control_data_hard'
              and trigger.to_state is defined
              and trigger.to_state is not none %}
          {% set candidate = trigger.to_state.attributes.reason_code %}
          {{ candidate if candidate in [
            'off_grid', 'bms_limit_invalid', 'bms_data_invalid',
            'load_data_invalid', 'bms_fault', 'inverter_fault',
            'invalid_topology', 'control_conflict',
            'communication_failure'
          ] else 'unknown_internal_error' }}
        {% elif trigger.id == 'watchdog_finished'
              and trigger.event is defined
              and trigger.event.data.entity_id
                == 'timer.hoymiles_battery_balancing_watchdog' %}
          watchdog_timeout
        {% else %}none{% endif %}
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ frozen_transaction_state == 'INVALID'
                     and is_state(
                       'input_boolean.hoymiles_battery_balancing_active', 'on') }}
            sequence:
              - action: script.hoymiles_battery_balancing_enter_recovery
                data:
                  reason_code: "{{ frozen_invalid_reason }}"
              - stop: "Malformed active lifecycle is manual recovery only"
      - condition: template
        value_template: >-
          {{ frozen_transaction_state in [
               'REQUESTED', 'OWNER_ACQUIRED', 'SNAPSHOT_VALID', 'APPLYING',
               'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING',
               'ABORT_REQUESTED', 'RESTORING', 'RESTORE_FAILED']
             and frozen_transaction_cycle | string | length > 1
             and frozen_transaction_cycle[0] == 'c'
             and frozen_hard_reason != 'none' }}
      - action: script.hoymiles_battery_balancing_request_abort
        data:
          reason_code: "{{ frozen_hard_reason }}"
          cycle_id: "{{ frozen_transaction_cycle }}"
          wake_worker: false
      # Recovery/no-op bursts may fill this bounded queue, but every admitted
      # fault is merged durably before the one final wake. Off-Grid has its own
      # admission lane and can merge a higher priority while this queue drains.
      - if:
          - condition: template
            value_template: >-
              {{ (state_attr(this.entity_id, 'current') | int(1)) <= 1
                 and is_state(
                   'sensor.hoymiles_battery_balancing_abort_request',
                   'PENDING')
                 and state_attr(
                   'sensor.hoymiles_battery_balancing_abort_request',
                   'cycle_id') == frozen_transaction_cycle }}
        then:
          - action: script.turn_on
            target:
              entity_id: >-
                script.hoymiles_battery_balancing_transaction_worker
            data:
              variables:
                intent: "abort"
                expected_cycle_id: "{{ frozen_transaction_cycle }}"

  - id: hoymiles_battery_balancing_control
    alias: "Battery balancing — short transaction controller"
    description: >-
      It reacts briefly and contains no physical helpers. It restores
      deadline guards after restart and delegates work to the sole queued worker.
    mode: queued
    max: 100
    max_exceeded: error
    triggers:
      - trigger: time_pattern
        minutes: "/1"
        id: periodic
      - trigger: state
        entity_id: input_boolean.hoymiles_battery_balancing_enabled
        id: policy_toggle
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_battery_balancing_active
          - input_number.hoymiles_battery_balancing_interval_days
          - input_number.hoymiles_battery_balancing_hold_hours
          - input_text.hoymiles_battery_balancing_lifecycle
          - input_text.hoymiles_battery_balancing_timing
          - input_text.hoymiles_battery_balancing_abort_request
          - sensor.hoymiles_battery_balancing_transaction
          - sensor.hoymiles_battery_balancing_timing_transaction
          - sensor.hoymiles_battery_balancing_abort_request
          - binary_sensor.hoymiles_battery_balancing_due
          - binary_sensor.hoymiles_battery_balancing_control_data_ready
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_hit_ems_maximum_charge_power_readback
          - sensor.hoymiles_hit_ems_force_charge_soc_readback
          - sensor.hoymiles_hit_ems_control_readback_generation
          - sensor.hoymiles_hit_parallel_topology_readback_generation
          - sensor.hoymiles_battery_balancing_bms_safe_charge_power
          - sensor.hoymiles_battery_balancing_slow_charge_power
          - sensor.hoymiles_actual_load_power
          - sensor.hoymiles_ems_hardware_mode
          - sun.sun
          - timer.hoymiles_battery_balancing_hold
          - timer.hoymiles_battery_balancing_watchdog
        id: state_change
      - trigger: event
        event_type: hoymiles_battery_balancing_soft_gap_deadline
        id: gap_deadline
      - trigger: event
        event_type: hoymiles_battery_balancing_hold_deadline
        id: hold_deadline
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:20"
      # These two unrelated durable initializers are retained from the managed
      # scheduler; they never overwrite a restored balancing transaction.
      - if:
          - condition: template
            value_template: >-
              {{ states('input_datetime.hoymiles_battery_balancing_last_completed')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hoymiles_battery_balancing_last_completed
            data:
              datetime: >-
                {{ (now() - timedelta(days=states(
                     'input_number.hoymiles_battery_balancing_interval_days')
                     | int(30))).strftime('%Y-%m-%d %H:%M:%S') }}
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.hoymiles_tariff_active_action')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_tariff_active_action
            data:
              value: "none"
      - variables:
          raw_lifecycle: >-
            {{ states('input_text.hoymiles_battery_balancing_lifecycle') }}
          raw_phase: >-
            {{ states('input_text.hoymiles_battery_balancing_phase') }}
          transaction_state: >-
            {{ states('sensor.hoymiles_battery_balancing_transaction') }}
          transaction_cycle: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
          timing_state: >-
            {{ states(
              'sensor.hoymiles_battery_balancing_timing_transaction') }}
          timing_cycle: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_timing_transaction',
              'cycle_id') }}
          now_epoch_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
          inactive_legacy_idle: >-
            {{ raw_lifecycle == '0|none|0|0|none|idle|unknown' }}
          inactive_reset_proven: >-
            {{ (raw_lifecycle in ['unknown', 'unavailable', 'none', '']
                 or inactive_legacy_idle)
               and is_state(
                 'input_boolean.hoymiles_battery_balancing_active', 'off')
               and raw_phase in ['IDLE', 'idle', 'unknown', 'unavailable',
                                 'none', '']
               and is_state(
                 'timer.hoymiles_battery_balancing_hold', 'idle')
               and is_state(
                 'timer.hoymiles_battery_balancing_watchdog', 'idle')
               and is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
               and states(
                 'script.hoymiles_battery_balancing_transaction_worker') != 'on'
               and states('script.hoymiles_verified_set_ems_mode') != 'on'
               and states(
                 'script.hoymiles_verified_set_ems_force_charge_soc') != 'on'
               and states(
                 'script.hoymiles_verified_set_ems_maximum_charge_power')
                 != 'on' }}
          malformed_active_or_owned: >-
            {{ is_state(
                 'input_boolean.hoymiles_battery_balancing_active', 'on')
               or is_state(
                 'timer.hoymiles_battery_balancing_hold', 'active')
               or is_state(
                 'timer.hoymiles_battery_balancing_watchdog', 'active')
               or raw_phase not in ['IDLE', 'idle', 'unknown', 'unavailable',
                                    'none', ''] }}
          gap_event_matches: >-
            {{ trigger.id != 'gap_deadline'
               or (trigger.event.data.cycle_id == transaction_cycle
                   and (trigger.event.data.gap_generation | int(-1))
                     == (state_attr(
                       'sensor.hoymiles_battery_balancing_timing_transaction',
                       'gap_generation') | int(-2))
                   and (trigger.event.data.gap_start_epoch_ms | int(-1))
                     == (state_attr(
                       'sensor.hoymiles_battery_balancing_timing_transaction',
                       'gap_start_epoch_ms') | int(-2))
                   and (trigger.event.data.gap_deadline_epoch_ms | int(-1))
                     == (state_attr(
                       'sensor.hoymiles_battery_balancing_timing_transaction',
                       'gap_deadline_epoch_ms') | int(-2))) }}
          hold_event_matches: >-
            {{ trigger.id != 'hold_deadline'
               or (trigger.event.data.cycle_id == transaction_cycle
                   and (trigger.event.data.hold_generation | int(-1))
                     == (state_attr(
                       'sensor.hoymiles_battery_balancing_timing_transaction',
                       'hold_generation') | int(-2))
                   and (trigger.event.data.hold_deadline_epoch_ms | int(-1))
                     == (state_attr(
                       'sensor.hoymiles_battery_balancing_timing_transaction',
                       'hold_deadline_epoch_ms') | int(-2))) }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ transaction_state == 'INVALID' }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ inactive_reset_proven }}"
                    sequence:
                      - action: >-
                          script.hoymiles_battery_balancing_initialize_records
                  - conditions:
                      - condition: template
                        value_template: "{{ malformed_active_or_owned }}"
                    sequence:
                      - action: script.hoymiles_battery_balancing_enter_recovery
                        data:
                          reason_code: >-
                            {{ state_attr(
                              'sensor.hoymiles_battery_balancing_transaction',
                              'invalid_reason') }}
                default:
                  - stop: >-
                      Inactive malformed state awaits proof; no reset or
                      physical action is authorized
              - stop: "Invalid lifecycle handled without a physical write"
          - conditions:
              - condition: template
                value_template: "{{ not gap_event_matches }}"
            sequence:
              - stop: "Stale soft-gap generation event ignored"
          - conditions:
              - condition: template
                value_template: "{{ not hold_event_matches }}"
            sequence:
              - stop: "Stale hold generation event ignored"
          - conditions:
              - condition: template
                value_template: "{{ transaction_state == 'RECOVERY_REQUIRED' }}"
            sequence:
              - action: script.hoymiles_notify_battery_balancing_lifecycle
                continue_on_error: true
                data:
                  event: "recovery_required"
                  reason_code: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_transaction',
                      'reason_code') }}
                  cycle_id: "{{ transaction_cycle }}"
              - stop: "Manual recovery retains owner and performs no restore"
          - conditions:
              - condition: template
                value_template: >-
                  {{ transaction_state == 'NOTIFICATION_PENDING' }}
            sequence:
              - variables:
                  pending_event: >-
                    {{ {'COMPLETED': 'completed', 'ABORTED': 'aborted',
                        'FAILED': 'failed'}.get(state_attr(
                          'sensor.hoymiles_battery_balancing_transaction',
                          'event_marker'), 'none') }}
                  pending_kind: >-
                    {{ {'completed': 'CO', 'aborted': 'AB',
                        'failed': 'FA'}.get(pending_event, 'NA') }}
                  pending_event_id: >-
                    {{ transaction_cycle ~ '.' ~ pending_kind }}
              - if:
                  - condition: template
                    value_template: "{{ pending_event != 'none' }}"
                then:
                  - action: script.hoymiles_notify_battery_balancing_lifecycle
                    continue_on_error: true
                    data:
                      event: "{{ pending_event }}"
                      reason_code: >-
                        {{ state_attr(
                          'sensor.hoymiles_battery_balancing_transaction',
                          'reason_code') }}
                      cycle_id: "{{ transaction_cycle }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ pending_event != 'none'
                         and pending_event_id in [
                           state_attr(
                             'sensor.hoymiles_battery_balancing_notification_outbox',
                             'slot_1_event_id'),
                           state_attr(
                             'sensor.hoymiles_battery_balancing_notification_outbox',
                             'slot_2_event_id')] }}
                then:
                  - action: script.hoymiles_battery_balancing_transition
                    data:
                      expected_cycle_id: "{{ transaction_cycle }}"
                      transaction_state: "TERMINAL"
              - stop: "Pending terminal event recovered independently"
          - conditions:
              - condition: template
                value_template: "{{ transaction_state == 'RESTORED' }}"
            sequence:
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_transaction',
                      'reason_code') }}
                  cycle_id: "{{ transaction_cycle }}"
              - stop: "Durable restore ACK is finalized by the physical worker"
          - conditions:
              - condition: template
                value_template: >-
                  {{ transaction_state in [
                       'ABORT_REQUESTED', 'RESTORING', 'RESTORE_FAILED']
                     or (states(
                       'sensor.hoymiles_battery_balancing_abort_request')
                         in ['PENDING', 'CONSUMED']
                         and state_attr(
                           'sensor.hoymiles_battery_balancing_abort_request',
                           'cycle_id') == transaction_cycle) }}
            sequence:
              - action: script.turn_on
                target:
                  entity_id: >-
                    script.hoymiles_battery_balancing_transaction_worker
                data:
                  variables:
                    intent: "abort"
                    expected_cycle_id: "{{ transaction_cycle }}"
              - stop: "Hard-stop restoration queued at the safe boundary"
          - conditions:
              - condition: template
                value_template: >-
                  {{ transaction_state in ['REQUESTED', 'OWNER_ACQUIRED']
                     and states(
                       'script.hoymiles_battery_balancing_transaction_worker')
                       != 'on' }}
            sequence:
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: "communication_failure"
                  cycle_id: "{{ transaction_cycle }}"
              - stop: "Restart before trusted snapshot releases provisional owner"
          - conditions:
              - condition: template
                value_template: >-
                  {{ transaction_state in [
                       'SNAPSHOT_VALID', 'APPLYING', 'OPERATIONAL', 'SLOW',
                       'HOLD_ARMING', 'HOLDING'] }}
            sequence:
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: timer.hoymiles_battery_balancing_watchdog
                        state: "idle"
                    sequence:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "watchdog_timeout"
                          cycle_id: "{{ transaction_cycle }}"
                  - conditions:
                      - condition: state
                        entity_id: >-
                          binary_sensor.hoymiles_battery_balancing_control_data_ready
                        state: "off"
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                            'binary_sensor.hoymiles_battery_balancing_control_data_ready',
                            'failure_class') == 'hard' }}
                    sequence:
                      - variables:
                          hard_data_reason: >-
                            {% set candidate = state_attr(
                              'binary_sensor.hoymiles_battery_balancing_control_data_ready',
                              'reason_code') %}
                            {{ candidate if candidate in [
                              'off_grid', 'bms_limit_invalid',
                              'bms_data_invalid', 'load_data_invalid',
                              'bms_fault', 'inverter_fault',
                              'invalid_topology', 'control_conflict',
                              'communication_failure'
                            ] else 'unknown_internal_error' }}
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "{{ hard_data_reason }}"
                          cycle_id: "{{ transaction_cycle }}"
                  - conditions:
                      - condition: state
                        entity_id: >-
                          binary_sensor.hoymiles_battery_balancing_control_data_ready
                        state: "off"
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                            'binary_sensor.hoymiles_battery_balancing_control_data_ready',
                            'failure_class') == 'soft'
                             and transaction_state in ['OPERATIONAL', 'SLOW']
                             and is_state(
                               'sensor.hoymiles_ems_hardware_mode',
                               'self_use') }}
                    sequence:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: >-
                                  {{ timing_state == 'GAP'
                                     and timing_cycle == transaction_cycle }}
                            sequence:
                              - variables:
                                  gap_generation: >-
                                    {{ state_attr(
                                      'sensor.hoymiles_battery_balancing_timing_transaction',
                                      'gap_generation') | int(-1) }}
                                  gap_start_ms: >-
                                    {{ state_attr(
                                      'sensor.hoymiles_battery_balancing_timing_transaction',
                                      'gap_start_epoch_ms') | int(-1) }}
                                  gap_deadline_ms: >-
                                    {{ state_attr(
                                      'sensor.hoymiles_battery_balancing_timing_transaction',
                                      'gap_deadline_epoch_ms') | int(-1) }}
                              - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ (now_epoch_ms | int(0))
                                               < (gap_start_ms | int(0)) - 5000 }}
                                    sequence:
                                      - action: >-
                                          script.hoymiles_battery_balancing_request_abort
                                        data:
                                          reason_code: "clock_anomaly"
                                          cycle_id: "{{ transaction_cycle }}"
                                  - conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ (now_epoch_ms | int(0))
                                               >= (gap_deadline_ms | int(1)) }}
                                    sequence:
                                      - action: >-
                                          script.hoymiles_battery_balancing_request_abort
                                        data:
                                          reason_code: "data_stale_timeout"
                                          cycle_id: "{{ transaction_cycle }}"
                                default:
                                  - action: script.turn_on
                                    target:
                                      entity_id: >-
                                        script.hoymiles_battery_balancing_soft_gap_guard
                                    data:
                                      variables:
                                        cycle_id: "{{ transaction_cycle }}"
                                        gap_generation: "{{ gap_generation }}"
                                        gap_start_epoch_ms: "{{ gap_start_ms }}"
                                        gap_deadline_epoch_ms: "{{ gap_deadline_ms }}"
                        default:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ timing_state == 'NONE'
                                         and timing_cycle == transaction_cycle }}
                                sequence:
                                  - variables:
                                      next_gap_generation: >-
                                        {{ state_attr(
                                          'sensor.hoymiles_battery_balancing_timing_transaction',
                                          'gap_generation') | int(0) + 1 }}
                                      new_gap_start_ms: "{{ now_epoch_ms }}"
                                      new_gap_deadline_ms: >-
                                        {{ (now_epoch_ms | int(0)) + 60000 }}
                                  - action: >-
                                      script.hoymiles_battery_balancing_write_timing
                                    data:
                                      cycle_id: "{{ transaction_cycle }}"
                                      gap_generation: "{{ next_gap_generation }}"
                                      gap_start_epoch_ms: "{{ new_gap_start_ms }}"
                                      gap_deadline_epoch_ms: "{{ new_gap_deadline_ms }}"
                                      hold_generation: >-
                                        {{ state_attr(
                                          'sensor.hoymiles_battery_balancing_timing_transaction',
                                          'hold_generation') | int(0) }}
                                      hold_deadline_epoch_ms: 0
                                      timing_state: "GAP"
                                  - action: script.turn_on
                                    target:
                                      entity_id: >-
                                        script.hoymiles_battery_balancing_soft_gap_guard
                                    data:
                                      variables:
                                        cycle_id: "{{ transaction_cycle }}"
                                        gap_generation: "{{ next_gap_generation }}"
                                        gap_start_epoch_ms: "{{ new_gap_start_ms }}"
                                        gap_deadline_epoch_ms: "{{ new_gap_deadline_ms }}"
                            default:
                              - action: script.hoymiles_battery_balancing_request_abort
                                data:
                                  reason_code: "lifecycle_invalid"
                                  cycle_id: "{{ transaction_cycle }}"
                  - conditions:
                      - condition: state
                        entity_id: >-
                          binary_sensor.hoymiles_battery_balancing_control_data_ready
                        state: "off"
                    sequence:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "communication_failure"
                          cycle_id: "{{ transaction_cycle }}"
                default:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ timing_state == 'GAP'
                                 and timing_cycle == transaction_cycle }}
                        sequence:
                          - action: script.hoymiles_battery_balancing_write_timing
                            data:
                              cycle_id: "{{ transaction_cycle }}"
                              gap_generation: >-
                                {{ state_attr(
                                  'sensor.hoymiles_battery_balancing_timing_transaction',
                                  'gap_generation') | int(0) + 1 }}
                              gap_start_epoch_ms: 0
                              gap_deadline_epoch_ms: 0
                              hold_generation: >-
                                {{ state_attr(
                                  'sensor.hoymiles_battery_balancing_timing_transaction',
                                  'hold_generation') | int(0) }}
                              hold_deadline_epoch_ms: 0
                              timing_state: "NONE"
                          - action: script.turn_on
                            target:
                              entity_id: >-
                                script.hoymiles_battery_balancing_transaction_worker
                            data:
                              variables:
                                intent: "reconcile"
                                expected_cycle_id: "{{ transaction_cycle }}"
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ transaction_state in [
                                   'HOLD_ARMING', 'HOLDING'] }}
                        sequence:
                          - action: script.turn_on
                            target:
                              entity_id: >-
                                script.hoymiles_battery_balancing_transaction_worker
                            data:
                              variables:
                                intent: "hold_reconcile"
                                expected_cycle_id: "{{ transaction_cycle }}"
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ timing_state == 'NONE'
                                 and timing_cycle == transaction_cycle }}
                        sequence:
                          - action: script.turn_on
                            target:
                              entity_id: >-
                                script.hoymiles_battery_balancing_transaction_worker
                            data:
                              variables:
                                intent: "reconcile"
                                expected_cycle_id: "{{ transaction_cycle }}"
                    default:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "lifecycle_invalid"
                          cycle_id: "{{ transaction_cycle }}"
              - stop: "Current transaction reconciled without blocking capture"
          - conditions:
              - condition: template
                value_template: >-
                  {{ transaction_state in ['IDLE', 'TERMINAL']
                     and is_state(
                       'input_boolean.hoymiles_battery_balancing_enabled', 'on')
                     and is_state(
                       'input_boolean.hoymiles_battery_balancing_active', 'off')
                     and is_state(
                       'binary_sensor.hoymiles_battery_balancing_due', 'on')
                     and is_state(
                       'binary_sensor.hoymiles_battery_balancing_control_data_ready',
                       'on')
                     and is_state('sun.sun', 'above_horizon') }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ trigger.id == 'policy_toggle'
                         and trigger.from_state is not none
                         and trigger.to_state is not none
                         and trigger.from_state.state == 'off'
                         and trigger.to_state.state == 'on'
                         and transaction_state == 'TERMINAL' }}
                then:
                  - action: script.hoymiles_battery_balancing_transition
                    data:
                      expected_cycle_id: "{{ transaction_cycle }}"
                      transaction_state: "TERMINAL"
                      cooldown_epoch_ms: 0
              - action: script.hoymiles_start_battery_balancing

  - id: hoymiles_battery_balancing_notification_delivery
    alias: "Battery balancing — deliver durable notifications"
    description: >-
      A separate phone dispatcher. Provider failure, restart or hang
      does not block restoration, ownership or transaction timers.
    mode: queued
    max: 20
    max_exceeded: error
    triggers:
      - trigger: state
        entity_id:
          - input_text.hoymiles_battery_balancing_notification_outbox
          - sensor.hoymiles_battery_balancing_notification_outbox
          - input_boolean.hoymiles_ems_push_notifications_enabled
        id: outbox_change
      - trigger: time_pattern
        minutes: "/1"
        id: periodic
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:25"
          - action: script.hoymiles_battery_balancing_recover_notification_leases
      - action: script.turn_on
        target:
          entity_id: script.hoymiles_battery_balancing_notification_dispatcher

  - id: hoymiles_ems_push_status_notification
    alias: "EMS — push notification for status change"
    description: >-
      Sends stable EMS changes. Closed allowlists suppress only
      expected changes or changes exactly covered by a balancing transaction event.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        id: ems_mode
        for: "00:00:45"
      - trigger: state
        entity_id: sensor.hoymiles_hit_inverter_work_status
        id: inverter_status
        for: "00:00:45"
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_ems_push_notifications_enabled
        state: "on"
      - condition: template
        value_template: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {{ target.startswith('notify.')
             and (expand(target) | list | count) > 0 }}
      - condition: template
        value_template: >-
          {{ trigger is not defined
             or trigger.from_state is not defined
             or trigger.from_state is none
             or trigger.from_state.state != trigger.to_state.state }}
    actions:
      - delay: "00:00:02"
      - variables:
          target_entity: >-
            {{ states('input_text.hoymiles_ems_push_notify_target') | trim }}
          raw_mode: "{{ states('sensor.hoymiles_ems_hardware_mode') }}"
          raw_status: "{{ states('sensor.hoymiles_hit_inverter_work_status') }}"
          transaction_state: >-
            {{ states('sensor.hoymiles_battery_balancing_transaction') }}
          transaction_cycle: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
          transaction_reason: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'reason_code') }}
          transaction_marker: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'event_marker') }}
          snapshot_mode: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'snapshot_mode') }}
          cooldown_epoch_ms: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'cooldown_epoch_ms') | int(0) }}
          abort_same_cycle: >-
            {{ states('sensor.hoymiles_battery_balancing_abort_request')
                 in ['PENDING', 'CONSUMED']
               and state_attr(
                 'sensor.hoymiles_battery_balancing_abort_request', 'cycle_id')
                 == transaction_cycle }}
          abort_reason: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_abort_request', 'reason_code')
               if abort_same_cycle else transaction_reason }}
          expected_balancing_pair: >-
            {{ transaction_state in [
                 'APPLYING', 'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING']
               and is_state(
                 'input_boolean.hoymiles_battery_balancing_active', 'on')
               and raw_mode in ['self_use', 'grid_charge']
               and raw_status in ['Standby', 'Grid test', 'On-grid operation'] }}
          expected_safe_restore: >-
            {{ transaction_state in ['RESTORING', 'RESTORED']
               and snapshot_mode in [
                 'self_use', 'grid_charge', 'grid_discharge']
               and raw_mode == snapshot_mode
               and raw_status in ['Standby', 'Grid test', 'On-grid operation'] }}
          exact_terminal_fault_coverage: >-
            {{ (abort_same_cycle
                 or transaction_state in [
                   'RESTORING', 'RESTORE_FAILED',
                   'NOTIFICATION_PENDING', 'TERMINAL'])
               and ((abort_reason == 'off_grid' and raw_mode == 'off_grid')
                    or (abort_reason == 'inverter_fault'
                        and raw_status == 'Fault')
                    or (abort_reason == 'communication_failure'
                        and raw_status not in [
                          'Standby', 'Grid test', 'On-grid operation'])) }}
          recent_exact_terminal: >-
            {{ transaction_state in ['NOTIFICATION_PENDING', 'TERMINAL']
               and transaction_marker in [
                 'COMPLETED', 'ABORTED', 'FAILED', 'RESTORE_FAILED']
               and (cooldown_epoch_ms == 0
                    or cooldown_epoch_ms > (as_timestamp(now()) * 1000) | int)
               and ((snapshot_mode in [
                       'self_use', 'grid_charge', 'grid_discharge']
                     and raw_mode == snapshot_mode
                     and raw_status in [
                       'Standby', 'Grid test', 'On-grid operation'])
                    or exact_terminal_fault_coverage) }}
          fingerprint: "{{ raw_mode ~ '|' ~ raw_status }}"
          last_push: >-
            {{ as_timestamp(states(
              'input_datetime.hoymiles_ems_last_push_at'), 0) }}
          ems_mode: >-
            {{ {
              'self_use': 'Self-Use',
              'grid_discharge': 'Grid discharge',
              'grid_charge': 'Grid charge',
              'off_grid': 'Off-grid operation'
            }.get(raw_mode, raw_mode) }}
          inverter_status: "{{ raw_status }}"
          changed_status: >-
            {% if trigger is defined and trigger.id == 'ems_mode' %}
              EMS mode
            {% elif trigger is defined and trigger.id == 'inverter_status' %}
              inverter operating status
            {% else %}test{% endif %}
      - choose:
          # Unknown/fault values are never called routine. They are suppressed
          # only when the exact same fault is already covered by this cycle.
          - conditions:
              - condition: template
                value_template: >-
                  {{ expected_balancing_pair or expected_safe_restore
                     or recent_exact_terminal or exact_terminal_fault_coverage }}
            sequence:
              - stop: >-
                  Expected or exactly covered balancing change;
                  the generic fingerprint remains unchanged
        default:
          - condition: template
            value_template: >-
              {{ fingerprint != states(
                   'input_text.hoymiles_ems_last_push_fingerprint')
                 or last_push <= 0
                 or as_timestamp(now()) - last_push >= 300 }}
          - action: notify.send_message
            continue_on_error: true
            target:
              entity_id: "{{ target_entity }}"
            data:
              title: "Hoymiles — status change"
              message: |-
                EMS mode: {{ ems_mode }}
                Inverter status: {{ inverter_status }}
                Changed: {{ changed_status }}
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hoymiles_ems_last_push_at
            data:
              timestamp: "{{ as_timestamp(now()) }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_ems_last_push_fingerprint
            data:
              value: "{{ fingerprint }}"
  - id: hoymiles_initialize_solcast_forecast_entity
    alias: "EMS RCE — set default Solcast entity"
    description: >-
      Detects the English or Polish Forecast Today and Forecast Tomorrow entities
      from the BJReplay Solcast PV Forecast integration. Valid custom entities
      made by the user are preserved.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - if:
          - condition: template
            value_template: >-
              {% set configured =
                states('input_text.hoymiles_solcast_forecast_today_entity')
                | trim %}
              {% set candidates = [
                configured,
                'sensor.solcast_pv_forecast_forecast_today',
                'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
                'sensor.solcast_forecast_today'
              ] %}
              {% set ns = namespace(entity='') %}
              {% for entity in candidates if entity and not ns.entity %}
                {% if is_number(states(entity)) %}
                  {% set ns.entity = entity %}
                {% endif %}
              {% endfor %}
              {{ ns.entity != '' and ns.entity != configured }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_solcast_forecast_today_entity
            data:
              value: >-
                {% set configured =
                  states('input_text.hoymiles_solcast_forecast_today_entity')
                  | trim %}
                {% set candidates = [
                  configured,
                  'sensor.solcast_pv_forecast_forecast_today',
                  'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
                  'sensor.solcast_forecast_today'
                ] %}
                {% set ns = namespace(entity='') %}
                {% for entity in candidates if entity and not ns.entity %}
                  {% if is_number(states(entity)) %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}
      - if:
          - condition: template
            value_template: >-
              {% set configured =
                states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
                | trim %}
              {% set candidates = [
                configured,
                'sensor.solcast_pv_forecast_forecast_tomorrow',
                'sensor.solcast_pv_forecast_prognoza_na_jutro',
                'sensor.solcast_forecast_tomorrow'
              ] %}
              {% set ns = namespace(entity='') %}
              {% for entity in candidates if entity and not ns.entity %}
                {% if is_number(states(entity)) %}
                  {% set ns.entity = entity %}
                {% endif %}
              {% endfor %}
              {{ ns.entity != '' and ns.entity != configured }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_solcast_forecast_tomorrow_entity
            data:
              value: >-
                {% set configured =
                  states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
                  | trim %}
                {% set candidates = [
                  configured,
                  'sensor.solcast_pv_forecast_forecast_tomorrow',
                  'sensor.solcast_pv_forecast_prognoza_na_jutro',
                  'sensor.solcast_forecast_tomorrow'
                ] %}
                {% set ns = namespace(entity='') %}
                {% for entity in candidates if entity and not ns.entity %}
                  {% if is_number(states(entity)) %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}
  - id: hoymiles_rce_sync_dynamic_minimum_soc
    alias: "EMS RCE — write dynamic SOC reserve"
    description: >-
      Writes the calculated minimum discharge SOC to the inverter. The plan protects
      home supply from now through tonight, the next day, and the following
      night until 90 minutes after sunrise, then selects the most valuable RCE slots.
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - input_number.hoymiles_rce_soc_safety_margin
          - sensor.hoymiles_hit_ems_self_use_soc_readback
          - sensor.hoymiles_hit_battery_capacity
          - sensor.hoymiles_solcast_forecast_today
          - sensor.hoymiles_solcast_forecast_remaining_today
          - sensor.hoymiles_solcast_forecast_tomorrow
          - sensor.hoymiles_load_average_4_days
          - sensor.hoymiles_night_load_average_4_days
          - sensor.hoymiles_night_protection_window_remaining
          - sensor.hoymiles_protected_window_expected_load
          - sensor.hoymiles_rce_energy_deficit_tomorrow
          - sensor.hoymiles_rce_protected_home_energy
          - sensor.hoymiles_rce_dynamic_minimum_soc
          - binary_sensor.hoymiles_rce_reserve_ready
          - sensor.hoymiles_hit_rce_optimized_plan
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_rce_discharge_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_rce_dynamic_soc_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.hoymiles_rce_reserve_ready
        state: "on"
      # The Force Discharge register is owned only by an accepted RCE run.
      # Inactive planning remains read-only; the start transaction below
      # snapshots and writes its initial floor atomically.
      - condition: state
        entity_id: input_boolean.hoymiles_rce_discharge_active
        state: "on"
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "grid_discharge"
      # This is a real Modbus writer, so it obeys the same ownership contract
      # as the RCE execution transaction. Shadow RCEm may observe in parallel;
      # every active/manual/other automatic owner blocks the register write.
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "off"
      - condition: template
        value_template: >-
          {{ not is_state('timer.hoymiles_discharge', 'active')
             and not is_state('timer.hoymiles_charge', 'active') }}
      - condition: state
        entity_id: input_boolean.hoymiles_tariff_charge_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_rcm_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
        state: "off"
      - condition: template
        value_template: >-
          {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
             or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_rce_dynamic_minimum_soc'))
             and is_number(
               states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')) }}
      - condition: template
        value_template: >-
          {% set current = states(
            'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
          {% set dynamic = states(
            'sensor.hoymiles_rce_dynamic_minimum_soc') | float(100) %}
          {% set latched = states(
            'input_number.hoymiles_rce_latched_minimum_soc') | float(0) %}
          {% set desired = [dynamic, latched, current] | max
               if is_state('input_boolean.hoymiles_rce_discharge_active', 'on')
               else dynamic %}
          {{ (current - desired) | abs >= 0.5 }}
    actions:
      - action: script.hoymiles_verified_set_ems_force_discharge_soc
        data:
          value: >-
            {% set current = states(
              'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
            {% set dynamic = states(
              'sensor.hoymiles_rce_dynamic_minimum_soc') | float(100) %}
            {% set latched = states(
              'input_number.hoymiles_rce_latched_minimum_soc') | float(0) %}
            {{ [dynamic, latched, current] | max
                 if is_state(
                   'input_boolean.hoymiles_rce_discharge_active', 'on')
                 else dynamic }}

  - id: hoymiles_enforce_sale_block
    alias: "EMS — enforce export lockout"
    description: >-
      During the lockout, stops every grid-discharge cycle and switches
      the inverter to Self-Use. Grid charging remains allowed.
    mode: restart
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        to: "on"
      - trigger: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        to: "grid_discharge"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "on"
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - if:
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "grid_discharge"
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
          - wait_template: >-
              {{ states('sensor.hoymiles_ems_hardware_mode')
                 not in ['grid_discharge', 'unknown', 'unavailable',
                         'none', ''] }}
            timeout: "00:01:00"
            continue_on_timeout: true
      # A sale block may never forget an unconfirmed Grid Discharge owner.
      # Keep both markers until a positive neutral-mode readback; the state
      # trigger retries automatically when the select entity reconnects.
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.hoymiles_ems_hardware_mode')
                 not in ['grid_discharge', 'unknown', 'unavailable',
                         'none', ''] }}
        then:
          - if:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
            then:
              - action: script.hoymiles_rollback_rce_transaction
          - if:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_discharge_cycle_active

  - id: hoymiles_rce_export_accounting
    alias: "EMS RCE — realized export accounting"
    description: >-
      Accounts for positive increments of the inverter grid-sell energy
      counter. Export during an active RCE cycle is stored separately from
      the natural Self-Use surplus. The RCE marker remains active
      during an ESP communication outage.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: sensor.hoymiles_hit_grid_energy_sell_today
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "00:00:10"
    conditions:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_grid_energy_sell_today')) }}
    actions:
      - variables:
          accounting_date: "{{ now().strftime('%Y-%m-%d') }}"
          stored_date: "{{ states('input_text.hoymiles_rce_accounting_date') }}"
          current_counter: >-
            {{ states('sensor.hoymiles_hit_grid_energy_sell_today') | float(0) }}
          checkpoint: >-
            {{ states('input_number.hoymiles_rce_grid_sell_checkpoint')
               | float(0) }}
          counter_delta: >-
            {% set current = states(
              'sensor.hoymiles_hit_grid_energy_sell_today') | float(0) %}
            {% set previous = states(
              'input_number.hoymiles_rce_grid_sell_checkpoint') | float(0) %}
            {{ ([current - previous, 0] | max) if current >= previous
               else current }}
          current_price: >-
            {{ states('sensor.hoymiles_rce_current_price') | float(0) }}
      - choose:
          # Przy zmianie daty punkt kontrolny może jeszcze zawierać końcową
          # value sprzętowego licznika z poprzedniego dnia. Nie wolno
          # przepisywać jej do bieżącego dnia jako eksport nierozpoznany.
          - conditions:
              - condition: template
                value_template: "{{ stored_date != accounting_date }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id:
                    - input_number.hoymiles_rce_realized_controlled_export_store
                    - input_number.hoymiles_rce_realized_natural_export_store
                    - input_number.hoymiles_rce_realized_controlled_revenue_store
                    - input_number.hoymiles_rce_realized_natural_revenue_store
                data:
                  value: 0
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_unclassified_export_store
                data:
                  value: 0
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
                data:
                  value: "{{ current_counter }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_rce_accounting_date
                data:
                  value: "{{ accounting_date }}"

          - conditions:
              - condition: template
                value_template: "{{ counter_delta | float(0) > 0 }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
                data:
                  value: "{{ current_counter }}"
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_boolean.hoymiles_rce_discharge_active
                        state: "on"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_controlled_export_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_controlled_export_store')
                              | float(0)) + (counter_delta | float(0))) }}
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_controlled_revenue_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_controlled_revenue_store')
                              | float(0))
                               + (counter_delta | float(0))
                               * (current_price | float(0))) }}

                  - conditions:
                      - condition: state
                        entity_id: sensor.hoymiles_ems_hardware_mode
                        state: "self_use"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_natural_export_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_natural_export_store')
                              | float(0)) + (counter_delta | float(0))) }}
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_natural_revenue_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_natural_revenue_store')
                              | float(0))
                               + (counter_delta | float(0))
                               * (current_price | float(0))) }}

                default:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rce_unclassified_export_store
                    data:
                      value: >-
                        {{ ((states(
                          'input_number.hoymiles_rce_unclassified_export_store')
                          | float(0)) + (counter_delta | float(0))) }}
        default:
          - action: input_number.set_value
            target:
              entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
            data:
              value: "{{ current_counter }}"

  - id: hoymiles_automatic_ems_mode_interlock
    alias: "EMS — interlock for RCE, tariff and RCEm automation"
    description: >-
      Allows only one execution automation to run. RCE, tariff charging
      and active RCEm 253 V+ control are mutually exclusive.
      RCEm can collect data in observation mode without taking ownership of EMS.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.hoymiles_rce_discharge_enabled
        to: "on"
        id: rce_enabled
      - trigger: state
        entity_id: input_boolean.hoymiles_tariff_charge_enabled
        to: "on"
        id: tariff_enabled
      - trigger: state
        entity_id: input_boolean.hoymiles_rcm_enabled
        to: "on"
        id: rcm_enabled
      - trigger: state
        entity_id: input_boolean.hoymiles_rcm_shadow_mode
        to: "off"
        id: rcm_shadow_disabled
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:20"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'rce_enabled'
                     or (trigger.id == 'startup'
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'on')) }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_tariff_charge_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_shadow_mode
                    state: "off"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rcm_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_tariff_transaction

          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'tariff_enabled'
                     or (trigger.id == 'startup'
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'on')) }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_shadow_mode
                    state: "off"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rcm_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_rce_transaction

          - conditions:
              - condition: template
                value_template: >-
                  {{ (trigger.id in ['rcm_enabled', 'rcm_shadow_disabled']
                      and is_state(
                        'input_boolean.hoymiles_rcm_shadow_mode', 'off'))
                     or (trigger.id == 'startup'
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'off')) }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ (is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'on')
                          or is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'on'))
                         and states('sensor.hoymiles_ems_hardware_mode')
                           in ['grid_discharge', 'grid_charge'] }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.hoymiles_rce_discharge_enabled
                    - input_boolean.hoymiles_tariff_charge_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_rce_transaction
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_tariff_transaction

  - id: hoymiles_tariff_grid_charge_control
    alias: "Tariff EMS — forecast-based charging in low-cost periods"
    description: >-
      Every minute it simulates the home, PV, and battery balance through tomorrow.
      It charges only in a planned low-cost slot before the forecast shortage.
      It cannot run together with RCE or manual EMS timers.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.hoymiles_hit_tariff_charge_plan
          - binary_sensor.hoymiles_tariff_planned_charge_slot
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_rce_discharge_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - input_boolean.hoymiles_rcm_active
          - input_boolean.hoymiles_rcm_pre_discharge_active
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_tariff_target_soc
          - input_number.hoymiles_tariff_maximum_soc
          - number.hoymiles_hit_force_charge_soc
          - number.hoymiles_hit_maximum_charge_power
          - sensor.hoymiles_ems_hardware_mode
          - binary_sensor.hoymiles_tariff_control_data_ready
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_battery_balancing_active
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          # Wyrównywanie ma bezwzględne pierwszeństwo. Zwalniamy jedynie
          # wewnętrzny znacznik taryfowy po odtworzeniu jego nastaw; sterownik
          # serwisowy pozostaje w fazie handover i czeka na ten readback.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_tariff_transaction

          # Ręczne harmonogramy mają pierwszeństwo. Automat przestaje uznawać
          # cykl za własny i nie nadpisuje trybu wybranego przez użytkownika.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.hoymiles_discharge_cycle_active
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.hoymiles_charge_cycle_active
                    state: "on"
            sequence:
              - action: script.hoymiles_rollback_tariff_transaction

          # A lower maximum SOC chosen during an active required-charge run
          # takes effect immediately. A value below the protected reserve first
          # neutralizes the cycle; otherwise the following branch clamps the
          # frozen target and the next minute updates Force Charge.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {% set maximum = states(
                    'input_number.hoymiles_tariff_maximum_soc') %}
                  {% set reserve = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'reserve_soc_percent') %}
                  {{ states('input_text.hoymiles_tariff_active_action')
                       in ['battery_charge', 'grid_support_and_charge']
                     and is_number(maximum) and is_number(reserve)
                     and (maximum | float(0)) < (reserve | float(0)) }}
            sequence:
              - action: script.hoymiles_rollback_tariff_transaction

          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {% set active = states(
                    'input_text.hoymiles_tariff_active_action') %}
                  {% set maximum = states(
                    'input_number.hoymiles_tariff_maximum_soc') %}
                  {% set latched = states(
                    'input_number.hoymiles_tariff_latched_target_soc') %}
                  {% set reserve = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'reserve_soc_percent') %}
                  {{ active in ['battery_charge', 'grid_support_and_charge']
                     and is_number(maximum) and is_number(latched)
                     and is_number(reserve)
                     and (maximum | float(0)) >= (reserve | float(0))
                     and (maximum | float(0)) < (latched | float(0)) }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_latched_target_soc
                data:
                  value: >-
                    {{ states('input_number.hoymiles_tariff_maximum_soc')
                       | float(100) | round(0, 'floor') }}

          # Start: plan i wszystkie dane są ważne, bieżący blok został wybrany,
          # a magazyn nie osiągnął jeszcze wyliczonego celu SOC. Pełny 1% próg
          # startu oddziela się od progu zatrzymania i zapobiega oscylacji.
          # Using low-cost grid power solely to supply the home has an additional execution contract:
          # the optimizer must accept the whole continuous run and its intent
          # must remain unchanged for 120 s. Urgent battery charging does not
          # wait for this micro-cycle filter.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state(
                       'input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_export_control_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_control_data_ready
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_planned_charge_slot
                state: "on"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                'status_code')
                     in ['ready', 'insufficient_cheap_window'] }}
              - condition: template
                value_template: >-
                  {% set action = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'current_action') %}
                  {% set plan = 'sensor.hoymiles_hit_tariff_charge_plan' %}
                  {% set soc = states(
                    'sensor.hoymiles_hit_overview_battery_soc') %}
                  {% if action == 'grid_support' %}
                    {{ state_attr(plan, 'current_run_start_eligible')
                         is sameas true
                       and is_number(state_attr(
                         plan, 'current_run_intent_stable_seconds'))
                       and (state_attr(
                         plan, 'current_run_intent_stable_seconds')
                           | float(0)) >= 120
                       and is_number(state_attr(plan, 'reserve_soc_percent'))
                       and is_number(states(
                         'input_number.hoymiles_tariff_maximum_soc'))
                       and is_number(soc)
                       and (states(
                         'input_number.hoymiles_tariff_maximum_soc')
                           | float(0))
                           >= (state_attr(plan, 'reserve_soc_percent')
                                | float(0))
                       and (soc | float(0))
                           > (state_attr(plan, 'reserve_soc_percent')
                                | float(0)) + 1.0 }}
                  {% elif action in
                       ['battery_charge', 'grid_support_and_charge'] %}
                    {% set target = states('sensor.hoymiles_tariff_target_soc') %}
                    {% set capacity = states(
                      'sensor.hoymiles_hit_battery_capacity') %}
                    {% set reserve = state_attr(plan, 'reserve_soc_percent') %}
                    {% if is_number(target) and is_number(soc)
                          and is_number(capacity) and (capacity | float(0)) > 0
                          and is_number(reserve)
                          and is_number(states(
                            'input_number.hoymiles_tariff_maximum_soc'))
                          and (states(
                            'input_number.hoymiles_tariff_maximum_soc')
                              | float(0)) >= (reserve | float(0)) %}
                      {% set headroom_kwh =
                        ((target | float(0)) - (soc | float(0)))
                        * (capacity | float(0)) / 100 %}
                      {% set minimum_headroom_kwh =
                        [[(capacity | float(0)) * 0.005, 0.20] | max, 0.50]
                        | min %}
                      {% set reserve_recovery =
                        (soc | float(0)) < (reserve | float(0))
                        and ((target | float(0)) - (soc | float(0))) >= 0.2
                        and headroom_kwh >= 0.10 %}
                      {{ (target | float(0)) > (soc | float(0))
                         and (reserve_recovery
                              or headroom_kwh >= minimum_headroom_kwh) }}
                    {% else %}
                      false
                    {% endif %}
                  {% else %}
                    false
                  {% endif %}
              - condition: template
                value_template: >-
                  {{ is_number(state_attr(
                       'sensor.hoymiles_hit_tariff_charge_plan',
                       'command_charge_power_percent'))
                     and (state_attr(
                       'sensor.hoymiles_hit_tariff_charge_plan',
                       'command_charge_power_percent') | float(0)) > 0
                     and states('sensor.hoymiles_ems_hardware_mode')
                       not in ['off_grid', 'unknown', 'unavailable', 'none'] }}
              - condition: template
                value_template: >-
                  {% set slot_end = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'current_slot_end') %}
                  {{ slot_end is not none
                     and as_timestamp(slot_end, 0) - as_timestamp(now())
                       >= 420 }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not is_state('timer.hoymiles_discharge', 'active')
                     and not is_state('timer.hoymiles_charge', 'active') }}
            sequence:
              # Freeze the accepted intent before the first Modbus wait. The
              # sensor may recalculate while the inverter confirms settings;
              # this transaction must nevertheless remain internally coherent.
              - variables:
                  tariff_start_action: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'current_action') }}
                  tariff_start_soc: >-
                    {{ states('sensor.hoymiles_hit_overview_battery_soc')
                       | float(0) }}
                  tariff_start_target_soc: >-
                    {{ states('sensor.hoymiles_tariff_target_soc')
                       | float(100) }}
                  tariff_start_reserve_soc: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'reserve_soc_percent') | float(0) }}
                  tariff_start_maximum_soc: >-
                    {{ states('input_number.hoymiles_tariff_maximum_soc')
                       | float(100) }}
                  tariff_start_power: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'command_charge_power_percent')
                       | float(0) }}
                  tariff_start_slot_end: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'current_slot_end') }}
              # Zamrożony cel pozostaje stały do końca rozpoczętego cyklu.
              # Kolejne przeliczenia pogody i obciążenia nie mogą wywołać
              # naprzemiennego Grid Charge / Self-Use.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_latched_target_soc
                data:
                  value: >-
                    {% if tariff_start_action == 'grid_support' %}
                      {# Force Charge uses an integer SOC. Keep the target
                         below live SOC and at/below the configured maximum,
                         but never below the protected Self-Use reserve. #}
                      {% set below_live =
                        (tariff_start_soc | round(0, 'floor')) - 1 %}
                      {% set maximum = tariff_start_maximum_soc
                        | round(0, 'floor') %}
                      {% set reserve = tariff_start_reserve_soc
                        | round(0, 'ceil') %}
                      {{ [[[below_live, maximum] | min, reserve] | max, 0]
                           | max | round(0) }}
                    {% else %}
                      {{ tariff_start_target_soc | float(100)
                         | round(0, 'ceil') }}
                    {% endif %}
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_tariff_latched_slot_end
                data:
                  timestamp: >-
                    {{ as_timestamp(tariff_start_slot_end) }}
              # Snapshot both shared registers, freeze the accepted action and
              # claim durable ownership before the first Modbus setting write.
              # A concurrent controller therefore sees this transaction even
              # while its first acknowledgement is still pending.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_saved_max_charge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                       | float(100) | round(1) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_saved_force_charge_soc
                data:
                  value: >-
                    {{ states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                       | float(100) | round(0) }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_tariff_active_action
                data:
                  value: >-
                    {{ tariff_start_action | default('none', true) }}
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_tariff_charge_active
              # Idempotent setting writes: a value already confirmed by the
              # inverter is never sent to Modbus again.
              - if:
                  - condition: template
                    value_template: >-
                      {% set wanted = tariff_start_power | float(0) %}
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                           - wanted) | abs >= 0.5 }}
                then:
                  - action: script.hoymiles_verified_set_ems_maximum_charge_power
                    data:
                      value: >-
                        {{ tariff_start_power | float(0) | round(1) }}
                  - wait_template: >-
                      {% set wanted = tariff_start_power | float(0) %}
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                           - wanted) | abs < 0.5 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {% set wanted = tariff_start_power | float(0) %}
                          {{ ((states(
                            'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                              | float(0)) - wanted) | abs >= 0.5 }}
                    then:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: "The inverter did not confirm the charging limit"
              - if:
                  - condition: template
                    value_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) %}
                      {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                            | float(0)) - wanted) | abs >= 1.0 }}
                then:
                  # The 4304 ACK above may have taken a full minute. Re-check
                  # authoritative readiness and physical mode immediately
                  # before the paired 4303 operational write.
                  - choose:
                      - conditions:
                          - condition: state
                            entity_id: input_boolean.hoymiles_tariff_charge_active
                            state: "on"
                          - condition: state
                            entity_id: input_boolean.hoymiles_tariff_charge_enabled
                            state: "on"
                          - condition: state
                            entity_id: binary_sensor.hoymiles_ems_control_conflict
                            state: "off"
                          - condition: state
                            entity_id: >-
                              binary_sensor.hoymiles_tariff_control_data_ready
                            state: "on"
                          - condition: template
                            value_template: >-
                              {{ states('sensor.hoymiles_ems_hardware_mode')
                                   not in ['off_grid', 'unknown', 'unavailable',
                                           'none', ''] }}
                        sequence:
                          - action: >-
                              script.hoymiles_verified_set_ems_force_charge_soc
                            data:
                              value: >-
                                {{ states(
                                     'input_number.hoymiles_tariff_latched_target_soc')
                                   | float(100) | round(0) }}
                    default:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: >-
                          Tariff start stopped before the next operational write
                  - wait_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) %}
                      {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                            | float(0)) - wanted) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {% set wanted = states(
                            'input_number.hoymiles_tariff_latched_target_soc')
                             | float(100) %}
                          {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                | float(0)) - wanted) | abs >= 1.0 }}
                    then:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: "The inverter did not confirm the target SOC before start"
              # Setting readbacks may take up to two minutes. Revalidate the
              # immutable window immediately before changing EMS mode, so a
              # late response can never start Grid Charge after the cheap zone.
              - if:
                  - condition: state
                    entity_id: binary_sensor.hoymiles_ems_control_conflict
                    state: "off"
                  - condition: template
                    value_template: >-
                      {% set live_plan =
                        states.sensor.hoymiles_hit_tariff_charge_plan %}
                      {% set reported = live_plan.last_reported
                        if live_plan.last_reported is defined
                        else live_plan.last_updated %}
                      {% set plan_age = as_timestamp(now())
                        - as_timestamp(reported, 0) %}
                      {{ state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_zone') == 'low'
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'control_inputs_fresh') is sameas true
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_slot_planned') is sameas true
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_action') == tariff_start_action
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'soc_age_seconds'))
                         and (state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'soc_age_seconds') | float(9999)) <= 120
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'bms_charge_age_seconds'))
                         and (state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'bms_charge_age_seconds') | float(9999)) <= 300
                         and plan_age >= 0 and plan_age <= 120
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'on')
                         and states(
                           'input_text.hoymiles_tariff_active_action')
                           == tariff_start_action
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off')
                         and (is_state(
                           'input_boolean.hoymiles_rcm_enabled', 'off')
                           or is_state(
                             'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                         and is_state(
                           'input_boolean.hoymiles_rcm_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_active',
                           'off')
                         and is_state(
                           'input_boolean.hoymiles_battery_balancing_active',
                           'off')
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_charge_cycle_active', 'off')
                         and not is_state('timer.hoymiles_discharge', 'active')
                         and not is_state('timer.hoymiles_charge', 'active')
                         and is_state(
                           'binary_sensor.hoymiles_ems_execution_ready', 'on')
                         and is_state(
                           'binary_sensor.hoymiles_tariff_control_data_ready',
                           'on')
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'command_charge_power_percent'))
                         and ((state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'command_charge_power_percent') | float(-999))
                           - (tariff_start_power | float(0))) | abs < 0.5
                         and is_number(states(
                           'input_number.hoymiles_tariff_maximum_soc'))
                         and (states(
                           'input_number.hoymiles_tariff_maximum_soc')
                             | float(0)) >= tariff_start_reserve_soc
                         and as_timestamp(states(
                           'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                           - as_timestamp(now()) >= 300
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
                then:
                  - delay: "00:00:01"
                else:
                  - action: script.hoymiles_rollback_tariff_transaction
                  - stop: "Safe Grid Charge start conditions expired"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                        'sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"
              # The select entity may publish optimistically. Wait for a normal
              # Modbus propagation pass before evaluating the readback.
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                timeout: "00:02:00"
                continue_on_timeout: true
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: sensor.hoymiles_ems_hardware_mode
                        state: "grid_charge"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_tariff_control_data_ready
                        state: "on"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_ems_control_conflict
                        state: "off"
                      - condition: template
                        value_template: >-
                          {% set live_plan =
                            states.sensor.hoymiles_hit_tariff_charge_plan %}
                          {% set reported = live_plan.last_reported
                            if live_plan.last_reported is defined
                            else live_plan.last_updated %}
                          {% set plan_age = as_timestamp(now())
                            - as_timestamp(reported, 0) %}
                          {{ state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'current_zone') == 'low'
                             and state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'control_inputs_fresh') is sameas true
                             and state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'current_slot_planned') is sameas true
                             and state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'current_action') == tariff_start_action
                             and is_number(state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'soc_age_seconds'))
                             and (state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'soc_age_seconds') | float(9999)) <= 120
                             and is_number(state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'bms_charge_age_seconds'))
                             and (state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'bms_charge_age_seconds') | float(9999)) <= 300
                             and plan_age >= 0 and plan_age <= 120
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_enabled', 'on')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_active', 'on')
                             and states(
                               'input_text.hoymiles_tariff_active_action')
                               == tariff_start_action
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_active', 'off')
                             and (is_state(
                               'input_boolean.hoymiles_rcm_enabled', 'off')
                               or is_state(
                                 'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                             and is_state(
                               'input_boolean.hoymiles_rcm_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_pre_discharge_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_battery_balancing_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_discharge_cycle_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_charge_cycle_active', 'off')
                             and not is_state('timer.hoymiles_discharge', 'active')
                             and not is_state('timer.hoymiles_charge', 'active')
                             and is_state(
                               'binary_sensor.hoymiles_ems_execution_ready', 'on')
                             and is_number(state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'command_charge_power_percent'))
                             and ((state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'command_charge_power_percent') | float(-999))
                               - (tariff_start_power | float(0))) | abs < 0.5
                             and is_number(states(
                               'input_number.hoymiles_tariff_maximum_soc'))
                             and (states(
                               'input_number.hoymiles_tariff_maximum_soc')
                               | float(0)) >= tariff_start_reserve_soc
                             and as_timestamp(states(
                               'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                               - as_timestamp(now()) >= 300 }}
                      - condition: template
                        value_template: >-
                          {% set wanted_power = tariff_start_power | float(0) %}
                          {% set wanted_soc = states(
                            'input_number.hoymiles_tariff_latched_target_soc')
                             | float(100) %}
                          {{ ((states(
                            'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                              | float(0)) - wanted_power) | abs < 0.5
                             and ((states(
                               'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                | float(0)) - wanted_soc) | abs < 1.1 }}
                    sequence:
                      - delay: "00:00:01"
                default:
                  # The inverter did not acknowledge the complete transaction.
                  # Roll back both writes; an unavailable readback keeps the
                  # pending owner for the periodic retry.
                  - action: script.hoymiles_rollback_tariff_transaction

          # Aktualizacja ograniczeń BMS podczas bieżącego bloku. Cel SOC nie
          # podąża już za ruchomym planem — używany jest cel zapamiętany przy
          # starcie cyklu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "on"
              # An active cycle may update hardware only from a newly committed
              # plan whose authoritative input freshness still passes.
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_control_data_ready
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "off"
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "grid_charge"
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_planned_charge_slot
                state: "on"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                'status_code')
                     in ['ready', 'insufficient_cheap_window'] }}
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'input_number.hoymiles_tariff_latched_target_soc')) }}
              - condition: template
                value_template: >-
                  {% set active = states(
                    'input_text.hoymiles_tariff_active_action') %}
                  {% set current = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'current_action') %}
                  {{ (active == 'grid_support'
                       and current == 'grid_support')
                     or (active in
                           ['battery_charge', 'grid_support_and_charge']
                         and current in
                           ['battery_charge', 'grid_support_and_charge']) }}
              - condition: template
                value_template: >-
                  {{ not (
                    state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_run_continue_eligible') is not sameas true
                    and is_number(state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_run_intent_stable_seconds'))
                    and (state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_run_intent_stable_seconds') | float(0)) >= 120
                    and (as_timestamp(now()) - as_timestamp(
                      states.input_boolean.hoymiles_tariff_charge_active
                        .last_changed)) >= 120) }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'command_charge_power_percent'))
                         and ((states(
                           'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                           | float(0))
                           - (state_attr(
                             'sensor.hoymiles_hit_tariff_charge_plan',
                             'command_charge_power_percent')
                              | float(0))) | abs >= 0.5 }}
                then:
                  - action: script.hoymiles_verified_set_ems_maximum_charge_power
                    data:
                      value: >-
                        {{ state_attr(
                             'sensor.hoymiles_hit_tariff_charge_plan',
                             'command_charge_power_percent')
                           | float(0) | round(1) }}
                  - wait_template: >-
                      {% set wanted = state_attr(
                        'sensor.hoymiles_hit_tariff_charge_plan',
                        'command_charge_power_percent') | float(0) %}
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                           - wanted) | abs < 0.5 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {% set wanted = state_attr(
                            'sensor.hoymiles_hit_tariff_charge_plan',
                            'command_charge_power_percent') | float(0) %}
                          {{ ((states(
                            'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                              | float(0)) - wanted) | abs >= 0.5 }}
                    then:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: "The inverter did not confirm the new charging limit"
              # A helper ACK may hold this mode:single automation for 60 s,
              # while its Off-Grid/readiness state trigger is dropped. Never
              # extend the accepted deadline from that obsolete snapshot.
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_boolean.hoymiles_tariff_charge_active
                        state: "on"
                      - condition: state
                        entity_id: input_boolean.hoymiles_tariff_charge_enabled
                        state: "on"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_ems_control_conflict
                        state: "off"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_tariff_control_data_ready
                        state: "on"
                      - condition: state
                        entity_id: sensor.hoymiles_ems_hardware_mode
                        state: "grid_charge"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_tariff_planned_charge_slot
                        state: "on"
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'status_code')
                             in ['ready', 'insufficient_cheap_window'] }}
                      - condition: template
                        value_template: >-
                          {% set active = states(
                               'input_text.hoymiles_tariff_active_action') %}
                          {% set current = state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'current_action') %}
                          {{ (active == 'grid_support'
                               and current == 'grid_support')
                             or (active in
                                   ['battery_charge', 'grid_support_and_charge']
                                 and current in
                                   ['battery_charge', 'grid_support_and_charge']) }}
                      - condition: template
                        value_template: >-
                          {% set slot_end = state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'current_slot_end') %}
                          {{ slot_end is not none
                             and as_timestamp(slot_end, 0) > as_timestamp(now())
                             and as_timestamp(states(
                               'input_datetime.hoymiles_tariff_latched_slot_end'),
                               0) > as_timestamp(now())
                             and not (
                               state_attr(
                                 'sensor.hoymiles_hit_tariff_charge_plan',
                                 'current_run_continue_eligible') is not sameas true
                               and is_number(state_attr(
                                 'sensor.hoymiles_hit_tariff_charge_plan',
                                 'current_run_intent_stable_seconds'))
                               and (state_attr(
                                 'sensor.hoymiles_hit_tariff_charge_plan',
                                 'current_run_intent_stable_seconds') | float(0)) >= 120
                               and (as_timestamp(now()) - as_timestamp(
                                 states.input_boolean.hoymiles_tariff_charge_active
                                   .last_changed)) >= 120) }}
                    sequence:
                      - if:
                          - condition: template
                            value_template: >-
                              {% set slot_end = state_attr(
                                'sensor.hoymiles_hit_tariff_charge_plan',
                                'current_slot_end') %}
                              {{ slot_end is not none
                                 and as_timestamp(slot_end, 0)
                                   > as_timestamp(states(
                                     'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                                     + 5 }}
                        then:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: >-
                                input_datetime.hoymiles_tariff_latched_slot_end
                            data:
                              timestamp: >-
                                {{ as_timestamp(state_attr(
                                  'sensor.hoymiles_hit_tariff_charge_plan',
                                  'current_slot_end')) }}
                default:
                  - action: script.hoymiles_rollback_tariff_transaction
                  - stop: >-
                      Tariff update stopped before extending the window
              - if:
                  - condition: template
                    value_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) | round(0) %}
                      {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                           | float(0)) - wanted) | abs >= 1.0 }}
                then:
                  # Re-check again after the optional latch action, directly
                  # before the second operational register write.
                  - choose:
                      - conditions:
                          - condition: state
                            entity_id: input_boolean.hoymiles_tariff_charge_active
                            state: "on"
                          - condition: state
                            entity_id: input_boolean.hoymiles_tariff_charge_enabled
                            state: "on"
                          - condition: state
                            entity_id: binary_sensor.hoymiles_ems_control_conflict
                            state: "off"
                          - condition: state
                            entity_id: >-
                              binary_sensor.hoymiles_tariff_control_data_ready
                            state: "on"
                          - condition: state
                            entity_id: sensor.hoymiles_ems_hardware_mode
                            state: "grid_charge"
                          - condition: state
                            entity_id: >-
                              binary_sensor.hoymiles_tariff_planned_charge_slot
                            state: "on"
                          - condition: template
                            value_template: >-
                              {{ state_attr(
                                   'sensor.hoymiles_hit_tariff_charge_plan',
                                   'status_code')
                                 in ['ready', 'insufficient_cheap_window'] }}
                          - condition: template
                            value_template: >-
                              {% set active = states(
                                   'input_text.hoymiles_tariff_active_action') %}
                              {% set current = state_attr(
                                   'sensor.hoymiles_hit_tariff_charge_plan',
                                   'current_action') %}
                              {{ (active == 'grid_support'
                                   and current == 'grid_support')
                                 or (active in
                                       ['battery_charge', 'grid_support_and_charge']
                                     and current in
                                       ['battery_charge', 'grid_support_and_charge']) }}
                          - condition: template
                            value_template: >-
                              {% set slot_end = state_attr(
                                   'sensor.hoymiles_hit_tariff_charge_plan',
                                   'current_slot_end') %}
                              {{ slot_end is not none
                                 and as_timestamp(slot_end, 0) > as_timestamp(now())
                                 and as_timestamp(states(
                                   'input_datetime.hoymiles_tariff_latched_slot_end'),
                                   0) > as_timestamp(now())
                                 and not (
                                   state_attr(
                                     'sensor.hoymiles_hit_tariff_charge_plan',
                                     'current_run_continue_eligible') is not sameas true
                                   and is_number(state_attr(
                                     'sensor.hoymiles_hit_tariff_charge_plan',
                                     'current_run_intent_stable_seconds'))
                                   and (state_attr(
                                     'sensor.hoymiles_hit_tariff_charge_plan',
                                     'current_run_intent_stable_seconds')
                                       | float(0)) >= 120
                                   and (as_timestamp(now()) - as_timestamp(
                                     states.input_boolean.hoymiles_tariff_charge_active
                                       .last_changed)) >= 120) }}
                        sequence:
                          - action: >-
                              script.hoymiles_verified_set_ems_force_charge_soc
                            data:
                              value: >-
                                {{ states(
                                     'input_number.hoymiles_tariff_latched_target_soc')
                                   | float(100) | round(0) }}
                    default:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: >-
                          Tariff update stopped before the next operational write
                  - wait_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) %}
                      {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                            | float(0)) - wanted) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {% set wanted = states(
                            'input_number.hoymiles_tariff_latched_target_soc')
                             | float(100) %}
                          {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                | float(0)) - wanted) | abs >= 1.0 }}
                    then:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: "The inverter did not confirm the target SOC"

          # Stop: end zapamiętanego ciągłego okna, osiągnięcie zamrożonego
          # celu, wyłączenie automatu albo trwała utrata wymaganych danych.
          # Chwilowe zniknięcie bieżącego bloku z ponownie przeliczonego planu
          # nie przerywa rozpoczętego ładowania. Minimalny czas 120 s pozwala
          # potwierdzić SOC i wykonanie zapisu Modbus przed komendą Self-Use.
              # The second 4303 ACK can also outlive the committed current
              # run. Do not accept it unless the identical live continuation
              # predicate still owns Grid Charge.
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_boolean.hoymiles_tariff_charge_active
                        state: "on"
                      - condition: state
                        entity_id: input_boolean.hoymiles_tariff_charge_enabled
                        state: "on"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_ems_control_conflict
                        state: "off"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_tariff_control_data_ready
                        state: "on"
                      - condition: state
                        entity_id: sensor.hoymiles_ems_hardware_mode
                        state: "grid_charge"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_tariff_planned_charge_slot
                        state: "on"
                      - condition: template
                        value_template: >-
                          {% set active = states(
                               'input_text.hoymiles_tariff_active_action') %}
                          {% set current = state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'current_action') %}
                          {% set slot_end = state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'current_slot_end') %}
                          {{ state_attr(
                               'sensor.hoymiles_hit_tariff_charge_plan',
                               'status_code')
                               in ['ready', 'insufficient_cheap_window']
                             and ((active == 'grid_support'
                                    and current == 'grid_support')
                               or (active in
                                     ['battery_charge', 'grid_support_and_charge']
                                   and current in
                                     ['battery_charge', 'grid_support_and_charge']))
                             and slot_end is not none
                             and as_timestamp(slot_end, 0) > as_timestamp(now())
                             and as_timestamp(states(
                               'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                               > as_timestamp(now())
                             and not (
                               state_attr(
                                 'sensor.hoymiles_hit_tariff_charge_plan',
                                 'current_run_continue_eligible') is not sameas true
                               and is_number(state_attr(
                                 'sensor.hoymiles_hit_tariff_charge_plan',
                                 'current_run_intent_stable_seconds'))
                               and (state_attr(
                                 'sensor.hoymiles_hit_tariff_charge_plan',
                                 'current_run_intent_stable_seconds')
                                   | float(0)) >= 120
                               and (as_timestamp(now()) - as_timestamp(
                                 states.input_boolean.hoymiles_tariff_charge_active
                                   .last_changed)) >= 120) }}
                    sequence:
                      - delay: "00:00:01"
                default:
                  - action: script.hoymiles_rollback_tariff_transaction
                  - stop: "Active tariff authorization lost after 4303 ACK"

          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_tariff_charge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
                     or state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                   'status_code')
                        in ['missing_data', 'optimizer_error', 'learning',
                            'no_charge_needed', 'soc_limits_conflict',
                            'hard_reserve_unavailable']
                     or (state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'bms_charge_data_fresh') is sameas true
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'bms_charge_available') is not sameas true)
                     or states('input_text.hoymiles_tariff_active_action')
                        not in
                          ['battery_charge', 'grid_support',
                           'grid_support_and_charge']
                     or not is_number(states(
                       'input_number.hoymiles_tariff_latched_target_soc'))
                     or not is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     or (states('input_text.hoymiles_tariff_active_action')
                           in ['battery_charge', 'grid_support_and_charge']
                         and is_number(states(
                           'input_number.hoymiles_tariff_maximum_soc'))
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'reserve_soc_percent'))
                         and (states(
                           'input_number.hoymiles_tariff_maximum_soc')
                              | float(0))
                           < (state_attr(
                             'sensor.hoymiles_hit_tariff_charge_plan',
                             'reserve_soc_percent') | float(0)))
                     or as_timestamp(states(
                          'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                        <= as_timestamp(now())
                     or (states('input_text.hoymiles_tariff_active_action')
                           in ['battery_charge', 'grid_support_and_charge']
                         and (as_timestamp(now()) - as_timestamp(
                           states.input_boolean.hoymiles_tariff_charge_active
                             .last_changed)) >= 120
                         and (states(
                           'sensor.hoymiles_hit_overview_battery_soc')
                              | float(0))
                              >= (states(
                                'input_number.hoymiles_tariff_latched_target_soc')
                                  | float(100)) - 0.1)
                     or ((as_timestamp(now()) - as_timestamp(
                           states.input_boolean.hoymiles_tariff_charge_active
                             .last_changed)) >= 120
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_run_intent_stable_seconds'))
                         and (state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_run_intent_stable_seconds') | float(0))
                           >= 120
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_run_continue_eligible')
                           is not sameas true)
                     or (not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_charge')
                         and (as_timestamp(now()) - as_timestamp(
                           states.sensor.hoymiles_ems_hardware_mode.last_changed))
                           >= 60) }}
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              - action: script.hoymiles_rollback_tariff_transaction

  - id: hoymiles_rce_grid_discharge_control
    alias: "EMS RCE — optimized-plan discharge control"
    description: >-
      Every minute, checks the optimizer's two-day plan. It discharges only in
      the selected most profitable slots and only above the SOC required to
      supply the home. Manual timers take priority.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.hoymiles_rce_current_price
          - sensor.hoymiles_hit_rce_optimized_plan
          - binary_sensor.hoymiles_rce_price_above_threshold
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
          - binary_sensor.hoymiles_sale_block_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - timer.hoymiles_discharge
          - timer.hoymiles_charge
          - sensor.hoymiles_hit_overview_battery_soc
          - number.hoymiles_hit_force_discharge_soc
          - number.hoymiles_hit_maximum_discharge_power
          - sensor.hoymiles_hit_maximum_discharge_current
          - sensor.hoymiles_hit_battery_voltage_bms
          - sensor.hoymiles_rce_effective_discharge_power_percent
          - input_number.hoymiles_rce_requested_discharge_power
          - input_select.hoymiles_rce_inverter_rated_power
          - sensor.hoymiles_hit_number_of_machines_master_and_slave
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - input_number.hoymiles_rce_soc_safety_margin
          - sensor.hoymiles_rce_effective_minimum_soc
          - sensor.hoymiles_rce_dynamic_minimum_soc
          - sensor.hoymiles_ems_hardware_mode
          - binary_sensor.hoymiles_ems_execution_ready
          - binary_sensor.hoymiles_ems_control_conflict
          - binary_sensor.hoymiles_rce_reserve_ready
          - binary_sensor.hoymiles_rce_control_data_ready
          - binary_sensor.hoymiles_ems_export_allowed
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_rcm_active
          - input_boolean.hoymiles_rcm_pre_discharge_active
          - input_boolean.hoymiles_tariff_charge_active
          - input_boolean.hoymiles_battery_balancing_active
      - trigger: homeassistant
        event: start
    actions:
      # Inactive RCE never pre-writes a shared register. The complete setting
      # transaction is performed only inside the owned start branch below.
      # Re-evaluate the complete active-run authorization before the first
      # operational write. A trigger received during another ACK can be dropped
      # by mode:single, so the branch-entry snapshot is never sufficient.
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_ems_export_allowed
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_reserve_ready
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_control_data_ready
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_ems_control_conflict
                state: "off"
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "grid_discharge"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                'current_slot_planned')
                     | default(false, true) }}
              - condition: template
                value_template: >-
                  {{ as_timestamp(states(
                       'input_datetime.hoymiles_rce_latched_slot_end'), 0)
                       > as_timestamp(now())
                     and state_attr(
                       'sensor.hoymiles_hit_rce_optimized_plan',
                       'current_slot_continue_eligible') is sameas true }}
            sequence:
              - variables:
                  rce_live_authorization_checked: true
          # Planning authority is required for every new start or operational
          # write. A short normal recalculation may, however, preserve an
          # already accepted and latched cycle while every independent live
          # execution-safety input remains valid.
          #
          # Important: do not infer safety from the stale/latched optimizer
          # result while recalculation is pending.  After a new result commits,
          # its dependent template sensors may settle one event later; that
          # bounded cohort transition also preserves only the already latched
          # cycle and never grants authority for a new start or write.
          # Hard-stop conditions must continue to be evaluated independently
          # from current physical/live safety inputs.
          # A normal planning-input change may preserve the active latched
          # cycle, but a safety-critical input change must stop it immediately
          # even if the new optimizer result has not yet been published.
          - conditions:
              - condition: template
                value_template: &rce_pending_latched_execution_safe >-
                  {% set plan =
                    states.sensor.hoymiles_hit_rce_optimized_plan %}
                  {% set plan_reported = plan.last_updated %}
                  {% set soc =
                    states.sensor.hoymiles_hit_overview_battery_soc %}
                  {% set bms_current =
                    states.sensor.hoymiles_hit_maximum_discharge_current %}
                  {% set bms_voltage =
                    states.sensor.hoymiles_hit_battery_voltage_bms %}
                  {% set floor =
                    states.sensor.hoymiles_hit_ems_force_discharge_soc_readback %}
                  {% set power =
                    states.sensor.hoymiles_hit_ems_maximum_discharge_power_readback %}
                  {% set soc_reported = soc.last_reported
                    if soc.last_reported is defined else soc.last_updated %}
                  {% set current_reported = bms_current.last_reported
                    if bms_current.last_reported is defined
                    else bms_current.last_updated %}
                  {% set voltage_reported = bms_voltage.last_reported
                    if bms_voltage.last_reported is defined
                    else bms_voltage.last_updated %}
                  {% set floor_reported = floor.last_reported
                    if floor.last_reported is defined else floor.last_updated %}
                  {% set power_reported = power.last_reported
                    if power.last_reported is defined else power.last_updated %}
                  {% set now_ts = as_timestamp(now()) %}
                  {% set plan_age =
                    now_ts - as_timestamp(plan_reported, 0) %}
                  {% set soc_age = now_ts - as_timestamp(soc_reported, 0) %}
                  {% set current_age =
                    now_ts - as_timestamp(current_reported, 0) %}
                  {% set voltage_age =
                    now_ts - as_timestamp(voltage_reported, 0) %}
                  {% set floor_age =
                    now_ts - as_timestamp(floor_reported, 0) %}
                  {% set power_age =
                    now_ts - as_timestamp(power_reported, 0) %}
                  {% set latched_floor = states(
                    'input_number.hoymiles_rce_latched_minimum_soc') %}
                  {% set committed_power = state_attr(
                    'sensor.hoymiles_hit_rce_optimized_plan',
                    'current_slot_execution_power_percent') %}
                  {% set current_price = state_attr(
                    'sensor.hoymiles_hit_rce_optimized_plan',
                    'current_price_pln_kwh') %}
                  {% set automatic_floor = state_attr(
                    'sensor.hoymiles_hit_rce_optimized_plan',
                    'automatic_price_floor_pln_kwh') %}
                  {% set continue_eligible = state_attr(
                    'sensor.hoymiles_hit_rce_optimized_plan',
                    'current_slot_continue_eligible') %}
                  {% set machine_type =
                    states('sensor.hoymiles_hit_machines_type') %}
                  {% set machine_count = states(
                    'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
                  {% set topology_valid =
                    is_number(machine_type) and is_number(machine_count)
                    and (((machine_type | int(-1)) == 0
                          and (machine_count | int(-1)) == 1)
                         or ((machine_type | int(-1)) == 1
                             and (machine_count | int(-1)) >= 2
                             and (machine_count | int(-1)) <= 10)) %}
                  {% set owners_clear =
                    is_state('input_boolean.hoymiles_tariff_charge_enabled', 'off')
                    and is_state(
                      'input_boolean.hoymiles_tariff_charge_active', 'off')
                    and is_state('input_boolean.hoymiles_rcm_active', 'off')
                    and is_state(
                      'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                    and is_state(
                      'input_boolean.hoymiles_rcm_export_control_active', 'off')
                    and (is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                         or is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                    and is_state(
                      'input_boolean.hoymiles_battery_balancing_active', 'off')
                    and is_state(
                      'input_boolean.hoymiles_discharge_cycle_active', 'off')
                    and is_state(
                      'input_boolean.hoymiles_charge_cycle_active', 'off')
                    and not is_state('timer.hoymiles_discharge', 'active')
                    and not is_state('timer.hoymiles_charge', 'active') %}
                  {% set price_stop =
                    not is_number(current_price)
                    or not is_number(automatic_floor)
                    or (current_price | float(0))
                       < (automatic_floor | float(0)) %}
                  {% set result_current = state_attr(
                    'sensor.hoymiles_hit_rce_optimized_plan',
                    'result_current') %}
                  {% set recalculation_pending = state_attr(
                    'sensor.hoymiles_hit_rce_optimized_plan',
                    'recalculation_pending') %}
                  {% set optimizer_pending =
                    result_current is sameas false
                    and recalculation_pending is sameas true %}
                  {% set current_cohort_settling =
                    result_current is sameas true
                    and recalculation_pending is sameas false
                    and is_state(
                      'binary_sensor.hoymiles_rce_control_data_ready', 'off')
                    and plan_age >= 0 and plan_age <= 5 %}
                  {% set optimizer_transition =
                    optimizer_pending or current_cohort_settling %}
                  {{ is_state(
                       'input_boolean.hoymiles_rce_discharge_active', 'on')
                     and is_state(
                       'input_boolean.hoymiles_rce_discharge_enabled', 'on')
                     and optimizer_transition
                     and is_state(
                       'binary_sensor.hoymiles_ems_execution_ready', 'on')
                     and is_state(
                       'binary_sensor.hoymiles_ems_export_allowed', 'on')
                     and is_state(
                       'binary_sensor.hoymiles_sale_block_active', 'off')
                     and is_state(
                       'binary_sensor.hoymiles_ems_control_conflict', 'off')
                     and is_state(
                       'sensor.hoymiles_ems_hardware_mode', 'grid_discharge')
                     and owners_clear
                     and topology_valid
                     and as_timestamp(states(
                       'input_datetime.hoymiles_rce_latched_slot_end'), 0)
                         > now_ts
                     and state_attr(
                       'sensor.hoymiles_hit_rce_optimized_plan',
                       'current_slot_planned') | default(false, true)
                     and continue_eligible is sameas true
                     and not price_stop
                     and is_number(committed_power)
                     and (committed_power | float(0)) > 0
                     and is_number(soc.state)
                     and (soc.state | float(-1)) >= 0
                     and (soc.state | float(101)) <= 100
                     and soc_age >= -5 and soc_age <= 120
                     and is_number(bms_current.state)
                     and (bms_current.state | float(0)) > 0
                     and current_age >= -5 and current_age <= 300
                     and is_number(bms_voltage.state)
                     and (bms_voltage.state | float(0)) > 0
                     and voltage_age >= -5 and voltage_age <= 300
                     and is_number(floor.state)
                     and (floor.state | float(-1)) >= 0
                     and (floor.state | float(101)) <= 100
                     and floor_age >= -5 and floor_age <= 180
                     and is_number(power.state)
                     and (power.state | float(0)) > 0
                     and (power.state | float(101)) <= 100
                     and power_age >= -5 and power_age <= 180
                     and is_number(latched_floor)
                     and (power.state | float(999))
                         <= (committed_power | float(0)) + 0.5
                     and (floor.state | float(-999))
                         >= (latched_floor | float(100)) - 0.5
                     and (soc.state | float(0))
                         > [latched_floor | float(100),
                            floor.state | float(100)] | max }}
            sequence:
              - stop: >-
                  RCE is synchronizing the plan cohort; the accepted active cycle remains unchanged
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
            sequence:
              - action: script.hoymiles_rollback_rce_transaction
              - stop: >-
                  Active RCE lost authorization before writing the power limit
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "grid_discharge"
          - condition: state
            entity_id: input_boolean.hoymiles_battery_balancing_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_discharge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_charge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_enabled
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "off"
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                 or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
          - condition: template
            value_template: >-
              {{ not is_state('timer.hoymiles_discharge', 'active')
                 and not is_state('timer.hoymiles_charge', 'active') }}
          - condition: state
            entity_id: binary_sensor.hoymiles_rce_control_data_ready
            state: "on"
          - condition: template
            value_template: >-
              {{ is_number(states(
                   'sensor.hoymiles_rce_effective_discharge_power_percent'))
                 and ((states(
                   'sensor.hoymiles_hit_ems_maximum_discharge_power_readback') | float(0))
                  - (states(
                    'sensor.hoymiles_rce_effective_discharge_power_percent')
                      | float(0))) | abs >= 0.5 }}
        then:
          # Freeze the requested 4306 value and the complete physical tuple.
          # The live optimizer target may legitimately move while the verified
          # full-block helper waits, so it must never redefine this ACK.
          - variables:
              rce_power_update_target: >-
                {{ states(
                     'sensor.hoymiles_rce_effective_discharge_power_percent')
                   | float(0) | round(1) }}
              rce_power_update_generation_before: >-
                {{ states(
                     'sensor.hoymiles_hit_ems_control_readback_generation') }}
              rce_power_update_expected_mode_code: >-
                {{ states('sensor.hoymiles_hit_ems_mode_readback_code')
                   | int(-1) }}
              rce_power_update_expected_self_use_soc: >-
                {{ states('sensor.hoymiles_hit_ems_self_use_soc_readback')
                   | float(-999) }}
              rce_power_update_expected_backup_soc: >-
                {{ states('sensor.hoymiles_hit_ems_backup_soc_readback')
                   | float(-999) }}
              rce_power_update_expected_force_charge_soc: >-
                {{ states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                   | float(-999) }}
              rce_power_update_expected_maximum_charge_power: >-
                {{ states(
                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                   | float(-999) }}
              rce_power_update_expected_force_discharge_soc: >-
                {{ states(
                     'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                   | float(-999) }}
          - action: script.hoymiles_verified_set_ems_maximum_discharge_power
            data:
              value: "{{ rce_power_update_target }}"
          - variables:
              rce_power_update_generation_after_helper: >-
                {{ states(
                     'sensor.hoymiles_hit_ems_control_readback_generation') }}
              rce_power_update_current_generation: >-
                {{ states(
                     'sensor.hoymiles_hit_ems_control_readback_generation') }}
          - variables:
              rce_power_update_helper_saw_new_generation: >-
                {% set current =
                  rce_power_update_generation_after_helper | float(-1) %}
                {% set baseline =
                  rce_power_update_generation_before | float(-1) %}
                {{ current > baseline
                   or (baseline >= 16000000 and current >= 1
                       and current < baseline) }}
              rce_power_update_full_block_current: &rce_power_update_full_block >-
                {{ rce_power_update_expected_mode_code | int(-1) == 5
                   and is_number(states(
                     'sensor.hoymiles_hit_ems_mode_readback_code'))
                   and (states('sensor.hoymiles_hit_ems_mode_readback_code')
                        | int(-1)) == 5
                   and is_number(states(
                     'sensor.hoymiles_hit_ems_self_use_soc_readback'))
                   and ((states(
                     'sensor.hoymiles_hit_ems_self_use_soc_readback')
                        | float(-999))
                     - (rce_power_update_expected_self_use_soc | float(-998)))
                       | abs < 0.5
                   and is_number(states(
                     'sensor.hoymiles_hit_ems_backup_soc_readback'))
                   and ((states(
                     'sensor.hoymiles_hit_ems_backup_soc_readback')
                        | float(-999))
                     - (rce_power_update_expected_backup_soc | float(-998)))
                       | abs < 0.5
                   and is_number(states(
                     'sensor.hoymiles_hit_ems_force_charge_soc_readback'))
                   and ((states(
                     'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                        | float(-999))
                     - (rce_power_update_expected_force_charge_soc
                        | float(-998))) | abs < 0.5
                   and is_number(states(
                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
                   and ((states(
                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                        | float(-999))
                     - (rce_power_update_expected_maximum_charge_power
                        | float(-998))) | abs < 0.05
                   and is_number(states(
                     'sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
                   and ((states(
                     'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                        | float(-999))
                     - (rce_power_update_expected_force_discharge_soc
                        | float(-998))) | abs < 0.5 }}
          - variables:
              rce_power_update_exact_ack_after_helper: &rce_power_update_exact_ack >-
                {% set current =
                  rce_power_update_current_generation | float(-1) %}
                {% set baseline =
                  rce_power_update_generation_before | float(-1) %}
                {% set newer = current > baseline
                  or (baseline >= 16000000 and current >= 1
                      and current < baseline) %}
                {{ newer
                   and rce_power_update_full_block_current | bool(false)
                   and is_number(states(
                     'sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
                   and ((states(
                     'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                        | float(-999))
                     - (rce_power_update_target | float(-998)))
                       | abs < 0.05 }}
          # The helper already spent at most 60 seconds waiting for exact ACK.
          # Keep the existing total horizon: use the second minute only to
          # observe a later physical generation or abort on a live hard-stop.
          - wait_template: >-
              {% set current = states(
                'sensor.hoymiles_hit_ems_control_readback_generation')
                | float(-1) %}
              {% set baseline =
                rce_power_update_generation_after_helper | float(-1) %}
              {% set newer = current > baseline
                or (baseline >= 16000000 and current >= 1
                    and current < baseline) %}
              {% set authorized =
                is_state('input_boolean.hoymiles_rce_discharge_active', 'on')
                and is_state(
                  'input_boolean.hoymiles_rce_discharge_enabled', 'on')
                and is_state(
                  'binary_sensor.hoymiles_sale_block_active', 'off')
                and is_state(
                  'binary_sensor.hoymiles_ems_export_allowed', 'on')
                and is_state(
                  'binary_sensor.hoymiles_rce_reserve_ready', 'on')
                and is_state(
                  'binary_sensor.hoymiles_rce_control_data_ready', 'on')
                and is_state(
                  'binary_sensor.hoymiles_ems_execution_ready', 'on')
                and is_state(
                  'binary_sensor.hoymiles_ems_control_conflict', 'off')
                and is_state(
                  'sensor.hoymiles_ems_hardware_mode', 'grid_discharge')
                and state_attr('sensor.hoymiles_ems_control_owner',
                               'owner_code') == 'rce'
                and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_planned')
                    | default(false, true)
                and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_continue_eligible')
                    is sameas true
                and as_timestamp(states(
                  'input_datetime.hoymiles_rce_latched_slot_end'), 0)
                    > as_timestamp(now())
                and is_state(
                  'input_boolean.hoymiles_battery_balancing_active', 'off')
                and is_state(
                  'input_boolean.hoymiles_discharge_cycle_active', 'off')
                and is_state(
                  'input_boolean.hoymiles_charge_cycle_active', 'off')
                and is_state(
                  'input_boolean.hoymiles_tariff_charge_active', 'off')
                and is_state(
                  'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                and is_state('input_boolean.hoymiles_rcm_active', 'off')
                and is_state(
                  'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                and is_state(
                  'input_boolean.hoymiles_rcm_export_control_active', 'off')
                and (is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state(
                       'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                and not is_state('timer.hoymiles_discharge', 'active')
                and not is_state('timer.hoymiles_charge', 'active') %}
              {{ rce_power_update_exact_ack_after_helper | bool(false)
                 or rce_power_update_helper_saw_new_generation | bool(false)
                 or newer or not authorized }}
            timeout: "00:01:00"
            continue_on_timeout: true
          - variables:
              rce_power_update_current_generation: >-
                {{ states(
                     'sensor.hoymiles_hit_ems_control_readback_generation') }}
              rce_power_update_live_safe_target: >-
                {{ states(
                     'sensor.hoymiles_rce_effective_discharge_power_percent') }}
              rce_power_update_physical_4306: >-
                {{ states(
                     'sensor.hoymiles_hit_ems_maximum_discharge_power_readback') }}
          - variables:
              rce_power_update_generation_newer_than_recovery: >-
                {% set current =
                  rce_power_update_current_generation | float(-1) %}
                {% set baseline =
                  rce_power_update_generation_after_helper | float(-1) %}
                {{ current > baseline
                   or (baseline >= 16000000 and current >= 1
                       and current < baseline) }}
              rce_power_update_full_block_current: *rce_power_update_full_block
              rce_power_update_live_authorized: >-
                {{ is_state(
                     'input_boolean.hoymiles_rce_discharge_active', 'on')
                   and is_state(
                     'input_boolean.hoymiles_rce_discharge_enabled', 'on')
                   and is_state(
                     'binary_sensor.hoymiles_sale_block_active', 'off')
                   and is_state(
                     'binary_sensor.hoymiles_ems_export_allowed', 'on')
                   and is_state(
                     'binary_sensor.hoymiles_rce_reserve_ready', 'on')
                   and is_state(
                     'binary_sensor.hoymiles_rce_control_data_ready', 'on')
                   and is_state(
                     'binary_sensor.hoymiles_ems_execution_ready', 'on')
                   and is_state(
                     'binary_sensor.hoymiles_ems_control_conflict', 'off')
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode', 'grid_discharge')
                   and state_attr('sensor.hoymiles_ems_control_owner',
                                  'owner_code') == 'rce'
                   and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                  'current_slot_planned')
                       | default(false, true)
                   and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                  'current_slot_continue_eligible')
                       is sameas true
                   and as_timestamp(states(
                     'input_datetime.hoymiles_rce_latched_slot_end'), 0)
                       > as_timestamp(now())
                   and is_state(
                     'input_boolean.hoymiles_battery_balancing_active', 'off')
                   and is_state(
                     'input_boolean.hoymiles_discharge_cycle_active', 'off')
                   and is_state(
                     'input_boolean.hoymiles_charge_cycle_active', 'off')
                   and is_state(
                     'input_boolean.hoymiles_tariff_charge_active', 'off')
                   and is_state(
                     'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                   and is_state(
                     'input_boolean.hoymiles_rcm_active', 'off')
                   and is_state(
                     'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                   and is_state(
                     'input_boolean.hoymiles_rcm_export_control_active', 'off')
                   and (is_state(
                          'input_boolean.hoymiles_rcm_enabled', 'off')
                        or is_state(
                          'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                   and not is_state('timer.hoymiles_discharge', 'active')
                   and not is_state('timer.hoymiles_charge', 'active')
                   and is_number(rce_power_update_live_safe_target)
                   and (rce_power_update_live_safe_target | float(0)) > 0 }}
          - variables:
              rce_power_update_exact_ack: *rce_power_update_exact_ack
              rce_power_update_within_live_safe_cap: >-
                {{ is_number(rce_power_update_physical_4306)
                   and is_number(rce_power_update_live_safe_target)
                   and (rce_power_update_physical_4306 | float(999))
                     <= (rce_power_update_live_safe_target | float(0)) + 0.5 }}
              rce_power_update_safe_under_command: >-
                {{ not rce_power_update_helper_saw_new_generation
                     | bool(false)
                   and rce_power_update_generation_newer_than_recovery
                     | bool(false)
                   and rce_power_update_full_block_current | bool(false)
                   and rce_power_update_live_authorized | bool(false)
                   and is_number(rce_power_update_physical_4306)
                   and (rce_power_update_physical_4306 | float(0)) > 0
                   and (rce_power_update_physical_4306 | float(999))
                     <= [rce_power_update_target | float(0),
                         rce_power_update_live_safe_target | float(0)]
                        | min + 0.5 }}
          # Only a telemetry blackout may defer one update. Fresh generations
          # that repeatedly mismatch are a proven actuator failure and roll
          # back. A lower value first seen after telemetry recovers remains
          # conservative under-delivery, not ACK of the requested increase.
          - if:
              - condition: template
                value_template: >-
                  {{ not (rce_power_update_exact_ack | bool(false)
                          and rce_power_update_live_authorized | bool(false)
                          and rce_power_update_within_live_safe_cap
                            | bool(false)) }}
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ rce_power_update_safe_under_command
                               | bool(false) }}
                    sequence:
                      - stop: >-
                          RCE keeps the freshly confirmed lower 4306 limit;
                          the update will be retried on the next trigger
                default:
                  - action: script.hoymiles_rollback_rce_transaction
                  - stop: >-
                      RCE was rolled back after an unconfirmed or unsafe
                      4306 limit update
      # Latch the complete contiguous run, not one half-hour row. This avoids
      # a Self-Use/Grid Discharge rollover at the boundary of adjacent slots.
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_ems_export_allowed
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_reserve_ready
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_control_data_ready
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_ems_control_conflict
                state: "off"
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "grid_discharge"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                'current_slot_planned')
                     | default(false, true) }}
              - condition: template
                value_template: >-
                 {{ as_timestamp(states(
                      'input_datetime.hoymiles_rce_latched_slot_end'), 0)
                      > as_timestamp(now())
                     and state_attr(
                       'sensor.hoymiles_hit_rce_optimized_plan',
                       'current_slot_continue_eligible') is sameas true }}
            sequence:
              - variables:
                  rce_live_authorization_checked: true
          - conditions:
              - condition: template
                value_template: *rce_pending_latched_execution_safe
            sequence:
              - stop: >-
                  RCE is synchronizing the plan cohort; the accepted active cycle remains unchanged
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
            sequence:
              - action: script.hoymiles_rollback_rce_transaction
              - stop: >-
                  Active RCE lost authorization before extending the execution window
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_enabled
            state: "on"
          - condition: state
            entity_id: binary_sensor.hoymiles_ems_control_conflict
            state: "off"
          # A current-run refresh is allowed to extend ownership only while
          # authoritative inputs remain committed and the physical inverter is
          # still executing Grid Discharge. This closes the mode:single wait
          # window in which an Off-Grid trigger can otherwise be dropped.
          - condition: state
            entity_id: binary_sensor.hoymiles_rce_control_data_ready
            state: "on"
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "grid_discharge"
          - condition: state
            entity_id: input_boolean.hoymiles_battery_balancing_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_discharge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_charge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "off"
          - condition: template
            value_template: >-
              {{ not is_state('timer.hoymiles_discharge', 'active')
                 and not is_state('timer.hoymiles_charge', 'active') }}
          - condition: template
            value_template: >-
              {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                            'current_slot_planned')
                 | default(false, true) }}
          - condition: template
            value_template: >-
              {% set end = as_timestamp(
                   state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                              'current_run_end'), 0) %}
              {{ end > as_timestamp(states(
                'input_datetime.hoymiles_rce_latched_slot_end'), 0) }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hoymiles_rce_latched_slot_end
            data:
              timestamp: >-
                {{ as_timestamp(
                     state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                'current_run_end')) }}

      # The Force Discharge floor is monotonic for the complete accepted run.
      # A colder LOAD/PV refresh may raise the protected SOC, but a later
      # optimistic refresh can never lower it before the latched deadline.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "grid_discharge"
          - condition: state
            entity_id: input_boolean.hoymiles_battery_balancing_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_discharge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_charge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_enabled
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "off"
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                 or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
          - condition: template
            value_template: >-
              {{ not is_state('timer.hoymiles_discharge', 'active')
                 and not is_state('timer.hoymiles_charge', 'active') }}
          - condition: state
            entity_id: binary_sensor.hoymiles_rce_control_data_ready
            state: "on"
          - condition: template
            value_template: >-
              {% set latched = states(
                   'input_number.hoymiles_rce_latched_minimum_soc') | float(0) %}
              {% set register = states(
                   'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
              {% set required = state_attr(
                   'sensor.hoymiles_hit_rce_optimized_plan',
                   'current_required_minimum_soc_percent') %}
              {% set safe = [latched, register,
                   required | float(latched)] | max | round(0, 'ceil') %}
              {{ is_number(states('sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
                 and safe > register + 0.5 }}
        then:
          - variables:
              rce_monotonic_minimum_soc: >-
                {% set latched = states(
                     'input_number.hoymiles_rce_latched_minimum_soc') | float(0) %}
                {% set register = states(
                     'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
                {% set required = state_attr(
                     'sensor.hoymiles_hit_rce_optimized_plan',
                     'current_required_minimum_soc_percent') %}
                {{ [latched, register,
                    required | float(latched)] | max | round(0, 'ceil') }}
          - action: input_number.set_value
            target:
              entity_id: input_number.hoymiles_rce_latched_minimum_soc
            data:
              value: "{{ rce_monotonic_minimum_soc | float(100) }}"
          # State triggers are dropped while this automation is `single`.
          # Therefore re-read both physical mode and source readiness directly
          # before the Modbus 4305 floor write, after the helper update above.
          - choose:
              - conditions:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_enabled
                    state: "on"
                  - condition: state
                    entity_id: binary_sensor.hoymiles_sale_block_active
                    state: "off"
                  - condition: state
                    entity_id: binary_sensor.hoymiles_ems_export_allowed
                    state: "on"
                  - condition: state
                    entity_id: binary_sensor.hoymiles_rce_reserve_ready
                    state: "on"
                  - condition: state
                    entity_id: binary_sensor.hoymiles_rce_control_data_ready
                    state: "on"
                  - condition: state
                    entity_id: binary_sensor.hoymiles_ems_control_conflict
                    state: "off"
                  - condition: state
                    entity_id: sensor.hoymiles_ems_hardware_mode
                    state: "grid_discharge"
                  - condition: template
                    value_template: >-
                      {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                    'current_slot_planned')
                         | default(false, true) }}
                  - condition: template
                    value_template: >-
                      {{ as_timestamp(states(
                           'input_datetime.hoymiles_rce_latched_slot_end'), 0)
                           > as_timestamp(now())
                         and state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'current_slot_continue_eligible') is sameas true }}
                sequence:
                  - action: script.hoymiles_verified_set_ems_force_discharge_soc
                    data:
                      value: "{{ rce_monotonic_minimum_soc | float(100) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(0))
                           - (rce_monotonic_minimum_soc | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(0))
                              - (rce_monotonic_minimum_soc | float(100)))
                              | abs >= 1.0 }}
                    then:
                      - if:
                          - condition: state
                            entity_id: sensor.hoymiles_ems_hardware_mode
                            state: "grid_discharge"
                        then:
                          - action: script.hoymiles_verified_set_ems_mode
                            data:
                              option: "self_use"
                      - wait_template: >-
                          {{ states('sensor.hoymiles_ems_hardware_mode')
                             not in ['grid_discharge', 'unknown', 'unavailable',
                                     'none', ''] }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: >-
                              {{ states('sensor.hoymiles_ems_hardware_mode')
                                 not in ['grid_discharge', 'unknown', 'unavailable',
                                         'none', ''] }}
                        then:
                          - action: script.hoymiles_rollback_rce_transaction
              - conditions:
                  - condition: template
                    value_template: *rce_pending_latched_execution_safe
                sequence:
                  - stop: >-
                      RCE is synchronizing the plan cohort; the accepted active cycle remains unchanged
            default:
              - action: script.hoymiles_rollback_rce_transaction
              - stop: >-
                  Active RCE lost authorization before writing the SOC threshold
      - choose:
          # Battery balancing ustawia własny tryb i nie może zostać
          # przerwane przez aktywny wcześniej blok RCE.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_rce_transaction

          # Jeśli w trakcie pracy RCE uruchomiono ręczny timer, automatyka RCE
          # oddaje mu control i nie zmienia ustawionego przez niego trybu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.hoymiles_discharge_cycle_active
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.hoymiles_charge_cycle_active
                    state: "on"
            sequence:
              - action: script.hoymiles_rollback_rce_transaction

          # Start RCE: the current slot is planned, SOC reserve is available, and
          # no manual cycle is active.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_export_control_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state(
                       'input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_control_data_ready
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_price_above_threshold
                state: "on"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                'current_slot_planned')
                     | default(false, true)
                     and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                    'current_slot_start_eligible')
                     | default(false, true) }}
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_reserve_ready
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                    'sensor.hoymiles_rce_effective_discharge_power_percent'))
                     and (states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent')
                       | float(0)) > 0
                     and is_number(states(
                       'sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
                     and is_number(states(
                       'sensor.hoymiles_hit_ems_force_discharge_soc_readback')) }}
              - condition: template
                value_template: >-
                  {{ (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                     > (states('sensor.hoymiles_rce_effective_minimum_soc') | float(100)) }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not is_state('timer.hoymiles_discharge', 'active')
                     and not is_state('timer.hoymiles_charge', 'active')
                     and states('sensor.hoymiles_ems_hardware_mode')
                       not in ['off_grid', 'unknown', 'unavailable', 'none'] }}
              # Never start a late, sub-five-minute fragment after a restart or
              # delayed plan refresh. This supplies the minimum EMS dwell time.
              - condition: template
                value_template: >-
                  {% set end = as_timestamp(state_attr(
                       'sensor.hoymiles_hit_rce_optimized_plan',
                       'current_slot_end'), 0) %}
                  {% set remaining = state_attr(
                       'sensor.hoymiles_hit_rce_optimized_plan',
                       'current_slot_remaining_minutes') | float(0) %}
                  {{ end - as_timestamp(now()) >= 300 and remaining >= 5 }}
            sequence:
              - variables:
                  rce_start_minimum_soc: >-
                    {% set required = state_attr(
                         'sensor.hoymiles_hit_rce_optimized_plan',
                         'current_required_minimum_soc_percent')
                         | float(states(
                           'sensor.hoymiles_rce_effective_minimum_soc')) %}
                    {% set register = states(
                         'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
                    {{ [required, register] | max | round(0, 'ceil') }}
                  rce_start_run_end: >-
                    {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                  'current_run_end') }}
                  rce_start_power: >-
                    {{ states(
                      'sensor.hoymiles_rce_effective_discharge_power_percent')
                       | float(0) }}
                  # This is the authoritative total battery-discharge target
                  # accepted by the optimizer for this exact start transaction.
                  # Later forecast refreshes must not move the physical ACK.
                  rce_start_expected_power_kw: >-
                    {{ state_attr(
                      'sensor.hoymiles_hit_rce_optimized_plan',
                      'current_slot_execution_discharge_power_kw') }}
              - condition: template
                value_template: >-
                  {{ is_number(rce_start_expected_power_kw)
                     and (rce_start_expected_power_kw | float(0)) >= 1.0 }}
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_rce_latched_slot_end
                data:
                  timestamp: >-
                    {{ as_timestamp(rce_start_run_end) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_latched_minimum_soc
                data:
                  value: "{{ rce_start_minimum_soc | float(100) }}"
              # Snapshot both shared registers and claim durable RCE ownership
              # before the first Modbus setting write. An abort restores this
              # exact baseline and never exposes an unowned changed register.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_saved_max_discharge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                       | float(100) | round(1) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_saved_force_discharge_soc
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                       | float(20) | round(0) }}
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_active
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback') | float(0))
                           - (rce_start_power | float(0))) | abs >= 0.5 }}
                then:
                  - action: script.hoymiles_verified_set_ems_maximum_discharge_power
                    data:
                      value: "{{ rce_start_power | float(0) | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (rce_start_power | float(0)))
                           | abs < 0.5 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                               | float(-999)) - (rce_start_power | float(0)))
                               | abs >= 0.5 }}
                    then:
                      - action: script.hoymiles_rollback_rce_transaction
                      - stop: "The inverter did not confirm the RCE discharging limit"
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0))
                         - (rce_start_minimum_soc | float(100))) | abs >= 1.0 }}
                then:
                  # The 4306 ACK above may outlive this start decision. Re-read
                  # authoritative readiness and physical mode immediately
                  # before the paired 4305 operational write.
                  - choose:
                      - conditions:
                          - condition: state
                            entity_id: input_boolean.hoymiles_rce_discharge_active
                            state: "on"
                          - condition: state
                            entity_id: input_boolean.hoymiles_rce_discharge_enabled
                            state: "on"
                          - condition: state
                            entity_id: binary_sensor.hoymiles_ems_control_conflict
                            state: "off"
                          - condition: state
                            entity_id: binary_sensor.hoymiles_rce_control_data_ready
                            state: "on"
                          - condition: state
                            entity_id: binary_sensor.hoymiles_sale_block_active
                            state: "off"
                          - condition: state
                            entity_id: binary_sensor.hoymiles_ems_export_allowed
                            state: "on"
                          - condition: state
                            entity_id: binary_sensor.hoymiles_rce_reserve_ready
                            state: "on"
                          - condition: template
                            value_template: >-
                              {{ state_attr(
                                   'sensor.hoymiles_hit_rce_optimized_plan',
                                   'current_slot_planned')
                                   | default(false, true)
                                 and state_attr(
                                   'sensor.hoymiles_hit_rce_optimized_plan',
                                   'current_slot_start_eligible')
                                   | default(false, true)
                                 and as_timestamp(state_attr(
                                   'sensor.hoymiles_hit_rce_optimized_plan',
                                   'current_slot_end'), 0)
                                   - as_timestamp(now()) >= 300 }}
                          - condition: template
                            value_template: >-
                              {{ states('sensor.hoymiles_ems_hardware_mode')
                                   not in ['off_grid', 'unknown', 'unavailable',
                                           'none', ''] }}
                        sequence:
                          - action: >-
                              script.hoymiles_verified_set_ems_force_discharge_soc
                            data:
                              value: >-
                                {{ rce_start_minimum_soc | float(100) }}
                    default:
                      - action: script.hoymiles_rollback_rce_transaction
                      - stop: >-
                          RCE start stopped before the next operational write
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(0))
                          - (rce_start_minimum_soc | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(-999))
                              - (rce_start_minimum_soc | float(100)))
                              | abs >= 1.0 }}
                    then:
                      - action: script.hoymiles_rollback_rce_transaction
                      - stop: "The inverter did not confirm the RCE SOC threshold"
              # Final, fresh interlock after every owned Modbus setting
              # readback. Failure is a rollback transaction, never an implicit
              # condition abort that could orphan changed registers.
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: binary_sensor.hoymiles_ems_control_conflict
                        state: "off"
                      - condition: template
                        value_template: >-
                          {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
                          {% set plan_reported = plan.last_reported
                               if plan.last_reported is defined else plan.last_updated %}
                          {% set soc = states.sensor.hoymiles_hit_overview_battery_soc %}
                          {% set soc_reported = soc.last_reported
                               if soc.last_reported is defined else soc.last_updated %}
                          {% set floor = states.sensor.hoymiles_hit_ems_force_discharge_soc_readback %}
                          {% set floor_reported = floor.last_reported
                               if floor.last_reported is defined else floor.last_updated %}
                          {% set plan_age = as_timestamp(now())
                               - as_timestamp(plan_reported, 0) %}
                          {% set soc_age = as_timestamp(now())
                               - as_timestamp(soc_reported, 0) %}
                          {% set floor_age = as_timestamp(now())
                               - as_timestamp(floor_reported, 0) %}
                          {% set fresh_required = state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_required_minimum_soc_percent') %}
                          {{ plan_age >= 0 and plan_age <= 120
                             and soc_age >= 0 and soc_age <= 120
                             and floor_age >= 0 and floor_age <= 120
                             and is_number(fresh_required)
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_active', 'on')
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_enabled', 'on')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_active', 'off')
                             and is_state('input_boolean.hoymiles_rcm_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                             and (is_state(
                               'input_boolean.hoymiles_rcm_enabled', 'off')
                                  or is_state(
                                    'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                             and is_state(
                               'input_boolean.hoymiles_battery_balancing_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_discharge_cycle_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_charge_cycle_active', 'off')
                             and is_state(
                               'binary_sensor.hoymiles_rce_control_data_ready', 'on')
                             and is_state(
                               'binary_sensor.hoymiles_ems_export_allowed', 'on')
                             and is_state(
                               'binary_sensor.hoymiles_sale_block_active', 'off')
                             and is_state(
                               'binary_sensor.hoymiles_rce_reserve_ready', 'on')
                             and state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_planned') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_start_eligible')
                               | default(false, true)
                             and as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_end'), 0) - as_timestamp(now()) >= 300
                             and as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_run_end'), 0) >= as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_end'), 0)
                             and is_number(states(
                               'sensor.hoymiles_rce_effective_discharge_power_percent'))
                             and (states(
                               'sensor.hoymiles_rce_effective_discharge_power_percent')
                               | float(0)) > 0
                             and ((states(
                               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                               | float(0)) - (rce_start_power | float(0)))
                               | abs < 0.5
                             and is_number(states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
                             and (states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(-1)) >= (fresh_required | float(100))
                             and is_number(states(
                               'sensor.hoymiles_hit_overview_battery_soc'))
                             and (states(
                               'sensor.hoymiles_hit_overview_battery_soc')
                               | float(0)) > (fresh_required | float(100))
                             and not is_state(
                               'timer.hoymiles_discharge', 'active')
                             and not is_state('timer.hoymiles_charge', 'active')
                             and states('sensor.hoymiles_ems_hardware_mode')
                               not in ['off_grid', 'unknown', 'unavailable',
                                       'none', ''] }}
                    sequence:
                      - delay: "00:00:01"
                default:
                  - action: script.hoymiles_rollback_rce_transaction
                  - stop: "Safe Grid Discharge start conditions expired"
              # Ownership is already active, so the first export sample and
              # every setting written above belong to the same transaction.
              - variables:
                  rce_parallel_generation_before_mode: >-
                    {{ states(
                      'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation')
                       | float(-1) }}
                  rce_response_transaction_id: >-
                    {{ now().strftime('%Y%m%dT%H%M%S.%f%z') }}-rce
                  rce_response_transaction_started_epoch: >-
                    {{ as_timestamp(now()) }}
                  rce_latched_machine_type: >-
                    {{ states('sensor.hoymiles_hit_machines_type') | int(-1) }}
                  rce_latched_inverter_count: >-
                    {{ states(
                      'sensor.hoymiles_hit_number_of_machines_master_and_slave')
                       | int(-1) }}
                  rce_latched_esp_uptime_seconds: >-
                    {{ states('sensor.hoymiles_hit_esp_uptime') | float(-1) }}
                  rce_latched_esp_uptime_reported_epoch: >-
                    {% set item = states.sensor.hoymiles_hit_esp_uptime %}
                    {{ as_timestamp(item.last_reported
                         if item.last_reported is defined
                         else item.last_updated, 0) }}
              - variables:
                  rce_topology_known: >-
                    {{ ((rce_latched_machine_type | int(-1)) == 0
                         and (rce_latched_inverter_count | int(-1)) == 1)
                       or ((rce_latched_machine_type | int(-1)) == 1
                           and (rce_latched_inverter_count | int(-1)) >= 2
                           and (rce_latched_inverter_count | int(-1)) <= 10) }}
                  rce_requires_parallel_proof: >-
                    {{ (rce_latched_machine_type | int(-1)) == 1
                       and (rce_latched_inverter_count | int(-1)) >= 2
                       and (rce_latched_inverter_count | int(-1)) <= 10 }}
                  rce_esp_uptime_ready: >-
                    {% set age =
                      (rce_response_transaction_started_epoch | float(0))
                      - (rce_latched_esp_uptime_reported_epoch | float(0)) %}
                    {{ (rce_latched_esp_uptime_seconds | float(-1)) >= 180
                       and age >= -5 and age <= 180 }}
              # Freeze topology before Mode 5; unknown is fail-closed.
              - condition: template
                value_template: "{{ rce_topology_known | bool(false) }}"
              - condition: template
                value_template: "{{ rce_esp_uptime_ready | bool(false) }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_discharge"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                timeout: "00:01:00"
                continue_on_timeout: true
              - action: >-
                  script.hoymiles_verify_parallel_aggregate_discharge_response
                continue_on_error: true
                data:
                  transaction_id: "{{ rce_response_transaction_id }}"
                  transaction_started_epoch: >-
                    {{ rce_response_transaction_started_epoch }}
                  baseline_generation: >-
                    {{ rce_parallel_generation_before_mode }}
                  latched_esp_uptime_seconds: >-
                    {{ rce_latched_esp_uptime_seconds }}
                  owner: rce
                  latched_machine_type: "{{ rce_latched_machine_type }}"
                  latched_inverter_count: "{{ rce_latched_inverter_count }}"
                  topology_known: "{{ rce_topology_known }}"
                  requires_parallel_proof: "{{ rce_requires_parallel_proof }}"
                  expected_power_kw: >-
                    {{ rce_start_expected_power_kw }}
                  authoritative_expected_power: true
              # On a parallel Master, RCE owns an authoritative, frozen kW
              # target and therefore fails closed on missing, wrong-direction,
              # unstable or out-of-tolerance aggregate physical evidence.
              - if:
                  - condition: template
                    value_template: >-
                      {% set correlated =
                        is_state(
                          'sensor.hoymiles_parallel_aggregate_physical_response',
                          'confirmed')
                        and state_attr(
                          'sensor.hoymiles_parallel_aggregate_physical_response',
                          'transaction_id') == rce_response_transaction_id
                        and state_attr(
                          'sensor.hoymiles_parallel_aggregate_physical_response',
                          'owner') == 'rce'
                        and as_timestamp(state_attr(
                          'sensor.hoymiles_parallel_aggregate_physical_response',
                          'completed_at'), 0)
                            >= (rce_response_transaction_started_epoch
                                | float(0)) %}
                      {{ not rce_topology_known | bool(false)
                         or (rce_requires_parallel_proof | bool(false)
                             and not correlated) }}
                then:
                  - action: script.hoymiles_rollback_rce_transaction
                  - stop: >-
                      RCE did not receive a matching aggregate power response
              # A successful mode ACK is not permission to accept an obsolete
              # transaction. After aggregate physical confirmation, re-evaluate
              # the live continuation contract; new-start eligibility no longer
              # applies once Grid Discharge has been physically accepted.
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: binary_sensor.hoymiles_ems_control_conflict
                        state: "off"
                      - condition: state
                        entity_id: input_boolean.hoymiles_rce_discharge_active
                        state: "on"
                      - condition: state
                        entity_id: input_boolean.hoymiles_rce_discharge_enabled
                        state: "on"
                      # The parallel-response helper can outlive a normal
                      # one-minute optimizer refresh. Accept either a current
                      # result or the already latched execution contract while
                      # every independent live hard stop remains clear.
                      - condition: or
                        conditions:
                          - condition: state
                            entity_id: >-
                              binary_sensor.hoymiles_rce_control_data_ready
                            state: "on"
                          - condition: template
                            value_template: *rce_pending_latched_execution_safe
                      - condition: state
                        entity_id: binary_sensor.hoymiles_ems_export_allowed
                        state: "on"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_sale_block_active
                        state: "off"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_rce_reserve_ready
                        state: "on"
                      - condition: state
                        entity_id: sensor.hoymiles_ems_hardware_mode
                        state: "grid_discharge"
                      - condition: template
                        value_template: >-
                          {% set plan =
                            states.sensor.hoymiles_hit_rce_optimized_plan %}
                          {% set plan_reported = plan.last_reported
                            if plan.last_reported is defined else plan.last_updated %}
                          {% set soc =
                            states.sensor.hoymiles_hit_overview_battery_soc %}
                          {% set soc_reported = soc.last_reported
                            if soc.last_reported is defined else soc.last_updated %}
                          {% set floor = states.sensor
                            .hoymiles_hit_ems_force_discharge_soc_readback %}
                          {% set floor_reported = floor.last_reported
                            if floor.last_reported is defined else floor.last_updated %}
                          {% set required = state_attr(
                            'sensor.hoymiles_hit_rce_optimized_plan',
                            'current_required_minimum_soc_percent') %}
                          {{ as_timestamp(now()) - as_timestamp(
                               plan_reported, 0) <= 120
                             and as_timestamp(now()) - as_timestamp(
                               plan_reported, 0) >= 0
                             and as_timestamp(now()) - as_timestamp(
                               soc_reported, 0) <= 120
                             and as_timestamp(now()) - as_timestamp(
                               soc_reported, 0) >= 0
                             and as_timestamp(now()) - as_timestamp(
                               floor_reported, 0) <= 120
                             and as_timestamp(now()) - as_timestamp(
                               floor_reported, 0) >= 0
                             and is_number(required)
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_active', 'off')
                             and (is_state(
                               'input_boolean.hoymiles_rcm_enabled', 'off')
                               or is_state(
                                 'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                             and is_state(
                               'input_boolean.hoymiles_rcm_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_export_control_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_battery_balancing_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_discharge_cycle_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_charge_cycle_active', 'off')
                             and not is_state('timer.hoymiles_discharge', 'active')
                             and not is_state('timer.hoymiles_charge', 'active')
                             and state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_planned') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_continue_eligible') is sameas true
                             and as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_end'), 0) > as_timestamp(now())
                             and as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_run_end'), 0) >= as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_end'), 0)
                             and is_number(states(
                               'sensor.hoymiles_rce_effective_discharge_power_percent'))
                             and (states(
                               'sensor.hoymiles_rce_effective_discharge_power_percent')
                               | float(0)) > 0
                             and ((states(
                               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                               | float(-999)) - (rce_start_power | float(0)))
                               | abs < 0.5
                             and is_number(states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
                             and (states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(-1)) >= (required | float(100))
                             and is_number(states(
                               'sensor.hoymiles_hit_overview_battery_soc'))
                             and (states(
                               'sensor.hoymiles_hit_overview_battery_soc')
                               | float(0)) > (required | float(100)) }}
                    sequence:
                      - delay: "00:00:01"
                default:
                  - action: script.hoymiles_rollback_rce_transaction
                  - stop: "RCE authorization lost after Grid Discharge ACK"

          # A recalculation withdraws planning authority but does not revoke an
          # already latched execution contract while all live hard stops remain
          # clear. The shared predicate is re-evaluated here after every prior
          # yielded action; it never trusts the unavailable derived power helper.
          - conditions:
              - condition: template
                value_template: *rce_pending_latched_execution_safe
            sequence:
              - stop: >-
                  RCE is synchronizing the plan cohort; the accepted active cycle remains unchanged

          # Stop RCE: the slot left the plan, minimum SOC was reached, automation
          # was disabled, or PSE data became unavailable.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
                     or is_state('binary_sensor.hoymiles_sale_block_active', 'on')
                     or is_state('binary_sensor.hoymiles_rce_reserve_ready', 'off')
                     or not is_number(states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent'))
                     or (states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent')
                       | float(0)) <= 0
                     or state_attr(
                          'sensor.hoymiles_hit_rce_optimized_plan',
                          'current_slot_continue_eligible') is not sameas true
                     or (is_number(state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'current_price_pln_kwh'))
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'automatic_price_floor_pln_kwh'))
                         and (state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'current_price_pln_kwh') | float(0))
                           < (state_attr(
                             'sensor.hoymiles_hit_rce_optimized_plan',
                             'automatic_price_floor_pln_kwh') | float(0)))
                     or as_timestamp(now()) >= as_timestamp(states(
                          'input_datetime.hoymiles_rce_latched_slot_end'), 0)
                     or (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                        <= (states(
                          'input_number.hoymiles_rce_latched_minimum_soc')
                          | float(100))
                     or (not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_discharge')
                         and (as_timestamp(now()) - as_timestamp(
                           states.sensor.hoymiles_ems_hardware_mode.last_changed))
                           >= 60) }}
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              - action: script.hoymiles_rollback_rce_transaction

  - id: hoymiles_automatic_ems_control_failsafe
    alias: "EMS — safe exit after data or acknowledgement loss"
    description: >-
      An active RCE or tariff cycle returns to Self-Use after two minutes
      of continuous loss of data, Master/Slave readiness, or export permission.
      When the EMS entity is unavailable, ownership remains active and the attempt is
      retried every minute after connectivity is restored.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: binary_sensor.hoymiles_ems_execution_ready
        to: "off"
        for: "00:02:00"
      - trigger: state
        entity_id: binary_sensor.hoymiles_rce_control_data_ready
        to: "off"
        for: "00:02:00"
      - trigger: state
        entity_id: binary_sensor.hoymiles_tariff_control_data_ready
        to: "off"
        for: "00:02:00"
      - trigger: state
        entity_id: binary_sensor.hoymiles_ems_export_allowed
        to: "off"
        for: "00:00:15"
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "on"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'binary_sensor.hoymiles_ems_export_allowed', 'on')
                     or (not is_state(
                           'binary_sensor.hoymiles_rce_control_data_ready', 'on')
                         and (as_timestamp(now()) - as_timestamp(
                           states.binary_sensor.hoymiles_rce_control_data_ready
                             .last_changed)) >= 120) }}
              - condition: not
                conditions:
                  - condition: template
                    value_template: *rce_pending_latched_execution_safe
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['unknown', 'unavailable', 'none', ''] }}
            sequence:
              - action: script.hoymiles_rollback_rce_transaction

          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'binary_sensor.hoymiles_tariff_control_data_ready', 'on')
                     and (as_timestamp(now()) - as_timestamp(
                       states.binary_sensor.hoymiles_tariff_control_data_ready
                         .last_changed)) >= 120 }}
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['unknown', 'unavailable', 'none', ''] }}
            sequence:
              - action: script.hoymiles_rollback_tariff_transaction

  - id: hoymiles_daily_grid_discharge
    alias: "EMS — daily discharge do sieci"
    description: "Uruchamia discharge codziennie o godzinie ustawionej na dashboardzie."
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hoymiles_discharge_start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_schedule_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
