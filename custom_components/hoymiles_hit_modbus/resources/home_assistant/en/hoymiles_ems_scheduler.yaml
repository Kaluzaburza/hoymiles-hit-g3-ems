                        timeout: "00:01:00"
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: >-
                              {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                        then:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: >-
                                input_boolean.hoymiles_rcm_export_control_active
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'charge_actuator_data_fresh')
                               | default(false, true)
                             and ((states(
                               'sensor.hoymiles_hit_battery_max_charge_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_battery_charge_power')
                               | float(100))) | abs < 1.0
                             and is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'off') }}
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.hoymiles_rcm_active

  - id: hoymiles_rcm_pre_discharge_control
    alias: "RCEm 253 V+ — morning battery-headroom preparation"
    description: >-
      Before today's high-voltage window, it discharges to the grid only
      the energy that the home will not consume beforehand and that is required as
      headroom for the forecast PV surplus. Power is selected from the energy amount
      and available time. It never goes below protected SOC and respects
      the export lockout, BMS limit and existing export cap. It changes neither
      GCF nor Maximum Export Power Limit.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_rcm_shadow_mode
          - input_boolean.hoymiles_rcm_pre_discharge_enabled
          - input_boolean.hoymiles_rcm_active
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - binary_sensor.hoymiles_sale_block_active
          - sensor.hoymiles_ems_hardware_mode
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_hit_rcm_voltage_plan
          - number.hoymiles_hit_maximum_export_power_limit
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          plan_status: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'status_code') | default('missing_data', true) }}
          result_current: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'result_current') | default(false, true) }}
          pre_discharge_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_ready') | default(false, true) }}
          pre_discharge_start_eligible: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_start_eligible')
               | default(false, true) }}
          pre_discharge_continue_eligible: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_continue_eligible')
               | default(false, true) }}
          pre_discharge_transaction_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_transaction_ready')
               | default(false, true) }}
          pre_discharge_deadline: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_deadline') }}
          target_soc: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_target_soc_percent') | float(100) }}
          power_percent: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_power_percent') | float(0) }}
          maximum_voltage: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'maximum_voltage_v') | float(999) }}
          rolling_voltage: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'rolling_10m_voltage_v') | float(999) }}
          prediction_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'prediction_ready') | default(false, true) }}
          voltage_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'voltage_data_fresh') | default(false, true) }}
          pre_discharge_actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_actuator_data_fresh')
               | default(false, true) }}
          discharge_registers_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'discharge_registers_data_fresh')
               | default(false, true) }}
          ems_mode_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'ems_mode_data_fresh') | default(false, true) }}
          rcm_plan_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_rcm_voltage_plan %}
            {% set reported = item.last_reported
              if item.last_reported is defined else item.last_updated %}
            {{ as_timestamp(now()) - as_timestamp(reported, 0) }}
          forecast_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'forecast_data_fresh') | default(false, true) }}
          history_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'history_data_fresh') | default(false, true) }}
          live_power_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'live_power_data_fresh') | default(false, true) }}
          bms_discharge_available: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'bms_discharge_available') | default(false, true) }}
          bms_discharge_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'bms_discharge_data_fresh') | default(false, true) }}
          gcf_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'gcf_data_fresh') | default(false, true) }}
          export_available: >-
            {% set gcf = states(
              'sensor.hoymiles_hit_gcf_enable_readback_code') %}
            {% set limit = states(
              'sensor.hoymiles_hit_gcf_maximum_export_power_readback') %}
            {{ gcf_data_fresh
               and is_state('binary_sensor.hoymiles_ems_export_allowed', 'on')
               and ((gcf | int(-1)) == 0
                    or ((gcf | int(-1)) == 1
                        and is_number(limit)
                        and (limit | float(0)) > 0)) }}
          pre_discharge_blocked: >-
            {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
               or is_state('input_boolean.hoymiles_rce_discharge_active', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_active', 'on')
               or is_state('input_boolean.hoymiles_battery_balancing_active', 'on')
               or is_state('input_boolean.hoymiles_discharge_cycle_active', 'on')
               or is_state('input_boolean.hoymiles_charge_cycle_active', 'on')
               or is_state('timer.hoymiles_discharge', 'active')
               or is_state('timer.hoymiles_charge', 'active')
               or is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - choose:
          # Każde naruszenie warunków natychmiast kończy tylko cykl należący do
          # RCEm i odtwarza dokładnie nastawy zastane przed jego rozpoczęciem.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on')
                     or is_state(
                       'input_boolean.hoymiles_rcm_pre_discharge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_active', 'off')
                     or pre_discharge_blocked
                     or is_state('binary_sensor.hoymiles_sale_block_active', 'on')
                     or rcm_plan_age_seconds < 0
                     or rcm_plan_age_seconds > 60
                     or not pre_discharge_continue_eligible
                     or not voltage_data_fresh
                     or not pre_discharge_actuator_data_fresh
                     or not bms_discharge_data_fresh
                     or not bms_discharge_available
                     or not export_available
                     or maximum_voltage >= 248.4
                     or as_timestamp(now()) >= as_timestamp(states(
                       'input_datetime.hoymiles_rcm_latched_pre_discharge_deadline'),
                       0)
                     or (states('sensor.hoymiles_hit_overview_battery_soc')
                         | float(0)) <= (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100)) + 0.5
                     or ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_power')
                           | float(0))) | abs >= 1.0
                     or ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100))) | abs >= 1.0
                     or not is_state(
                       'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
            sequence:
              - if:
                  - condition: state
                    entity_id: sensor.hoymiles_ems_hardware_mode
                    state: "grid_discharge"
                  - condition: template
                    value_template: >-
                      {{ ems_mode_data_fresh
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ discharge_registers_data_fresh
                         and is_number(states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_ems_maximum_discharge_power
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_max_discharge_power')
                           | float(100) | round(1) }}
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_max_discharge_power')
                           | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ discharge_registers_data_fresh
                         and is_number(states(
                           'sensor.hoymiles_hit_ems_force_discharge_soc_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_ems_force_discharge_soc
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_force_discharge_soc')
                           | float(20) | round(0) }}
                  - wait_template: >-
                      {{ ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_force_discharge_soc')
                           | float(20))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              # Keep ownership until mode and both Modbus values are positively
              # read back. A stale/unavailable actuator is retried next minute.
              - if:
                  - condition: template
                    value_template: >-
                      {{ discharge_registers_data_fresh
                         and states('sensor.hoymiles_ems_hardware_mode')
                           in ['self_use', 'off_grid']
                         and ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_max_discharge_power')
                           | float(100))) | abs < 1.0
                         and ((states(
                           'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_force_discharge_soc')
                           | float(20))) | abs < 1.0 }}
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: >-
                        input_boolean.hoymiles_rcm_pre_discharge_active

          # Rozpoczęcie jest dozwolone wyłącznie dla dzisiejszego okna ryzyka,
          # przy bezpiecznym napięciu, aktywnym eksporcie i poza blokadą sprzedaży.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_shadow_mode
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_ems_execution_ready
                state: "on"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "self_use"
              - condition: template
                value_template: >-
                  {{ not pre_discharge_blocked
                     and result_current
                     and rcm_plan_age_seconds >= 0
                     and rcm_plan_age_seconds <= 60
                     and pre_discharge_start_eligible
                     and pre_discharge_transaction_ready
                     and prediction_ready
                     and voltage_data_fresh
                     and pre_discharge_actuator_data_fresh
                     and forecast_data_fresh
                     and history_data_fresh
                     and live_power_data_fresh
                     and bms_discharge_data_fresh
                     and bms_discharge_available
                     and export_available
                     and maximum_voltage < 248.4
                     and power_percent >= 1
                     and target_soc >= 0
                     and as_timestamp(pre_discharge_deadline, 0)
                         - as_timestamp(now()) >= 300
                     and is_number(states(
                       'sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
                     and is_number(states(
                       'sensor.hoymiles_hit_ems_force_discharge_soc_readback')) }}
            sequence:
              # Freeze the complete accepted run before the first Modbus
              # write. Later forecast refreshes cannot move its SOC/deadline.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_latched_pre_discharge_target_soc
                data:
                  value: "{{ target_soc | round(0, 'ceil') }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_latched_pre_discharge_power
                data:
                  value: "{{ power_percent | round(1) }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_rcm_latched_pre_discharge_deadline
                data:
                  timestamp: "{{ as_timestamp(pre_discharge_deadline) }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_max_discharge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                       | float(100) | round(1) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_force_discharge_soc
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                       | float(20) | round(0) }}
              # Ownership begins before the first Modbus write. If any later
              # interlock/readback fails, the restore is retried on every run.
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
              - action: script.hoymiles_verified_set_ems_maximum_discharge_power
                data:
                  value: >-
                    {{ states(
                      'input_number.hoymiles_rcm_latched_pre_discharge_power')
                       | float(0) | round(1) }}
              - wait_template: >-
                  {{ ((states(
                       'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                       | float(-999)) - (states(
                       'input_number.hoymiles_rcm_latched_pre_discharge_power')
                       | float(0))) | abs < 1.0 }}
                timeout: "00:01:00"
                continue_on_timeout: true
              # The 4306 acknowledgement can consume the whole single-mode
              # run. Re-evaluate live blockers and source provenance before the
              # paired 4305 write instead of reusing pre_discharge_blocked.
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {% set plan =
                            states.sensor.hoymiles_hit_rcm_voltage_plan %}
                          {% set reported = plan.last_reported
                            if plan.last_reported is defined else plan.last_updated %}
                          {% set age = as_timestamp(now())
                            - as_timestamp(reported, 0) %}
                          {% set gcf = states(
                            'sensor.hoymiles_hit_gcf_enable_readback_code') %}
                          {% set export_limit = states(
                            'sensor.hoymiles_hit_gcf_maximum_export_power_readback') %}
                          {% set target = states(
                            'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                            | float(100) %}
                          {% set power = states(
                            'input_number.hoymiles_rcm_latched_pre_discharge_power')
                            | float(0) %}
                          {{ age >= 0 and age <= 60
                             and is_state(
                               'binary_sensor.hoymiles_ems_execution_ready', 'on')
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'result_current') | default(false, true)
                             and is_state(
                               'input_boolean.hoymiles_rcm_enabled', 'on')
                             and is_state(
                               'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_pre_discharge_enabled',
                               'on')
                             and is_state(
                               'input_boolean.hoymiles_rcm_active', 'on')
                             and is_state(
                               'input_boolean.hoymiles_rcm_pre_discharge_active',
                               'on')
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_battery_balancing_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_discharge_cycle_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_charge_cycle_active', 'off')
                             and not is_state('timer.hoymiles_discharge', 'active')
                             and not is_state('timer.hoymiles_charge', 'active')
                             and is_state(
                               'binary_sensor.hoymiles_sale_block_active', 'off')
                             and is_state(
                               'sensor.hoymiles_ems_hardware_mode', 'self_use')
                             and is_number(states(
                               'sensor.hoymiles_hit_ems_mode_readback_code'))
                             and (states(
                               'sensor.hoymiles_hit_ems_mode_readback_code')
                               | int(-1)) != 3
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'pre_discharge_continue_eligible')
                               | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'prediction_ready') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'voltage_data_fresh') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'pre_discharge_actuator_data_fresh')
                               | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'forecast_data_fresh') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'history_data_fresh') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'live_power_data_fresh') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'bms_discharge_data_fresh') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'bms_discharge_available') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'gcf_data_fresh') | default(false, true)
                             and is_state(
                               'binary_sensor.hoymiles_ems_export_allowed', 'on')
                             and ((gcf | int(-1)) == 0
                               or ((gcf | int(-1)) == 1
                                 and is_number(export_limit)
                                 and (export_limit | float(0)) > 0))
                             and (state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'maximum_voltage_v') | float(999)) < 248.4
                             and as_timestamp(states(
                               'input_datetime.hoymiles_rcm_latched_pre_discharge_deadline'),
                               0) - as_timestamp(now()) >= 300
                             and (states(
                               'sensor.hoymiles_hit_overview_battery_soc')
                               | float(0)) > target + 0.5
                             and ((states(
                               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                               | float(-999)) - power) | abs < 1.0 }}
                    sequence:
                      - action: script.hoymiles_verified_set_ems_force_discharge_soc
                        data:
                          value: >-
                            {{ states(
                              'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                               | float(100) | round(0) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                               | float(100))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                default:
                  - delay: "00:00:01"

              # Ownership is already active here, so the sensor intentionally
              # exposes continue_eligible (not start_eligible). The frozen
              # target/deadline and live register readbacks remain authoritative.
              - variables:
                  rcm_parallel_generation_before_mode: >-
                    {{ states(
                      'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation')
                       | float(-1) }}
                  rcm_response_transaction_id: >-
                    {{ now().strftime('%Y%m%dT%H%M%S.%f%z') }}-rcm
                  rcm_response_transaction_started_epoch: >-
                    {{ as_timestamp(now()) }}
                  rcm_latched_machine_type: >-
                    {{ states('sensor.hoymiles_hit_machines_type') | int(-1) }}
                  rcm_latched_inverter_count: >-
                    {{ states(
                      'sensor.hoymiles_hit_number_of_machines_master_and_slave')
                       | int(-1) }}
                  rcm_latched_esp_uptime_seconds: >-
                    {{ states('sensor.hoymiles_hit_esp_uptime') | float(-1) }}
                  rcm_latched_esp_uptime_reported_epoch: >-
                    {% set item = states.sensor.hoymiles_hit_esp_uptime %}
                    {{ as_timestamp(item.last_reported
                         if item.last_reported is defined
                         else item.last_updated, 0) }}
              - variables:
                  rcm_topology_known: >-
                    {{ ((rcm_latched_machine_type | int(-1)) == 0
                         and (rcm_latched_inverter_count | int(-1)) == 1)
                       or ((rcm_latched_machine_type | int(-1)) == 1
                           and (rcm_latched_inverter_count | int(-1)) >= 2
                           and (rcm_latched_inverter_count | int(-1)) <= 10) }}
                  rcm_requires_parallel_proof: >-
                    {{ (rcm_latched_machine_type | int(-1)) == 1
                       and (rcm_latched_inverter_count | int(-1)) >= 2
                       and (rcm_latched_inverter_count | int(-1)) <= 10 }}
                  rcm_esp_uptime_ready: >-
                    {% set age =
                      (rcm_response_transaction_started_epoch | float(0))
                      - (rcm_latched_esp_uptime_reported_epoch | float(0)) %}
                    {{ (rcm_latched_esp_uptime_seconds | float(-1)) >= 180
                       and age >= -5 and age <= 180 }}
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
                      {% set reported = plan.last_reported
                           if plan.last_reported is defined else plan.last_updated %}
                      {% set age = as_timestamp(now())
                           - as_timestamp(reported, 0) %}
                      {{ age >= 0 and age <= 60
                         and is_state(
                           'binary_sensor.hoymiles_ems_execution_ready', 'on')
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'result_current') | default(false, true)
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_enabled',
                           'on')
                         and is_state('input_boolean.hoymiles_rcm_active', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_active', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_battery_balancing_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_charge_cycle_active', 'off')
                         and not is_state('timer.hoymiles_discharge', 'active')
                         and not is_state('timer.hoymiles_charge', 'active')
                         and is_number(states(
                           'sensor.hoymiles_hit_ems_mode_readback_code'))
                         and (states(
                           'sensor.hoymiles_hit_ems_mode_readback_code')
                           | int(-1)) != 3
                         and is_state(
                           'binary_sensor.hoymiles_sale_block_active', 'off')
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'pre_discharge_continue_eligible')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'voltage_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'pre_discharge_actuator_data_fresh')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'prediction_ready') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'forecast_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'history_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'live_power_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'gcf_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'ems_mode_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'discharge_registers_data_fresh')
                           | default(false, true)
                         and is_state(
                           'binary_sensor.hoymiles_ems_export_allowed', 'on')
                         and ((states(
                           'sensor.hoymiles_hit_gcf_enable_readback_code')
                           | int(-1)) == 0
                           or ((states(
                             'sensor.hoymiles_hit_gcf_enable_readback_code')
                             | int(-1)) == 1
                             and is_number(states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback'))
                             and (states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(0)) > 0))
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_discharge_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_discharge_available') | default(false, true)
                         and (state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'maximum_voltage_v') | float(999)) < 248.4
                         and as_timestamp(states(
                           'input_datetime.hoymiles_rcm_latched_pre_discharge_deadline'),
                           0) - as_timestamp(now()) >= 300
                         and (states('sensor.hoymiles_hit_overview_battery_soc')
                           | float(0)) > (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100)) + 0.5
                         and ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_power')
                           | float(0))) | abs < 1.0
                         and ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100))) | abs < 1.0
                         and is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  # Unknown/unavailable topology cannot authorize Mode 5.
                  - condition: template
                    value_template: "{{ rcm_topology_known | bool(false) }}"
                  - condition: template
                    value_template: "{{ rcm_esp_uptime_ready | bool(false) }}"
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_discharge"
                  - wait_template: >-
                      {{ is_state(
                        'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  # RCEm stores a percent register, not an authoritative total
                  # kW target. Record fresh direction evidence without applying
                  # the RCE amplitude fail-closed policy.
                  - action: >-
                      script.hoymiles_verify_parallel_aggregate_discharge_response
                    data:
                      transaction_id: "{{ rcm_response_transaction_id }}"
                      transaction_started_epoch: >-
                        {{ rcm_response_transaction_started_epoch }}
                      baseline_generation: >-
                        {{ rcm_parallel_generation_before_mode }}
                      latched_esp_uptime_seconds: >-
                        {{ rcm_latched_esp_uptime_seconds }}
                      owner: rcm_pre_discharge
                      latched_machine_type: "{{ rcm_latched_machine_type }}"
                      latched_inverter_count: "{{ rcm_latched_inverter_count }}"
                      topology_known: "{{ rcm_topology_known }}"
                      requires_parallel_proof: >-
                        {{ rcm_requires_parallel_proof }}
                      authoritative_expected_power: false

              # A failed final interlock or mode readback is a pending restore,
              # never a reason to forget ownership of the two discharge writes.
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                    state: "on"
                  - condition: template
                    value_template: >-
                      {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
                      {% set reported = plan.last_reported
                           if plan.last_reported is defined else plan.last_updated %}
                      {% set age = as_timestamp(now())
                           - as_timestamp(reported, 0) %}
                      {% set target = states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100) %}
                      {% set power = states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_power')
                           | float(0) %}
                      {{ not (age >= 0 and age <= 60
                         and is_state(
                           'binary_sensor.hoymiles_ems_execution_ready', 'on')
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'result_current') | default(false, true)
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_enabled',
                           'on')
                         and is_state('input_boolean.hoymiles_rcm_active', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_active', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_battery_balancing_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_charge_cycle_active', 'off')
                         and not is_state('timer.hoymiles_discharge', 'active')
                         and not is_state('timer.hoymiles_charge', 'active')
                         and is_number(states(
                           'sensor.hoymiles_hit_ems_mode_readback_code'))
                         and (states(
                           'sensor.hoymiles_hit_ems_mode_readback_code')
                           | int(-1)) != 3
                         and is_state(
                           'binary_sensor.hoymiles_sale_block_active', 'off')
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'pre_discharge_continue_eligible')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'voltage_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'pre_discharge_actuator_data_fresh')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'prediction_ready') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'forecast_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'history_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'live_power_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'gcf_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'ems_mode_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'discharge_registers_data_fresh')
                           | default(false, true)
                         and is_state(
                           'binary_sensor.hoymiles_ems_export_allowed', 'on')
                         and ((states(
                           'sensor.hoymiles_hit_gcf_enable_readback_code')
                           | int(-1)) == 0
                           or ((states(
                             'sensor.hoymiles_hit_gcf_enable_readback_code')
                             | int(-1)) == 1
                             and is_number(states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback'))
                             and (states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(0)) > 0))
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_discharge_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_discharge_available') | default(false, true)
                         and (state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'maximum_voltage_v') | float(999)) < 248.4
                         and as_timestamp(states(
                           'input_datetime.hoymiles_rcm_latched_pre_discharge_deadline'),
                           0) - as_timestamp(now()) >= 300
                         and (states('sensor.hoymiles_hit_overview_battery_soc')
                           | float(0)) > target + 0.5
                         and ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - power) | abs < 1.0
                         and ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - target) | abs < 1.0
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_discharge')) }}
                then:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'ems_mode_data_fresh')
                               | default(false, true) }}
                    then:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ not is_state(
                                'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                        then:
                          - action: script.hoymiles_verified_set_ems_mode
                            data:
                              option: "self_use"
                          - wait_template: >-
                              {{ is_state(
                                'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                            timeout: "00:01:00"
                            continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'discharge_registers_data_fresh')
                               | default(false, true) }}
                    then:
                      - action: script.hoymiles_verified_set_ems_maximum_discharge_power
                        data:
                          value: >-
                            {{ states(
                              'input_number.hoymiles_rcm_saved_max_discharge_power')
                               | float(100) | round(1) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_max_discharge_power')
                               | float(100))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                      - action: script.hoymiles_verified_set_ems_force_discharge_soc
                        data:
                          value: >-
                            {{ states(
                              'input_number.hoymiles_rcm_saved_force_discharge_soc')
                               | float(20) | round(0) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_force_discharge_soc')
                               | float(20))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: >-
                              {{ is_state(
                                   'sensor.hoymiles_ems_hardware_mode', 'self_use')
                                 and ((states(
                                   'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                                   | float(-999)) - (states(
                                   'input_number.hoymiles_rcm_saved_max_discharge_power')
                                   | float(100))) | abs < 1.0
                                 and ((states(
                                   'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                                   | float(-999)) - (states(
                                   'input_number.hoymiles_rcm_saved_force_discharge_soc')
                                   | float(20))) | abs < 1.0 }}
                        then:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: >-
                                input_boolean.hoymiles_rcm_pre_discharge_active
