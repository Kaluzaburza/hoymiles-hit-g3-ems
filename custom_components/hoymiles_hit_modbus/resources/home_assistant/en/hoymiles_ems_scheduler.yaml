      - name: "Hoymiles RCEm Recommended Export Limit"
        unique_id: hoymiles_rcm_recommended_export_limit
        icon: mdi:transmission-tower-export
        unit_of_measurement: "%"
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                        'recommended_export_limit_percent') is number }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                        'recommended_export_limit_percent')
             | float(0) | round(1) }}

      - name: "Hoymiles RCEm Headroom Shortfall"
        unique_id: hoymiles_rcm_headroom_shortfall
        icon: mdi:battery-alert-variant-outline
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
