              owner: "{{ response_owner }}"
              transaction_started_epoch: "{{ response_started_epoch }}"
              latched_esp_uptime_seconds: >-
                {{ response_latched_esp_uptime_seconds | float(-1) }}
              pending_at: "{{ response_pending_at }}"
              verification_horizon_seconds: 155
              detected_inverters: "{{ response_machine_count }}"
              latched_machine_type: "{{ response_machine_type }}"
              topology_known: "{{ response_topology_known | bool(false) }}"
              requires_parallel_proof: >-
                {{ response_requires_parallel_proof | bool(false) }}
              authoritative_expected_power: >-
                {{ response_authoritative_requested | bool(false) }}
              expected_power_kw: "{{ response_expected_kw | float(0) }}"
              sample_count: 0
              samples_kw: []
              grid_samples_kw: []
              baseline_generation: >-
                {{ response_baseline_generation | float(-1) }}
              collection_baseline_generation: >-
                {{ response_collection_baseline_generation | float(-1) }}
              final_generation: null
              completed_at: "{{ now().isoformat() }}"
          - wait_template: >-
              {{ state_attr(
                   'sensor.hoymiles_parallel_aggregate_physical_response',
                   'transaction_id') == response_transaction_id
                 and state_attr(
                   'sensor.hoymiles_parallel_aggregate_physical_response',
                   'owner') == response_owner
                 and not is_state(
                   'sensor.hoymiles_parallel_aggregate_physical_response',
                   'pending') }}
            timeout: "00:00:05"
            continue_on_timeout: true
          - stop: "ESP restarted during response verification"
            error: false
      # Generation is monotonic only inside one ESP boot. If it fell below the
      # pre-command latch, a reboot/reset occurred during the transition and
      # subsequent low generations must never be accepted as newer evidence.
      - if:
          - condition: template
            value_template: >-
              {{ (response_collection_baseline_generation | float(-1))
                   < (response_baseline_generation | float(-1)) }}
        then:
          - event: hoymiles_parallel_aggregate_physical_response
            event_data:
              result: not_confirmed
              phase: complete
              reason: aggregate_generation_reset_during_transition
              transaction_id: "{{ response_transaction_id }}"
              owner: "{{ response_owner }}"
              transaction_started_epoch: "{{ response_started_epoch }}"
              latched_esp_uptime_seconds: >-
                {{ response_latched_esp_uptime_seconds | float(-1) }}
              pending_at: "{{ response_pending_at }}"
              verification_horizon_seconds: 155
              detected_inverters: "{{ response_machine_count }}"
              latched_machine_type: "{{ response_machine_type }}"
              topology_known: "{{ response_topology_known | bool(false) }}"
              requires_parallel_proof: >-
                {{ response_requires_parallel_proof | bool(false) }}
              authoritative_expected_power: >-
                {{ response_authoritative_requested | bool(false) }}
              expected_power_kw: "{{ response_expected_kw | float(0) }}"
              sample_count: 0
              samples_kw: []
              grid_samples_kw: []
              baseline_generation: >-
                {{ response_baseline_generation | float(-1) }}
              collection_baseline_generation: >-
                {{ response_collection_baseline_generation | float(-1) }}
              final_generation: null
              completed_at: "{{ now().isoformat() }}"
          - wait_template: >-
              {{ state_attr(
                   'sensor.hoymiles_parallel_aggregate_physical_response',
                   'transaction_id') == response_transaction_id
                 and state_attr(
                   'sensor.hoymiles_parallel_aggregate_physical_response',
                   'owner') == response_owner
                 and not is_state(
                   'sensor.hoymiles_parallel_aggregate_physical_response',
                   'pending') }}
            timeout: "00:00:05"
            continue_on_timeout: true
          - stop: "Aggregate readback generation reset after the command"
            error: false
      # Each wait accepts exactly one newer firmware generation. The power
      # timestamps must also be newer than this transaction, so a cached
      # pre-command value cannot become physical-response evidence. Six
      # candidates provide a clean fourth window after one central transition
      # generation without treating that isolated peak as a failure.
      - wait_template: >-
          {% set battery = states.sensor.hoymiles_hit_overview_battery_power %}
          {% set grid =
            states.sensor.hoymiles_hit_overview_grid_total_active_power %}
          {% set battery_reported = battery.last_reported
