                 response_sample_3_kw | float(-999)] | min) >= 0.5
               and (not response_authoritative_requested | bool(false)
                    or ([response_grid_1_kw | float(-999),
                         response_grid_2_kw | float(-999),
                         response_grid_3_kw | float(-999)] | min) >= 0.25) }}
          response_window_2_direction: >-
            {{ ([response_sample_2_kw | float(-999),
                 response_sample_3_kw | float(-999),
                 response_sample_4_kw | float(-999)] | min) >= 0.5
               and (not response_authoritative_requested | bool(false)
                    or ([response_grid_2_kw | float(-999),
                         response_grid_3_kw | float(-999),
                         response_grid_4_kw | float(-999)] | min) >= 0.25) }}
          response_window_3_direction: >-
            {{ ([response_sample_3_kw | float(-999),
                 response_sample_4_kw | float(-999),
                 response_sample_5_kw | float(-999)] | min) >= 0.5
               and (not response_authoritative_requested | bool(false)
                     or ([response_grid_3_kw | float(-999),
                          response_grid_4_kw | float(-999),
                          response_grid_5_kw | float(-999)] | min) >= 0.25) }}
          response_window_4_direction: >-
            {{ ([response_sample_4_kw | float(-999),
                 response_sample_5_kw | float(-999),
                 response_sample_6_kw | float(-999)] | min) >= 0.5
               and (not response_authoritative_requested | bool(false)
                    or ([response_grid_4_kw | float(-999),
                         response_grid_5_kw | float(-999),
                         response_grid_6_kw | float(-999)] | min) >= 0.25) }}
          response_window_1_median_kw: >-
            {% set samples = [response_sample_1_kw | float(-999),
                              response_sample_2_kw | float(-999),
                              response_sample_3_kw | float(-999)] | sort %}
            {{ samples[1] }}
          response_window_2_median_kw: >-
            {% set samples = [response_sample_2_kw | float(-999),
                              response_sample_3_kw | float(-999),
                              response_sample_4_kw | float(-999)] | sort %}
            {{ samples[1] }}
          response_window_3_median_kw: >-
            {% set samples = [response_sample_3_kw | float(-999),
                              response_sample_4_kw | float(-999),
                              response_sample_5_kw | float(-999)] | sort %}
            {{ samples[1] }}
          response_window_4_median_kw: >-
            {% set samples = [response_sample_4_kw | float(-999),
                              response_sample_5_kw | float(-999),
                              response_sample_6_kw | float(-999)] | sort %}
            {{ samples[1] }}
          response_window_1_spread_kw: >-
            {% set samples = [response_sample_1_kw | float(-999),
                              response_sample_2_kw | float(-999),
                              response_sample_3_kw | float(-999)] %}
            {{ (samples | max) - (samples | min) }}
          response_window_2_spread_kw: >-
            {% set samples = [response_sample_2_kw | float(-999),
                              response_sample_3_kw | float(-999),
                              response_sample_4_kw | float(-999)] %}
            {{ (samples | max) - (samples | min) }}
          response_window_3_spread_kw: >-
            {% set samples = [response_sample_3_kw | float(-999),
                              response_sample_4_kw | float(-999),
                              response_sample_5_kw | float(-999)] %}
            {{ (samples | max) - (samples | min) }}
          response_window_4_spread_kw: >-
            {% set samples = [response_sample_4_kw | float(-999),
                              response_sample_5_kw | float(-999),
                              response_sample_6_kw | float(-999)] %}
            {{ (samples | max) - (samples | min) }}
          response_tolerance_kw: >-
            {{ [1.0, (response_expected_kw | float(0)) * 0.15] | max }}
      - variables:
          # A natural transition peak may occupy either of the first two
          # generations. It merely invalidates that three-sample window; the
          # next overlapping window restarts stability evaluation.
          response_window_1_stable: >-
            {{ response_window_1_valid | bool(false)
               and response_window_1_direction | bool(false)
               and (response_window_1_spread_kw | float(999))
                 <= ([1.0,
                      ((response_expected_kw | float(0))
                       if response_expected_valid | bool(false)
                       else (response_window_1_median_kw | float(0))) * 0.10]
                     | max) }}
          response_window_2_stable: >-
            {{ response_window_2_valid | bool(false)
               and response_window_2_direction | bool(false)
               and (response_window_2_spread_kw | float(999))
                 <= ([1.0,
                      ((response_expected_kw | float(0))
                       if response_expected_valid | bool(false)
                       else (response_window_2_median_kw | float(0))) * 0.10]
                     | max) }}
          response_window_3_stable: >-
            {{ response_window_3_valid | bool(false)
               and response_window_3_direction | bool(false)
               and (response_window_3_spread_kw | float(999))
                 <= ([1.0,
                      ((response_expected_kw | float(0))
                       if response_expected_valid | bool(false)
                       else (response_window_3_median_kw | float(0))) * 0.10]
                     | max) }}
          response_window_4_stable: >-
            {{ response_window_4_valid | bool(false)
               and response_window_4_direction | bool(false)
               and (response_window_4_spread_kw | float(999))
                 <= ([1.0,
                      ((response_expected_kw | float(0))
                       if response_expected_valid | bool(false)
                       else (response_window_4_median_kw | float(0))) * 0.10]
                     | max) }}
      - variables:
          # For an authoritative RCE transaction a stable transition plateau
          # outside the target band is not selected while a later candidate
          # window can still settle correctly. Only exhaustion of all windows
          # turns a persistent stable mismatch into a negative result.
          response_window_1_target_compatible: >-
            {{ not response_expected_valid | bool(false)
               or ((response_window_1_median_kw | float(-999))
                   - (response_expected_kw | float(0))) | abs
                    <= (response_tolerance_kw | float(0)) }}
          response_window_2_target_compatible: >-
            {{ not response_expected_valid | bool(false)
               or ((response_window_2_median_kw | float(-999))
                   - (response_expected_kw | float(0))) | abs
                    <= (response_tolerance_kw | float(0)) }}
          response_window_3_target_compatible: >-
            {{ not response_expected_valid | bool(false)
               or ((response_window_3_median_kw | float(-999))
                    - (response_expected_kw | float(0))) | abs
                     <= (response_tolerance_kw | float(0)) }}
          response_window_4_target_compatible: >-
            {{ not response_expected_valid | bool(false)
               or ((response_window_4_median_kw | float(-999))
                   - (response_expected_kw | float(0))) | abs
                    <= (response_tolerance_kw | float(0)) }}
      - variables:
          response_stable_window_start: >-
            {% if response_window_1_stable | bool(false)
                  and response_window_1_target_compatible | bool(false) %}
              1
            {% elif response_window_2_stable | bool(false)
                    and response_window_2_target_compatible | bool(false) %}
              2
            {% elif response_window_3_stable | bool(false)
                    and response_window_3_target_compatible | bool(false) %}
              3
            {% elif response_window_4_stable | bool(false)
                    and response_window_4_target_compatible | bool(false) %}
              4
            {% else %}
              0
            {% endif %}
          # This is a best-effort sampled peak, not the exact physical maximum:
          # 13-second polling can miss the narrow constructional transient.
          response_sampled_transition_peak_kw: >-
            {{ [response_transition_entry_kw | float(-999),
                response_transition_grace_kw | float(-999),
                response_sample_1_kw | float(-999),
                response_sample_2_kw | float(-999),
                response_sample_3_kw | float(-999),
                response_sample_4_kw | float(-999),
                response_sample_5_kw | float(-999),
                response_sample_6_kw | float(-999)] | max }}
      - variables:
          response_sample_count: >-
            {{ 3 if response_stable_window_start | int(0) > 0
               else response_candidate_sample_count | int(0) }}
          response_median_kw: >-
            {% if response_stable_window_start | int(0) == 1 %}
              {{ response_window_1_median_kw }}
            {% elif response_stable_window_start | int(0) == 2 %}
              {{ response_window_2_median_kw }}
            {% elif response_stable_window_start | int(0) == 3 %}
              {{ response_window_3_median_kw }}
            {% elif response_stable_window_start | int(0) == 4 %}
              {{ response_window_4_median_kw }}
            {% else %}
              0
            {% endif %}
          response_spread_kw: >-
            {% if response_stable_window_start | int(0) == 1 %}
              {{ response_window_1_spread_kw }}
            {% elif response_stable_window_start | int(0) == 2 %}
              {{ response_window_2_spread_kw }}
            {% elif response_stable_window_start | int(0) == 3 %}
              {{ response_window_3_spread_kw }}
            {% elif response_stable_window_start | int(0) == 4 %}
              {{ response_window_4_spread_kw }}
            {% else %}
              0
            {% endif %}
      - variables:
          response_sampled_transition_observed: >-
            {{ (response_sampled_transition_peak_kw | float(-999)) >= 0.5
               and (response_stable_window_start | int(0) == 0
                    or (response_sampled_transition_peak_kw | float(-999))
                      > (response_median_kw | float(0))
                        + ([1.0, (response_median_kw | float(0)) * 0.15]
                           | max)) }}
          response_topology_still_matches: >-
            {{ is_number(states('sensor.hoymiles_hit_machines_type'))
               and is_number(states(
                 'sensor.hoymiles_hit_number_of_machines_master_and_slave'))
               and (states('sensor.hoymiles_hit_machines_type') | int(-2))
                  == (response_machine_type | int(-1))
               and (states(
                 'sensor.hoymiles_hit_number_of_machines_master_and_slave')
                    | int(-2)) == (response_machine_count | int(-1)) }}
          response_esp_uptime_still_monotonic: >-
            {% set uptimes = [response_esp_uptime_after_grace | float(-1),
                              response_esp_uptime_1 | float(-1),
                              response_esp_uptime_2 | float(-1),
                              response_esp_uptime_3 | float(-1),
                              response_esp_uptime_4 | float(-1),
                              response_esp_uptime_5 | float(-1),
                              response_esp_uptime_6 | float(-1),
                              states('sensor.hoymiles_hit_esp_uptime')
                                | float(-1)] %}
            {{ (uptimes | min)
                 >= (response_latched_esp_uptime_seconds | float(-1)) }}
      - variables:
          response_result: >-
            {% if not response_esp_uptime_still_monotonic | bool(false) %}
              not_confirmed
            {% elif not response_topology_still_matches | bool(false) %}
              not_confirmed
            {% elif not is_state(
                 'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') %}
              not_confirmed
            {% elif response_authoritative_requested | bool(false)
                    and not response_expected_valid | bool(false) %}
              not_evaluable
            {% elif response_stable_window_start | int(0) == 0 %}
              not_confirmed
            {% elif response_expected_valid | bool(false)
                    and ((response_median_kw | float(-999))
                         - (response_expected_kw | float(0))) | abs
                      > (response_tolerance_kw | float(0)) %}
              not_confirmed
            {% else %}
              confirmed
            {% endif %}
          response_reason: >-
            {% if not response_esp_uptime_still_monotonic | bool(false) %}
              esp_restart_during_response_verification
            {% elif not response_topology_still_matches | bool(false) %}
              topology_changed_during_response
            {% elif not is_state(
                 'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') %}
              mode_changed_before_evidence
            {% elif response_authoritative_requested | bool(false)
                    and not response_expected_valid | bool(false) %}
              authoritative_target_invalid
            {% elif response_stable_window_start | int(0) == 0
                    and response_expected_valid | bool(false)
                    and (response_window_1_stable | bool(false)
                         or response_window_2_stable | bool(false)
                         or response_window_3_stable | bool(false)
                         or response_window_4_stable | bool(false)) %}
              authoritative_target_mismatch_after_transition_grace
            {% elif response_stable_window_start | int(0) == 0
                    and response_candidate_sample_count | int(0) < 3 %}
              fresh_sample_timeout
            {% elif response_stable_window_start | int(0) == 0
                    and not (response_window_1_direction | bool(false)
                             or response_window_2_direction | bool(false)
                             or response_window_3_direction | bool(false)
                             or response_window_4_direction | bool(false)) %}
              missing_required_direction_after_transition_grace
            {% elif response_stable_window_start | int(0) == 0 %}
              stable_sample_window_timeout
            {% elif response_expected_valid | bool(false)
                    and ((response_median_kw | float(-999))
                         - (response_expected_kw | float(0))) | abs
                      > (response_tolerance_kw | float(0)) %}
              authoritative_target_mismatch
            {% elif response_expected_valid | bool(false) %}
              fresh_direction_and_target_confirmed
            {% else %}
              fresh_direction_confirmed
            {% endif %}
      - event: hoymiles_parallel_aggregate_physical_response
        event_data:
          result: "{{ response_result | trim }}"
          phase: complete
          reason: "{{ response_reason | trim }}"
          transaction_id: "{{ response_transaction_id }}"
          owner: "{{ response_owner }}"
          transaction_started_epoch: "{{ response_started_epoch }}"
          latched_esp_uptime_seconds: >-
            {{ response_latched_esp_uptime_seconds | float(-1) }}
          pending_at: "{{ response_pending_at }}"
          verification_horizon_seconds: 155
          detected_inverters: "{{ response_machine_count }}"
          latched_machine_type: "{{ response_machine_type }}"
          topology_known: "{{ response_topology_known | bool(false) }}"
          requires_parallel_proof: >-
            {{ response_requires_parallel_proof | bool(false) }}
          authoritative_expected_power: >-
            {{ response_authoritative_requested | bool(false) }}
          expected_power_kw: >-
            {{ response_expected_kw | float(0) }}
          observed_median_power_kw: >-
            {{ response_median_kw | float(0) | round(3) }}
          observed_spread_kw: >-
            {{ response_spread_kw | float(0) | round(3) }}
          sampled_transition_peak_kw: >-
            {{ response_sampled_transition_peak_kw | float(0) | round(3) }}
          sampled_transition_observed: >-
            {{ response_sampled_transition_observed | bool(false) }}
          stable_window_start: >-
            {{ response_stable_window_start | int(0) }}
          tolerance_kw: >-
            {{ response_tolerance_kw | float(0) | round(3)
               if response_expected_valid | bool(false) else none }}
          sample_count: "{{ response_sample_count | int(0) }}"
          samples_kw: >-
            {% if response_stable_window_start | int(0) == 1 %}
              {{ [response_sample_1_kw | float(0) | round(3),
                  response_sample_2_kw | float(0) | round(3),
                  response_sample_3_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 2 %}
              {{ [response_sample_2_kw | float(0) | round(3),
                  response_sample_3_kw | float(0) | round(3),
                  response_sample_4_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 3 %}
              {{ [response_sample_3_kw | float(0) | round(3),
                  response_sample_4_kw | float(0) | round(3),
                  response_sample_5_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 4 %}
              {{ [response_sample_4_kw | float(0) | round(3),
                  response_sample_5_kw | float(0) | round(3),
                  response_sample_6_kw | float(0) | round(3)] }}
            {% else %}
              []
            {% endif %}
          grid_samples_kw: >-
            {% if response_stable_window_start | int(0) == 1 %}
              {{ [response_grid_1_kw | float(0) | round(3),
                  response_grid_2_kw | float(0) | round(3),
                  response_grid_3_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 2 %}
              {{ [response_grid_2_kw | float(0) | round(3),
                  response_grid_3_kw | float(0) | round(3),
                  response_grid_4_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 3 %}
              {{ [response_grid_3_kw | float(0) | round(3),
                  response_grid_4_kw | float(0) | round(3),
                  response_grid_5_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 4 %}
              {{ [response_grid_4_kw | float(0) | round(3),
                  response_grid_5_kw | float(0) | round(3),
                  response_grid_6_kw | float(0) | round(3)] }}
            {% else %}
              []
            {% endif %}
          baseline_generation: >-
            {{ response_baseline_generation | float(-1) }}
          collection_baseline_generation: >-
            {{ response_collection_baseline_generation | float(-1) }}
          final_generation: "{{ response_generation_6 | float(-1) }}"
          completed_at: "{{ now().isoformat() }}"
      # Event dispatch and trigger-based template rendering are asynchronous.
      # Do not return to a policy caller until this transaction owns the sensor.
      - wait_template: >-
          {{ state_attr(
               'sensor.hoymiles_parallel_aggregate_physical_response',
               'transaction_id') == response_transaction_id
             and state_attr(
               'sensor.hoymiles_parallel_aggregate_physical_response',
               'owner') == response_owner
             and as_timestamp(state_attr(
               'sensor.hoymiles_parallel_aggregate_physical_response',
               'completed_at'), 0) >= response_started_epoch | float(0)
             and not is_state(
               'sensor.hoymiles_parallel_aggregate_physical_response',
               'pending') }}
        timeout: "00:00:05"
        # A missing/renamed result sensor must return control to the caller.
        # Parallel policy callers then see no fresh transaction timestamp and
        # take their normal fail-closed rollback instead of being orphaned here.
        continue_on_timeout: true

  hoymiles_start_grid_discharge:
    alias: "EMS — start discharge do sieci"
    description: "Switches EMS to grid discharge outside the export lockout and starts the timer."
    icon: mdi:transmission-tower-export
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_charge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active
      # Claim manual ownership before the first EMS write. Automatic final
      # interlocks observe this flag and cannot overwrite the user's direction.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active
      # Manual ownership is visible before asking an automatic owner to roll
      # back its register transaction. A failed rollback aborts this start and
      # leaves the manual watchdog to retry a neutral hand-off.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_tariff_transaction
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "grid_discharge"
        then:
          - action: script.hoymiles_rollback_rce_transaction
      # RCEm pre-discharge retains ownership until its saved registers and a
      # neutral physical mode are acknowledged. The manual owner deliberately
      # blocks RCEm from selecting Self-Use, so perform that explicit neutral
      # handover here before waiting for RCEm to release. The verified helper
      # still preserves a concurrent raw/derived Off-Grid transition.
      - if:
          - condition: template
            value_template: >-
              {{ (is_state('input_boolean.hoymiles_rcm_active', 'on')
                   or is_state(
                     'input_boolean.hoymiles_rcm_pre_discharge_active', 'on'))
                 and states('sensor.hoymiles_ems_hardware_mode')
                   not in ['self_use', 'off_grid', 'unknown', 'unavailable',
                           'none', ''] }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      # Both RCEm controllers now see the manual owner and the neutral mode;
      # let their readback-safe register restores finish before the final
      # user-owned Grid Discharge write.
      - wait_template: >-
          {{ is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'off') }}
        timeout: "00:03:00"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      # Final physical interlock after every ownership/rollback wait.
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - variables:
          manual_parallel_generation_before_mode: >-
            {{ states(
              'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation')
               | float(-1) }}
          manual_response_transaction_id: >-
            {{ now().strftime('%Y%m%dT%H%M%S.%f%z') }}-manual
          manual_response_transaction_started_epoch: "{{ as_timestamp(now()) }}"
          manual_latched_machine_type: >-
            {{ states('sensor.hoymiles_hit_machines_type') | int(-1) }}
          manual_latched_inverter_count: >-
            {{ states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave')
               | int(-1) }}
          manual_latched_esp_uptime_seconds: >-
            {{ states('sensor.hoymiles_hit_esp_uptime') | float(-1) }}
          manual_latched_esp_uptime_reported_epoch: >-
            {% set item = states.sensor.hoymiles_hit_esp_uptime %}
            {{ as_timestamp(item.last_reported
                 if item.last_reported is defined else item.last_updated, 0) }}
      - variables:
          manual_topology_known: >-
            {{ ((manual_latched_machine_type | int(-1)) == 0
                 and (manual_latched_inverter_count | int(-1)) == 1)
               or ((manual_latched_machine_type | int(-1)) == 1
                   and (manual_latched_inverter_count | int(-1)) >= 2
                   and (manual_latched_inverter_count | int(-1)) <= 10) }}
          manual_requires_parallel_proof: >-
            {{ (manual_latched_machine_type | int(-1)) == 1
               and (manual_latched_inverter_count | int(-1)) >= 2
               and (manual_latched_inverter_count | int(-1)) <= 10 }}
          manual_esp_uptime_ready: >-
            {% set age = (manual_response_transaction_started_epoch | float(0))
               - (manual_latched_esp_uptime_reported_epoch | float(0)) %}
            {{ (manual_latched_esp_uptime_seconds | float(-1)) >= 180
               and age >= -5 and age <= 180 }}
      # Unknown/unavailable topology is not permission to issue Mode 5.
      - condition: template
        value_template: "{{ manual_topology_known | bool(false) }}"
      - condition: template
        value_template: "{{ manual_esp_uptime_ready | bool(false) }}"
      - action: script.hoymiles_verified_set_ems_mode
        data:
          option: "grid_discharge"
      # The verified helper returns only after fresh Master FC03 Mode 5 ACK.
      # Re-check that physical alias, then arm the timer without another wait.
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "grid_discharge"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      # Start the exact requested duration as soon as Mode 5 is physically
      # confirmed. The minute watchdog now sees an active timer throughout the
      # synchronous aggregate verification and cannot neutralize this owner.
      - action: timer.start
        target:
          entity_id: timer.hoymiles_discharge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_discharge_duration') | int(90)) * 60 }}
      - action: script.hoymiles_verify_parallel_aggregate_discharge_response
        continue_on_error: true
        data:
          transaction_id: "{{ manual_response_transaction_id }}"
          transaction_started_epoch: >-
            {{ manual_response_transaction_started_epoch }}
          baseline_generation: >-
            {{ manual_parallel_generation_before_mode }}
          latched_esp_uptime_seconds: >-
            {{ manual_latched_esp_uptime_seconds }}
          owner: manual
          latched_machine_type: "{{ manual_latched_machine_type }}"
          latched_inverter_count: "{{ manual_latched_inverter_count }}"
          topology_known: "{{ manual_topology_known }}"
          requires_parallel_proof: "{{ manual_requires_parallel_proof }}"
          authoritative_expected_power: false
      # Manual mode has no authoritative kW target. It therefore checks only
      # three fresh, stable battery-discharge samples; neither grid direction
      # nor an amplitude estimate can reject the user's command.
      - if:
          - condition: template
            value_template: >-
              {% set correlated =
                is_state(
                  'sensor.hoymiles_parallel_aggregate_physical_response',
                  'confirmed')
                and state_attr(
                  'sensor.hoymiles_parallel_aggregate_physical_response',
                  'transaction_id') == manual_response_transaction_id
                and state_attr(
                  'sensor.hoymiles_parallel_aggregate_physical_response',
                  'owner') == 'manual'
                and as_timestamp(state_attr(
                  'sensor.hoymiles_parallel_aggregate_physical_response',
                  'completed_at'), 0)
                    >= (manual_response_transaction_started_epoch | float(0)) %}
              {{ not manual_topology_known | bool(false)
                 or (manual_requires_parallel_proof | bool(false)
                     and not correlated) }}
        then:
          # Stop the requested-duration clock immediately. If neutralization
          # cannot be proved, owner=on + timer=idle deliberately hands the same
          # transaction to the minute finish watchdog for a safe retry.
          - action: timer.cancel
            target:
              entity_id: timer.hoymiles_discharge
          - if:
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
            then:
              - action: script.hoymiles_verified_set_ems_mode
                continue_on_error: true
                data:
                  option: "self_use"
          - wait_template: >-
              {{ states('sensor.hoymiles_ems_hardware_mode')
                 in ['self_use', 'off_grid'] }}
            timeout: "00:01:00"
            continue_on_timeout: true
          # Release ownership only after the same physical neutral readback
          # used by the normal timer-finish path. A missing API/readback leaves
          # the owner latched so the minute watchdog cannot lose the rollback.
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     in ['self_use', 'off_grid'] }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_discharge', 'idle') }}
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_discharge_cycle_active
          - stop: >-
              No fresh, directionally consistent parallel-system power response
            error: false
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"

  hoymiles_start_grid_charge:
    alias: "EMS — start charge z sieci"
    description: "Switches EMS to grid charge and starts the timer using the dashboard duration."
    icon: mdi:transmission-tower-import
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active
      # Claim manual ownership before the first EMS write. Automatic final
      # interlocks observe this flag and cannot overwrite the user's direction.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active
      # Complete any automatic register rollback before the user's mode write.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_tariff_transaction
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_rce_transaction
      # Wait until both RCEm ownership paths and the other automatic owners
      # have positively released their transactions. Otherwise a late RCEm
      # cleanup could overwrite the manual Grid Charge command with Self-Use.
      - wait_template: >-
          {{ is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'off') }}
        timeout: "00:03:00"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      # Final physical interlock after every ownership/rollback wait.
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - action: script.hoymiles_verified_set_ems_mode
        data:
          option: "grid_charge"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
        timeout: "00:01:00"
        continue_on_timeout: false
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "grid_charge"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_charge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_charge_duration') | int(90)) * 60 }}

  hoymiles_stop_scheduled_cycle:
    alias: "EMS — stop the cycle and return to Self-Use"
    description: "Stops both timers and safely returns the inverter to Self-Use."
    icon: mdi:stop-circle-outline
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_discharge
            - timer.hoymiles_charge
      # Cancel only the timers. Their ownership flags deliberately remain on
      # until Self-Use and both idle states are positively read back. If the
      # API disappears, the minute finish watchdogs retry this same hand-off.
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - delay: "00:00:05"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode')
             in ['self_use', 'off_grid'] }}
        timeout: "00:00:35"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode')
             in ['self_use', 'off_grid'] }}
      - condition: state
        entity_id: timer.hoymiles_discharge
        state: "idle"
      - condition: state
        entity_id: timer.hoymiles_charge
        state: "idle"
      # Exact Self-Use + idle readback closes the explicit stop transaction.
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hoymiles_discharge_cycle_active
            - input_boolean.hoymiles_charge_cycle_active

  hoymiles_rollback_tariff_transaction:
    alias: "Tariff EMS — roll back an incomplete transaction"
    description: >-
      Returns to Self-Use and restores both settings from before the automatic start.
      Ownership remains active until every readback matches.
    mode: single
    max_exceeded: silent
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_tariff_charge_active
        state: "on"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ (states(
                'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
                | float(0)) > 0.5
             and is_number(states(
               'sensor.hoymiles_hit_ems_control_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_mode_readback_code'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_self_use_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_backup_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_force_charge_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
             and is_number(states(
               'input_number.hoymiles_tariff_saved_max_charge_power'))
             and is_number(states(
               'input_number.hoymiles_tariff_saved_force_charge_soc')) }}
      # Build one final desired 4300-4306 tuple from the latest physical
      # readback plus the two values explicitly saved by the tariff owner.
      # The command endpoint delegates that tuple to the existing firmware
      # barrier exactly once; writable helper/command echoes are never inputs.
      - variables:
          rollback_expected_mode: >-
            {{ 3 if (states('sensor.hoymiles_hit_ems_mode_readback_code')
                       | int(-1)) == 3 else 0 }}
          rollback_expected_4301: >-
            {{ states('sensor.hoymiles_hit_ems_self_use_soc_readback')
               | float(-999) }}
          rollback_expected_4302: >-
            {{ states('sensor.hoymiles_hit_ems_backup_soc_readback')
               | float(-999) }}
          rollback_expected_4303: >-
            {{ states('input_number.hoymiles_tariff_saved_force_charge_soc')
               | float(-999) | round(0) }}
          rollback_expected_4304: >-
            {{ states('input_number.hoymiles_tariff_saved_max_charge_power')
               | float(-999) | round(1) }}
          rollback_expected_4305: >-
            {{ states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
               | float(-999) }}
          rollback_expected_4306: >-
            {{ states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
               | float(-999) }}
      - variables:
          rollback_payload: >-
            {{ (rollback_expected_4303 | int(-1)) * 1001
               + (((rollback_expected_4304 | float(-1)) * 10)
                  | round(0) | int(-1)) }}
          rollback_write_required: >-
            {{ (states('sensor.hoymiles_hit_ems_mode_readback_code')
                  | int(-1)) != (rollback_expected_mode | int(-2))
               or ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                       | float(-999))
                    - (rollback_expected_4303 | float(-998))) | abs >= 0.5
               or ((states(
                       'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                       | float(-999))
                    - (rollback_expected_4304 | float(-998))) | abs >= 0.05 }}
          rollback_generation_before_transaction: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}
      - if:
          - condition: template
            value_template: "{{ rollback_write_required }}"
        then:
          - action: number.set_value
            target:
              entity_id: >-
                number.hoymiles_hit_ems_complete_block_charge_rollback_command
            data:
              value: "{{ rollback_payload }}"
          # Capture after the one command. A cached/pre-command generation can
          # never satisfy the physical acknowledgement below.
          - variables:
              rollback_generation_after_write: >-
                {{ states(
                  'sensor.hoymiles_hit_ems_control_readback_generation') }}
          - wait_template: >-
              {{ (states(
                   'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
                    | float(0)) > 0.5
                 and states(
                   'sensor.hoymiles_hit_ems_control_readback_generation')
                    not in ['unknown', 'unavailable', 'none', '']
                 and states(
                   'sensor.hoymiles_hit_ems_control_readback_generation')
                    != rollback_generation_after_write
                 and (states('sensor.hoymiles_hit_ems_mode_readback_code')
                      | int(-1)) == (rollback_expected_mode | int(-2))
                 and ((states(
                        'sensor.hoymiles_hit_ems_self_use_soc_readback')
                        | float(-999))
                      - (rollback_expected_4301 | float(-998))) | abs < 0.5
                 and ((states('sensor.hoymiles_hit_ems_backup_soc_readback')
                        | float(-999))
                      - (rollback_expected_4302 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                        | float(-999))
                      - (rollback_expected_4303 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                        | float(-999))
                      - (rollback_expected_4304 | float(-998))) | abs < 0.05
                 and ((states(
                        'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                        | float(-999))
                      - (rollback_expected_4305 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                        | float(-999))
                      - (rollback_expected_4306 | float(-998))) | abs < 0.05 }}
            timeout: "00:01:00"
            continue_on_timeout: false
        else:
          # A logical no-op emits no FC16, but it is not allowed to release
          # ownership from a cached HA snapshot. Require a newer completed
          # physical cohort with the same frozen seven-field tuple.
          - wait_template: >-
              {{ (states(
                   'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
                    | float(0)) > 0.5
                 and states(
                   'sensor.hoymiles_hit_ems_control_readback_generation')
                    not in ['unknown', 'unavailable', 'none', '']
                 and states(
                   'sensor.hoymiles_hit_ems_control_readback_generation')
                    != rollback_generation_before_transaction
                 and (states('sensor.hoymiles_hit_ems_mode_readback_code')
                      | int(-1)) == (rollback_expected_mode | int(-2))
                 and ((states(
                        'sensor.hoymiles_hit_ems_self_use_soc_readback')
                        | float(-999))
                      - (rollback_expected_4301 | float(-998))) | abs < 0.5
                 and ((states('sensor.hoymiles_hit_ems_backup_soc_readback')
                        | float(-999))
                      - (rollback_expected_4302 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                        | float(-999))
                      - (rollback_expected_4303 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                        | float(-999))
                      - (rollback_expected_4304 | float(-998))) | abs < 0.05
                 and ((states(
                        'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                        | float(-999))
                      - (rollback_expected_4305 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                        | float(-999))
                      - (rollback_expected_4306 | float(-998))) | abs < 0.05 }}
            timeout: "00:01:00"
            continue_on_timeout: false
      # Off-Grid is a user-owned physical mode. A rollback restores both owned
      # registers but never pulls a running island back onto normal EMS control.
      - condition: template
        value_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
                | float(0)) > 0.5
             and (states('sensor.hoymiles_hit_ems_mode_readback_code')
                | int(-1)) == (rollback_expected_mode | int(-2))
             and rollback_expected_mode | int(-1) in [0, 3]
             and ((states('sensor.hoymiles_hit_ems_self_use_soc_readback')
                     | float(-999))
                  - (rollback_expected_4301 | float(-998))) | abs < 0.5
             and ((states('sensor.hoymiles_hit_ems_backup_soc_readback')
                     | float(-999))
                  - (rollback_expected_4302 | float(-998))) | abs < 0.5
             and ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                     | float(-999))
                  - (rollback_expected_4303 | float(-998))) | abs < 0.5
             and ((states(
                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                     | float(-999))
                  - (rollback_expected_4304 | float(-998))) | abs < 0.05
             and ((states(
                     'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                     | float(-999))
                  - (rollback_expected_4305 | float(-998))) | abs < 0.5
             and ((states(
                     'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                     | float(-999))
                  - (rollback_expected_4306 | float(-998))) | abs < 0.05 }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_tariff_charge_active
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_tariff_active_action
        data:
          value: "none"

  hoymiles_rollback_rce_transaction:
    alias: "RCE EMS — roll back an incomplete transaction"
    description: >-
      Returns to Self-Use and restores both settings from before the automatic start.
      Ownership remains active until every readback matches.
    mode: queued
    max: 5
    max_exceeded: silent
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_rce_discharge_active
        state: "on"
      - variables:
          rollback_preserve_off_grid: >-
            {{ is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - if:
          - condition: template
            value_template: >-
              {{ not rollback_preserve_off_grid
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'off_grid')
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
             or is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
        timeout: "00:00:35"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
             and is_number(states('sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
             and is_number(states(
               'input_number.hoymiles_rce_saved_max_discharge_power'))
             and is_number(states(
               'input_number.hoymiles_rce_saved_force_discharge_soc')) }}
      - action: script.hoymiles_verified_set_ems_maximum_discharge_power
        data:
          value: >-
            {{ states('input_number.hoymiles_rce_saved_max_discharge_power')
               | float(100) | round(1) }}
      - wait_template: >-
          {{ ((states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                | float(-999)) - (states(
                'input_number.hoymiles_rce_saved_max_discharge_power')
                | float(100))) | abs < 0.5 }}
        timeout: "00:01:00"
        continue_on_timeout: false
      - action: script.hoymiles_verified_set_ems_force_discharge_soc
        data:
          value: >-
            {{ states('input_number.hoymiles_rce_saved_force_discharge_soc')
               | float(20) | round(0) }}
      - wait_template: >-
          {{ ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                | float(-999)) - (states(
                'input_number.hoymiles_rce_saved_force_discharge_soc')
                | float(20))) | abs < 1.0 }}
        timeout: "00:01:00"
        continue_on_timeout: false
      # Preserve a physical Off-Grid transition while restoring both registers.
      - condition: template
        value_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
             or is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_rce_discharge_active

  hoymiles_start_battery_balancing:
    alias: "Battery balancing — start cycle"
    description: >-
      Suspends all other EMS plans and keeps the inverter in Self-Use
      during PV production while preparing a safe charge cycle to 100%.
    icon: mdi:battery-sync
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: sun.sun
        state: "above_horizon"
      - condition: state
        entity_id: binary_sensor.hoymiles_battery_balancing_control_data_ready
        state: "on"
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_overview_battery_soc'))
             and is_number(states('sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
             and is_number(states('sensor.hoymiles_hit_ems_force_charge_soc_readback'))
             and states('sensor.hoymiles_ems_hardware_mode')
               not in ['off_grid', 'unknown', 'unavailable', 'none'] }}
      # Latch ownership before asking any competing automation to release.
      # The balancing baseline is snapshotted only after their restores are
      # positively acknowledged in the durable handover phase below.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_battery_balancing_active
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_phase
        data:
          value: "handover"
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_discharge
            - timer.hoymiles_charge
            - timer.hoymiles_battery_balancing_hold
      - action: timer.start
        target:
          entity_id: timer.hoymiles_battery_balancing_watchdog
        data:
          duration: 86400
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'off') }}
        timeout: "00:00:30"
        continue_on_timeout: true
      # The balancing owner intentionally blocks the normal manual finalizers.
      # Once exact Self-Use and both cancelled timers are read back, handover
      # may safely close those manual owners itself.
      - if:
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "self_use"
          - condition: state
            entity_id: timer.hoymiles_discharge
            state: "idle"
          - condition: state
            entity_id: timer.hoymiles_charge
            state: "idle"
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_export_control_active
            state: "off"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.hoymiles_discharge_cycle_active
                - input_boolean.hoymiles_charge_cycle_active
      - if:
          - condition: template
            value_template: >-
              {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                 and is_state('input_boolean.hoymiles_discharge_cycle_active', 'off')
                 and is_state('input_boolean.hoymiles_charge_cycle_active', 'off')
                 and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
                 and is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
                 and is_state('input_boolean.hoymiles_rcm_active', 'off')
                  and is_state(
                    'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                  and is_state(
                    'input_boolean.hoymiles_rcm_export_control_active', 'off')
                 and is_number(states(
                   'sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
                 and is_number(states(
                   'sensor.hoymiles_hit_ems_force_charge_soc_readback')) }}
        then:
          - action: input_number.set_value
            target:
              entity_id: >-
                input_number.hoymiles_battery_balancing_saved_charge_power
            data:
              value: >-
                {{ states(
                  'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                   | float }}
          - action: input_number.set_value
            target:
              entity_id: >-
                input_number.hoymiles_battery_balancing_saved_force_charge_soc
            data:
              value: >-
                {{ states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                   | float }}
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_battery_balancing_phase
            data:
              value: "pv"

  hoymiles_stop_battery_balancing:
    alias: "Battery balancing — finish cycle"
    description: >-
      Returns to Self-Use, restores charge settings, and releases the lock
      on other EMS plans. A successfully completed cycle stores its date.
    icon: mdi:battery-check-outline
    mode: restart
    fields:
      completed:
        description: "Whether the cycle reached 100% SOC and completed its balancing time"
        example: true
        default: false
    sequence:
      - variables:
          stopping_from_handover: >-
            {{ states('input_text.hoymiles_battery_balancing_phase')
                 in ['handover', 'stopping_handover'] }}
          stopping_preserve_off_grid: >-
            {{ is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
          completed_cycle: >-
            {% set already_complete = is_state(
              'input_text.hoymiles_battery_balancing_phase',
              'stopping_complete') %}
            {% set soc = states(
              'sensor.hoymiles_hit_overview_battery_soc') %}
            {{ already_complete
               or (completed | default(false) | bool
                   and is_number(soc) and (soc | float(0)) >= 99.9) }}
      # Persist the stop reason so a timeout can be retried by the periodic
      # controller without losing a successfully completed balancing cycle.
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_phase
        data:
          value: >-
            {% if stopping_from_handover %}stopping_handover
            {% elif completed_cycle %}stopping_complete
            {% else %}stopping_abort{% endif %}
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_battery_balancing_hold
            - timer.hoymiles_battery_balancing_watchdog
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.hoymiles_ems_hardware_mode')
                   not in ['unknown', 'unavailable', 'none', '']
                 and not stopping_preserve_off_grid
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'off_grid')
                 and not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
             or is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
        timeout: "00:00:15"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ not stopping_from_handover
                 and is_number(states('sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
                 and is_number(states(
                   'input_number.hoymiles_battery_balancing_saved_charge_power')) }}
        then:
          - action: script.hoymiles_verified_set_ems_maximum_charge_power
            data:
              value: >-
                {{ states(
                     'input_number.hoymiles_battery_balancing_saved_charge_power')
                     | float(50) }}
          - wait_template: >-
              {{ ((states('sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                    | float(-999)) - (states(
                    'input_number.hoymiles_battery_balancing_saved_charge_power')
                    | float(50))) | abs < 1.0 }}
            timeout: "00:00:15"
            continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ not stopping_from_handover
                 and is_number(states('sensor.hoymiles_hit_ems_force_charge_soc_readback'))
                 and is_number(states(
                   'input_number.hoymiles_battery_balancing_saved_force_charge_soc')) }}
        then:
          - action: script.hoymiles_verified_set_ems_force_charge_soc
            data:
              value: >-
                {{ states(
                     'input_number.hoymiles_battery_balancing_saved_force_charge_soc')
                     | float(100) }}
          - wait_template: >-
              {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                    | float(-999)) - (states(
                    'input_number.hoymiles_battery_balancing_saved_force_charge_soc')
                    | float(100))) | abs < 1.0 }}
            timeout: "00:00:15"
            continue_on_timeout: true
      # Ownership is released only after three positive readbacks. If any
      # source is unavailable or a write is not acknowledged, the stopping
      # phase remains active and the next minute retries safely.
      - if:
          - condition: template
            value_template: >-
              {{ (is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                   or is_state(
                     'sensor.hoymiles_ems_hardware_mode', 'off_grid'))
                 and (stopping_from_handover
                      or (((states('sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                       | float(-999)) - (states(
                       'input_number.hoymiles_battery_balancing_saved_charge_power')
                       | float(50))) | abs < 1.0
                 and ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                       | float(-999)) - (states(
                       'input_number.hoymiles_battery_balancing_saved_force_charge_soc')
                       | float(100))) | abs < 1.0)) }}
        then:
          - if:
              - condition: template
                value_template: "{{ completed_cycle }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_battery_balancing_last_completed
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_battery_balancing_phase
            data:
              value: "idle"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.hoymiles_battery_balancing_active

automation:
  - id: hoymiles_battery_balancing_control
    alias: "Battery balancing — cycle control"
    description: >-
      Runs the cycle at the configured day interval. It first uses PV in Self-Use,
      tops up the battery from the grid after sunset, and from 99% limits
      battery charging to about 2 kW; balancing time starts only at 100% SOC.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
        id: periodic
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_battery_balancing_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_number.hoymiles_battery_balancing_interval_days
          - input_number.hoymiles_battery_balancing_hold_hours
          - input_text.hoymiles_battery_balancing_phase
          - binary_sensor.hoymiles_battery_balancing_due
          - binary_sensor.hoymiles_battery_balancing_control_data_ready
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_hit_maximum_charge_current
          - sensor.hoymiles_hit_battery_voltage_bms
          - sensor.hoymiles_battery_balancing_bms_safe_charge_power
          - sensor.hoymiles_battery_balancing_slow_charge_power
          - sensor.hoymiles_actual_load_power
          - sun.sun
          - sensor.hoymiles_ems_hardware_mode
        id: state_change
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hoymiles_battery_balancing_hold
        id: hold_finished
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hoymiles_battery_balancing_watchdog
        id: watchdog_finished
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:20"
      # Helpers without `initial` restore their last state after an HA restart.
      # On a genuinely fresh installation initialize only missing internal
      # markers; never overwrite a value already selected by the user.
      - if:
          - condition: template
            value_template: >-
              {{ states('input_datetime.hoymiles_battery_balancing_last_completed')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hoymiles_battery_balancing_last_completed
            data:
              datetime: >-
                {{ (now() - timedelta(days=states(
                     'input_number.hoymiles_battery_balancing_interval_days')
                     | int(30))).strftime('%Y-%m-%d %H:%M:%S') }}
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.hoymiles_tariff_active_action')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_tariff_active_action
            data:
              value: "none"
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.hoymiles_battery_balancing_phase')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_battery_balancing_phase
            data:
              value: "idle"
      - choose:
          # A failed restore keeps ownership and a durable stopping phase. The
          # periodic trigger retries until Self-Use and both saved registers
          # are positively read back.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ states('input_text.hoymiles_battery_balancing_phase')
                       in ['stopping_complete', 'stopping_abort',
                           'stopping_handover'] }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: >-
                    {{ is_state(
                      'input_text.hoymiles_battery_balancing_phase',
                      'stopping_complete') }}

          # Any stale SOC, BMS limit, LOAD or writable-register readback is a
          # hard stop. Ownership remains durable inside the stop script until
          # Self-Use and the saved settings are positively acknowledged.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_control_data_ready
                state: "off"
              - condition: template
                value_template: >-
                  {{ states('input_text.hoymiles_battery_balancing_phase')
                       not in ['stopping_complete', 'stopping_abort',
                               'stopping_handover'] }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          # A physical Off-Grid transition belongs to the user/inverter. Stop
          # the service transaction and restore its registers without changing
          # the islanded mode.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "off_grid"
              - condition: template
                value_template: >-
                  {{ states('input_text.hoymiles_battery_balancing_phase')
                       not in ['stopping_complete', 'stopping_abort',
                               'stopping_handover'] }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          # During handover balancing already owns the EMS, while each former
          # controller completes its own readback-safe cleanup. Keep retrying
          # Self-Use and enter the PV phase only after every owner is released.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "handover"
              - condition: template
                value_template: "{{ trigger.id != 'watchdog_finished' }}"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none', '']
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_charge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'off')
                         and is_state('input_boolean.hoymiles_rcm_active', 'off')
                          and is_state(
                            'input_boolean.hoymiles_rcm_pre_discharge_active',
                            'off')
                          and is_state(
                            'input_boolean.hoymiles_rcm_export_control_active',
                            'off')
                          and is_number(states(
                           'sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
                         and is_number(states(
                           'sensor.hoymiles_hit_ems_force_charge_soc_readback')) }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: >-
                        input_number.hoymiles_battery_balancing_saved_charge_power
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                           | float }}
                  - action: input_number.set_value
                    target:
                      entity_id: >-
                        input_number.hoymiles_battery_balancing_saved_force_charge_soc
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                           | float }}
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.hoymiles_battery_balancing_phase
                    data:
                      value: "pv"

          # The daylight PV phase has a hard Self-Use invariant. A lost or
          # rejected mode write is retried every minute while ownership stays.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "pv"
              - condition: template
                value_template: "{{ trigger.id != 'watchdog_finished' }}"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
              - condition: template
                value_template: >-
                  {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none', ''] }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"

          # Twardy limit 24 godzin chroni przed pozostawieniem Grid Charge po
          # utracie wiarygodnego SOC albo problemie z komunikacją BMS.
          - conditions:
              - condition: trigger
                id: watchdog_finished
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          - conditions:
              # Falling below full SOC invalidates the entire accumulated hold.
              # Re-enter slow charging and require a fresh full-duration hold
              # after the battery reaches 99.9% again.
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(0)) < 99.9 }}
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.hoymiles_battery_balancing_hold
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_battery_balancing_phase
                data:
                  value: "slow"

          - conditions:
              - condition: trigger
                id: hold_finished
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(-1)) >= 99.9
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(101)) <= 100 }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: true

          # Wyłączenie przełącznika w czasie cyklu jest bezpiecznym przerwaniem:
          # Self-Use i wcześniejsze nastawy ładowania zostają odtworzone.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "off"
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          # Po restarcie HA finish poprawnie odtworzony etap utrzymania, jeżeli
          # timer zdążył upłynąć podczas niedostępności systemu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(-1)) >= 99.9
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(101)) <= 100 }}
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'timer.hoymiles_battery_balancing_hold', 'active') }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: true

          # Cykl należny w danym dniu rozpoczyna się dopiero po wschodzie.
          # Zapewnia to maksymalne wykorzystanie PV zamiast nocnego ładowania.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_due
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_control_data_ready
                state: "on"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
            sequence:
              - action: script.hoymiles_start_battery_balancing

          # Pełny magazyn: ustaw delikatny wspólny limit wejścia AC i start
          # właściwy czas wyrównywania. Timer nie biegnie przy 99%.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ states('input_text.hoymiles_battery_balancing_phase')
                       in ['pv', 'grid', 'slow']
                     and is_number(states(
