# Czysta moc LOAD jest sumą faz 2170-2172 i nie zawiera zużycia własnego
# falownika ani strat przetwarzania. Całka tej mocy jest wspólnym źródłem
# energii dla wykresu zużycia domu, licznika dziennego i historii RCE.
sensor:
  - platform: integration
    source: sensor.hoymiles_actual_load_power
    name: "Hoymiles Actual Load Energy Total"
    unique_id: hoymiles_actual_load_energy_total
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  # The daily LOAD meter increases during the day and resets at midnight.
  # sum_differences_nonnegative sums only positive increments from the last
  # 96 hours, accounting for the reset. Recorder restores the buffer after restart.
  - platform: statistics
    name: "Hoymiles Load Energy Last 4 Days"
    unique_id: hoymiles_load_energy_last_4_days
    entity_id: sensor.hoymiles_actual_load_energy_today
    state_characteristic: sum_differences_nonnegative
    sampling_size: 20000
    max_age:
      days: 4
    keep_last_sample: true
    precision: 2

  # Moc LOAD jest próbkowana tylko w chronionym oknie nocnym. Całka tworzy
  # licznik energii, z którego po pierwszej pełnej dobie wyznaczana jest
  # actual średnia z maksymalnie czterech ostatnich nocy.
  - platform: integration
    source: sensor.hoymiles_night_protected_load_power
    name: "Hoymiles Night Protected Load Energy Total"
    unique_id: hoymiles_night_protected_load_energy_total
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: statistics
    name: "Hoymiles Night Protected Load Energy Last 4 Days"
    unique_id: hoymiles_night_protected_load_energy_last_4_days
    entity_id: sensor.hoymiles_night_protected_load_energy_total
    state_characteristic: sum_differences_nonnegative
    sampling_size: 10000
    max_age:
      days: 4
    keep_last_sample: true
    precision: 3

  - platform: integration
    source: sensor.hoymiles_rce_grid_export_power
    name: "Hoymiles RCE Grid Export Energy Total"
    unique_id: hoymiles_rce_grid_export_energy_total
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.hoymiles_rce_revenue_rate
    name: "Hoymiles RCE Revenue Total"
    unique_id: hoymiles_rce_revenue_total
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.hoymiles_tariff_grid_charge_power
    name: "Hoymiles Tariff Grid Charge Energy Total"
    unique_id: hoymiles_tariff_grid_charge_energy_total
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.hoymiles_tariff_savings_rate
    name: "Hoymiles Tariff Savings Total"
    unique_id: hoymiles_tariff_savings_total
    unit_time: h
    round: 3
    method: left

