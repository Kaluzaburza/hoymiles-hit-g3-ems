    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_discharge_duration:
    name: "EMS — discharge duration"
    min: 1
    max: 720
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  hoymiles_charge_duration:
    name: "EMS — charge duration"
    min: 1
    max: 720
