  hoymiles_verify_parallel_aggregate_discharge_response:
    alias: "EMS — verify aggregate power response after Grid Discharge"
    description: >-
      After the physical Master mode ACK, looks for three consecutive stable
      balances within five newer complete generations. A transition peak only
      shifts the window. The result is aggregate-response evidence, not a readback
      confirming the state of any individual inverter.
    # Independent callers carry their own transaction id. Parallel mode avoids
    # a later observer cancelling an in-flight safety decision; exact caller
    # correlation below turns any event-sensor overwrite into a safe failure.
    mode: parallel
    max: 4
    max_exceeded: error
    fields:
      transaction_id:
        required: true
        selector:
          text:
      transaction_started_epoch:
        required: true
        selector:
          number:
            min: 0
            max: 4102444800
            step: 0.001
            mode: box
      baseline_generation:
        required: true
        selector:
          number:
            min: -1
            max: 16000000
            step: 1
            mode: box
      latched_esp_uptime_seconds:
        required: true
        selector:
          number:
            min: 0
            max: 2147483647
            step: 1
            mode: box
      owner:
        required: true
        selector:
          text:
      latched_machine_type:
        required: true
        selector:
          number:
            min: -1
            max: 10
            step: 1
            mode: box
      latched_inverter_count:
        required: true
        selector:
          number:
            min: -1
            max: 10
            step: 1
            mode: box
      topology_known:
        required: true
        selector:
          boolean:
      requires_parallel_proof:
        required: true
        selector:
          boolean:
      expected_power_kw:
        required: false
        default: 0
        selector:
          number:
            min: 0
            max: 200
            step: 0.1
            mode: box
      authoritative_expected_power:
        required: false
        default: false
        selector:
          boolean:
    sequence:
      - variables:
          response_transaction_id: >-
            {{ transaction_id | default('', true) | trim }}
          response_started_epoch: >-
            {{ transaction_started_epoch | float(0) }}
          response_pending_at: "{{ now().isoformat() }}"
          response_owner: "{{ owner | default('unknown', true) }}"
          response_baseline_generation: >-
            {{ baseline_generation | float(-1) }}
          response_latched_esp_uptime_seconds: >-
            {{ latched_esp_uptime_seconds | float(-1) }}
          response_authoritative_requested: >-
            {{ authoritative_expected_power | default(false) | bool(false) }}
          response_expected_kw: >-
            {{ expected_power_kw | default(0) | float(0) }}
          response_transition_entry_kw: >-
            {{ states('sensor.hoymiles_hit_overview_battery_power')
               | float(-999000) / 1000 }}
          response_machine_type: "{{ latched_machine_type | int(-1) }}"
          response_machine_count: "{{ latched_inverter_count | int(-1) }}"
          response_topology_known: >-
            {{ topology_known | bool(false) }}
          response_requires_parallel_proof: >-
            {{ requires_parallel_proof | bool(false) }}
      - condition: template
        value_template: >-
          {{ response_transaction_id | length >= 8
             and response_started_epoch | float(0) > 0
             and response_latched_esp_uptime_seconds | float(-1) >= 180
             and response_owner in
               ['manual', 'manual_recovery', 'rce', 'rcm_pre_discharge'] }}
      - event: hoymiles_parallel_aggregate_physical_response
        event_data:
          result: pending
          phase: collecting
          reason: awaiting_fresh_complete_samples
          transaction_id: "{{ response_transaction_id }}"
          owner: "{{ response_owner }}"
          transaction_started_epoch: "{{ response_started_epoch }}"
          latched_esp_uptime_seconds: >-
            {{ response_latched_esp_uptime_seconds | float(-1) }}
          pending_at: "{{ response_pending_at }}"
          verification_horizon_seconds: 155
          detected_inverters: "{{ response_machine_count }}"
          latched_machine_type: "{{ response_machine_type }}"
          topology_known: "{{ response_topology_known | bool(false) }}"
          requires_parallel_proof: >-
            {{ response_requires_parallel_proof | bool(false) }}
          authoritative_expected_power: >-
            {{ response_authoritative_requested | bool(false) }}
          expected_power_kw: "{{ response_expected_kw | float(0) }}"
          sample_count: 0
          samples_kw: []
          grid_samples_kw: []
          baseline_generation: >-
            {{ response_baseline_generation | float(-1) }}
          final_generation: null
          completed_at: null
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ not response_topology_known | bool(false) }}
            sequence:
              - event: hoymiles_parallel_aggregate_physical_response
                event_data:
                  result: not_confirmed
                  phase: complete
                  reason: precommand_topology_unknown
                  transaction_id: "{{ response_transaction_id }}"
                  owner: "{{ response_owner }}"
                  transaction_started_epoch: "{{ response_started_epoch }}"
                  latched_esp_uptime_seconds: >-
                    {{ response_latched_esp_uptime_seconds | float(-1) }}
                  pending_at: "{{ response_pending_at }}"
                  verification_horizon_seconds: 155
                  detected_inverters: "{{ response_machine_count }}"
                  latched_machine_type: "{{ response_machine_type }}"
                  topology_known: false
                  requires_parallel_proof: >-
                    {{ response_requires_parallel_proof | bool(false) }}
                  authoritative_expected_power: >-
                    {{ response_authoritative_requested | bool(false) }}
                  expected_power_kw: "{{ response_expected_kw | float(0) }}"
                  sample_count: 0
                  samples_kw: []
                  grid_samples_kw: []
                  baseline_generation: >-
                    {{ response_baseline_generation | float(-1) }}
                  final_generation: null
                  completed_at: "{{ now().isoformat() }}"
              - wait_template: >-
                  {{ state_attr(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'transaction_id') == response_transaction_id
                     and state_attr(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'owner') == response_owner
                     and not is_state(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'pending') }}
                timeout: "00:00:05"
                continue_on_timeout: true
              - stop: "Pre-command topology was not unambiguous"
                error: false
          - conditions:
              - condition: template
                value_template: >-
                  {{ response_topology_known | bool(false)
                     and not response_requires_parallel_proof | bool(false) }}
            sequence:
              - event: hoymiles_parallel_aggregate_physical_response
                event_data:
                  result: not_evaluable
                  phase: complete
                  reason: parallel_proof_not_required
                  transaction_id: "{{ response_transaction_id }}"
                  owner: "{{ response_owner }}"
                  transaction_started_epoch: "{{ response_started_epoch }}"
                  latched_esp_uptime_seconds: >-
                    {{ response_latched_esp_uptime_seconds | float(-1) }}
                  pending_at: "{{ response_pending_at }}"
                  verification_horizon_seconds: 155
                  detected_inverters: "{{ response_machine_count }}"
                  latched_machine_type: "{{ response_machine_type }}"
                  topology_known: true
                  requires_parallel_proof: false
                  authoritative_expected_power: >-
                    {{ response_authoritative_requested | bool(false) }}
                  expected_power_kw: "{{ response_expected_kw | float(0) }}"
                  sample_count: 0
                  samples_kw: []
                  grid_samples_kw: []
                  baseline_generation: >-
                    {{ response_baseline_generation | float(-1) }}
                  final_generation: null
                  completed_at: "{{ now().isoformat() }}"
              - wait_template: >-
                  {{ state_attr(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'transaction_id') == response_transaction_id
                     and state_attr(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'owner') == response_owner
                     and not is_state(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'pending') }}
                timeout: "00:00:05"
                continue_on_timeout: true
              - stop: "Aggregate evidence is not required for this topology"
                error: false
          - conditions:
              - condition: template
                value_template: >-
                  {{ response_requires_parallel_proof | bool(false)
                     and (response_machine_type | int(-1) != 1
                     or response_machine_count | int(-1) < 2
                     or response_baseline_generation | float(-1) < 0
                     or not is_number(states(
                       'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation'))) }}
            sequence:
              - event: hoymiles_parallel_aggregate_physical_response
                event_data:
                  result: not_evaluable
                  phase: complete
                  reason: aggregate_generation_unavailable
                  transaction_id: "{{ response_transaction_id }}"
                  owner: "{{ response_owner }}"
                  transaction_started_epoch: "{{ response_started_epoch }}"
                  latched_esp_uptime_seconds: >-
                    {{ response_latched_esp_uptime_seconds | float(-1) }}
                  pending_at: "{{ response_pending_at }}"
                  verification_horizon_seconds: 155
                  detected_inverters: "{{ response_machine_count }}"
                  latched_machine_type: "{{ response_machine_type }}"
                  topology_known: >-
                    {{ response_topology_known | bool(false) }}
                  requires_parallel_proof: >-
                    {{ response_requires_parallel_proof | bool(false) }}
                  authoritative_expected_power: >-
                    {{ response_authoritative_requested | bool(false) }}
                  expected_power_kw: "{{ response_expected_kw | float(0) }}"
                  sample_count: 0
                  samples_kw: []
                  grid_samples_kw: []
                  baseline_generation: >-
                    {{ response_baseline_generation | float(-1) }}
                  final_generation: null
                  completed_at: "{{ now().isoformat() }}"
              - wait_template: >-
                  {{ state_attr(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'transaction_id') == response_transaction_id
                     and state_attr(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'owner') == response_owner
                     and not is_state(
                       'sensor.hoymiles_parallel_aggregate_physical_response',
                       'pending') }}
                timeout: "00:00:05"
                continue_on_timeout: true
              - stop: "No complete aggregate power-balance generation is available"
                error: false
      # A mode change can produce a short constructional power peak. Keep that
      # interval outside the confirmation window. The wait exits early only if
      # another mode supersedes Grid Discharge; otherwise it supplies 20 s of
      # transition grace and collection starts from the then-current generation.
      - wait_template: >-
          {{ not is_state(
            'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
        timeout: "00:00:20"
        continue_on_timeout: true
      - variables:
          response_collection_baseline_generation: >-
            {{ states(
              'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation')
               | float(-1) }}
          response_transition_grace_kw: >-
            {{ states('sensor.hoymiles_hit_overview_battery_power')
               | float(-999000) / 1000 }}
          response_esp_uptime_after_grace: >-
            {{ states('sensor.hoymiles_hit_esp_uptime') | float(-1) }}
      # A reboot can reset the generation counter and later catch up. Uptime is
      # the independent boot latch: it may stay equal between 60-second reports,
      # but it must never fall below the pre-command value.
      - if:
          - condition: template
            value_template: >-
              {{ (response_esp_uptime_after_grace | float(-1))
                   < (response_latched_esp_uptime_seconds | float(-1)) }}
        then:
          - event: hoymiles_parallel_aggregate_physical_response
            event_data:
              result: not_confirmed
              phase: complete
              reason: esp_restart_during_response_verification
              transaction_id: "{{ response_transaction_id }}"
              owner: "{{ response_owner }}"
              transaction_started_epoch: "{{ response_started_epoch }}"
              latched_esp_uptime_seconds: >-
                {{ response_latched_esp_uptime_seconds | float(-1) }}
              pending_at: "{{ response_pending_at }}"
