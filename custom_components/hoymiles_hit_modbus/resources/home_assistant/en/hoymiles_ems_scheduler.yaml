          {% set machines = states(
            'sensor.hoymiles_hit_number_of_machines_master_and_slave') | int(0) %}
          {% set system_power = (rated | default(0, true)) * machines %}
          {% set load_power = states('sensor.hoymiles_actual_load_power')
             | float(0) / 1000 %}
          {% set target = states(
            'sensor.hoymiles_battery_balancing_slow_target') | float(0) %}
          {% set direct_safe = state_attr(
            'sensor.hoymiles_battery_balancing_bms_safe_charge_power',
            'self_use_percent') | float(0) %}
          {% set grid_safe = state_attr(
            'sensor.hoymiles_battery_balancing_bms_safe_charge_power',
            'grid_charge_percent') | float(0) %}
          {% set direct_raw = [target / system_power * 100,
                               direct_safe, 100] | min
             if system_power > 0 and target > 0 and direct_safe > 0 else 0 %}
          {% set grid_raw = [(load_power + target) / system_power * 100,
                             grid_safe, 100] | min
             if system_power > 0 and target > 0 and load_power >= 0
                and grid_safe > 0 else 0 %}
          {% set direct = ((direct_raw * 10) | round(0, 'floor') / 10)
             if direct_raw >= 0.1 else 0 %}
          {% set grid = ((grid_raw * 10) | round(0, 'floor') / 10)
             if grid_raw >= 0.1 else 0 %}
          {{ (grid if is_state('sensor.hoymiles_ems_hardware_mode',
                               'grid_charge') else direct) | round(1) }}
        attributes:
          self_use_percent: >-
            {% set rated = {
              '5 kW': 5.0, '8 kW': 8.0, '10 kW': 10.0,
              '12 kW': 12.0, '15 kW': 15.0, '20 kW': 20.0
            }.get(states('input_select.hoymiles_rce_inverter_rated_power')) %}
            {% set machines = states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') | int(0) %}
            {% set system_power = (rated | default(0, true)) * machines %}
            {% set target = states(
              'sensor.hoymiles_battery_balancing_slow_target') | float(0) %}
            {% set safe = state_attr(
              'sensor.hoymiles_battery_balancing_bms_safe_charge_power',
              'self_use_percent') | float(0) %}
            {% set raw = [target / system_power * 100, safe, 100] | min
               if system_power > 0 and target > 0 and safe > 0 else 0 %}
            {{ (((raw * 10) | round(0, 'floor')) / 10
                if raw >= 0.1 else 0) | round(1) }}
          grid_charge_percent: >-
            {% set rated = {
              '5 kW': 5.0, '8 kW': 8.0, '10 kW': 10.0,
              '12 kW': 12.0, '15 kW': 15.0, '20 kW': 20.0
            }.get(states('input_select.hoymiles_rce_inverter_rated_power')) %}
            {% set machines = states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') | int(0) %}
            {% set system_power = (rated | default(0, true)) * machines %}
            {% set load_power = states('sensor.hoymiles_actual_load_power')
               | float(0) / 1000 %}
            {% set target = states(
              'sensor.hoymiles_battery_balancing_slow_target') | float(0) %}
            {% set safe = state_attr(
              'sensor.hoymiles_battery_balancing_bms_safe_charge_power',
              'grid_charge_percent') | float(0) %}
            {% set raw = [(load_power + target) / system_power * 100,
                           safe, 100] | min
               if system_power > 0 and target > 0 and load_power >= 0
                  and safe > 0 else 0 %}
            {{ (((raw * 10) | round(0, 'floor')) / 10
                if raw >= 0.1 else 0) | round(1) }}
          aggregate_target_kw: >-
            {{ states('sensor.hoymiles_battery_balancing_slow_target') }}
          self_use_semantics: direct_battery_charge_cap
          grid_charge_semantics: common_ac_budget_including_load
          quantization: floor_to_0.1_percent
          description: >-
            One shared EMS 4304 limit for approximately 0.4 kW net into the battery:
            without LOAD in Self-Use and with LOAD added exactly once in Grid Charge.

      - name: "Hoymiles Battery Balancing Next Run"
        unique_id: hoymiles_battery_balancing_next_run
        icon: mdi:calendar-clock
        availability: >-
          {{ states('input_datetime.hoymiles_battery_balancing_last_completed')
               not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set last = states(
               'input_datetime.hoymiles_battery_balancing_last_completed') %}
          {% set last_ts = as_timestamp(last, 0) %}
          {% set midnight = as_timestamp(last[0:10], as_timestamp(now())) %}
          {% set days = states(
               'input_number.hoymiles_battery_balancing_interval_days')
               | int(30) %}
          {% set due = midnight + days * 86400 %}
          {% set rising = as_timestamp(
               state_attr('sun.sun', 'next_rising'), 0) %}
          {% if is_state(
                  'input_boolean.hoymiles_battery_balancing_enabled', 'off') %}
            {% if last_ts <= as_timestamp('2020-01-02 00:00:00', 0) %}
              Automation disabled — first cycle is waiting
            {% else %}
              Automation disabled
            {% endif %}
          {% elif is_state(
                  'input_boolean.hoymiles_battery_balancing_active', 'on') %}
            Cycle in progress
          {% elif due <= as_timestamp(now()) %}
            {% if is_state('sun.sun', 'below_horizon') and rising > 0 %}
              After sunrise —
              {{ rising | timestamp_custom('%d.%m.%Y %H:%M', true) }}
            {% else %}
              Ready to start
            {% endif %}
          {% else %}
            {{ due | timestamp_custom('%d.%m.%Y', true) }} — after sunrise
          {% endif %}

      # Canonical parser for the exact 18-field b2 lifecycle schema. All
      # balancing control readers consume this entity; no control script may
      # index the raw input_text record directly.
      - name: "Hoymiles Battery Balancing Transaction"
        unique_id: hoymiles_battery_balancing_transaction
        icon: mdi:state-machine
        state: >-
          {% set raw = states(
            'input_text.hoymiles_battery_balancing_lifecycle') %}
          {% set p = raw.split('|') %}
          {% set ascii = namespace(valid=true) %}
          {% for character in raw %}
            {% if character not in
              'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
              {% set ascii.valid = false %}
            {% endif %}
          {% endfor %}
          {% set tx_states = [
            'IDLE', 'REQUESTED', 'OWNER_ACQUIRED', 'SNAPSHOT_VALID',
            'APPLYING', 'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING',
            'ABORT_REQUESTED', 'RESTORING', 'RESTORED',
            'NOTIFICATION_PENDING', 'TERMINAL', 'RESTORE_FAILED',
            'RECOVERY_REQUIRED'] %}
          {% set reasons = [
            'none', 'completed', 'user_disabled', 'off_grid',
            'bms_limit_invalid', 'bms_data_invalid', 'load_data_invalid',
            'bms_fault', 'inverter_fault', 'invalid_topology',
            'control_conflict', 'ownership_lost', 'data_stale_timeout',
            'clock_anomaly', 'communication_failure',
            'max_charge_power_ack_failed', 'force_soc_ack_failed',
            'mode_ack_failed', 'watchdog_timeout',
            'snapshot_changed_before_transaction', 'lifecycle_invalid',
            'legacy_untrusted', 'restore_ack_failed',
            'outbox_write_failed', 'physical_transaction_failure',
            'unknown_internal_error'] %}
          {% set events = [
            'NONE', 'STARTED', 'COMPLETED', 'ABORTED', 'FAILED',
            'RESTORE_FAILED', 'RECOVERY_REQUIRED'] %}
          {% if p | count != 18 or (states(
              'input_text.hoymiles_battery_balancing_lifecycle') | length) > 255 %}
            INVALID
          {% else %}
            {% set seq = p[1][1:] | int(-1)
                 if p[1] | length > 1 and p[1][0] == 'c' else -1 %}
            {% set cycle_ok = p[1] in ['idle', 'legacy']
                 or (seq >= 1 and seq <= 2147483647
                     and p[1] == 'c' ~ seq) %}
            {% set integers_ok =
                 p[4] == ((p[4] | int(-1)) | string)
                 and (p[4] | int(-1)) >= 0
                 and (p[4] | int(-1)) <= 2147483647
                 and p[10] == ((p[10] | int(-1)) | string)
                 and (p[10] | int(-1)) >= 0
                 and (p[10] | int(-1)) <= 16000000
                 and p[11] == ((p[11] | int(-1)) | string)
                 and (p[11] | int(-1)) >= 0
                 and (p[11] | int(-1)) <= 16000000
                 and p[12] == ((p[12] | int(-1)) | string)
                 and (p[12] | int(-1)) >= 0
                 and (p[12] | int(-1)) <= 4102444800000
                 and p[16] == ((p[16] | int(-1)) | string)
                 and (p[16] | int(-1)) >= 0
                 and (p[16] | int(-1)) <= 4102444800000 %}
            {% set values_ok = is_number(p[8]) and is_number(p[9])
                 and (p[8] | float(-1)) >= 0
                 and (p[8] | float(101)) <= 100
                 and (p[9] | float(-1)) >= 0
                 and (p[9] | float(101)) <= 100
                 and p[8] == (((p[8] | float(-1)) | round(1)) | string)
                 and p[9] == (((p[9] | float(-1)) | round(1)) | string) %}
            {% set absent_snapshot = p[5] == '0' and p[6] == 'none'
                 and p[7] == 'unknown' and p[8] == '0.0' and p[9] == '0.0'
                 and p[10] == '0' and p[11] == '0' and p[12] == '0' %}
            {% set trusted_snapshot = p[5] == '1' and p[6] == p[1]
                 and p[7] in ['self_use', 'grid_charge', 'grid_discharge']
                 and (p[12] | int(0)) > 0 %}
            {% set snapshot_required = p[2] in [
                 'SNAPSHOT_VALID', 'APPLYING', 'OPERATIONAL', 'SLOW',
                 'HOLD_ARMING', 'HOLDING', 'RESTORING', 'RESTORED',
                 'RESTORE_FAILED'] %}
            {% set owner_required = p[2] in [
                 'OWNER_ACQUIRED', 'SNAPSHOT_VALID', 'APPLYING',
                 'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING',
                 'ABORT_REQUESTED', 'RESTORING', 'RESTORED',
                 'RESTORE_FAILED', 'RECOVERY_REQUIRED'] %}
            {% set identity_ok =
                 (p[2] == 'IDLE' and p[1] == 'idle' and p[4] == '0')
                 or (p[2] == 'RECOVERY_REQUIRED' and p[1] == 'legacy'
                     and p[4] == '0')
                 or (p[2] not in ['IDLE', 'RECOVERY_REQUIRED']
                     and seq >= 1 and (p[4] | int(-1)) == seq) %}
            {% set owner_ok = (owner_required and p[3] == 'balancing')
                 or (not owner_required and p[3] == 'none') %}
            {% set snapshot_ok = (snapshot_required and trusted_snapshot)
                 or (not snapshot_required
                     and (trusted_snapshot or absent_snapshot)) %}
            {% set flags_ok = p[5] in ['0', '1']
                 and p[13] in ['0', '1'] and p[15] in ['0', '1'] %}
            {% set state_relation_ok =
                 (p[2] == 'IDLE' and absent_snapshot and p[13] == '0'
                    and p[15] == '0' and p[14] == 'none'
                    and p[17] == 'NONE')
                 or (p[2] == 'REQUESTED' and absent_snapshot
                     and p[13] == '0')
                 or (p[2] == 'OWNER_ACQUIRED' and absent_snapshot
                     and p[13] == '0')
                 or (p[2] == 'SNAPSHOT_VALID' and trusted_snapshot
                     and p[13] == '0')
                 or (p[2] in ['APPLYING', 'OPERATIONAL', 'SLOW',
                              'HOLD_ARMING', 'HOLDING', 'RESTORING',
                              'RESTORED', 'RESTORE_FAILED']
                     and trusted_snapshot and p[13] == '1')
                 or p[2] in ['ABORT_REQUESTED',
                             'NOTIFICATION_PENDING', 'TERMINAL']
                  or (p[2] == 'RECOVERY_REQUIRED' and absent_snapshot
                      and p[13] == '1') %}
            {# A guarded steady-phase writer persists raw APPLYING plus one
               conditional commit token in the otherwise inactive cooldown
               field. The parser, not the non-atomic input_text service call,
               decides whether that token is a current steady-state commit. #}
            {% set conditional_states = {
              '101': 'OPERATIONAL', '102': 'OPERATIONAL',
              '201': 'SLOW', '202': 'SLOW',
              '301': 'HOLD_ARMING', '302': 'HOLD_ARMING',
              '401': 'HOLDING', '402': 'HOLDING'
            } %}
            {% set conditional_modes = {
              '101': 'self_use', '102': 'grid_charge',
              '201': 'self_use', '202': 'grid_charge',
              '301': 'self_use', '302': 'grid_charge',
              '401': 'self_use', '402': 'grid_charge'
            } %}
            {% set conditional_phase = conditional_states.get(p[16])
                 if p[2] == 'APPLYING' else none %}
            {% set conditional_mode = conditional_modes.get(p[16])
                 if conditional_phase is not none else none %}
            {% set conditional_timing_ok =
                 conditional_phase not in ['HOLD_ARMING', 'HOLDING']
                 or (states(
                       'sensor.hoymiles_battery_balancing_timing_transaction')
                       == conditional_phase
                     and state_attr(
                       'sensor.hoymiles_battery_balancing_timing_transaction',
                       'cycle_id') == p[1]) %}
            {% set conditional_commit_current = conditional_phase is not none
                 and p[3] == 'balancing'
                 and is_state(
                   'input_boolean.hoymiles_battery_balancing_active', 'on')
                 and is_state(
                   'input_boolean.hoymiles_battery_balancing_enabled', 'on')
                 and state_attr(
                   'sensor.hoymiles_ems_control_owner', 'owner_code')
                   == 'balancing'
                 and is_state(
                   'binary_sensor.hoymiles_ems_control_conflict', 'off')
                 and is_state(
                   'binary_sensor.hoymiles_battery_balancing_control_data_ready',
                   'on')
                 and is_state(
                   'sensor.hoymiles_ems_hardware_mode', conditional_mode)
                 and ((p[16] | int(0)) % 100 == 1
                      and is_state('sun.sun', 'above_horizon')
                      or (p[16] | int(0)) % 100 == 2
                         and is_state('sun.sun', 'below_horizon'))
                 and conditional_timing_ok
                 and not (is_state(
                   'sensor.hoymiles_battery_balancing_abort_request', 'PENDING')
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'cycle_id') == p[1]) %}
            {% set effective_state = conditional_phase
                 if conditional_commit_current else p[2] %}
            {{ effective_state if p[0] == 'b2' and ascii.valid and cycle_ok
                and p[2] in tx_states and p[3] in ['none', 'balancing']
                and integers_ok and values_ok and identity_ok and owner_ok
                and snapshot_ok and flags_ok and state_relation_ok
               and p[14] in reasons
               and p[17] in events else 'INVALID' }}
          {% endif %}
        attributes:
          schema_valid: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p | count == 18 and p[0] == 'b2' }}
          invalid_reason: >-
            {% set raw = states(
              'input_text.hoymiles_battery_balancing_lifecycle') %}
            {% set p = raw.split('|') %}
            {% set ascii = namespace(valid=true) %}
            {% for character in raw %}
              {% if character not in
                'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
                {% set ascii.valid = false %}
              {% endif %}
            {% endfor %}
            {% set recognized_legacy = p | count == 7 and ascii.valid
                 and raw | length <= 255
                 and is_number(p[0]) and (p[0] | int(-1)) >= 0
                 and p[1] in [
                   'none', 'pending', 'started', 'completed',
                   'aborted', 'failed']
                 and is_number(p[2]) and (p[2] | float(-1)) >= 0
                 and is_number(p[3]) and (p[3] | float(-1)) >= 0
                 and p[4] in [
                   'none', 'completed', 'user_disabled', 'off_grid',
                   'bms_limit_invalid', 'bms_data_invalid',
                   'load_data_invalid', 'bms_fault', 'inverter_fault',
                   'invalid_topology', 'control_conflict',
                   'ownership_lost', 'data_stale_timeout',
                   'communication_failure', 'max_charge_power_ack_failed',
                   'force_soc_ack_failed', 'mode_ack_failed',
                   'watchdog_timeout', 'restored_after_restart',
                   'unknown_internal_error']
                 and p[5] in [
                   'idle', 'handover', 'pv', 'grid', 'slow', 'holding']
                 and p[6] in [
                   'unknown', 'self_use', 'grid_charge', 'grid_discharge'] %}
            {{ 'legacy_untrusted' if recognized_legacy
               else 'lifecycle_invalid' }}
          serialized_length: >-
            {{ states(
              'input_text.hoymiles_battery_balancing_lifecycle') | length }}
          cycle_id: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[1] if p | count == 18 else 'invalid' }}
          transaction_state: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {% set committed = {
              '101': 'OPERATIONAL', '102': 'OPERATIONAL',
              '201': 'SLOW', '202': 'SLOW',
              '301': 'HOLD_ARMING', '302': 'HOLD_ARMING',
              '401': 'HOLDING', '402': 'HOLDING'
            } %}
            {{ committed.get(p[16], p[2])
               if p | count == 18 else 'INVALID' }}
          owner: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[3] if p | count == 18 else 'unknown' }}
          owner_generation: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[4] | int(-1) if p | count == 18 else -1 }}
          snapshot_valid: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p | count == 18 and p[5] == '1' }}
          snapshot_cycle_id: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[6] if p | count == 18 else 'invalid' }}
          snapshot_mode: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[7] if p | count == 18 else 'unknown' }}
          snapshot_4303: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[8] | float(-1) if p | count == 18 else -1 }}
          snapshot_4304: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[9] | float(-1) if p | count == 18 else -1 }}
          snapshot_ems_generation: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[10] | int(-1) if p | count == 18 else -1 }}
          snapshot_topology_generation: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[11] | int(-1) if p | count == 18 else -1 }}
          snapshot_epoch_ms: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[12] | int(-1) if p | count == 18 else -1 }}
          write_started: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p | count == 18 and p[13] == '1' }}
          reason_code: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[14] if p | count == 18 else 'lifecycle_invalid' }}
          operational_started: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p | count == 18 and p[15] == '1' }}
          cooldown_epoch_ms: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[16] | int(-1) if p | count == 18 else -1 }}
          event_marker: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_lifecycle').split('|') %}
            {{ p[17] if p | count == 18 else 'NONE' }}
          current_physical_mode: >-
            {{ states('sensor.hoymiles_ems_hardware_mode') }}
          current_physical_4303: >-
            {{ states('sensor.hoymiles_hit_ems_force_charge_soc_readback') }}
          current_physical_4304: >-
            {{ states(
              'sensor.hoymiles_hit_ems_maximum_charge_power_readback') }}
          current_ems_generation: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}
          current_topology_generation: >-
            {{ states(
              'sensor.hoymiles_hit_parallel_topology_readback_generation') }}

      # Canonical parser for restart-durable soft-gap and two-phase hold state.
      - name: "Hoymiles Battery Balancing Timing Transaction"
        unique_id: hoymiles_battery_balancing_timing_transaction
        icon: mdi:timer-lock-outline
        state: >-
          {% set raw = states(
            'input_text.hoymiles_battery_balancing_timing') %}
          {% set p = raw.split('|') %}
          {% set ascii = namespace(valid=true) %}
          {% for character in raw %}
            {% if character not in
              'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
              {% set ascii.valid = false %}
            {% endif %}
          {% endfor %}
          {% if p | count != 8 or (states(
              'input_text.hoymiles_battery_balancing_timing') | length) > 160 %}
            INVALID
          {% else %}
            {% set seq = p[1][1:] | int(-1)
                 if p[1] | length > 1 and p[1][0] == 'c' else -1 %}
            {% set cycle_ok = p[1] in ['idle', 'legacy']
                 or (seq >= 1 and seq <= 2147483647
                     and p[1] == 'c' ~ seq) %}
            {% set nums_ok = namespace(valid=true) %}
            {% for index, maximum in [(2, 2147483647), (3, 4102444800000),
                                      (4, 4102444800000), (5, 2147483647),
                                      (6, 4102444800000)] %}
              {% if p[index] != ((p[index] | int(-1)) | string)
                    or (p[index] | int(-1)) < 0
                    or (p[index] | int(-1)) > maximum %}
                {% set nums_ok.valid = false %}
              {% endif %}
            {% endfor %}
            {% set relation_ok =
                 (p[7] == 'NONE' and (p[4] | int(-1)) == 0
                    and (p[6] | int(-1)) == 0)
                 or (p[7] == 'GAP' and (p[2] | int(0)) > 0
                    and (p[3] | int(0)) > 0
                    and (p[4] | int(0)) == (p[3] | int(0)) + 60000
                    and (p[6] | int(-1)) == 0)
                 or (p[7] in ['HOLD_ARMING', 'HOLDING']
                    and (p[4] | int(-1)) == 0
                    and (p[5] | int(0)) > 0 and (p[6] | int(0)) > 0) %}
            {{ p[7] if p[0] == 't1' and ascii.valid and cycle_ok
               and nums_ok.valid
               and relation_ok else 'INVALID' }}
          {% endif %}
        attributes:
          cycle_id: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_timing').split('|') %}
            {{ p[1] if p | count == 8 else 'invalid' }}
          gap_generation: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_timing').split('|') %}
            {{ p[2] | int(-1) if p | count == 8 else -1 }}
          gap_start_epoch_ms: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_timing').split('|') %}
            {{ p[3] | int(-1) if p | count == 8 else -1 }}
          gap_deadline_epoch_ms: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_timing').split('|') %}
            {{ p[4] | int(-1) if p | count == 8 else -1 }}
          hold_generation: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_timing').split('|') %}
            {{ p[5] | int(-1) if p | count == 8 else -1 }}
          hold_deadline_epoch_ms: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_timing').split('|') %}
            {{ p[6] | int(-1) if p | count == 8 else -1 }}
          timing_state: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_timing').split('|') %}
            {{ p[7] if p | count == 8 else 'INVALID' }}

      # Canonical parser for the independent hard-stop latch.
      - name: "Hoymiles Battery Balancing Abort Request"
        unique_id: hoymiles_battery_balancing_abort_request
        icon: mdi:shield-alert-outline
        state: >-
          {% set raw = states(
            'input_text.hoymiles_battery_balancing_abort_request') %}
          {% set p = raw.split('|') %}
          {% set ascii = namespace(valid=true) %}
          {% for character in raw %}
            {% if character not in
              'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
              {% set ascii.valid = false %}
            {% endif %}
          {% endfor %}
          {% set reasons = [
            'none', 'completed', 'user_disabled', 'off_grid',
            'bms_limit_invalid', 'bms_data_invalid', 'load_data_invalid',
            'bms_fault', 'inverter_fault', 'invalid_topology',
            'control_conflict', 'ownership_lost', 'data_stale_timeout',
            'clock_anomaly', 'communication_failure',
            'max_charge_power_ack_failed', 'force_soc_ack_failed',
            'mode_ack_failed', 'watchdog_timeout',
            'snapshot_changed_before_transaction', 'lifecycle_invalid',
            'legacy_untrusted', 'restore_ack_failed',
            'physical_transaction_failure', 'unknown_internal_error'] %}
          {% if p | count != 7 or (states(
              'input_text.hoymiles_battery_balancing_abort_request') | length) > 160 %}
            INVALID
          {% else %}
            {% set seq = p[1][1:] | int(-1)
                 if p[1] | length > 1 and p[1][0] == 'c' else -1 %}
            {% set cycle_ok = p[1] in ['idle', 'legacy']
                 or (seq >= 1 and seq <= 2147483647
                     and p[1] == 'c' ~ seq) %}
            {% set nums_ok = p[2] == ((p[2] | int(-1)) | string)
                 and (p[2] | int(-1)) >= 0
                 and (p[2] | int(-1)) <= 2147483647
                 and p[3] == ((p[3] | int(-1)) | string)
                 and (p[3] | int(-1)) >= 0 and (p[3] | int(-1)) <= 100
                 and p[6] == ((p[6] | int(-1)) | string)
                 and (p[6] | int(-1)) >= 0
                 and (p[6] | int(-1)) <= 4102444800000 %}
            {% set relation_ok =
                 (p[5] == 'NONE' and p[3] == '0' and p[4] == 'none'
                    and p[6] == '0')
                 or (p[5] in ['PENDING', 'CONSUMED']
                    and (p[2] | int(0)) > 0 and (p[3] | int(0)) > 0
                    and p[4] in reasons and p[4] != 'none'
                    and (p[6] | int(0)) > 0) %}
            {{ p[5] if p[0] == 'a1' and ascii.valid and cycle_ok and nums_ok
               and relation_ok else 'INVALID' }}
          {% endif %}
        attributes:
          cycle_id: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_abort_request').split('|') %}
            {{ p[1] if p | count == 7 else 'invalid' }}
          request_generation: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_abort_request').split('|') %}
            {{ p[2] | int(-1) if p | count == 7 else -1 }}
          priority: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_abort_request').split('|') %}
            {{ p[3] | int(-1) if p | count == 7 else -1 }}
          reason_code: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_abort_request').split('|') %}
            {{ p[4] if p | count == 7 else 'lifecycle_invalid' }}
          request_state: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_abort_request').split('|') %}
            {{ p[5] if p | count == 7 else 'INVALID' }}
          requested_epoch_ms: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_abort_request').split('|') %}
            {{ p[6] | int(-1) if p | count == 7 else -1 }}

      # Canonical two-slot outbox parser. Event IDs and stable phone tags are
      # deterministic functions of cycle identity and event kind.
      - name: "Hoymiles Battery Balancing Notification Outbox"
        unique_id: hoymiles_battery_balancing_notification_outbox
        icon: mdi:bell-badge-outline
        state: >-
          {% set raw = states(
            'input_text.hoymiles_battery_balancing_notification_outbox') %}
          {% set p = raw.split('|') %}
          {% set ascii = namespace(valid=true) %}
          {% for character in raw %}
            {% if character not in
              'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
              {% set ascii.valid = false %}
            {% endif %}
          {% endfor %}
          {% set kinds = ['NA', 'ST', 'CO', 'AB', 'FA', 'RF', 'RQ'] %}
          {% set deliveries = [
            'EMPTY', 'PENDING', 'DELIVERING', 'DELIVERED',
            'SUPPRESSED_DISABLED', 'PERMANENT_FAILURE'] %}
          {% set reasons = [
            'none', 'completed', 'user_disabled', 'off_grid',
            'bms_limit_invalid', 'bms_data_invalid', 'load_data_invalid',
            'bms_fault', 'inverter_fault', 'invalid_topology',
            'control_conflict', 'ownership_lost', 'data_stale_timeout',
            'clock_anomaly', 'communication_failure',
            'max_charge_power_ack_failed', 'force_soc_ack_failed',
            'mode_ack_failed', 'watchdog_timeout',
            'snapshot_changed_before_transaction', 'lifecycle_invalid',
            'legacy_untrusted', 'restore_ack_failed',
            'physical_transaction_failure', 'unknown_internal_error'] %}
          {% if p | count != 15 or (states(
              'input_text.hoymiles_battery_balancing_notification_outbox')
              | length) > 255 %}
            INVALID
          {% else %}
            {% set check = namespace(valid=true) %}
            {% for start in [1, 8] %}
              {% set empty = p[start] == '-' and p[start + 1] == 'idle'
                   and p[start + 2] == 'NA' and p[start + 3] == 'none'
                   and p[start + 4] == 'EMPTY' and p[start + 5] == '0'
                   and p[start + 6] == '-' %}
              {% set nonempty = p[start + 2] in kinds
                   and p[start + 2] != 'NA'
                   and p[start + 3] in reasons
                   and p[start + 4] in deliveries
                   and p[start + 4] != 'EMPTY'
                   and p[start + 5] == ((p[start + 5] | int(-1)) | string)
                   and (p[start + 5] | int(-1)) >= 0
                   and (p[start + 5] | int(-1)) <= 3
                   and p[start] == p[start + 1] ~ '.' ~ p[start + 2]
                   and p[start + 6] == 'bb.' ~ p[start + 1] ~ '.' ~ p[start + 2]
                   and (p[start + 1] == 'legacy'
                        or (p[start + 1] | length > 1
                            and p[start + 1][0] == 'c'
                            and p[start + 1][1:] | int(-1) >= 1
                            and p[start + 1] == 'c' ~
                              (p[start + 1][1:] | int(-1)))) %}
              {% if not empty and not nonempty %}
                {% set check.valid = false %}
              {% endif %}
            {% endfor %}
            {{ 'VALID' if p[0] == 'o1' and ascii.valid and check.valid
               else 'INVALID' }}
          {% endif %}
        attributes:
          slot_1_event_id: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[1] if p | count == 15 else 'invalid' }}
          slot_1_cycle_id: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[2] if p | count == 15 else 'invalid' }}
          slot_1_kind: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[3] if p | count == 15 else 'NA' }}
          slot_1_reason: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[4] if p | count == 15 else 'lifecycle_invalid' }}
          slot_1_delivery_state: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[5] if p | count == 15 else 'INVALID' }}
          slot_1_attempt_count: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[6] | int(-1) if p | count == 15 else -1 }}
          slot_1_stable_tag: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[7] if p | count == 15 else 'invalid' }}
          slot_2_event_id: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[8] if p | count == 15 else 'invalid' }}
          slot_2_cycle_id: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[9] if p | count == 15 else 'invalid' }}
          slot_2_kind: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[10] if p | count == 15 else 'NA' }}
          slot_2_reason: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[11] if p | count == 15 else 'lifecycle_invalid' }}
          slot_2_delivery_state: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[12] if p | count == 15 else 'INVALID' }}
          slot_2_attempt_count: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[13] | int(-1) if p | count == 15 else -1 }}
          slot_2_stable_tag: >-
            {% set p = states(
              'input_text.hoymiles_battery_balancing_notification_outbox').split('|') %}
            {{ p[14] if p | count == 15 else 'invalid' }}

      - name: "Hoymiles Battery Balancing Status"
        unique_id: hoymiles_battery_balancing_status
        icon: mdi:battery-sync-outline
        state: >-
          {% set tx = states('sensor.hoymiles_battery_balancing_transaction') %}
          {% if tx == 'RECOVERY_REQUIRED' %}
            Manual recovery required — no trusted snapshot
          {% elif tx == 'RESTORE_FAILED' %}
            Restoration failed — ownership remains locked
          {% elif tx == 'INVALID'
                and is_state(
                  'input_boolean.hoymiles_battery_balancing_active', 'on') %}
            Manual recovery required — invalid transaction state
          {% elif is_state('input_boolean.hoymiles_battery_balancing_enabled', 'off')
                and is_state(
                  'input_boolean.hoymiles_battery_balancing_active', 'off') %}
            Disabled
          {% elif is_state('input_boolean.hoymiles_battery_balancing_active', 'on') %}
            {{ {
              'REQUESTED': 'Preparing the balancing cycle',
              'OWNER_ACQUIRED': 'Preparing the balancing cycle',
              'SNAPSHOT_VALID': 'Preparing the balancing cycle',
              'APPLYING': 'Applying transactional charging target',
              'OPERATIONAL': ('Charging from PV to 95% SOC'
                if is_state('sun.sun', 'above_horizon')
                else 'Charging from the grid to 95% SOC'),
              'SLOW': 'Slow charging at approximately 0.4 kW from 95% to 100% SOC',
              'HOLD_ARMING': 'Arming balancing hold at 100% SOC',
              'HOLDING': 'Balancing cells at 100% SOC',
              'ABORT_REQUESTED': 'Safe-abort request accepted',
              'RESTORING': 'Bezpieczne odtwarzanie nastaw sprzed cyklu',
              'RESTORED': 'Nastawy sprzed cyklu potwierdzone',
              'NOTIFICATION_PENDING': 'Fizycznie finishono — trwa zapis zdarzenia'
            }.get(tx, 'Unknown balancing-cycle phase') }}
          {% elif is_state('binary_sensor.hoymiles_battery_balancing_due', 'on') %}
            Waiting for the next PV production period
          {% else %}
            Scheduled
          {% endif %}

