              authoritative_target_invalid
            {% elif response_stable_window_start | int(0) == 0
                    and response_expected_valid | bool(false)
                    and (response_window_1_stable | bool(false)
                         or response_window_2_stable | bool(false)
                         or response_window_3_stable | bool(false)
                         or response_window_4_stable | bool(false)) %}
              authoritative_target_mismatch_after_transition_grace
            {% elif response_stable_window_start | int(0) == 0
                    and response_candidate_sample_count | int(0) < 3 %}
              fresh_sample_timeout
            {% elif response_stable_window_start | int(0) == 0
                    and not (response_window_1_direction | bool(false)
                             or response_window_2_direction | bool(false)
                             or response_window_3_direction | bool(false)
                             or response_window_4_direction | bool(false)) %}
              missing_required_direction_after_transition_grace
            {% elif response_stable_window_start | int(0) == 0 %}
              stable_sample_window_timeout
            {% elif response_expected_valid | bool(false)
                    and ((response_median_kw | float(-999))
                         - (response_expected_kw | float(0))) | abs
                      > (response_tolerance_kw | float(0)) %}
              authoritative_target_mismatch
            {% elif response_expected_valid | bool(false) %}
              fresh_direction_and_target_confirmed
            {% else %}
              fresh_direction_confirmed
            {% endif %}
      - event: hoymiles_parallel_aggregate_physical_response
        event_data:
          result: "{{ response_result | trim }}"
          phase: complete
          reason: "{{ response_reason | trim }}"
          transaction_id: "{{ response_transaction_id }}"
          owner: "{{ response_owner }}"
          transaction_started_epoch: "{{ response_started_epoch }}"
          latched_esp_uptime_seconds: >-
            {{ response_latched_esp_uptime_seconds | float(-1) }}
          pending_at: "{{ response_pending_at }}"
          verification_horizon_seconds: 155
          detected_inverters: "{{ response_machine_count }}"
          latched_machine_type: "{{ response_machine_type }}"
          topology_known: "{{ response_topology_known | bool(false) }}"
          requires_parallel_proof: >-
            {{ response_requires_parallel_proof | bool(false) }}
          authoritative_expected_power: >-
            {{ response_authoritative_requested | bool(false) }}
          expected_power_kw: >-
            {{ response_expected_kw | float(0) }}
          observed_median_power_kw: >-
            {{ response_median_kw | float(0) | round(3) }}
          observed_spread_kw: >-
            {{ response_spread_kw | float(0) | round(3) }}
          sampled_transition_peak_kw: >-
            {{ response_sampled_transition_peak_kw | float(0) | round(3) }}
          sampled_transition_observed: >-
            {{ response_sampled_transition_observed | bool(false) }}
          stable_window_start: >-
            {{ response_stable_window_start | int(0) }}
          tolerance_kw: >-
            {{ response_tolerance_kw | float(0) | round(3)
               if response_expected_valid | bool(false) else none }}
          sample_count: "{{ response_sample_count | int(0) }}"
          samples_kw: >-
            {% if response_stable_window_start | int(0) == 1 %}
              {{ [response_sample_1_kw | float(0) | round(3),
                  response_sample_2_kw | float(0) | round(3),
                  response_sample_3_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 2 %}
              {{ [response_sample_2_kw | float(0) | round(3),
                  response_sample_3_kw | float(0) | round(3),
                  response_sample_4_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 3 %}
              {{ [response_sample_3_kw | float(0) | round(3),
                  response_sample_4_kw | float(0) | round(3),
                  response_sample_5_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 4 %}
              {{ [response_sample_4_kw | float(0) | round(3),
                  response_sample_5_kw | float(0) | round(3),
                  response_sample_6_kw | float(0) | round(3)] }}
            {% else %}
              []
            {% endif %}
          grid_samples_kw: >-
            {% if response_stable_window_start | int(0) == 1 %}
              {{ [response_grid_1_kw | float(0) | round(3),
                  response_grid_2_kw | float(0) | round(3),
                  response_grid_3_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 2 %}
              {{ [response_grid_2_kw | float(0) | round(3),
                  response_grid_3_kw | float(0) | round(3),
                  response_grid_4_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 3 %}
              {{ [response_grid_3_kw | float(0) | round(3),
                  response_grid_4_kw | float(0) | round(3),
                  response_grid_5_kw | float(0) | round(3)] }}
            {% elif response_stable_window_start | int(0) == 4 %}
              {{ [response_grid_4_kw | float(0) | round(3),
                  response_grid_5_kw | float(0) | round(3),
                  response_grid_6_kw | float(0) | round(3)] }}
            {% else %}
              []
            {% endif %}
          baseline_generation: >-
            {{ response_baseline_generation | float(-1) }}
          collection_baseline_generation: >-
            {{ response_collection_baseline_generation | float(-1) }}
          final_generation: "{{ response_generation_6 | float(-1) }}"
          completed_at: "{{ now().isoformat() }}"
      # Event dispatch and trigger-based template rendering are asynchronous.
      # Do not return to a policy caller until this transaction owns the sensor.
      - wait_template: >-
          {{ state_attr(
               'sensor.hoymiles_parallel_aggregate_physical_response',
               'transaction_id') == response_transaction_id
             and state_attr(
               'sensor.hoymiles_parallel_aggregate_physical_response',
               'owner') == response_owner
             and as_timestamp(state_attr(
               'sensor.hoymiles_parallel_aggregate_physical_response',
               'completed_at'), 0) >= response_started_epoch | float(0)
             and not is_state(
               'sensor.hoymiles_parallel_aggregate_physical_response',
               'pending') }}
        timeout: "00:00:05"
        # A missing/renamed result sensor must return control to the caller.
        # Parallel policy callers then see no fresh transaction timestamp and
        # take their normal fail-closed rollback instead of being orphaned here.
        continue_on_timeout: true

  hoymiles_start_grid_discharge:
    alias: "EMS — start discharge do sieci"
    description: "Switches EMS to grid discharge outside the export lockout and starts the timer."
    icon: mdi:transmission-tower-export
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_charge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active
      # Claim manual ownership before the first EMS write. Automatic final
      # interlocks observe this flag and cannot overwrite the user's direction.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active
      # Manual ownership is visible before asking an automatic owner to roll
      # back its register transaction. A failed rollback aborts this start and
      # leaves the manual watchdog to retry a neutral hand-off.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_tariff_transaction
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "grid_discharge"
        then:
          - action: script.hoymiles_rollback_rce_transaction
      # RCEm pre-discharge retains ownership until its saved registers and a
      # neutral physical mode are acknowledged. The manual owner deliberately
      # blocks RCEm from selecting Self-Use, so perform that explicit neutral
      # handover here before waiting for RCEm to release. The verified helper
      # still preserves a concurrent raw/derived Off-Grid transition.
      - if:
          - condition: template
            value_template: >-
              {{ (is_state('input_boolean.hoymiles_rcm_active', 'on')
                   or is_state(
                     'input_boolean.hoymiles_rcm_pre_discharge_active', 'on'))
                 and states('sensor.hoymiles_ems_hardware_mode')
                   not in ['self_use', 'off_grid', 'unknown', 'unavailable',
                           'none', ''] }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      # Both RCEm controllers now see the manual owner and the neutral mode;
      # let their readback-safe register restores finish before the final
      # user-owned Grid Discharge write.
      - wait_template: >-
          {{ is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'off') }}
        timeout: "00:03:00"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      # Final physical interlock after every ownership/rollback wait.
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - variables:
          manual_parallel_generation_before_mode: >-
            {{ states(
              'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation')
               | float(-1) }}
          manual_response_transaction_id: >-
            {{ now().strftime('%Y%m%dT%H%M%S.%f%z') }}-manual
          manual_response_transaction_started_epoch: "{{ as_timestamp(now()) }}"
          manual_latched_machine_type: >-
            {{ states('sensor.hoymiles_hit_machines_type') | int(-1) }}
          manual_latched_inverter_count: >-
            {{ states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave')
               | int(-1) }}
          manual_latched_esp_uptime_seconds: >-
            {{ states('sensor.hoymiles_hit_esp_uptime') | float(-1) }}
          manual_latched_esp_uptime_reported_epoch: >-
            {% set item = states.sensor.hoymiles_hit_esp_uptime %}
            {{ as_timestamp(item.last_reported
                 if item.last_reported is defined else item.last_updated, 0) }}
      - variables:
          manual_topology_known: >-
            {{ ((manual_latched_machine_type | int(-1)) == 0
                 and (manual_latched_inverter_count | int(-1)) == 1)
               or ((manual_latched_machine_type | int(-1)) == 1
                   and (manual_latched_inverter_count | int(-1)) >= 2
                   and (manual_latched_inverter_count | int(-1)) <= 10) }}
          manual_requires_parallel_proof: >-
            {{ (manual_latched_machine_type | int(-1)) == 1
               and (manual_latched_inverter_count | int(-1)) >= 2
               and (manual_latched_inverter_count | int(-1)) <= 10 }}
          manual_esp_uptime_ready: >-
            {% set age = (manual_response_transaction_started_epoch | float(0))
               - (manual_latched_esp_uptime_reported_epoch | float(0)) %}
            {{ (manual_latched_esp_uptime_seconds | float(-1)) >= 180
               and age >= -5 and age <= 180 }}
      # Unknown/unavailable topology is not permission to issue Mode 5.
      - condition: template
        value_template: "{{ manual_topology_known | bool(false) }}"
      - condition: template
        value_template: "{{ manual_esp_uptime_ready | bool(false) }}"
      - action: script.hoymiles_verified_set_ems_mode
        data:
          option: "grid_discharge"
      # The verified helper returns only after fresh Master FC03 Mode 5 ACK.
      # Re-check that physical alias, then arm the timer without another wait.
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "grid_discharge"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      # Start the exact requested duration as soon as Mode 5 is physically
      # confirmed. The minute watchdog now sees an active timer throughout the
      # synchronous aggregate verification and cannot neutralize this owner.
      - action: timer.start
        target:
          entity_id: timer.hoymiles_discharge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_discharge_duration') | int(90)) * 60 }}
      - action: script.hoymiles_verify_parallel_aggregate_discharge_response
        continue_on_error: true
        data:
          transaction_id: "{{ manual_response_transaction_id }}"
          transaction_started_epoch: >-
            {{ manual_response_transaction_started_epoch }}
          baseline_generation: >-
            {{ manual_parallel_generation_before_mode }}
          latched_esp_uptime_seconds: >-
            {{ manual_latched_esp_uptime_seconds }}
          owner: manual
          latched_machine_type: "{{ manual_latched_machine_type }}"
          latched_inverter_count: "{{ manual_latched_inverter_count }}"
          topology_known: "{{ manual_topology_known }}"
          requires_parallel_proof: "{{ manual_requires_parallel_proof }}"
          authoritative_expected_power: false
      # Manual mode has no authoritative kW target. It therefore checks only
      # three fresh, stable battery-discharge samples; neither grid direction
      # nor an amplitude estimate can reject the user's command.
      - if:
          - condition: template
            value_template: >-
              {% set correlated =
                is_state(
                  'sensor.hoymiles_parallel_aggregate_physical_response',
                  'confirmed')
                and state_attr(
                  'sensor.hoymiles_parallel_aggregate_physical_response',
                  'transaction_id') == manual_response_transaction_id
                and state_attr(
                  'sensor.hoymiles_parallel_aggregate_physical_response',
                  'owner') == 'manual'
                and as_timestamp(state_attr(
                  'sensor.hoymiles_parallel_aggregate_physical_response',
                  'completed_at'), 0)
                    >= (manual_response_transaction_started_epoch | float(0)) %}
              {{ not manual_topology_known | bool(false)
                 or (manual_requires_parallel_proof | bool(false)
                     and not correlated) }}
        then:
          # Stop the requested-duration clock immediately. If neutralization
          # cannot be proved, owner=on + timer=idle deliberately hands the same
          # transaction to the minute finish watchdog for a safe retry.
          - action: timer.cancel
            target:
              entity_id: timer.hoymiles_discharge
          - if:
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
            then:
              - action: script.hoymiles_verified_set_ems_mode
                continue_on_error: true
                data:
                  option: "self_use"
          - wait_template: >-
              {{ states('sensor.hoymiles_ems_hardware_mode')
                 in ['self_use', 'off_grid'] }}
            timeout: "00:01:00"
            continue_on_timeout: true
          # Release ownership only after the same physical neutral readback
          # used by the normal timer-finish path. A missing API/readback leaves
          # the owner latched so the minute watchdog cannot lose the rollback.
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     in ['self_use', 'off_grid'] }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_discharge', 'idle') }}
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_discharge_cycle_active
          - stop: >-
              No fresh, directionally consistent parallel-system power response
            error: false
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"

  hoymiles_start_grid_charge:
    alias: "EMS — start charge z sieci"
    description: "Switches EMS to grid charge and starts the timer using the dashboard duration."
    icon: mdi:transmission-tower-import
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active
      # Claim manual ownership before the first EMS write. Automatic final
      # interlocks observe this flag and cannot overwrite the user's direction.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active
      # Complete any automatic register rollback before the user's mode write.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_tariff_transaction
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_rce_transaction
      # Wait until both RCEm ownership paths and the other automatic owners
      # have positively released their transactions. Otherwise a late RCEm
      # cleanup could overwrite the manual Grid Charge command with Self-Use.
      - wait_template: >-
          {{ is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'off') }}
        timeout: "00:03:00"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      # Final physical interlock after every ownership/rollback wait.
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - action: script.hoymiles_verified_set_ems_mode
        data:
          option: "grid_charge"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
        timeout: "00:01:00"
        continue_on_timeout: false
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "grid_charge"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_charge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_charge_duration') | int(90)) * 60 }}

  hoymiles_stop_scheduled_cycle:
    alias: "EMS — stop the cycle and return to Self-Use"
    description: "Stops both timers and safely returns the inverter to Self-Use."
    icon: mdi:stop-circle-outline
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_discharge
            - timer.hoymiles_charge
      # Cancel only the timers. Their ownership flags deliberately remain on
      # until Self-Use and both idle states are positively read back. If the
      # API disappears, the minute finish watchdogs retry this same hand-off.
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - delay: "00:00:05"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode')
             in ['self_use', 'off_grid'] }}
        timeout: "00:00:35"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode')
             in ['self_use', 'off_grid'] }}
      - condition: state
        entity_id: timer.hoymiles_discharge
        state: "idle"
      - condition: state
        entity_id: timer.hoymiles_charge
        state: "idle"
      # Exact Self-Use + idle readback closes the explicit stop transaction.
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hoymiles_discharge_cycle_active
            - input_boolean.hoymiles_charge_cycle_active

  hoymiles_rollback_tariff_transaction:
    alias: "Tariff EMS — roll back an incomplete transaction"
    description: >-
      Returns to Self-Use and restores both settings from before the automatic start.
      Ownership remains active until every readback matches.
    mode: single
    max_exceeded: silent
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_tariff_charge_active
        state: "on"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ (states(
                'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
                | float(0)) > 0.5
             and is_number(states(
               'sensor.hoymiles_hit_ems_control_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_mode_readback_code'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_self_use_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_backup_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_force_charge_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
             and is_number(states(
               'input_number.hoymiles_tariff_saved_max_charge_power'))
             and is_number(states(
               'input_number.hoymiles_tariff_saved_force_charge_soc')) }}
      # Build one final desired 4300-4306 tuple from the latest physical
      # readback plus the two values explicitly saved by the tariff owner.
      # The command endpoint delegates that tuple to the existing firmware
      # barrier exactly once; writable helper/command echoes are never inputs.
      - variables:
          rollback_expected_mode: >-
            {{ 3 if (states('sensor.hoymiles_hit_ems_mode_readback_code')
                       | int(-1)) == 3 else 0 }}
          rollback_expected_4301: >-
            {{ states('sensor.hoymiles_hit_ems_self_use_soc_readback')
               | float(-999) }}
          rollback_expected_4302: >-
            {{ states('sensor.hoymiles_hit_ems_backup_soc_readback')
               | float(-999) }}
          rollback_expected_4303: >-
            {{ states('input_number.hoymiles_tariff_saved_force_charge_soc')
               | float(-999) | round(0) }}
          rollback_expected_4304: >-
            {{ states('input_number.hoymiles_tariff_saved_max_charge_power')
               | float(-999) | round(1) }}
          rollback_expected_4305: >-
            {{ states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
               | float(-999) }}
          rollback_expected_4306: >-
            {{ states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
               | float(-999) }}
      - variables:
          rollback_payload: >-
            {{ (rollback_expected_4303 | int(-1)) * 1001
               + (((rollback_expected_4304 | float(-1)) * 10)
                  | round(0) | int(-1)) }}
          rollback_write_required: >-
            {{ (states('sensor.hoymiles_hit_ems_mode_readback_code')
                  | int(-1)) != (rollback_expected_mode | int(-2))
               or ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                       | float(-999))
                    - (rollback_expected_4303 | float(-998))) | abs >= 0.5
               or ((states(
                       'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                       | float(-999))
                    - (rollback_expected_4304 | float(-998))) | abs >= 0.05 }}
          rollback_generation_before_transaction: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}
      - if:
          - condition: template
            value_template: "{{ rollback_write_required }}"
        then:
          - action: number.set_value
            target:
              entity_id: >-
                number.hoymiles_hit_ems_complete_block_charge_rollback_command
            data:
              value: "{{ rollback_payload }}"
          # Capture after the one command. A cached/pre-command generation can
          # never satisfy the physical acknowledgement below.
          - variables:
              rollback_generation_after_write: >-
                {{ states(
                  'sensor.hoymiles_hit_ems_control_readback_generation') }}
          - wait_template: >-
              {{ (states(
                   'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
                    | float(0)) > 0.5
                 and states(
                   'sensor.hoymiles_hit_ems_control_readback_generation')
                    not in ['unknown', 'unavailable', 'none', '']
                 and states(
                   'sensor.hoymiles_hit_ems_control_readback_generation')
                    != rollback_generation_after_write
                 and (states('sensor.hoymiles_hit_ems_mode_readback_code')
                      | int(-1)) == (rollback_expected_mode | int(-2))
                 and ((states(
                        'sensor.hoymiles_hit_ems_self_use_soc_readback')
                        | float(-999))
                      - (rollback_expected_4301 | float(-998))) | abs < 0.5
                 and ((states('sensor.hoymiles_hit_ems_backup_soc_readback')
                        | float(-999))
                      - (rollback_expected_4302 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                        | float(-999))
                      - (rollback_expected_4303 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                        | float(-999))
                      - (rollback_expected_4304 | float(-998))) | abs < 0.05
                 and ((states(
                        'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                        | float(-999))
                      - (rollback_expected_4305 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                        | float(-999))
                      - (rollback_expected_4306 | float(-998))) | abs < 0.05 }}
            timeout: "00:01:00"
            continue_on_timeout: false
        else:
          # A logical no-op emits no FC16, but it is not allowed to release
          # ownership from a cached HA snapshot. Require a newer completed
          # physical cohort with the same frozen seven-field tuple.
          - wait_template: >-
              {{ (states(
                   'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
                    | float(0)) > 0.5
                 and states(
                   'sensor.hoymiles_hit_ems_control_readback_generation')
                    not in ['unknown', 'unavailable', 'none', '']
                 and states(
                   'sensor.hoymiles_hit_ems_control_readback_generation')
                    != rollback_generation_before_transaction
                 and (states('sensor.hoymiles_hit_ems_mode_readback_code')
                      | int(-1)) == (rollback_expected_mode | int(-2))
                 and ((states(
                        'sensor.hoymiles_hit_ems_self_use_soc_readback')
                        | float(-999))
                      - (rollback_expected_4301 | float(-998))) | abs < 0.5
                 and ((states('sensor.hoymiles_hit_ems_backup_soc_readback')
                        | float(-999))
                      - (rollback_expected_4302 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                        | float(-999))
                      - (rollback_expected_4303 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                        | float(-999))
                      - (rollback_expected_4304 | float(-998))) | abs < 0.05
                 and ((states(
                        'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                        | float(-999))
                      - (rollback_expected_4305 | float(-998))) | abs < 0.5
                 and ((states(
                        'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                        | float(-999))
                      - (rollback_expected_4306 | float(-998))) | abs < 0.05 }}
            timeout: "00:01:00"
            continue_on_timeout: false
      # Off-Grid is a user-owned physical mode. A rollback restores both owned
      # registers but never pulls a running island back onto normal EMS control.
      - condition: template
        value_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
                | float(0)) > 0.5
             and (states('sensor.hoymiles_hit_ems_mode_readback_code')
                | int(-1)) == (rollback_expected_mode | int(-2))
             and rollback_expected_mode | int(-1) in [0, 3]
             and ((states('sensor.hoymiles_hit_ems_self_use_soc_readback')
                     | float(-999))
                  - (rollback_expected_4301 | float(-998))) | abs < 0.5
             and ((states('sensor.hoymiles_hit_ems_backup_soc_readback')
                     | float(-999))
                  - (rollback_expected_4302 | float(-998))) | abs < 0.5
             and ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                     | float(-999))
                  - (rollback_expected_4303 | float(-998))) | abs < 0.5
             and ((states(
                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                     | float(-999))
                  - (rollback_expected_4304 | float(-998))) | abs < 0.05
             and ((states(
                     'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                     | float(-999))
                  - (rollback_expected_4305 | float(-998))) | abs < 0.5
             and ((states(
                     'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                     | float(-999))
                  - (rollback_expected_4306 | float(-998))) | abs < 0.05 }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_tariff_charge_active
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_tariff_active_action
        data:
          value: "none"

  hoymiles_rollback_rce_transaction:
    alias: "RCE EMS — roll back an incomplete transaction"
    description: >-
      Returns to Self-Use and restores both settings from before the automatic start.
      Ownership remains active until every readback matches.
    mode: queued
    max: 5
    max_exceeded: silent
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_rce_discharge_active
        state: "on"
      - variables:
          rollback_preserve_off_grid: >-
            {{ is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - if:
          - condition: template
            value_template: >-
              {{ not rollback_preserve_off_grid
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'off_grid')
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
             or is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
        timeout: "00:00:35"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
             and is_number(states('sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
             and is_number(states(
               'input_number.hoymiles_rce_saved_max_discharge_power'))
             and is_number(states(
               'input_number.hoymiles_rce_saved_force_discharge_soc')) }}
      - action: script.hoymiles_verified_set_ems_maximum_discharge_power
        data:
          value: >-
            {{ states('input_number.hoymiles_rce_saved_max_discharge_power')
               | float(100) | round(1) }}
      - wait_template: >-
          {{ ((states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                | float(-999)) - (states(
                'input_number.hoymiles_rce_saved_max_discharge_power')
                | float(100))) | abs < 0.5 }}
        timeout: "00:01:00"
        continue_on_timeout: false
      - action: script.hoymiles_verified_set_ems_force_discharge_soc
        data:
          value: >-
            {{ states('input_number.hoymiles_rce_saved_force_discharge_soc')
               | float(20) | round(0) }}
      - wait_template: >-
          {{ ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                | float(-999)) - (states(
                'input_number.hoymiles_rce_saved_force_discharge_soc')
                | float(20))) | abs < 1.0 }}
        timeout: "00:01:00"
        continue_on_timeout: false
      # Preserve a physical Off-Grid transition while restoring both registers.
      - condition: template
        value_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
             or is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_rce_discharge_active

  hoymiles_battery_balancing_write_record:
    alias: "Battery balancing — write canonical b2 record"
    description: >-
      The sole cycle serializer. It rejects non-canonical fields and every value
      longer than 255 characters before calling the input_text service.
    mode: queued
    max: 50
    max_exceeded: error
    fields:
      cycle_id: {required: true}
      transaction_state: {required: true}
      owner: {required: true}
      owner_generation: {required: true}
      snapshot_valid: {required: true}
      snapshot_cycle_id: {required: true}
      snapshot_mode: {required: true}
      snapshot_4303: {required: true}
      snapshot_4304: {required: true}
      snapshot_ems_generation: {required: true}
      snapshot_topology_generation: {required: true}
      snapshot_epoch_ms: {required: true}
      write_started: {required: true}
      reason_code: {required: true}
      operational_started: {required: true}
      cooldown_epoch_ms: {required: true}
      event_marker: {required: true}
      steady_commit_guard:
        required: false
        default: false
      expected_owner_generation:
        required: false
        default: -1
    sequence:
      - variables:
          record_cycle: "{{ cycle_id | string }}"
          record_state: "{{ transaction_state | string }}"
          record_owner: "{{ owner | string }}"
          record_owner_generation: "{{ owner_generation | int(-1) }}"
          record_snapshot_valid: "{{ 1 if snapshot_valid | bool(false) else 0 }}"
          record_snapshot_cycle: "{{ snapshot_cycle_id | string }}"
          record_snapshot_mode: "{{ snapshot_mode | string }}"
          record_snapshot_4303: "{{ snapshot_4303 | float(-1) | round(1) }}"
          record_snapshot_4304: "{{ snapshot_4304 | float(-1) | round(1) }}"
          record_ems_generation: "{{ snapshot_ems_generation | int(-1) }}"
          record_topology_generation: >-
            {{ snapshot_topology_generation | int(-1) }}
          record_snapshot_ms: "{{ snapshot_epoch_ms | int(-1) }}"
          record_write_started: "{{ 1 if write_started | bool(false) else 0 }}"
          record_reason: "{{ reason_code | string }}"
          record_operational_started: >-
            {{ 1 if operational_started | bool(false) else 0 }}
          record_cooldown_ms: "{{ cooldown_epoch_ms | int(-1) }}"
          record_event: "{{ event_marker | string }}"
          record_guard_steady_commit: >-
            {{ steady_commit_guard | default(false) | bool(false) }}
          record_guarded_owner_generation: >-
            {{ expected_owner_generation | default(-1) | int(-1) }}
          record_current_required_mode: >-
            {{ 'self_use' if is_state('sun.sun', 'above_horizon')
               else 'grid_charge' }}
          # Guarded steady states are conditional commits. Persisting raw
          # APPLYING plus a compact phase/mode token means a state change at the
          # input_text service boundary cannot itself persist an accepted phase.
          record_persisted_state: >-
            {{ 'APPLYING' if record_guard_steady_commit else record_state }}
          record_commit_token: >-
            {% set phase_code = {
              'OPERATIONAL': 100, 'SLOW': 200,
              'HOLD_ARMING': 300, 'HOLDING': 400
            }.get(record_state, 0) %}
            {% set mode_code = 1
                 if record_current_required_mode == 'self_use' else 2 %}
            {{ phase_code + mode_code
               if record_guard_steady_commit and phase_code > 0
               else record_cooldown_ms }}
          serialized_record: >-
            b2|{{ record_cycle }}|{{ record_persisted_state }}|{{ record_owner }}|{{
            record_owner_generation }}|{{ record_snapshot_valid }}|{{
            record_snapshot_cycle }}|{{ record_snapshot_mode }}|{{
            record_snapshot_4303 }}|{{ record_snapshot_4304 }}|{{
            record_ems_generation }}|{{ record_topology_generation }}|{{
            record_snapshot_ms }}|{{ record_write_started }}|{{ record_reason
            }}|{{ record_operational_started }}|{{ record_commit_token }}|{{
            record_event }}
          serialized_ascii_valid: >-
            {% set check = namespace(valid=true) %}
            {% for character in serialized_record %}
              {% if character not in
                'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
                {% set check.valid = false %}
              {% endif %}
            {% endfor %}
            {{ check.valid }}
          allowed_states: >-
            {{ ['IDLE', 'REQUESTED', 'OWNER_ACQUIRED', 'SNAPSHOT_VALID',
                'APPLYING', 'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING',
                'ABORT_REQUESTED', 'RESTORING', 'RESTORED',
                'NOTIFICATION_PENDING', 'TERMINAL', 'RESTORE_FAILED',
                'RECOVERY_REQUIRED'] }}
          allowed_reasons: >-
            {{ ['none', 'completed', 'user_disabled', 'off_grid',
                'bms_limit_invalid', 'bms_data_invalid', 'load_data_invalid',
                'bms_fault', 'inverter_fault', 'invalid_topology',
                'control_conflict', 'ownership_lost', 'data_stale_timeout',
                'clock_anomaly', 'communication_failure',
                'max_charge_power_ack_failed', 'force_soc_ack_failed',
                'mode_ack_failed', 'watchdog_timeout',
                'snapshot_changed_before_transaction', 'lifecycle_invalid',
                'legacy_untrusted', 'restore_ack_failed',
                'outbox_write_failed', 'physical_transaction_failure',
                'unknown_internal_error'] }}
          allowed_events: >-
            {{ ['NONE', 'STARTED', 'COMPLETED', 'ABORTED', 'FAILED',
                'RESTORE_FAILED', 'RECOVERY_REQUIRED'] }}
          sequence_value: >-
            {{ record_cycle[1:] | int(-1)
               if record_cycle | length > 1 and record_cycle[0] == 'c'
               else -1 }}
          cycle_valid: >-
            {{ record_cycle in ['idle', 'legacy']
               or (sequence_value | int(-1)) >= 1
                  and (sequence_value | int(-1)) <= 2147483647
                  and record_cycle == 'c' ~ (sequence_value | int(-1)) }}
          snapshot_absent: >-
            {{ (record_snapshot_valid | int(-1)) == 0
               and record_snapshot_cycle == 'none'
               and record_snapshot_mode == 'unknown'
               and (record_snapshot_4303 | float(-1)) == 0
               and (record_snapshot_4304 | float(-1)) == 0
               and (record_ems_generation | int(-1)) == 0
               and (record_topology_generation | int(-1)) == 0
               and (record_snapshot_ms | int(-1)) == 0 }}
          snapshot_trusted: >-
            {{ (record_snapshot_valid | int(-1)) == 1
               and record_snapshot_cycle == record_cycle
               and record_snapshot_mode in [
                 'self_use', 'grid_charge', 'grid_discharge']
               and (record_snapshot_4303 | float(-1)) >= 0
               and (record_snapshot_4303 | float(101)) <= 100
               and (record_snapshot_4304 | float(-1)) >= 0
               and (record_snapshot_4304 | float(101)) <= 100
               and (record_ems_generation | int(-1)) >= 0
               and (record_ems_generation | int(-1)) <= 16000000
               and (record_topology_generation | int(-1)) >= 0
               and (record_topology_generation | int(-1)) <= 16000000
               and (record_snapshot_ms | int(0)) > 0
               and (record_snapshot_ms | int(0)) <= 4102444800000 }}
          owner_required: >-
            {{ record_state in [
              'OWNER_ACQUIRED', 'SNAPSHOT_VALID', 'APPLYING', 'OPERATIONAL',
              'SLOW', 'HOLD_ARMING', 'HOLDING', 'ABORT_REQUESTED',
              'RESTORING', 'RESTORED', 'RESTORE_FAILED',
              'RECOVERY_REQUIRED'] }}
          snapshot_required: >-
            {{ record_state in [
              'SNAPSHOT_VALID', 'APPLYING', 'OPERATIONAL', 'SLOW',
              'HOLD_ARMING', 'HOLDING', 'RESTORING', 'RESTORED',
              'RESTORE_FAILED'] }}
          identity_valid: >-
            {{ (record_state == 'IDLE' and record_cycle == 'idle'
                 and (record_owner_generation | int(-1)) == 0)
               or (record_state == 'RECOVERY_REQUIRED'
                   and record_cycle == 'legacy'
                   and (record_owner_generation | int(-1)) == 0)
               or (record_state not in ['IDLE', 'RECOVERY_REQUIRED']
                   and (sequence_value | int(-1)) >= 1
                   and (record_owner_generation | int(-1))
                     == (sequence_value | int(-2))) }}
          state_relation_valid: >-
            {{ (record_state == 'IDLE' and snapshot_absent
                 and (record_write_started | int(-1)) == 0
                 and (record_operational_started | int(-1)) == 0
                 and record_reason == 'none' and record_event == 'NONE')
               or (record_state == 'REQUESTED' and snapshot_absent
                   and (record_write_started | int(-1)) == 0)
               or (record_state == 'OWNER_ACQUIRED' and snapshot_absent
                   and (record_write_started | int(-1)) == 0)
               or (record_state == 'SNAPSHOT_VALID' and snapshot_trusted
                   and (record_write_started | int(-1)) == 0)
               or (record_state in ['APPLYING', 'OPERATIONAL', 'SLOW',
                                     'HOLD_ARMING', 'HOLDING', 'RESTORING',
                                     'RESTORED', 'RESTORE_FAILED']
                   and snapshot_trusted
                   and (record_write_started | int(-1)) == 1)
               or record_state in ['ABORT_REQUESTED',
                                    'NOTIFICATION_PENDING', 'TERMINAL']
               or (record_state == 'RECOVERY_REQUIRED'
                   and snapshot_absent
                   and (record_write_started | int(-1)) == 1) }}
          record_valid: >-
            {{ serialized_record | length <= 255
               and serialized_ascii_valid
               and cycle_valid
               and identity_valid
               and state_relation_valid
               and record_state in allowed_states
               and record_owner in ['none', 'balancing']
               and ((owner_required and record_owner == 'balancing')
                    or (not owner_required and record_owner == 'none'))
               and ((snapshot_required and snapshot_trusted)
                    or (not snapshot_required
                        and (snapshot_trusted or snapshot_absent)))
               and (record_owner_generation | int(-1)) >= 0
               and (record_owner_generation | int(-1)) <= 2147483647
               and record_reason in allowed_reasons
               and record_event in allowed_events
               and (record_write_started | int(-1)) in [0, 1]
               and (record_operational_started | int(-1)) in [0, 1]
               and (record_commit_token | int(-1)) >= 0
               and (record_commit_token | int(-1)) <= 4102444800000 }}
          # This is the innermost lifecycle-write boundary. EVENT_CALL_SERVICE
          # for write_record has already fired before these current values are
          # rendered, so a final sun/mode/owner/abort change cannot persist a
          # stale steady phase.
          record_steady_commit_authorized: >-
            {{ not record_guard_steady_commit
               or (record_state in [
                     'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING']
                   and record_owner == 'balancing'
                   and (record_owner_generation | int(-1))
                     == (record_guarded_owner_generation | int(-2))
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'cycle_id') == record_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner_generation') | int(-1))
                     == (record_guarded_owner_generation | int(-2))
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner') == 'balancing'
                   and is_state(
                     'input_boolean.hoymiles_battery_balancing_active', 'on')
                   and is_state(
                     'input_boolean.hoymiles_battery_balancing_enabled', 'on')
                   and state_attr(
                     'sensor.hoymiles_ems_control_owner', 'owner_code')
                     == 'balancing'
                   and is_state(
                     'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                     'on')
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode',
                     record_current_required_mode)
                   and not (is_state(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'PENDING') and state_attr(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'cycle_id') == record_cycle)) }}
      - condition: template
        value_template: >-
          {{ record_valid and record_steady_commit_authorized }}
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_lifecycle
        data:
          value: "{{ serialized_record }}"
      - wait_template: >-
          {{ states('input_text.hoymiles_battery_balancing_lifecycle')
             == serialized_record }}
        timeout: "00:00:05"
        continue_on_timeout: false
      # Compatibility mirror only; every authority decision uses the b2 parser.
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: input_text.hoymiles_battery_balancing_phase
        data:
          value: "{{ record_persisted_state }}"

  hoymiles_battery_balancing_write_timing:
    alias: "Battery balancing — write canonical t1 deadlines"
    description: >-
      The sole serializer for the soft gap and two-phase hold deadlines.
    mode: queued
    max: 50
    max_exceeded: error
    fields:
      cycle_id: {required: true}
      gap_generation: {required: true}
      gap_start_epoch_ms: {required: true}
      gap_deadline_epoch_ms: {required: true}
      hold_generation: {required: true}
      hold_deadline_epoch_ms: {required: true}
      timing_state: {required: true}
    sequence:
      - variables:
          timing_cycle: "{{ cycle_id | string }}"
          timing_gap_generation: "{{ gap_generation | int(-1) }}"
          timing_gap_start: "{{ gap_start_epoch_ms | int(-1) }}"
          timing_gap_deadline: "{{ gap_deadline_epoch_ms | int(-1) }}"
          timing_hold_generation: "{{ hold_generation | int(-1) }}"
          timing_hold_deadline: "{{ hold_deadline_epoch_ms | int(-1) }}"
          timing_kind: "{{ timing_state | string }}"
          serialized_timing: >-
            t1|{{ timing_cycle }}|{{ timing_gap_generation }}|{{
            timing_gap_start }}|{{ timing_gap_deadline }}|{{
            timing_hold_generation }}|{{ timing_hold_deadline }}|{{ timing_kind }}
          timing_ascii_valid: >-
            {% set check = namespace(valid=true) %}
            {% for character in serialized_timing %}
              {% if character not in
                'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
                {% set check.valid = false %}
              {% endif %}
            {% endfor %}
            {{ check.valid }}
          timing_sequence: >-
            {{ timing_cycle[1:] | int(-1)
               if timing_cycle | length > 1 and timing_cycle[0] == 'c'
               else -1 }}
          timing_cycle_valid: >-
            {{ timing_cycle in ['idle', 'legacy']
               or ((timing_sequence | int(-1)) >= 1
                   and (timing_sequence | int(-1)) <= 2147483647
                   and timing_cycle == 'c' ~ (timing_sequence | int(-1))) }}
          timing_relation_valid: >-
            {{ (timing_kind == 'NONE'
                 and (timing_gap_deadline | int(-1)) == 0
                 and (timing_hold_deadline | int(-1)) == 0)
               or (timing_kind == 'GAP'
                   and (timing_gap_generation | int(0)) > 0
                   and (timing_gap_start | int(0)) > 0
                   and (timing_gap_deadline | int(0))
                     == (timing_gap_start | int(0)) + 60000
                   and (timing_hold_deadline | int(-1)) == 0)
                or (timing_kind in ['HOLD_ARMING', 'HOLDING']
                    and (timing_gap_deadline | int(-1)) == 0
                    and (timing_hold_generation | int(0)) > 0
                    and (timing_hold_deadline | int(0)) > 0) }}
          hold_soc_at_serializer: >-
            {{ states('sensor.hoymiles_hit_overview_battery_soc') }}
          hold_soc_age_at_serializer: >-
            {% set item = states.sensor.hoymiles_hit_overview_battery_soc %}
            {% set reported = item.last_reported
               if item.last_reported is defined else item.last_updated %}
            {{ as_timestamp(now()) - as_timestamp(reported, 0) }}
          hold_mode_at_serializer: >-
            {{ 'self_use' if is_state('sun.sun', 'above_horizon')
               else 'grid_charge' }}
          hold_arm_authorized: >-
            {{ timing_kind != 'HOLD_ARMING'
               or (is_number(hold_soc_at_serializer)
                   and (hold_soc_at_serializer | float(0)) | abs < 1000000000
                   and (hold_soc_at_serializer | float(-1)) >= 99.9
                   and (hold_soc_at_serializer | float(101)) <= 100
                   and (hold_soc_age_at_serializer | float(999)) >= -5
                   and (hold_soc_age_at_serializer | float(999)) <= 120
                   and is_state(
                     'sensor.hoymiles_battery_balancing_transaction', 'SLOW')
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'cycle_id') == timing_cycle
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner') == 'balancing'
                   and is_state(
                     'input_boolean.hoymiles_battery_balancing_active', 'on')
                   and is_state(
                     'input_boolean.hoymiles_battery_balancing_enabled', 'on')
                   and state_attr(
                     'sensor.hoymiles_ems_control_owner', 'owner_code')
                     == 'balancing'
                   and is_state(
                     'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                     'on')
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_timing_transaction',
                     'cycle_id') == timing_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_timing_transaction',
                     'hold_generation') | int(-1))
                     == (timing_hold_generation | int(-1)) - 1
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode',
                     hold_mode_at_serializer)
                   and not (is_state(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'PENDING') and state_attr(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'cycle_id') == timing_cycle)) }}
      - condition: template
        value_template: >-
          {{ serialized_timing | length <= 160
             and timing_ascii_valid and timing_cycle_valid
             and timing_kind in ['NONE', 'GAP', 'HOLD_ARMING', 'HOLDING']
             and timing_relation_valid
             and (timing_gap_generation | int(-1)) >= 0
             and (timing_gap_generation | int(-1)) <= 2147483647
             and (timing_gap_start | int(-1)) >= 0
             and (timing_gap_start | int(-1)) <= 4102444800000
             and (timing_gap_deadline | int(-1)) >= 0
             and (timing_gap_deadline | int(-1)) <= 4102444800000
             and (timing_hold_generation | int(-1)) >= 0
             and (timing_hold_generation | int(-1)) <= 2147483647
             and (timing_hold_deadline | int(-1)) >= 0
             and (timing_hold_deadline | int(-1)) <= 4102444800000
             and hold_arm_authorized }}
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_timing
        data:
          value: "{{ serialized_timing }}"
      - wait_template: >-
          {{ states('input_text.hoymiles_battery_balancing_timing')
             == serialized_timing }}
        timeout: "00:00:05"
        continue_on_timeout: false

  hoymiles_battery_balancing_write_abort_request:
    alias: "Battery balancing — write canonical a1 request"
    description: "The sole serializer for the durable hard-stop request."
    mode: queued
    max: 100
    max_exceeded: error
    fields:
      cycle_id: {required: true}
      request_generation: {required: true}
      priority: {required: true}
      reason_code: {required: true}
      request_state: {required: true}
      requested_epoch_ms: {required: true}
    sequence:
      - variables:
          abort_cycle: "{{ cycle_id | string }}"
          abort_generation: "{{ request_generation | int(-1) }}"
          abort_priority: "{{ priority | int(-1) }}"
          abort_reason: "{{ reason_code | string }}"
          abort_state: "{{ request_state | string }}"
          abort_requested_ms: "{{ requested_epoch_ms | int(-1) }}"
          serialized_abort: >-
            a1|{{ abort_cycle }}|{{ abort_generation }}|{{ abort_priority }}|{{
            abort_reason }}|{{ abort_state }}|{{ abort_requested_ms }}
          abort_ascii_valid: >-
            {% set check = namespace(valid=true) %}
            {% for character in serialized_abort %}
              {% if character not in
                'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
                {% set check.valid = false %}
              {% endif %}
            {% endfor %}
            {{ check.valid }}
          abort_sequence: >-
            {{ abort_cycle[1:] | int(-1)
               if abort_cycle | length > 1 and abort_cycle[0] == 'c'
               else -1 }}
          abort_cycle_valid: >-
            {{ abort_cycle in ['idle', 'legacy']
               or ((abort_sequence | int(-1)) >= 1
                   and (abort_sequence | int(-1)) <= 2147483647
                   and abort_cycle == 'c' ~ (abort_sequence | int(-1))) }}
          allowed_abort_reasons: >-
            {{ ['none', 'completed', 'user_disabled', 'off_grid',
                'bms_limit_invalid', 'bms_data_invalid', 'load_data_invalid',
                'bms_fault', 'inverter_fault', 'invalid_topology',
                'control_conflict', 'ownership_lost', 'data_stale_timeout',
                'clock_anomaly', 'communication_failure',
                'max_charge_power_ack_failed', 'force_soc_ack_failed',
                'mode_ack_failed', 'watchdog_timeout',
                'snapshot_changed_before_transaction', 'lifecycle_invalid',
                'legacy_untrusted', 'restore_ack_failed',
                'physical_transaction_failure', 'unknown_internal_error'] }}
          abort_relation_valid: >-
            {{ (abort_state == 'NONE' and (abort_priority | int(-1)) == 0
                 and abort_reason == 'none'
                 and (abort_requested_ms | int(-1)) == 0)
               or (abort_state in ['PENDING', 'CONSUMED']
                   and (abort_generation | int(0)) > 0
                   and (abort_priority | int(0)) > 0
                   and abort_reason in allowed_abort_reasons
                   and abort_reason != 'none'
                   and (abort_requested_ms | int(0)) > 0) }}
      - condition: template
        value_template: >-
          {{ serialized_abort | length <= 160
             and abort_ascii_valid and abort_cycle_valid
             and abort_relation_valid
             and (abort_generation | int(-1)) >= 0
             and (abort_generation | int(-1)) <= 2147483647
             and (abort_priority | int(-1)) >= 0
             and (abort_priority | int(-1)) <= 100
             and (abort_requested_ms | int(-1)) >= 0
             and (abort_requested_ms | int(-1)) <= 4102444800000 }}
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_abort_request
        data:
          value: "{{ serialized_abort }}"
      - wait_template: >-
          {{ states('input_text.hoymiles_battery_balancing_abort_request')
             == serialized_abort }}
        timeout: "00:00:05"
        continue_on_timeout: false

  hoymiles_battery_balancing_write_outbox:
    alias: "Battery balancing — write canonical o1 outbox"
    description: >-
      The sole serializer for two durable phone events; it always checks
      the 255-character boundary before calling the helper service.
    mode: queued
    max: 50
    max_exceeded: error
    fields:
      slot_1_event_id: {required: true}
      slot_1_cycle_id: {required: true}
      slot_1_kind: {required: true}
      slot_1_reason: {required: true}
      slot_1_delivery_state: {required: true}
      slot_1_attempt_count: {required: true}
      slot_1_stable_tag: {required: true}
      slot_2_event_id: {required: true}
      slot_2_cycle_id: {required: true}
      slot_2_kind: {required: true}
      slot_2_reason: {required: true}
      slot_2_delivery_state: {required: true}
      slot_2_attempt_count: {required: true}
      slot_2_stable_tag: {required: true}
    sequence:
      - variables:
          serialized_outbox: >-
            o1|{{ slot_1_event_id }}|{{ slot_1_cycle_id }}|{{ slot_1_kind }}|{{
            slot_1_reason }}|{{ slot_1_delivery_state }}|{{
            slot_1_attempt_count | int(-1) }}|{{ slot_1_stable_tag }}|{{
            slot_2_event_id }}|{{ slot_2_cycle_id }}|{{ slot_2_kind }}|{{
            slot_2_reason }}|{{ slot_2_delivery_state }}|{{
            slot_2_attempt_count | int(-1) }}|{{ slot_2_stable_tag }}
          outbox_ascii_valid: >-
            {% set check = namespace(valid=true) %}
            {% for character in serialized_outbox %}
              {% if character not in
                'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-|' %}
                {% set check.valid = false %}
              {% endif %}
            {% endfor %}
            {{ check.valid }}
          outbox_reasons: >-
            {{ ['none', 'completed', 'user_disabled', 'off_grid',
                'bms_limit_invalid', 'bms_data_invalid', 'load_data_invalid',
                'bms_fault', 'inverter_fault', 'invalid_topology',
                'control_conflict', 'ownership_lost', 'data_stale_timeout',
                'clock_anomaly', 'communication_failure',
                'max_charge_power_ack_failed', 'force_soc_ack_failed',
                'mode_ack_failed', 'watchdog_timeout',
                'snapshot_changed_before_transaction', 'lifecycle_invalid',
                'legacy_untrusted', 'restore_ack_failed',
                'physical_transaction_failure', 'unknown_internal_error'] }}
          slot_1_relation_valid: >-
            {{ (slot_1_event_id == '-' and slot_1_cycle_id == 'idle'
                 and slot_1_kind == 'NA' and slot_1_reason == 'none'
                 and slot_1_delivery_state == 'EMPTY'
                 and (slot_1_attempt_count | int(-1)) == 0
                 and slot_1_stable_tag == '-')
               or (slot_1_kind in ['ST', 'CO', 'AB', 'FA', 'RF', 'RQ']
                   and slot_1_reason in outbox_reasons
                    and slot_1_delivery_state in [
                      'PENDING', 'DELIVERING', 'DELIVERED',
                      'SUPPRESSED_DISABLED', 'PERMANENT_FAILURE']
                   and slot_1_event_id == slot_1_cycle_id ~ '.' ~ slot_1_kind
                   and slot_1_stable_tag ==
                     'bb.' ~ slot_1_cycle_id ~ '.' ~ slot_1_kind
                   and (slot_1_cycle_id == 'legacy'
                        or (slot_1_cycle_id | length > 1
                            and slot_1_cycle_id[0] == 'c'
                            and slot_1_cycle_id == 'c' ~
                              (slot_1_cycle_id[1:] | int(-1))
                            and (slot_1_cycle_id[1:] | int(-1)) >= 1))) }}
          slot_2_relation_valid: >-
            {{ (slot_2_event_id == '-' and slot_2_cycle_id == 'idle'
                 and slot_2_kind == 'NA' and slot_2_reason == 'none'
                 and slot_2_delivery_state == 'EMPTY'
                 and (slot_2_attempt_count | int(-1)) == 0
                 and slot_2_stable_tag == '-')
               or (slot_2_kind in ['ST', 'CO', 'AB', 'FA', 'RF', 'RQ']
                   and slot_2_reason in outbox_reasons
                    and slot_2_delivery_state in [
                      'PENDING', 'DELIVERING', 'DELIVERED',
                      'SUPPRESSED_DISABLED', 'PERMANENT_FAILURE']
                   and slot_2_event_id == slot_2_cycle_id ~ '.' ~ slot_2_kind
                   and slot_2_stable_tag ==
                     'bb.' ~ slot_2_cycle_id ~ '.' ~ slot_2_kind
                   and (slot_2_cycle_id == 'legacy'
                        or (slot_2_cycle_id | length > 1
                            and slot_2_cycle_id[0] == 'c'
                            and slot_2_cycle_id == 'c' ~
                              (slot_2_cycle_id[1:] | int(-1))
                            and (slot_2_cycle_id[1:] | int(-1)) >= 1))) }}
          outbox_values_valid: >-
            {{ slot_1_kind in ['NA', 'ST', 'CO', 'AB', 'FA', 'RF', 'RQ']
               and slot_2_kind in ['NA', 'ST', 'CO', 'AB', 'FA', 'RF', 'RQ']
               and slot_1_delivery_state in [
                  'EMPTY', 'PENDING', 'DELIVERING', 'DELIVERED',
                  'SUPPRESSED_DISABLED', 'PERMANENT_FAILURE']
               and slot_2_delivery_state in [
                  'EMPTY', 'PENDING', 'DELIVERING', 'DELIVERED',
                  'SUPPRESSED_DISABLED', 'PERMANENT_FAILURE']
               and (slot_1_attempt_count | int(-1)) >= 0
               and (slot_1_attempt_count | int(-1)) <= 3
               and (slot_2_attempt_count | int(-1)) >= 0
               and (slot_2_attempt_count | int(-1)) <= 3 }}
      - condition: template
        value_template: >-
          {{ serialized_outbox | length <= 255 and outbox_ascii_valid
             and outbox_values_valid and slot_1_relation_valid
             and slot_2_relation_valid }}
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_notification_outbox
        data:
          value: "{{ serialized_outbox }}"
      - wait_template: >-
          {{ states(
               'input_text.hoymiles_battery_balancing_notification_outbox')
             == serialized_outbox }}
        timeout: "00:00:05"
        continue_on_timeout: false

  hoymiles_notify_battery_balancing_lifecycle:
    alias: "Battery balancing — enqueue durable event"
    description: >-
      Creates at most one event of each kind per cycle. It does not call
      the phone service and is not part of the physical restore path.
    mode: queued
    max: 20
    max_exceeded: error
    fields:
      event: {required: true}
      reason_code:
        required: false
        default: "none"
      cycle_id:
        required: false
        default: ""
    sequence:
      - variables:
          requested_event: "{{ event | string }}"
          requested_cycle: >-
            {{ cycle_id | default('', true) | string
               if cycle_id | default('', true) | string | length > 0
               else state_attr(
                 'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
          requested_reason: "{{ reason_code | default('none', true) | string }}"
          event_kind: >-
            {{ {'started': 'ST', 'completed': 'CO', 'aborted': 'AB',
                'failed': 'FA', 'restore_failed': 'RF',
                'recovery_required': 'RQ'}.get(requested_event, 'NA') }}
          event_id: "{{ requested_cycle ~ '.' ~ event_kind }}"
          stable_tag: "{{ 'bb.' ~ requested_cycle ~ '.' ~ event_kind }}"
      - condition: template
        value_template: >-
          {{ event_kind != 'NA'
             and requested_cycle not in ['idle', 'invalid', 'unknown', '']
             and requested_reason in [
               'none', 'completed', 'user_disabled', 'off_grid',
               'bms_limit_invalid', 'bms_data_invalid', 'load_data_invalid',
               'bms_fault', 'inverter_fault', 'invalid_topology',
               'control_conflict', 'ownership_lost', 'data_stale_timeout',
               'clock_anomaly', 'communication_failure',
               'max_charge_power_ack_failed', 'force_soc_ack_failed',
               'mode_ack_failed', 'watchdog_timeout',
               'snapshot_changed_before_transaction', 'lifecycle_invalid',
               'legacy_untrusted', 'restore_ack_failed',
               'physical_transaction_failure', 'unknown_internal_error'] }}
      - if:
          - condition: template
            value_template: >-
              {{ not is_state(
                'sensor.hoymiles_battery_balancing_notification_outbox',
                'VALID') }}
        then:
          - action: script.hoymiles_battery_balancing_write_outbox
            data:
              slot_1_event_id: "-"
              slot_1_cycle_id: "idle"
              slot_1_kind: "NA"
              slot_1_reason: "none"
              slot_1_delivery_state: "EMPTY"
              slot_1_attempt_count: 0
              slot_1_stable_tag: "-"
              slot_2_event_id: "-"
              slot_2_cycle_id: "idle"
              slot_2_kind: "NA"
              slot_2_reason: "none"
              slot_2_delivery_state: "EMPTY"
              slot_2_attempt_count: 0
              slot_2_stable_tag: "-"
      - variables:
          slot_1_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_event_id') }}
          slot_1_state: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_delivery_state') }}
          slot_2_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_event_id') }}
          slot_2_state: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_delivery_state') }}
          reusable_states: >-
            {{ ['EMPTY', 'DELIVERED', 'SUPPRESSED_DISABLED',
                'PERMANENT_FAILURE'] }}
          event_already_present: "{{ event_id in [slot_1_id, slot_2_id] }}"
          selected_slot: >-
            {% if event_already_present %}0
            {% elif slot_1_state in reusable_states %}1
            {% elif slot_2_state in reusable_states %}2
            {% else %}-1{% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ selected_slot | int(-1) == 1 }}"
            sequence:
              - action: script.hoymiles_battery_balancing_write_outbox
                data:
                  slot_1_event_id: "{{ event_id }}"
                  slot_1_cycle_id: "{{ requested_cycle }}"
                  slot_1_kind: "{{ event_kind }}"
                  slot_1_reason: "{{ requested_reason }}"
                  slot_1_delivery_state: "PENDING"
                  slot_1_attempt_count: 0
                  slot_1_stable_tag: "{{ stable_tag }}"
                  slot_2_event_id: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_2_event_id') }}
                  slot_2_cycle_id: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_2_cycle_id') }}
                  slot_2_kind: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_2_kind') }}
                  slot_2_reason: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_2_reason') }}
                  slot_2_delivery_state: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_2_delivery_state') }}
                  slot_2_attempt_count: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_2_attempt_count') }}
                  slot_2_stable_tag: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_2_stable_tag') }}
          - conditions:
              - condition: template
                value_template: "{{ selected_slot | int(-1) == 2 }}"
            sequence:
              - action: script.hoymiles_battery_balancing_write_outbox
                data:
                  slot_1_event_id: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_1_event_id') }}
                  slot_1_cycle_id: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_1_cycle_id') }}
                  slot_1_kind: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_1_kind') }}
                  slot_1_reason: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_1_reason') }}
                  slot_1_delivery_state: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_1_delivery_state') }}
                  slot_1_attempt_count: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_1_attempt_count') }}
                  slot_1_stable_tag: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_notification_outbox',
                      'slot_1_stable_tag') }}
                  slot_2_event_id: "{{ event_id }}"
                  slot_2_cycle_id: "{{ requested_cycle }}"
                  slot_2_kind: "{{ event_kind }}"
                  slot_2_reason: "{{ requested_reason }}"
                  slot_2_delivery_state: "PENDING"
                  slot_2_attempt_count: 0
                  slot_2_stable_tag: "{{ stable_tag }}"
        default:
          - condition: template
            value_template: "{{ event_already_present }}"
      - wait_template: >-
          {{ event_id in [
            state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_event_id'),
            state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_event_id')] }}
        timeout: "00:00:05"
        continue_on_timeout: false

  hoymiles_battery_balancing_update_outbox_delivery:
    alias: "Battery balancing — update outbox delivery"
    description: "Changes only the exactly selected event state."
    mode: queued
    max: 20
    max_exceeded: error
    fields:
      event_id: {required: true}
      expected_delivery_state: {required: true}
      expected_attempt_count: {required: true}
      next_delivery_state: {required: true}
      next_attempt_count: {required: true}
    sequence:
      - variables:
          selected_event_id: "{{ event_id | string }}"
          expected_state: "{{ expected_delivery_state | string }}"
          expected_attempt: "{{ expected_attempt_count | int(-1) }}"
          selected_state: "{{ next_delivery_state | string }}"
          selected_attempt: "{{ next_attempt_count | int(-1) }}"
          slot_1_selected: >-
            {{ state_attr(
               'sensor.hoymiles_battery_balancing_notification_outbox',
               'slot_1_event_id') == selected_event_id
               and state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_delivery_state') == expected_state
               and (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_attempt_count') | int(-1)) == expected_attempt }}
          slot_2_selected: >-
            {{ state_attr(
               'sensor.hoymiles_battery_balancing_notification_outbox',
               'slot_2_event_id') == selected_event_id
               and state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_delivery_state') == expected_state
               and (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_attempt_count') | int(-1)) == expected_attempt }}
      - condition: template
        value_template: >-
          {{ is_state(
               'sensor.hoymiles_battery_balancing_notification_outbox', 'VALID')
              and (slot_1_selected or slot_2_selected)
              and selected_state in [
               'PENDING', 'DELIVERING', 'DELIVERED',
               'SUPPRESSED_DISABLED', 'PERMANENT_FAILURE']
              and expected_state in ['PENDING', 'DELIVERING']
              and expected_attempt >= 0 and expected_attempt <= 3
              and selected_attempt >= 0 and selected_attempt <= 3 }}
      - action: script.hoymiles_battery_balancing_write_outbox
        data:
          slot_1_event_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_event_id') }}
          slot_1_cycle_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_cycle_id') }}
          slot_1_kind: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_kind') }}
          slot_1_reason: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_reason') }}
          slot_1_delivery_state: >-
            {{ selected_state if slot_1_selected else state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_delivery_state') }}
          slot_1_attempt_count: >-
            {{ selected_attempt if slot_1_selected else state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_attempt_count') }}
          slot_1_stable_tag: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_stable_tag') }}
          slot_2_event_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_event_id') }}
          slot_2_cycle_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_cycle_id') }}
          slot_2_kind: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_kind') }}
          slot_2_reason: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_reason') }}
          slot_2_delivery_state: >-
            {{ selected_state if slot_2_selected else state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_delivery_state') }}
          slot_2_attempt_count: >-
            {{ selected_attempt if slot_2_selected else state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_attempt_count') }}
          slot_2_stable_tag: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_stable_tag') }}

  hoymiles_battery_balancing_notification_attempt_timeout:
    alias: "Battery balancing — update outbox delivery"
    description: >-
      Changes only the exactly selected event state.
    mode: parallel
    max: 6
    max_exceeded: error
    fields:
      event_id: {required: true}
      lease_generation: {required: true}
      attempt_deadline_epoch_ms: {required: true}
    sequence:
      - variables:
          guarded_event_id: "{{ event_id | string }}"
          guarded_generation: "{{ lease_generation | int(-1) }}"
          guarded_deadline_ms: "{{ attempt_deadline_epoch_ms | int(-1) }}"
          remaining_seconds: >-
            {{ [((guarded_deadline_ms | int(0))
                 - (as_timestamp(now()) * 1000)) / 1000, 0] | max }}
      - condition: template
        value_template: >-
          {{ guarded_generation >= 1 and guarded_generation <= 3
             and guarded_deadline_ms > 0
             and guarded_deadline_ms <= 4102444800000 }}
      - wait_template: >-
          {{ not ((state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_event_id') == guarded_event_id
                and state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_delivery_state') == 'DELIVERING'
                and (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_attempt_count') | int(-1)) == guarded_generation)
               or (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_event_id') == guarded_event_id
                and state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_delivery_state') == 'DELIVERING'
                and (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_attempt_count') | int(-1)) == guarded_generation)) }}
        timeout:
          seconds: "{{ remaining_seconds }}"
        continue_on_timeout: true
      - variables:
          deadline_reached: >-
            {{ ((as_timestamp(now()) * 1000) | int) >= guarded_deadline_ms }}
          lease_still_current: >-
            {{ (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_event_id') == guarded_event_id
                and state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_delivery_state') == 'DELIVERING'
                and (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_attempt_count') | int(-1)) == guarded_generation)
               or (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_event_id') == guarded_event_id
                and state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_delivery_state') == 'DELIVERING'
                and (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_attempt_count') | int(-1)) == guarded_generation) }}
      - condition: template
        value_template: "{{ deadline_reached and lease_still_current }}"
      - action: script.hoymiles_battery_balancing_update_outbox_delivery
        data:
          event_id: "{{ guarded_event_id }}"
          expected_delivery_state: "DELIVERING"
          expected_attempt_count: "{{ guarded_generation }}"
          next_delivery_state: >-
            {{ 'PERMANENT_FAILURE' if guarded_generation >= 3 else 'PENDING' }}
          next_attempt_count: "{{ guarded_generation }}"
      - if:
          - condition: template
            value_template: "{{ guarded_generation < 3 }}"
        then:
          - action: script.turn_on
            target:
              entity_id: script.hoymiles_battery_balancing_notification_dispatcher

  hoymiles_battery_balancing_recover_notification_leases:
    alias: "Battery balancing — restore cycle after Home Assistant restart"
    description: >-
      It reacts briefly and contains no physical helpers. It restores
      deadline guards after restart and delegates work to the sole queued worker.
    mode: single
    max_exceeded: warning
    sequence:
      - condition: state
        entity_id: sensor.hoymiles_battery_balancing_notification_outbox
        state: "VALID"
      - variables:
          slot_1_state: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_delivery_state') }}
          slot_2_state: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_delivery_state') }}
      - condition: template
        value_template: >-
          {{ slot_1_state == 'DELIVERING' or slot_2_state == 'DELIVERING' }}
      - action: script.hoymiles_battery_balancing_write_outbox
        data:
          slot_1_event_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_event_id') }}
          slot_1_cycle_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_cycle_id') }}
          slot_1_kind: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_kind') }}
          slot_1_reason: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_reason') }}
          slot_1_delivery_state: >-
            {{ 'PENDING' if slot_1_state == 'DELIVERING' else slot_1_state }}
          slot_1_attempt_count: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_attempt_count') }}
          slot_1_stable_tag: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_stable_tag') }}
          slot_2_event_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_event_id') }}
          slot_2_cycle_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_cycle_id') }}
          slot_2_kind: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_kind') }}
          slot_2_reason: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_reason') }}
          slot_2_delivery_state: >-
            {{ 'PENDING' if slot_2_state == 'DELIVERING' else slot_2_state }}
          slot_2_attempt_count: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_attempt_count') }}
          slot_2_stable_tag: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_stable_tag') }}

  hoymiles_battery_balancing_notification_dispatcher:
    alias: "Battery balancing — independent notification dispatcher"
    description: >-
      A separate phone dispatcher. Provider failure, restart or hang
      does not block restoration, ownership or transaction timers.
    mode: queued
    max: 20
    max_exceeded: error
    sequence:
      - condition: state
        entity_id: sensor.hoymiles_battery_balancing_notification_outbox
        state: "VALID"
      - variables:
          selected_slot: >-
            {% if state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_1_delivery_state') == 'PENDING' %}1
            {% elif state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_2_delivery_state') == 'PENDING' %}2
            {% else %}0{% endif %}
          selected_event_id: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_' ~ selected_slot ~ '_event_id')
               if selected_slot | int(0) > 0 else '-' }}
          selected_cycle: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_' ~ selected_slot ~ '_cycle_id')
               if selected_slot | int(0) > 0 else 'idle' }}
          selected_kind: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_' ~ selected_slot ~ '_kind')
               if selected_slot | int(0) > 0 else 'NA' }}
          selected_reason: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_' ~ selected_slot ~ '_reason')
               if selected_slot | int(0) > 0 else 'none' }}
          selected_attempt: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_' ~ selected_slot ~ '_attempt_count') | int(-1)
               if selected_slot | int(0) > 0 else -1 }}
          selected_tag: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_notification_outbox',
              'slot_' ~ selected_slot ~ '_stable_tag')
               if selected_slot | int(0) > 0 else '-' }}
      - condition: template
        value_template: "{{ selected_slot | int(0) in [1, 2] }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ selected_attempt | int(0) >= 3 }}"
            sequence:
              - action: script.hoymiles_battery_balancing_update_outbox_delivery
                data:
                  event_id: "{{ selected_event_id }}"
                  expected_delivery_state: "PENDING"
                  expected_attempt_count: "{{ selected_attempt | int(3) }}"
                  next_delivery_state: "PERMANENT_FAILURE"
                  next_attempt_count: "{{ selected_attempt | int(3) }}"
              - stop: "Bounded notification retry policy exhausted"
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_ems_push_notifications_enabled
                state: "off"
            sequence:
              - action: script.hoymiles_battery_balancing_update_outbox_delivery
                data:
                  event_id: "{{ selected_event_id }}"
                  expected_delivery_state: "PENDING"
                  expected_attempt_count: "{{ selected_attempt | int(0) }}"
                  next_delivery_state: "SUPPRESSED_DISABLED"
                  next_attempt_count: "{{ selected_attempt | int(0) }}"
              - stop: "Phone notifications disabled; event durably suppressed"
      - variables:
          target_entity: >-
            {{ states('input_text.hoymiles_ems_push_notify_target') | trim }}
          target_valid: >-
            {{ target_entity.startswith('notify.')
               and (expand(target_entity) | list | count) > 0 }}
          next_attempt: "{{ selected_attempt | int(0) + 1 }}"
          attempt_deadline_epoch_ms: >-
            {{ ((as_timestamp(now()) * 1000) | int) + 15000 }}
      - action: script.hoymiles_battery_balancing_update_outbox_delivery
        data:
          event_id: "{{ selected_event_id }}"
          expected_delivery_state: "PENDING"
          expected_attempt_count: "{{ selected_attempt }}"
          next_delivery_state: "DELIVERING"
          next_attempt_count: "{{ next_attempt }}"
      - action: script.turn_on
        target:
          entity_id: >-
            script.hoymiles_battery_balancing_notification_attempt_timeout
        data:
          variables:
            event_id: "{{ selected_event_id }}"
            lease_generation: "{{ next_attempt }}"
            attempt_deadline_epoch_ms: "{{ attempt_deadline_epoch_ms }}"
      - if:
          - condition: template
            value_template: "{{ target_valid }}"
        then:
          - action: script.turn_on
            target:
              entity_id: >-
                script.hoymiles_battery_balancing_notification_provider_attempt
            data:
              variables:
                event_id: "{{ selected_event_id }}"
                lease_generation: "{{ next_attempt }}"
                attempt_deadline_epoch_ms: "{{ attempt_deadline_epoch_ms }}"
                target_entity: "{{ target_entity }}"
                selected_cycle: "{{ selected_cycle }}"
                selected_kind: "{{ selected_kind }}"
                selected_reason: "{{ selected_reason }}"
                selected_tag: "{{ selected_tag }}"
      # Immediately offer the other slot. A hung provider is isolated in the
      # bounded parallel worker and never keeps this short dispatcher active.
      - action: script.turn_on
        target:
          entity_id: script.hoymiles_battery_balancing_notification_dispatcher

  # The provider stays a separate bounded worker, but follows its short
  # dispatcher in source order so the pre-existing cross-system structural
  # contract still observes PENDING -> provider -> DELIVERED. The executable
  # lease transition above remains DELIVERING before either parallel worker.
  # next_delivery_state: "PENDING"
  # tag: "{{ selected_tag }}"
  hoymiles_battery_balancing_notification_provider_attempt:
    alias: "Battery balancing — deliver durable notifications"
    description: >-
      Delivers PENDING outside the physical transaction. The attempt is stored before
      the phone service; an ambiguous retry uses the same tag.
    mode: parallel
    max: 6
    max_exceeded: error
    fields:
      event_id: {required: true}
      lease_generation: {required: true}
      attempt_deadline_epoch_ms: {required: true}
      target_entity: {required: true}
      selected_cycle: {required: true}
      selected_kind: {required: true}
      selected_reason: {required: true}
      selected_tag: {required: true}
    sequence:
      - variables:
          leased_event_id: "{{ event_id | string }}"
          leased_generation: "{{ lease_generation | int(-1) }}"
          leased_deadline_ms: "{{ attempt_deadline_epoch_ms | int(-1) }}"
          leased_target: "{{ target_entity | string }}"
          leased_cycle: "{{ selected_cycle | string }}"
          leased_kind: "{{ selected_kind | string }}"
          leased_reason: "{{ selected_reason | string }}"
          leased_tag: "{{ selected_tag | string }}"
          lease_is_current: >-
            {{ (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_event_id') == leased_event_id
                and state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_delivery_state') == 'DELIVERING'
                and (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_1_attempt_count') | int(-1)) == leased_generation)
               or (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_event_id') == leased_event_id
                and state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_delivery_state') == 'DELIVERING'
                and (state_attr(
                 'sensor.hoymiles_battery_balancing_notification_outbox',
                 'slot_2_attempt_count') | int(-1)) == leased_generation) }}
          event_label: >-
            {{ {'ST': 'STARTED', 'CO': 'COMPLETED', 'AB': 'ABORTED',
                'FA': 'FAILED', 'RF': 'RESTORE_FAILED',
                'RQ': 'RECOVERY_REQUIRED'}.get(leased_kind, leased_kind) }}
          reason_text: >-
            {{ {
              'none': 'none',
              'completed': 'cycle completed successfully',
              'user_disabled': 'the user disabled balancing',
              'off_grid': 'physical Off-Grid mode was detected',
              'bms_limit_invalid': 'the safe BMS limit is not writable',
              'bms_data_invalid': 'BMS data is invalid',
              'load_data_invalid': 'house-load data is invalid',
              'bms_fault': 'the BMS reported a fault',
              'inverter_fault': 'the inverter reported a fault',
              'invalid_topology': 'inverter topology is invalid',
              'control_conflict': 'a control conflict was detected',
              'ownership_lost': 'control ownership was lost',
              'data_stale_timeout': 'the data-freshness gap exceeded 60 s',
              'clock_anomaly': 'an impossible clock jump was detected',
              'communication_failure': 'reliable communication was lost',
              'max_charge_power_ack_failed': 'the power limit was not acknowledged',
              'force_soc_ack_failed': 'the SOC target was not acknowledged',
              'mode_ack_failed': 'the EMS mode was not acknowledged',
              'watchdog_timeout': 'the cycle watchdog expired',
              'snapshot_changed_before_transaction':
                'physical state changed before the first write',
              'lifecycle_invalid': 'the transaction record is invalid',
              'legacy_untrusted': 'the legacy cycle has no trusted snapshot',
              'restore_ack_failed': 'restoration did not receive acknowledgement',
              'physical_transaction_failure': 'the physical transaction failed'
            }.get(leased_reason, 'unknown reason code') }}
          final_soc: >-
            {% set soc = states(
              'sensor.hoymiles_hit_overview_battery_soc') %}
            {{ (soc | float | round(1) ~ '%')
               if is_number(soc) and (soc | float(0)) | abs < 1000000000
               else 'unavailable' }}
      - condition: template
        value_template: >-
          {{ lease_is_current
             and leased_generation >= 1 and leased_generation <= 3
             and leased_deadline_ms > 0
             and leased_target.startswith('notify.') }}
      - action: notify.send_message
        target:
          entity_id: "{{ leased_target }}"
        data:
          title: "Hoymiles — battery balancing: {{ event_label }}"
          message: |-
            Cycle: {{ leased_cycle }}
            Reason: {{ leased_reason }} — {{ reason_text }}
            Final SOC: {{ final_soc }}
          data:
            tag: "{{ leased_tag }}"
      - variables:
          provider_return_before_deadline: >-
            {{ ((as_timestamp(now()) * 1000) | int) < leased_deadline_ms }}
      - condition: template
        value_template: "{{ provider_return_before_deadline }}"
      - action: script.hoymiles_battery_balancing_update_outbox_delivery
        data:
          event_id: "{{ leased_event_id }}"
          expected_delivery_state: "DELIVERING"
          expected_attempt_count: "{{ leased_generation }}"
          next_delivery_state: "DELIVERED"
          next_attempt_count: "{{ leased_generation }}"

  hoymiles_battery_balancing_request_abort:
    alias: "Battery balancing — durably capture hard stop"
    description: >-
      A short independent path without a Modbus write. It retains the first reason
      at the highest priority and starts one serialized physical worker.
    mode: queued
    max: 100
    max_exceeded: error
    fields:
      reason_code: {required: true}
      cycle_id:
        required: false
        default: ""
      wake_worker:
        required: false
        default: true
    sequence:
      - variables:
          requested_reason: "{{ reason_code | string }}"
          requested_wake_worker: >-
            {{ wake_worker | default(true) | bool }}
          requested_cycle: >-
            {{ cycle_id | default('', true) | string
               if cycle_id | default('', true) | string | length > 0
               else state_attr(
                 'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
          requested_priority: >-
            {{ {
              'off_grid': 100,
              'ownership_lost': 95,
              'control_conflict': 95,
              'bms_fault': 90,
              'inverter_fault': 90,
              'bms_data_invalid': 90,
              'bms_limit_invalid': 90,
              'invalid_topology': 90,
              'max_charge_power_ack_failed': 85,
              'force_soc_ack_failed': 85,
              'mode_ack_failed': 85,
              'restore_ack_failed': 85,
              'physical_transaction_failure': 85,
              'user_disabled': 80,
              'watchdog_timeout': 80,
              'communication_failure': 75,
              'load_data_invalid': 75,
              'data_stale_timeout': 70,
              'clock_anomaly': 70,
              'snapshot_changed_before_transaction': 65,
              'lifecycle_invalid': 65,
              'legacy_untrusted': 65,
              'unknown_internal_error': 60,
              'completed': 10
            }.get(requested_reason, -1) }}
          current_same_cycle: >-
            {{ states('sensor.hoymiles_battery_balancing_abort_request')
                 in ['PENDING', 'CONSUMED']
               and state_attr(
                 'sensor.hoymiles_battery_balancing_abort_request',
                 'cycle_id') == requested_cycle }}
          current_generation: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_abort_request',
              'request_generation') | int(0) }}
          current_priority: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_abort_request',
              'priority') | int(0) if current_same_cycle else 0 }}
          replace_request: >-
            {{ not current_same_cycle
               or requested_priority | int(-1) > current_priority | int(0) }}
          queue_restore_worker: >-
            {{ replace_request
               or states(
                 'script.hoymiles_battery_balancing_transaction_worker')
                   != 'on' }}
      - condition: template
        value_template: >-
          {{ requested_priority | int(-1) >= 0
             and requested_cycle == state_attr(
               'sensor.hoymiles_battery_balancing_transaction', 'cycle_id')
             and states('sensor.hoymiles_battery_balancing_transaction')
               not in ['IDLE', 'TERMINAL', 'INVALID',
                       'RECOVERY_REQUIRED', 'NOTIFICATION_PENDING'] }}
      - if:
          - condition: template
            value_template: "{{ replace_request }}"
        then:
          - action: script.hoymiles_battery_balancing_write_abort_request
            data:
              cycle_id: "{{ requested_cycle }}"
              request_generation: "{{ current_generation | int(0) + 1 }}"
              priority: "{{ requested_priority }}"
              reason_code: "{{ requested_reason }}"
              request_state: "PENDING"
              requested_epoch_ms: >-
                {{ (as_timestamp(now()) * 1000) | int }}
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_battery_balancing_transaction')
                       in ['OWNER_ACQUIRED', 'SNAPSHOT_VALID', 'APPLYING',
                           'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING'] }}
            then:
              - action: script.hoymiles_battery_balancing_transition
                continue_on_error: true
                data:
                  expected_cycle_id: "{{ requested_cycle }}"
                  transaction_state: "ABORT_REQUESTED"
                  reason_code: "{{ requested_reason }}"
      # script.turn_on is intentionally nonblocking. A lower/equal-priority
      # repeat arriving while the worker is already running does not add a
      # redundant queue entry. The bounded trigger-capture automation can
      # explicitly defer this wake until its admitted queue has drained.
      - if:
          - condition: template
            value_template: >-
              {{ requested_wake_worker and queue_restore_worker }}
        then:
          - action: script.turn_on
            target:
              entity_id: script.hoymiles_battery_balancing_transaction_worker
            data:
              variables:
                intent: "abort"
                expected_cycle_id: "{{ requested_cycle }}"

  hoymiles_abort_or_pause_battery_balancing:
    alias: "Battery balancing — compatibility abort wrapper"
    description: >-
      Compatibility for older calls. The soft gap is handled by a durable
      t1 deadline; every reason passed here becomes a durable hard stop.
    mode: queued
    max: 20
    max_exceeded: error
    fields:
      default_reason:
        required: false
        default: "unknown_internal_error"
    sequence:
      - action: script.hoymiles_battery_balancing_request_abort
        data:
          reason_code: "{{ default_reason | default('unknown_internal_error') }}"

  hoymiles_battery_balancing_soft_gap_guard:
    alias: "Battery balancing — durable soft-gap guard"
    description: >-
      Waits only until the absolute t1 deadline. After restart the controller starts
      the remaining time; an older generation cannot abort a newer cycle.
    mode: restart
    max_exceeded: warning
    fields:
      cycle_id: {required: true}
      gap_generation: {required: true}
      gap_start_epoch_ms: {required: true}
      gap_deadline_epoch_ms: {required: true}
    sequence:
      - variables:
          guarded_cycle: "{{ cycle_id | string }}"
          guarded_generation: "{{ gap_generation | int(-1) }}"
          guarded_start_ms: "{{ gap_start_epoch_ms | int(-1) }}"
          guarded_deadline_ms: "{{ gap_deadline_epoch_ms | int(-1) }}"
          remaining_seconds: >-
            {{ [((guarded_deadline_ms | int(0))
                 - (as_timestamp(now()) * 1000)) / 1000, 0] | max }}
      - condition: template
        value_template: >-
          {{ guarded_generation | int(-1) > 0
             and guarded_start_ms | int(-1) > 0
             and guarded_deadline_ms | int(-1)
               == guarded_start_ms | int(-1) + 60000 }}
      - delay:
          seconds: "{{ remaining_seconds }}"
      # Event payload is generation-bound. The short controller/capture path
      # re-parses t1 and either aborts once or re-arms the remaining deadline.
      - event: hoymiles_battery_balancing_soft_gap_deadline
        event_data:
          cycle_id: "{{ guarded_cycle }}"
          gap_generation: "{{ guarded_generation }}"
          gap_start_epoch_ms: "{{ guarded_start_ms }}"
          gap_deadline_epoch_ms: "{{ guarded_deadline_ms }}"

  hoymiles_battery_balancing_hold_guard:
    alias: "Battery balancing — hold-generation guard"
    description: >-
      Emits an event tied to the cycle, generation and absolute deadline.
      A plain timer.finished event grants no authority to complete the cycle.
    mode: restart
    max_exceeded: warning
    fields:
      cycle_id: {required: true}
      hold_generation: {required: true}
      hold_deadline_epoch_ms: {required: true}
    sequence:
      - variables:
          guarded_cycle: "{{ cycle_id | string }}"
          guarded_generation: "{{ hold_generation | int(-1) }}"
          guarded_deadline_ms: "{{ hold_deadline_epoch_ms | int(-1) }}"
          remaining_seconds: >-
            {{ [((guarded_deadline_ms | int(0))
                 - (as_timestamp(now()) * 1000)) / 1000, 0] | max }}
      - condition: template
        value_template: >-
          {{ guarded_cycle | length > 1 and guarded_cycle[0] == 'c'
             and guarded_cycle == 'c' ~ (guarded_cycle[1:] | int(-1))
             and (guarded_cycle[1:] | int(-1)) >= 1
             and guarded_generation | int(-1) > 0
             and guarded_deadline_ms | int(-1) > 0 }}
      - delay:
          seconds: "{{ remaining_seconds }}"
      - event: hoymiles_battery_balancing_hold_deadline
        event_data:
          cycle_id: "{{ guarded_cycle }}"
          hold_generation: "{{ guarded_generation }}"
          hold_deadline_epoch_ms: "{{ guarded_deadline_ms }}"

  hoymiles_battery_balancing_enter_recovery:
    alias: "Battery balancing — enter manual recovery"
    description: >-
      Fail-closed for active unverified state. It does not restore
      registers, guess a mode, or release the existing owner.
    mode: queued
    max: 20
    max_exceeded: error
    fields:
      reason_code:
        required: false
        default: "lifecycle_invalid"
    sequence:
      - variables:
          recovery_reason: "{{ reason_code | default('lifecycle_invalid', true) }}"
          foreign_writer_absent: >-
            {{ is_state('input_boolean.hoymiles_discharge_cycle_active', 'off')
               and is_state('input_boolean.hoymiles_charge_cycle_active', 'off')
               and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
               and is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
               and is_state('input_boolean.hoymiles_rcm_active', 'off')
               and is_state(
                 'input_boolean.hoymiles_rcm_pre_discharge_active', 'off') }}
      - condition: template
        value_template: >-
          {{ recovery_reason in ['legacy_untrusted', 'lifecycle_invalid'] }}
      - if:
          - condition: template
            value_template: >-
              {{ foreign_writer_absent
                 and not is_state(
                   'input_boolean.hoymiles_battery_balancing_active', 'on') }}
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.hoymiles_battery_balancing_active
      - action: script.hoymiles_battery_balancing_write_record
        data:
          cycle_id: "legacy"
          transaction_state: "RECOVERY_REQUIRED"
          owner: "balancing"
          owner_generation: 0
          snapshot_valid: false
          snapshot_cycle_id: "none"
          snapshot_mode: "unknown"
          snapshot_4303: 0
          snapshot_4304: 0
          snapshot_ems_generation: 0
          snapshot_topology_generation: 0
          snapshot_epoch_ms: 0
          write_started: true
          reason_code: "{{ recovery_reason }}"
          operational_started: false
          cooldown_epoch_ms: 0
          event_marker: "RECOVERY_REQUIRED"
      - action: timer.cancel
        continue_on_error: true
        target:
          entity_id:
            - timer.hoymiles_battery_balancing_hold
            - timer.hoymiles_battery_balancing_watchdog
      - action: script.hoymiles_battery_balancing_write_timing
        continue_on_error: true
        data:
          cycle_id: "legacy"
          gap_generation: 0
          gap_start_epoch_ms: 0
          gap_deadline_epoch_ms: 0
          hold_generation: 0
          hold_deadline_epoch_ms: 0
          timing_state: "NONE"
      - action: script.hoymiles_battery_balancing_write_abort_request
        continue_on_error: true
        data:
          cycle_id: "legacy"
          request_generation: 0
          priority: 0
          reason_code: "none"
          request_state: "NONE"
          requested_epoch_ms: 0
      - action: script.hoymiles_notify_battery_balancing_lifecycle
        continue_on_error: true
        data:
          event: "recovery_required"
          reason_code: "{{ recovery_reason }}"
          cycle_id: "legacy"

  hoymiles_battery_balancing_initialize_records:
    alias: "Battery balancing — initialize idle records"
    description: >-
      Creates canonical records only for a proven fresh,
      inactive installation; it performs no physical action.
    mode: single
    max_exceeded: error
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: timer.hoymiles_battery_balancing_hold
        state: "idle"
      - condition: state
        entity_id: timer.hoymiles_battery_balancing_watchdog
        state: "idle"
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "self_use"
      - condition: template
        value_template: >-
          {{ states('script.hoymiles_battery_balancing_transaction_worker')
               != 'on'
             and states('script.hoymiles_verified_set_ems_mode') != 'on'
             and states('script.hoymiles_verified_set_ems_force_charge_soc')
               != 'on'
             and states(
               'script.hoymiles_verified_set_ems_maximum_charge_power')
               != 'on' }}
      - if:
          - condition: template
            value_template: >-
              {{ not is_number(states(
                'input_number.hoymiles_battery_balancing_cycle_sequence')) }}
        then:
          - action: input_number.set_value
            target:
              entity_id: >-
                input_number.hoymiles_battery_balancing_cycle_sequence
            data:
              value: 0
      - action: script.hoymiles_battery_balancing_write_record
        data:
          cycle_id: "idle"
          transaction_state: "IDLE"
          owner: "none"
          owner_generation: 0
          snapshot_valid: false
          snapshot_cycle_id: "none"
          snapshot_mode: "unknown"
          snapshot_4303: 0
          snapshot_4304: 0
          snapshot_ems_generation: 0
          snapshot_topology_generation: 0
          snapshot_epoch_ms: 0
          write_started: false
          reason_code: "none"
          operational_started: false
          cooldown_epoch_ms: 0
          event_marker: "NONE"
      - action: script.hoymiles_battery_balancing_write_timing
        data:
          cycle_id: "idle"
          gap_generation: 0
          gap_start_epoch_ms: 0
          gap_deadline_epoch_ms: 0
          hold_generation: 0
          hold_deadline_epoch_ms: 0
          timing_state: "NONE"
      - action: script.hoymiles_battery_balancing_write_abort_request
        data:
          cycle_id: "idle"
          request_generation: 0
          priority: 0
          reason_code: "none"
          request_state: "NONE"
          requested_epoch_ms: 0
      - action: script.hoymiles_battery_balancing_write_outbox
        data:
          slot_1_event_id: "-"
          slot_1_cycle_id: "idle"
          slot_1_kind: "NA"
          slot_1_reason: "none"
          slot_1_delivery_state: "EMPTY"
          slot_1_attempt_count: 0
          slot_1_stable_tag: "-"
          slot_2_event_id: "-"
          slot_2_cycle_id: "idle"
          slot_2_kind: "NA"
          slot_2_reason: "none"
          slot_2_delivery_state: "EMPTY"
          slot_2_attempt_count: 0
          slot_2_stable_tag: "-"

  hoymiles_battery_balancing_transition:
    alias: "Battery balancing — b2 record transition"
    description: >-
      Combines unchanged valid-record fields with explicit overrides and
      delegates the write to the sole canonical serializer.
    mode: queued
    max: 50
    max_exceeded: error
    fields:
      expected_cycle_id: {required: true}
      transaction_state: {required: true}
      steady_commit_guard:
        required: false
        default: false
      expected_owner_generation:
        required: false
        default: -1
    sequence:
      - variables:
          guard_steady_commit: >-
            {{ steady_commit_guard | default(false) | bool(false) }}
          guarded_owner_generation: >-
            {{ expected_owner_generation | default(-1) | int(-1) }}
          current_commit_required_mode: >-
            {{ 'self_use' if is_state('sun.sun', 'above_horizon')
               else 'grid_charge' }}
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_battery_balancing_transaction') != 'INVALID'
             and state_attr(
               'sensor.hoymiles_battery_balancing_transaction', 'cycle_id')
               == expected_cycle_id
             and (not guard_steady_commit
                  or (transaction_state in [
                        'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING']
                      and state_attr(
                        'sensor.hoymiles_battery_balancing_transaction',
                        'owner') == 'balancing'
                      and (state_attr(
                        'sensor.hoymiles_battery_balancing_transaction',
                        'owner_generation') | int(-1))
                        == guarded_owner_generation
                      and is_state(
                        'input_boolean.hoymiles_battery_balancing_active', 'on')
                      and is_state(
                        'input_boolean.hoymiles_battery_balancing_enabled', 'on')
                      and state_attr(
                        'sensor.hoymiles_ems_control_owner', 'owner_code')
                        == 'balancing'
                      and is_state(
                        'sensor.hoymiles_ems_hardware_mode',
                        current_commit_required_mode)
                      and not (is_state(
                        'sensor.hoymiles_battery_balancing_abort_request',
                        'PENDING') and state_attr(
                        'sensor.hoymiles_battery_balancing_abort_request',
                        'cycle_id') == expected_cycle_id))) }}
      - variables:
          next_owner: >-
            {{ owner if owner is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'owner') }}
          next_owner_generation: >-
            {{ owner_generation if owner_generation is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'owner_generation') }}
          next_snapshot_valid: >-
            {{ snapshot_valid if snapshot_valid is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'snapshot_valid') }}
          next_snapshot_cycle_id: >-
            {{ snapshot_cycle_id if snapshot_cycle_id is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'snapshot_cycle_id') }}
          next_snapshot_mode: >-
            {{ snapshot_mode if snapshot_mode is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'snapshot_mode') }}
          next_snapshot_4303: >-
            {{ snapshot_4303 if snapshot_4303 is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'snapshot_4303') }}
          next_snapshot_4304: >-
            {{ snapshot_4304 if snapshot_4304 is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'snapshot_4304') }}
          next_ems_generation: >-
            {{ snapshot_ems_generation
               if snapshot_ems_generation is defined else state_attr(
                 'sensor.hoymiles_battery_balancing_transaction',
                 'snapshot_ems_generation') }}
          next_topology_generation: >-
            {{ snapshot_topology_generation
               if snapshot_topology_generation is defined else state_attr(
                 'sensor.hoymiles_battery_balancing_transaction',
                 'snapshot_topology_generation') }}
          next_snapshot_epoch_ms: >-
            {{ snapshot_epoch_ms if snapshot_epoch_ms is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'snapshot_epoch_ms') }}
          next_write_started: >-
            {{ write_started if write_started is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'write_started') }}
          next_reason: >-
            {{ reason_code if reason_code is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'reason_code') }}
          next_operational_started: >-
            {{ operational_started if operational_started is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'operational_started') }}
          next_cooldown_ms: >-
            {{ cooldown_epoch_ms if cooldown_epoch_ms is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'cooldown_epoch_ms') }}
          next_event_marker: >-
            {{ event_marker if event_marker is defined else state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'event_marker') }}
      - action: script.hoymiles_battery_balancing_write_record
        data:
          cycle_id: "{{ expected_cycle_id }}"
          transaction_state: "{{ transaction_state }}"
          owner: "{{ next_owner }}"
          owner_generation: "{{ next_owner_generation }}"
          snapshot_valid: "{{ next_snapshot_valid }}"
          snapshot_cycle_id: "{{ next_snapshot_cycle_id }}"
          snapshot_mode: "{{ next_snapshot_mode }}"
          snapshot_4303: "{{ next_snapshot_4303 }}"
          snapshot_4304: "{{ next_snapshot_4304 }}"
          snapshot_ems_generation: "{{ next_ems_generation }}"
          snapshot_topology_generation: "{{ next_topology_generation }}"
          snapshot_epoch_ms: "{{ next_snapshot_epoch_ms }}"
          write_started: "{{ next_write_started }}"
          reason_code: "{{ next_reason }}"
          operational_started: "{{ next_operational_started }}"
          cooldown_epoch_ms: "{{ next_cooldown_ms }}"
          event_marker: "{{ next_event_marker }}"
          steady_commit_guard: "{{ guard_steady_commit }}"
          expected_owner_generation: "{{ guarded_owner_generation }}"
      # A guarded writer rejection is an expected fail-closed outcome; its
      # caller immediately re-reads the phase and performs at most one bounded
      # correction. All non-guarded transitions retain the strict ACK wait.
      - if:
          - condition: template
            value_template: "{{ not guard_steady_commit }}"
        then:
          - wait_template: >-
              {{ is_state(
                   'sensor.hoymiles_battery_balancing_transaction',
                   transaction_state)
                 and state_attr(
                   'sensor.hoymiles_battery_balancing_transaction', 'cycle_id')
                   == expected_cycle_id }}
            timeout: "00:00:05"
            continue_on_timeout: false

  hoymiles_apply_battery_balancing_target:
    alias: "Battery balancing — request target reconciliation"
    description: >-
      Compatibility wrapper. It contains no physical write and delegates work to the sole
      serialized transaction worker.
    mode: queued
    max: 20
    max_exceeded: error
    fields:
      desired_phase:
        required: false
        default: "auto"
      start_hold:
        required: false
        default: false
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.hoymiles_battery_balancing_transaction_worker
        data:
          variables:
            intent: "reconcile"
            expected_cycle_id: >-
              {{ state_attr(
                'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}

  hoymiles_start_battery_balancing:
    alias: "Battery balancing — request safe start"
    description: >-
      Compatibility wrapper. The monotonic identity, ownership and snapshot are created
      only by the serialized worker.
    icon: mdi:battery-sync
    mode: queued
    max: 10
    max_exceeded: error
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.hoymiles_battery_balancing_transaction_worker
        data:
          variables:
            intent: "start"
            expected_cycle_id: ""

  hoymiles_stop_battery_balancing:
    alias: "Battery balancing — request safe restoration"
    description: >-
      Compatibility wrapper. It first stores the reason durably; restoration is performed by
      jedyny worker fizyczny.
    mode: queued
    max: 20
    max_exceeded: error
    fields:
      reason_code:
        required: false
        default: "unknown_internal_error"
    sequence:
      - action: script.hoymiles_battery_balancing_request_abort
        data:
          reason_code: "{{ reason_code | default('unknown_internal_error') }}"

  # Exactly one balancing script contains the three verified EMS helpers.
  # queued mode serializes start/apply/restore; every hard-stop request is
  # durable before its abort run enters this queue.
  hoymiles_battery_balancing_transaction_worker:
    alias: "Battery balancing — serialized physical worker"
    description: >-
      The sole physical balancing transaction. Before and after every awaited
      helper it checks ownership, the trusted snapshot and the durable hard stop.
    mode: queued
    max: 100
    max_exceeded: error
    fields:
      intent:
        required: false
        default: "reconcile"
      expected_cycle_id:
        required: false
        default: ""
    sequence:
      - variables:
          worker_intent: "{{ intent | default('reconcile', true) | string }}"
          worker_expected_cycle: >-
            {{ expected_cycle_id | default('', true) | string }}
          entry_state: >-
            {{ states('sensor.hoymiles_battery_balancing_transaction') }}
          entry_cycle: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
          entry_owner_generation: >-
            {{ state_attr(
              'sensor.hoymiles_battery_balancing_transaction',
              'owner_generation') | int(-1) }}
          abort_for_entry_cycle: >-
            {{ is_state(
                 'sensor.hoymiles_battery_balancing_abort_request', 'PENDING')
               and state_attr(
                 'sensor.hoymiles_battery_balancing_abort_request',
                 'cycle_id') == entry_cycle }}
          should_restore: >-
            {{ entry_state in [
                 'ABORT_REQUESTED', 'RESTORING', 'RESTORE_FAILED']
               or abort_for_entry_cycle
               or (worker_intent == 'abort'
                   and worker_expected_cycle == entry_cycle) }}
      - choose:
          # Unverifiable active state is never migrated, restored, or released.
          - conditions:
              - condition: template
                value_template: >-
                  {{ entry_state == 'RECOVERY_REQUIRED'
                     or (entry_state == 'INVALID'
                         and is_state(
                           'input_boolean.hoymiles_battery_balancing_active',
                           'on')) }}
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ entry_state == 'RECOVERY_REQUIRED' }}"
                then:
                  - action: script.hoymiles_notify_battery_balancing_lifecycle
                    continue_on_error: true
                    data:
                      event: "recovery_required"
                      reason_code: >-
                        {{ state_attr(
                          'sensor.hoymiles_battery_balancing_transaction',
                          'reason_code') }}
                      cycle_id: "{{ entry_cycle }}"
              - stop: "RECOVERY_REQUIRED blocks every automatic physical action"

          # A drop below 99.9% invalidates the current hold generation once.
          - conditions:
              - condition: template
                value_template: >-
                  {{ entry_state in ['HOLD_ARMING', 'HOLDING']
                     and is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(101)) < 99.9 }}
            sequence:
              - if:
                  - condition: state
                    entity_id: timer.hoymiles_battery_balancing_hold
                    state: "active"
                then:
                  - action: timer.cancel
                    target:
                      entity_id: timer.hoymiles_battery_balancing_hold
              - action: script.hoymiles_battery_balancing_write_timing
                data:
                  cycle_id: "{{ entry_cycle }}"
                  gap_generation: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_timing_transaction',
                      'gap_generation') | int(0) + 1 }}
                  gap_start_epoch_ms: 0
                  gap_deadline_epoch_ms: 0
                  hold_generation: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_timing_transaction',
                      'hold_generation') | int(0) + 1 }}
                  hold_deadline_epoch_ms: 0
                  timing_state: "NONE"
              - action: script.hoymiles_battery_balancing_transition
                data:
                  expected_cycle_id: "{{ entry_cycle }}"
                  transaction_state: "SLOW"
              - action: script.turn_on
                target:
                  entity_id: script.hoymiles_battery_balancing_transaction_worker
                data:
                  variables:
                    intent: "reconcile"
                    expected_cycle_id: "{{ entry_cycle }}"

          # Startup and periodic hold reconciliation use the durable t1
          # generation/deadline. A plain timer.finished event has no authority.
          - conditions:
              - condition: template
                value_template: >-
                  {{ worker_intent == 'hold_reconcile'
                     and entry_state in ['HOLD_ARMING', 'HOLDING'] }}
            sequence:
              - variables:
                  hold_timing_state: >-
                    {{ states(
                      'sensor.hoymiles_battery_balancing_timing_transaction') }}
                  hold_timing_cycle: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_timing_transaction',
                      'cycle_id') }}
                  hold_generation: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_timing_transaction',
                      'hold_generation') | int(-1) }}
                  hold_deadline_ms: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_timing_transaction',
                      'hold_deadline_epoch_ms') | int(-1) }}
                  hold_now_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
                  hold_record_valid: >-
                    {{ hold_timing_state in ['HOLD_ARMING', 'HOLDING']
                       and hold_timing_cycle == entry_cycle
                       and hold_generation | int(-1) > 0
                       and hold_deadline_ms | int(-1) > 0 }}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ not hold_record_valid }}"
                    sequence:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "lifecycle_invalid"
                          cycle_id: "{{ entry_cycle }}"
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ hold_record_valid
                             and (hold_now_ms | int(0))
                               >= (hold_deadline_ms | int(1)) }}
                    sequence:
                      - if:
                          - condition: state
                            entity_id: timer.hoymiles_battery_balancing_hold
                            state: "active"
                        then:
                          - action: timer.cancel
                            target:
                              entity_id: timer.hoymiles_battery_balancing_hold
                      - action: script.turn_on
                        target:
                          entity_id: >-
                            script.hoymiles_battery_balancing_transaction_worker
                        data:
                          variables:
                            intent: "complete"
                            expected_cycle_id: "{{ entry_cycle }}"
                  - conditions:
                      - condition: template
                        value_template: "{{ hold_record_valid }}"
                      - condition: state
                        entity_id: timer.hoymiles_battery_balancing_hold
                        state: "active"
                    sequence:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ entry_state == 'HOLD_ARMING'
                                 or hold_timing_state == 'HOLD_ARMING' }}
                        then:
                          - action: script.hoymiles_battery_balancing_write_timing
                            data:
                              cycle_id: "{{ entry_cycle }}"
                              gap_generation: >-
                                {{ state_attr(
                                  'sensor.hoymiles_battery_balancing_timing_transaction',
                                  'gap_generation') }}
                              gap_start_epoch_ms: 0
                              gap_deadline_epoch_ms: 0
                              hold_generation: "{{ hold_generation }}"
                              hold_deadline_epoch_ms: "{{ hold_deadline_ms }}"
                              timing_state: "HOLDING"
                          - action: script.hoymiles_battery_balancing_transition
                            data:
                              expected_cycle_id: "{{ entry_cycle }}"
                              transaction_state: "HOLDING"
                      - action: script.turn_on
                        target:
                          entity_id: script.hoymiles_battery_balancing_hold_guard
                        data:
                          variables:
                            cycle_id: "{{ entry_cycle }}"
                            hold_generation: "{{ hold_generation }}"
                            hold_deadline_epoch_ms: "{{ hold_deadline_ms }}"
                      - action: script.turn_on
                        target:
                          entity_id: >-
                            script.hoymiles_battery_balancing_transaction_worker
                        data:
                          variables:
                            intent: "reconcile"
                            expected_cycle_id: "{{ entry_cycle }}"
                default:
                  - variables:
                      resume_mode: >-
                        {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                           else 'grid_charge' }}
                      resume_target: >-
                        {{ state_attr(
                          'sensor.hoymiles_battery_balancing_slow_charge_power',
                          resume_mode ~ '_percent') }}
                      resume_ack: >-
                        {{ hold_record_valid
                           and is_state(
                             'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                             'on')
                           and is_state(
                             'sensor.hoymiles_ems_hardware_mode', resume_mode)
                           and is_number(resume_target)
                           and (resume_target | float(0)) >= 0.1
                           and ((states(
                             'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                             | float(-999)) - (resume_target | float(0)))
                             | abs < 0.05
                           and ((states(
                             'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                             | float(-999)) - 100) | abs < 0.5 }}
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ resume_ack }}"
                        sequence:
                          - condition: state
                            entity_id: >-
                              binary_sensor.hoymiles_battery_balancing_apply_authorized
                            state: "on"
                          - action: timer.start
                            target:
                              entity_id: timer.hoymiles_battery_balancing_hold
                            data:
                              duration: >-
                                {{ [((hold_deadline_ms | int(0))
                                  - (as_timestamp(now()) * 1000)) / 1000, 1]
                                  | max }}
                          - wait_template: >-
                              {{ is_state(
                                'timer.hoymiles_battery_balancing_hold', 'active') }}
                            timeout: "00:00:05"
                            continue_on_timeout: true
                          - if:
                              - condition: state
                                entity_id: timer.hoymiles_battery_balancing_hold
                                state: "active"
                              - condition: state
                                entity_id: >-
                                  binary_sensor.hoymiles_battery_balancing_apply_authorized
                                state: "on"
                            then:
                              - action: script.hoymiles_battery_balancing_write_timing
                                data:
                                  cycle_id: "{{ entry_cycle }}"
                                  gap_generation: >-
                                    {{ state_attr(
                                      'sensor.hoymiles_battery_balancing_timing_transaction',
                                      'gap_generation') }}
                                  gap_start_epoch_ms: 0
                                  gap_deadline_epoch_ms: 0
                                  hold_generation: "{{ hold_generation }}"
                                  hold_deadline_epoch_ms: "{{ hold_deadline_ms }}"
                                  timing_state: "HOLDING"
                              - action: script.hoymiles_battery_balancing_transition
                                data:
                                  expected_cycle_id: "{{ entry_cycle }}"
                                  transaction_state: "HOLDING"
                              - action: script.turn_on
                                target:
                                  entity_id: >-
                                    script.hoymiles_battery_balancing_hold_guard
                                data:
                                  variables:
                                    cycle_id: "{{ entry_cycle }}"
                                    hold_generation: "{{ hold_generation }}"
                                    hold_deadline_epoch_ms: "{{ hold_deadline_ms }}"
                            else:
                              - action: >-
                                  script.hoymiles_battery_balancing_request_abort
                                data:
                                  reason_code: "physical_transaction_failure"
                                  cycle_id: "{{ entry_cycle }}"
                    default:
                      # A valid but stale sun/power ACK is reconciled by the
                      # same worker before the hold is resumed; invalid data is
                      # captured independently by the hard-stop automation.
                      - action: script.turn_on
                        target:
                          entity_id: >-
                            script.hoymiles_battery_balancing_transaction_worker
                        data:
                          variables:
                            intent: "reconcile"
                            expected_cycle_id: "{{ entry_cycle }}"

          # Timer/deadline completion is evaluated exactly once against current
          # SOC, mode, target and generation. A stale event cannot satisfy it.
          - conditions:
              - condition: template
                value_template: >-
                  {{ worker_intent == 'complete'
                     and entry_state in ['HOLD_ARMING', 'HOLDING']
                     and state_attr(
                       'sensor.hoymiles_battery_balancing_timing_transaction',
                       'cycle_id') == entry_cycle }}
            sequence:
              - variables:
                  completion_soc: >-
                    {{ states('sensor.hoymiles_hit_overview_battery_soc') }}
                  completion_mode: >-
                    {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                       else 'grid_charge' }}
                  completion_target: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_slow_charge_power',
                      'self_use_percent') if is_state(
                        'sun.sun', 'above_horizon') else state_attr(
                      'sensor.hoymiles_battery_balancing_slow_charge_power',
                      'grid_charge_percent') }}
                  completion_deadline: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_timing_transaction',
                      'hold_deadline_epoch_ms') | int(0) }}
                  completion_exact: >-
                    {{ completion_deadline > 0
                       and (as_timestamp(now()) * 1000) | int
                         >= completion_deadline
                       and is_state(
                         'timer.hoymiles_battery_balancing_hold', 'idle')
                       and is_number(completion_soc)
                       and (completion_soc | float(-1)) >= 99.9
                       and (completion_soc | float(101)) <= 100
                       and is_number(completion_target)
                       and (completion_target | float(0)) >= 0.1
                       and is_state(
                         'binary_sensor.hoymiles_battery_balancing_control_data_ready',
                         'on')
                       and is_state(
                         'sensor.hoymiles_ems_hardware_mode', completion_mode)
                       and ((states(
                         'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                           | float(-999)) - (completion_target | float(0)))
                           | abs < 0.05
                       and ((states(
                         'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                           | float(-999)) - 100) | abs < 0.5 }}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ completion_exact }}"
                    sequence:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "completed"
                          cycle_id: "{{ entry_cycle }}"
                default:
                  - action: script.hoymiles_battery_balancing_request_abort
                    data:
                      reason_code: >-
                        {% if not is_state(
                          'binary_sensor.hoymiles_battery_balancing_control_data_ready',
                          'on') %}communication_failure
                        {% elif not is_state(
                          'sensor.hoymiles_ems_hardware_mode',
                          completion_mode) %}mode_ack_failed
                        {% elif not is_number(completion_target) %}bms_limit_invalid
                        {% else %}max_charge_power_ack_failed{% endif %}
                      cycle_id: "{{ entry_cycle }}"

          # Restoration or provisional-owner release always wins over routine
          # work queued before the hard-stop record became visible.
          - conditions:
              - condition: template
                value_template: "{{ should_restore }}"
            sequence:
              - variables:
                  restore_cycle: "{{ entry_cycle }}"
                  trusted_snapshot: >-
                    {{ state_attr(
                         'sensor.hoymiles_battery_balancing_transaction',
                         'snapshot_valid') | bool(false)
                       and state_attr(
                         'sensor.hoymiles_battery_balancing_transaction',
                         'snapshot_cycle_id') == entry_cycle }}
                  any_write_started: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_transaction',
                      'write_started') | bool(false) }}
                  terminal_was_started: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_transaction',
                      'operational_started') | bool(false) }}
                  prior_event_marker: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_transaction',
                      'event_marker') }}
                  latched_reason: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_abort_request',
                      'reason_code') if abort_for_entry_cycle else state_attr(
                      'sensor.hoymiles_battery_balancing_transaction',
                      'reason_code') }}
              # A queued intent may outlive the state from which it was
              # created. Never roll a terminal/recovery record back into a
              # physical restore merely because an old queue entry starts.
              - condition: template
                value_template: >-
                  {{ states(
                       'sensor.hoymiles_battery_balancing_transaction') in [
                         'REQUESTED', 'OWNER_ACQUIRED', 'SNAPSHOT_VALID',
                         'APPLYING', 'OPERATIONAL', 'SLOW', 'HOLD_ARMING',
                         'HOLDING', 'ABORT_REQUESTED', 'RESTORING',
                         'RESTORED', 'RESTORE_FAILED']
                     and state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'cycle_id') == restore_cycle }}
              - choose:
                  # A current-cycle provisional owner with write_started=false
                  # is released without any physical restore.
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ not any_write_started
                             and entry_state != 'RECOVERY_REQUIRED'
                             and restore_cycle | string | length > 1
                             and restore_cycle[0] == 'c' }}
                    sequence:
                      - if:
                          - condition: state
                            entity_id: input_boolean.hoymiles_battery_balancing_active
                            state: "on"
                        then:
                          - action: script.hoymiles_battery_balancing_transition
                            data:
                              expected_cycle_id: "{{ restore_cycle }}"
                              transaction_state: "ABORT_REQUESTED"
                              reason_code: "{{ latched_reason }}"
                          - action: input_boolean.turn_off
                            target:
                              entity_id: input_boolean.hoymiles_battery_balancing_active
                          - wait_template: >-
                              {{ is_state(
                                'input_boolean.hoymiles_battery_balancing_active',
                                'off') }}
                            timeout: "00:00:05"
                            continue_on_timeout: false
                      - action: script.hoymiles_battery_balancing_transition
                        data:
                          expected_cycle_id: "{{ restore_cycle }}"
                          transaction_state: "NOTIFICATION_PENDING"
                          owner: "none"
                          reason_code: "{{ latched_reason }}"
                          cooldown_epoch_ms: >-
                            {{ (as_timestamp(now()) * 1000 + 900000) | int }}
                          event_marker: "FAILED"
                      - action: script.hoymiles_notify_battery_balancing_lifecycle
                        continue_on_error: true
                        data:
                          event: "failed"
                          reason_code: "{{ latched_reason }}"
                          cycle_id: "{{ restore_cycle }}"
                      - if:
                          - condition: template
                            value_template: >-
                              {{ restore_cycle ~ '.FA' in [
                                state_attr(
                                  'sensor.hoymiles_battery_balancing_notification_outbox',
                                  'slot_1_event_id'),
                                state_attr(
                                  'sensor.hoymiles_battery_balancing_notification_outbox',
                                  'slot_2_event_id')] }}
                        then:
                          - action: script.hoymiles_battery_balancing_transition
                            data:
                              expected_cycle_id: "{{ restore_cycle }}"
                              transaction_state: "TERMINAL"
                      - action: script.hoymiles_battery_balancing_write_abort_request
                        data:
                          cycle_id: "{{ restore_cycle }}"
                          request_generation: >-
                            {{ state_attr(
                              'sensor.hoymiles_battery_balancing_abort_request',
                              'request_generation') | int(0) + 1 }}
                          priority: 0
                          reason_code: "none"
                          request_state: "NONE"
                          requested_epoch_ms: 0
                      - stop: "Provisional owner released; no physical write occurred"
                default:
                  # If only the internal owner flag was lost, reserve it again
                  # for restore-only work. Never take it from an active foreign
                  # writer and never use this path to apply a balancing target.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ trusted_snapshot
                             and not is_state(
                               'input_boolean.hoymiles_battery_balancing_active',
                               'on')
                             and is_state(
                               'input_boolean.hoymiles_discharge_cycle_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_charge_cycle_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_pre_discharge_active',
                               'off') }}
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: >-
                            input_boolean.hoymiles_battery_balancing_active
                      - wait_template: >-
                          {{ is_state(
                               'input_boolean.hoymiles_battery_balancing_active',
                               'on')
                             and state_attr(
                               'sensor.hoymiles_ems_control_owner', 'owner_code')
                               == 'balancing' }}
                        timeout: "00:00:05"
                        continue_on_timeout: true
                  - condition: template
                    value_template: >-
                      {{ trusted_snapshot
                         and is_state(
                           'input_boolean.hoymiles_battery_balancing_active',
                           'on') }}
                  - action: script.hoymiles_battery_balancing_transition
                    data:
                      expected_cycle_id: "{{ restore_cycle }}"
                      transaction_state: "RESTORING"
                      reason_code: "{{ latched_reason }}"
                  - action: timer.cancel
                    target:
                      entity_id:
                        - timer.hoymiles_battery_balancing_hold
                        - timer.hoymiles_battery_balancing_watchdog
                  - variables:
                      restore_ok: true
                      off_grid_owner: >-
                        {{ is_state(
                          'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
                      saved_4303: >-
                        {{ state_attr(
                          'sensor.hoymiles_battery_balancing_transaction',
                          'snapshot_4303') | float(-1) }}
                      saved_4304: >-
                        {{ state_attr(
                          'sensor.hoymiles_battery_balancing_transaction',
                          'snapshot_4304') | float(-1) }}
                      saved_mode: >-
                        {{ state_attr(
                          'sensor.hoymiles_battery_balancing_transaction',
                          'snapshot_mode') }}
                  # Restore 4304. Identity/owner is revalidated immediately
                  # before and immediately after the awaited helper.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ not off_grid_owner
                             and restore_ok
                             and is_state(
                               'binary_sensor.hoymiles_battery_balancing_restore_authorized',
                               'on')
                             and state_attr(
                               'binary_sensor.hoymiles_battery_balancing_restore_authorized',
                               'cycle_id') == restore_cycle }}
                    then:
                      - action: script.hoymiles_verified_set_ems_maximum_charge_power
                        continue_on_error: true
                        data:
                          value: "{{ saved_4304 }}"
                      - if:
                          - condition: template
                            value_template: >-
                              {{ not is_state(
                                   'binary_sensor.hoymiles_battery_balancing_restore_authorized',
                                   'on')
                                 or ((states(
                                   'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                                   | float(-999)) - saved_4304) | abs >= 0.05 }}
                        then:
                          - variables:
                              restore_ok: false
                  # Restore 4303 only while the same trusted snapshot remains.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ not off_grid_owner
                             and restore_ok
                             and is_state(
                               'binary_sensor.hoymiles_battery_balancing_restore_authorized',
                               'on')
                             and state_attr(
                               'sensor.hoymiles_battery_balancing_transaction',
                               'snapshot_cycle_id') == restore_cycle }}
                    then:
                      - action: script.hoymiles_verified_set_ems_force_charge_soc
                        continue_on_error: true
                        data:
                          value: "{{ saved_4303 }}"
                      - if:
                          - condition: template
                            value_template: >-
                              {{ not is_state(
                                   'binary_sensor.hoymiles_battery_balancing_restore_authorized',
                                   'on')
                                 or ((states(
                                   'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                   | float(-999)) - saved_4303) | abs >= 0.5 }}
                        then:
                          - variables:
                              restore_ok: false
                  # Restore the exact pre-cycle mode last; Off-Grid is never
                  # overwritten and is accepted as physical-owner transfer.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ not off_grid_owner
                             and restore_ok
                             and is_state(
                               'binary_sensor.hoymiles_battery_balancing_restore_authorized',
                               'on')
                             and state_attr(
                               'sensor.hoymiles_battery_balancing_transaction',
                               'snapshot_cycle_id') == restore_cycle }}
                    then:
                      - action: script.hoymiles_verified_set_ems_mode
                        continue_on_error: true
                        data:
                          option: "{{ saved_mode }}"
                      - if:
                          - condition: template
                            value_template: >-
                              {{ not is_state(
                                   'binary_sensor.hoymiles_battery_balancing_restore_authorized',
                                   'on')
                                 or not is_state(
                                   'sensor.hoymiles_ems_hardware_mode', saved_mode) }}
                        then:
                          - variables:
                              restore_ok: false
                  - variables:
                      off_grid_now: >-
                        {{ is_state(
                          'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
                      final_restore_ack: >-
                        {{ not off_grid_now and restore_ok
                           and is_state(
                             'sensor.hoymiles_ems_hardware_mode', saved_mode)
                           and ((states(
                             'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                             | float(-999)) - saved_4303) | abs < 0.5
                           and ((states(
                             'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                             | float(-999)) - saved_4304) | abs < 0.05 }}
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ final_restore_ack }}"
                        sequence:
                          - action: script.hoymiles_battery_balancing_transition
                            data:
                              expected_cycle_id: "{{ restore_cycle }}"
                              transaction_state: "RESTORED"
                              reason_code: "{{ latched_reason }}"
                          # Re-read the abort latch and all three physical values
                          # immediately before owner release. A later/higher
                          # hard-stop reason wins; physical drift retains owner.
                          - variables:
                              release_reason: >-
                                {{ state_attr(
                                     'sensor.hoymiles_battery_balancing_abort_request',
                                     'reason_code')
                                   if states(
                                     'sensor.hoymiles_battery_balancing_abort_request')
                                      in ['PENDING', 'CONSUMED']
                                   and state_attr(
                                     'sensor.hoymiles_battery_balancing_abort_request',
                                     'cycle_id') == restore_cycle
                                   else latched_reason }}
                              release_abort_generation: >-
                                {{ state_attr(
                                  'sensor.hoymiles_battery_balancing_abort_request',
                                  'request_generation') | int(-1) }}
                              release_ack: >-
                                {{ states(
                                     'sensor.hoymiles_battery_balancing_transaction')
                                      == 'RESTORED'
                                   and state_attr(
                                     'sensor.hoymiles_battery_balancing_transaction',
                                     'cycle_id') == restore_cycle
                                   and state_attr(
                                     'sensor.hoymiles_battery_balancing_transaction',
                                     'snapshot_valid') | bool(false)
                                   and state_attr(
                                     'sensor.hoymiles_battery_balancing_transaction',
                                     'snapshot_cycle_id') == restore_cycle
                                   and is_state(
                                     'sensor.hoymiles_ems_hardware_mode', saved_mode)
                                   and ((states(
                                     'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                     | float(-999)) - saved_4303) | abs < 0.5
                                   and ((states(
                                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                                     | float(-999)) - saved_4304) | abs < 0.05
                                   and is_state(
                                     'input_boolean.hoymiles_battery_balancing_active',
                                     'on') }}
                          - if:
                              - condition: template
                                value_template: "{{ not release_ack }}"
                            then:
                              - action: script.hoymiles_battery_balancing_transition
                                data:
                                  expected_cycle_id: "{{ restore_cycle }}"
                                  transaction_state: "RESTORE_FAILED"
                                  reason_code: "restore_ack_failed"
                                  event_marker: "RESTORE_FAILED"
                              - action: script.hoymiles_notify_battery_balancing_lifecycle
                                continue_on_error: true
                                data:
                                  event: "restore_failed"
                                  reason_code: "restore_ack_failed"
                                  cycle_id: "{{ restore_cycle }}"
                              - action: script.hoymiles_battery_balancing_write_abort_request
                                continue_on_error: true
                                data:
                                  cycle_id: "{{ restore_cycle }}"
                                  request_generation: >-
                                    {{ state_attr(
                                      'sensor.hoymiles_battery_balancing_abort_request',
                                      'request_generation') | int(0) + 1 }}
                                  priority: 85
                                  reason_code: "restore_ack_failed"
                                  request_state: "CONSUMED"
                                  requested_epoch_ms: >-
                                    {{ (as_timestamp(now()) * 1000) | int }}
                              - stop: "Restore ACK changed before owner release"
                          # This is the final live boundary, not a cached local
                          # decision: a higher-priority request or physical drift
                          # between RESTORED and this action retains ownership.
                          - condition: template
                            value_template: >-
                              {{ states(
                                   'sensor.hoymiles_battery_balancing_transaction')
                                    == 'RESTORED'
                                 and state_attr(
                                   'sensor.hoymiles_battery_balancing_transaction',
                                   'cycle_id') == restore_cycle
                                 and state_attr(
                                   'sensor.hoymiles_battery_balancing_abort_request',
                                   'request_generation') | int(-2)
                                     == release_abort_generation | int(-1)
                                 and is_state(
                                   'sensor.hoymiles_ems_hardware_mode', saved_mode)
                                 and ((states(
                                   'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                   | float(-999)) - saved_4303) | abs < 0.5
                                 and ((states(
                                   'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                                   | float(-999)) - saved_4304) | abs < 0.05
                                 and is_state(
                                   'input_boolean.hoymiles_battery_balancing_active',
                                   'on') }}
                          - action: input_boolean.turn_off
                            target:
                              entity_id: input_boolean.hoymiles_battery_balancing_active
                          - wait_template: >-
                              {{ is_state(
                                'input_boolean.hoymiles_battery_balancing_active',
                                'off') }}
                            timeout: "00:00:05"
                            continue_on_timeout: false
                          - if:
                              - condition: template
                                value_template: "{{ release_reason == 'completed' }}"
                            then:
                              - action: input_datetime.set_datetime
                                target:
                                  entity_id: >-
                                    input_datetime.hoymiles_battery_balancing_last_completed
                                data:
                                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          - variables:
                              terminal_reason: "{{ release_reason }}"
                              terminal_event: >-
                                {% if prior_event_marker == 'RESTORE_FAILED' %}none
                                {% elif terminal_reason == 'completed' %}completed
                                {% elif terminal_was_started %}aborted
                                {% else %}failed{% endif %}
                              terminal_marker: >-
                                {{ {'completed': 'COMPLETED', 'aborted': 'ABORTED',
                                    'failed': 'FAILED', 'none': 'RESTORE_FAILED'}
                                   .get(terminal_event, 'FAILED') }}
                              terminal_cooldown: >-
                                {{ 0 if terminal_reason == 'completed'
                                   else (as_timestamp(now()) * 1000 + 900000) | int }}
                          - action: script.hoymiles_battery_balancing_transition
                            data:
                              expected_cycle_id: "{{ restore_cycle }}"
                              transaction_state: "NOTIFICATION_PENDING"
                              owner: "none"
                              reason_code: "{{ terminal_reason }}"
                              cooldown_epoch_ms: "{{ terminal_cooldown }}"
                              event_marker: "{{ terminal_marker }}"
                          - if:
                              - condition: template
                                value_template: "{{ terminal_event != 'none' }}"
                            then:
                              - action: script.hoymiles_notify_battery_balancing_lifecycle
                                continue_on_error: true
                                data:
                                  event: "{{ terminal_event }}"
                                  reason_code: "{{ terminal_reason }}"
                                  cycle_id: "{{ restore_cycle }}"
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ terminal_event == 'none'
                                     or restore_cycle ~ '.' ~ {
                                       'completed': 'CO', 'aborted': 'AB',
                                       'failed': 'FA'
                                     }.get(terminal_event, 'NA') in [
                                       state_attr(
                                         'sensor.hoymiles_battery_balancing_notification_outbox',
                                         'slot_1_event_id'),
                                       state_attr(
                                         'sensor.hoymiles_battery_balancing_notification_outbox',
                                         'slot_2_event_id')] }}
                            then:
                              - action: script.hoymiles_battery_balancing_transition
                                data:
                                  expected_cycle_id: "{{ restore_cycle }}"
                                  transaction_state: "TERMINAL"
                          - action: script.hoymiles_battery_balancing_write_timing
                            data:
                              cycle_id: "{{ restore_cycle }}"
                              gap_generation: >-
                                {{ state_attr(
                                  'sensor.hoymiles_battery_balancing_timing_transaction',
                                  'gap_generation') | int(0) + 1 }}
                              gap_start_epoch_ms: 0
                              gap_deadline_epoch_ms: 0
                              hold_generation: >-
                                {{ state_attr(
                                  'sensor.hoymiles_battery_balancing_timing_transaction',
                                  'hold_generation') | int(0) + 1 }}
                              hold_deadline_epoch_ms: 0
                              timing_state: "NONE"
                          - action: script.hoymiles_battery_balancing_write_abort_request
                            data:
                              cycle_id: "{{ restore_cycle }}"
                              request_generation: >-
                                {{ state_attr(
                                  'sensor.hoymiles_battery_balancing_abort_request',
                                  'request_generation') | int(0) + 1 }}
                              priority: 0
                              reason_code: "none"
                              request_state: "NONE"
                              requested_epoch_ms: 0
                    default:
                      - variables:
                          restore_failure_reason: >-
                            {{ 'off_grid' if off_grid_now
                               else 'restore_ack_failed' }}
                      - action: script.hoymiles_battery_balancing_transition
                        data:
                          expected_cycle_id: "{{ restore_cycle }}"
                          transaction_state: "RESTORE_FAILED"
                          reason_code: "{{ restore_failure_reason }}"
                          event_marker: "RESTORE_FAILED"
                      - action: script.hoymiles_notify_battery_balancing_lifecycle
                        continue_on_error: true
                        data:
                          event: "restore_failed"
                          reason_code: "{{ restore_failure_reason }}"
                          cycle_id: "{{ restore_cycle }}"
                      - action: script.hoymiles_battery_balancing_write_abort_request
                        continue_on_error: true
                        data:
                          cycle_id: "{{ restore_cycle }}"
                          request_generation: >-
                            {{ state_attr(
                              'sensor.hoymiles_battery_balancing_abort_request',
                              'request_generation') | int(0) + 1 }}
                          priority: "{{ 100 if off_grid_now else 85 }}"
                          reason_code: "{{ restore_failure_reason }}"
                          request_state: "CONSUMED"
                          requested_epoch_ms: >-
                            {{ (as_timestamp(now()) * 1000) | int }}

          # Only the worker creates a monotonic cycle and claims ownership.
          - conditions:
              - condition: template
                value_template: "{{ worker_intent == 'start' }}"
            sequence:
              - condition: template
                value_template: >-
                  {% set seq = states(
                    'input_number.hoymiles_battery_balancing_cycle_sequence') %}
                  {% set cooldown = state_attr(
                    'sensor.hoymiles_battery_balancing_transaction',
                    'cooldown_epoch_ms') | int(0) %}
                  {{ entry_state in ['IDLE', 'TERMINAL']
                     and is_number(seq) and (seq | int(-1)) >= 0
                     and (seq | int(-1)) < 2147483647
                     and cooldown <= (as_timestamp(now()) * 1000) | int
                     and is_state(
                       'input_boolean.hoymiles_battery_balancing_active', 'off')
                     and is_state(
                       'input_boolean.hoymiles_battery_balancing_enabled', 'on')
                     and is_state(
                       'binary_sensor.hoymiles_battery_balancing_due', 'on')
                     and is_state(
                       'binary_sensor.hoymiles_battery_balancing_control_data_ready',
                       'on')
                     and is_state('sun.sun', 'above_horizon')
                     and is_state(
                       'binary_sensor.hoymiles_ems_control_conflict', 'off')
                     and is_state(
                       'input_boolean.hoymiles_discharge_cycle_active', 'off')
                     and is_state(
                       'input_boolean.hoymiles_charge_cycle_active', 'off')
                     and is_state(
                       'input_boolean.hoymiles_rce_discharge_active', 'off')
                     and is_state(
                       'input_boolean.hoymiles_tariff_charge_active', 'off')
                     and is_state('input_boolean.hoymiles_rcm_active', 'off')
                     and is_state(
                       'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                     and is_state('timer.hoymiles_discharge', 'idle')
                     and is_state('timer.hoymiles_charge', 'idle') }}
              - variables:
                  next_sequence: >-
                    {{ states(
                      'input_number.hoymiles_battery_balancing_cycle_sequence')
                      | int(0) + 1 }}
                  next_cycle: "{{ 'c' ~ next_sequence }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_battery_balancing_cycle_sequence
                data:
                  value: "{{ next_sequence }}"
              - wait_template: >-
                  {{ states(
                    'input_number.hoymiles_battery_balancing_cycle_sequence')
                    | int(-1) == next_sequence | int(-2) }}
                timeout: "00:00:05"
                continue_on_timeout: false
              - action: script.hoymiles_battery_balancing_write_record
                data:
                  cycle_id: "{{ next_cycle }}"
                  transaction_state: "REQUESTED"
                  owner: "none"
                  owner_generation: "{{ next_sequence }}"
                  snapshot_valid: false
                  snapshot_cycle_id: "none"
                  snapshot_mode: "unknown"
                  snapshot_4303: 0
                  snapshot_4304: 0
                  snapshot_ems_generation: 0
                  snapshot_topology_generation: 0
                  snapshot_epoch_ms: 0
                  write_started: false
                  reason_code: "none"
                  operational_started: false
                  cooldown_epoch_ms: 0
                  event_marker: "NONE"
              - action: script.hoymiles_battery_balancing_write_timing
                data:
                  cycle_id: "{{ next_cycle }}"
                  gap_generation: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_timing_transaction',
                      'gap_generation') | int(0) + 1 }}
                  gap_start_epoch_ms: 0
                  gap_deadline_epoch_ms: 0
                  hold_generation: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_timing_transaction',
                      'hold_generation') | int(0) + 1 }}
                  hold_deadline_epoch_ms: 0
                  timing_state: "NONE"
              - action: script.hoymiles_battery_balancing_write_abort_request
                data:
                  cycle_id: "{{ next_cycle }}"
                  request_generation: >-
                    {{ state_attr(
                      'sensor.hoymiles_battery_balancing_abort_request',
                      'request_generation') | int(0) + 1 }}
                  priority: 0
                  reason_code: "none"
                  request_state: "NONE"
                  requested_epoch_ms: 0
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_battery_balancing_active
              - wait_template: >-
                  {{ is_state(
                       'input_boolean.hoymiles_battery_balancing_active', 'on')
                     and state_attr(
                       'sensor.hoymiles_ems_control_owner',
                       'owner_code') == 'balancing'
                     and is_state(
                       'binary_sensor.hoymiles_ems_control_conflict', 'off') }}
                timeout: "00:00:05"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_state(
                           'input_boolean.hoymiles_battery_balancing_active', 'on')
                         and state_attr(
                           'sensor.hoymiles_ems_control_owner',
                           'owner_code') == 'balancing'
                         and is_state(
                           'binary_sensor.hoymiles_ems_control_conflict', 'off') }}
                then:
                  - action: script.hoymiles_battery_balancing_transition
                    data:
                      expected_cycle_id: "{{ next_cycle }}"
                      transaction_state: "OWNER_ACQUIRED"
                      owner: "balancing"
                  - variables:
                      captured_mode: "{{ states('sensor.hoymiles_ems_hardware_mode') }}"
                      captured_4303: >-
                        {{ states(
                          'sensor.hoymiles_hit_ems_force_charge_soc_readback') }}
                      captured_4304: >-
                        {{ states(
                          'sensor.hoymiles_hit_ems_maximum_charge_power_readback') }}
                      captured_ems_generation: >-
                        {{ states(
                          'sensor.hoymiles_hit_ems_control_readback_generation') }}
                      captured_topology_generation: >-
                        {{ states(
                          'sensor.hoymiles_hit_parallel_topology_readback_generation') }}
                      captured_snapshot_ms: >-
                        {{ (as_timestamp(now()) * 1000) | int }}
                      captured_valid: >-
                        {{ captured_mode in [
                             'self_use', 'grid_charge', 'grid_discharge']
                           and is_number(captured_4303)
                           and (captured_4303 | float(-1)) >= 0
                           and (captured_4303 | float(101)) <= 100
                           and is_number(captured_4304)
                           and (captured_4304 | float(-1)) >= 0
                           and (captured_4304 | float(101)) <= 100
                           and is_number(captured_ems_generation)
                           and (captured_ems_generation | int(-1)) >= 0
                           and is_number(captured_topology_generation)
                           and (captured_topology_generation | int(-1)) >= 0 }}
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ captured_valid }}"
                        sequence:
                          - action: script.hoymiles_battery_balancing_transition
                            data:
                              expected_cycle_id: "{{ next_cycle }}"
                              transaction_state: "SNAPSHOT_VALID"
                              snapshot_valid: true
                              snapshot_cycle_id: "{{ next_cycle }}"
                              snapshot_mode: "{{ captured_mode }}"
                              snapshot_4303: "{{ captured_4303 | float | round(1) }}"
                              snapshot_4304: "{{ captured_4304 | float | round(1) }}"
                              snapshot_ems_generation: >-
                                {{ captured_ems_generation | int }}
                              snapshot_topology_generation: >-
                                {{ captured_topology_generation | int }}
                              snapshot_epoch_ms: "{{ captured_snapshot_ms }}"
                          - if:
                              - condition: state
                                entity_id: >-
                                  binary_sensor.hoymiles_battery_balancing_apply_authorized
                                state: "on"
                              - condition: template
                                value_template: >-
                                  {{ not (is_state(
                                       'sensor.hoymiles_battery_balancing_abort_request',
                                       'PENDING') and state_attr(
                                       'sensor.hoymiles_battery_balancing_abort_request',
                                       'cycle_id') == next_cycle) }}
                            then:
                              - action: timer.start
                                target:
                                  entity_id: >-
                                    timer.hoymiles_battery_balancing_watchdog
                              - wait_template: >-
                                  {{ is_state(
                                    'timer.hoymiles_battery_balancing_watchdog',
                                    'active') }}
                                timeout: "00:00:05"
                                continue_on_timeout: true
                              - if:
                                  - condition: state
                                    entity_id: >-
                                      timer.hoymiles_battery_balancing_watchdog
                                    state: "active"
                                  - condition: state
                                    entity_id: >-
                                      binary_sensor.hoymiles_battery_balancing_apply_authorized
                                    state: "on"
                                then:
                                  - action: script.turn_on
                                    target:
                                      entity_id: >-
                                        script.hoymiles_battery_balancing_transaction_worker
                                    data:
                                      variables:
                                        intent: "reconcile"
                                        expected_cycle_id: "{{ next_cycle }}"
                                else:
                                  - action: >-
                                      script.hoymiles_battery_balancing_request_abort
                                    data:
                                      reason_code: "physical_transaction_failure"
                                      cycle_id: "{{ next_cycle }}"
                            else:
                              - action: >-
                                  script.hoymiles_battery_balancing_request_abort
                                data:
                                  reason_code: "communication_failure"
                                  cycle_id: "{{ next_cycle }}"
                    default:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "communication_failure"
                          cycle_id: "{{ next_cycle }}"
                else:
                  - action: script.hoymiles_battery_balancing_request_abort
                    data:
                      reason_code: "control_conflict"
                      cycle_id: "{{ next_cycle }}"

        default:
          # Routine reconcile: a fresh current-cycle snapshot is re-read before
          # the first write, then every helper boundary rechecks hard-stop.
          - condition: template
            value_template: >-
              {{ entry_state in [
                   'SNAPSHOT_VALID', 'APPLYING', 'OPERATIONAL', 'SLOW',
                   'HOLD_ARMING', 'HOLDING']
                 and is_state(
                   'input_boolean.hoymiles_battery_balancing_active', 'on')
                 and (worker_expected_cycle in ['', entry_cycle]) }}
          - variables:
              first_write_pending: >-
                {{ not state_attr(
                  'sensor.hoymiles_battery_balancing_transaction',
                  'write_started') | bool(false) }}
              snapshot_still_equal: >-
                {{ state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'snapshot_valid') | bool(false)
                   and state_attr(
                      'sensor.hoymiles_battery_balancing_transaction',
                      'snapshot_cycle_id') == entry_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner_generation') | int(-1))
                     == (entry_owner_generation | int(-2))
                   and states('sensor.hoymiles_ems_hardware_mode')
                     == state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_mode')
                   and ((states(
                     'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                     | float(-999)) - (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_4303') | float(-998))) | abs < 0.5
                   and ((states(
                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                     | float(-999)) - (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_4304') | float(-998))) | abs < 0.05
                   and is_number(states(
                      'sensor.hoymiles_hit_ems_control_readback_generation'))
                    and (states(
                      'sensor.hoymiles_hit_ems_control_readback_generation')
                      | int(-1)) == (state_attr(
                        'sensor.hoymiles_battery_balancing_transaction',
                        'snapshot_ems_generation') | int(16000001))
                   and is_number(states(
                     'sensor.hoymiles_hit_parallel_topology_readback_generation'))
                    and (states(
                      'sensor.hoymiles_hit_parallel_topology_readback_generation')
                      | int(-1)) == (state_attr(
                        'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_topology_generation') | int(16000001))
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'snapshot_epoch_ms') | int(0)) > 0
                   and (as_timestamp(now()) * 1000) | int
                     >= (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_epoch_ms') | int(4102444800001))
                   and ((as_timestamp(now()) * 1000) | int
                     - (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_epoch_ms') | int(0))) <= 60000 }}
          - if:
              - condition: template
                value_template: >-
                  {{ first_write_pending and not snapshot_still_equal }}
            then:
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: "snapshot_changed_before_transaction"
                  cycle_id: "{{ entry_cycle }}"
              - stop: "Physical snapshot changed before first balancing write"
          - condition: state
            entity_id: binary_sensor.hoymiles_battery_balancing_apply_authorized
            state: "on"
          # write_started is committed before the first possible balancing write.
          - action: script.hoymiles_battery_balancing_transition
            data:
              expected_cycle_id: "{{ entry_cycle }}"
              transaction_state: "APPLYING"
              write_started: true
          # Yield once so every callback fired by the inner input_text service
          # boundary becomes visible before the post-arm physical snapshot read.
          - delay: 0
          # Re-read the complete trusted snapshot after the inner lifecycle
          # serializer returns. A generation or physical tuple change at that
          # service boundary still precedes every balancing physical helper.
          - variables:
              snapshot_equal_after_apply_arm: >-
                {{ state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'snapshot_valid') | bool(false)
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'snapshot_cycle_id') == entry_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner_generation') | int(-1))
                     == (entry_owner_generation | int(-2))
                   and states('sensor.hoymiles_ems_hardware_mode')
                     == state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_mode')
                   and ((states(
                     'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                     | float(-999)) - (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_4303') | float(-998))) | abs < 0.5
                   and ((states(
                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                     | float(-999)) - (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_4304') | float(-998))) | abs < 0.05
                   and is_number(states(
                     'sensor.hoymiles_hit_ems_control_readback_generation'))
                   and (states(
                     'sensor.hoymiles_hit_ems_control_readback_generation')
                     | int(-1)) == (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_ems_generation') | int(16000001))
                   and is_number(states(
                     'sensor.hoymiles_hit_parallel_topology_readback_generation'))
                   and (states(
                     'sensor.hoymiles_hit_parallel_topology_readback_generation')
                     | int(-1)) == (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_topology_generation') | int(16000001))
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'snapshot_epoch_ms') | int(0)) > 0
                   and (as_timestamp(now()) * 1000) | int
                     >= (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_epoch_ms') | int(4102444800001))
                   and ((as_timestamp(now()) * 1000) | int
                     - (state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'snapshot_epoch_ms') | int(0))) <= 60000 }}
          - if:
              - condition: template
                value_template: >-
                  {{ first_write_pending
                     and not snapshot_equal_after_apply_arm }}
            then:
              # No balancing helper has run. Disarm write_started before the
              # abort worker so it releases only the provisional owner and
              # never restores the now-stale snapshot.
              - action: script.hoymiles_battery_balancing_transition
                data:
                  expected_cycle_id: "{{ entry_cycle }}"
                  transaction_state: "SNAPSHOT_VALID"
                  write_started: false
                  reason_code: "snapshot_changed_before_transaction"
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: "snapshot_changed_before_transaction"
                  cycle_id: "{{ entry_cycle }}"
              - stop: >-
                  Physical snapshot changed at the APPLYING arm boundary
          - variables:
              soc_now: "{{ states('sensor.hoymiles_hit_overview_battery_soc') }}"
              slow_latched: >-
                {{ entry_state in ['SLOW', 'HOLD_ARMING', 'HOLDING']
                   or (is_number(soc_now) and (soc_now | float(0)) >= 95) }}
              target_sensor: >-
                {{ 'sensor.hoymiles_battery_balancing_slow_charge_power'
                   if slow_latched else
                   'sensor.hoymiles_battery_balancing_bms_safe_charge_power' }}
              required_mode_before_apply: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
              pre_budget_mode: >-
                {{ 'grid_charge' if required_mode_before_apply == 'grid_charge'
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode', 'grid_charge')
                   else 'self_use' }}
              pre_target: >-
                {{ state_attr(
                  target_sensor, pre_budget_mode ~ '_percent') }}
          - if:
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_apply_authorized
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_number(pre_target)
                     and (pre_target | float(0)) >= 0.1
                     and (pre_target | float(0)) <= 100 }}
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                        | float(-999)) - (pre_target | float(0))) | abs >= 0.05 }}
                then:
                  - condition: state
                    entity_id: >-
                      binary_sensor.hoymiles_battery_balancing_apply_authorized
                    state: "on"
                  - action: script.hoymiles_verified_set_ems_maximum_charge_power
                    continue_on_error: true
                    data:
                      value: "{{ pre_target | float | round(1) }}"
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                            'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                            | float(-999)) - (pre_target | float(0))) | abs >= 0.05 }}
                    then:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "max_charge_power_ack_failed"
                          cycle_id: "{{ entry_cycle }}"
            else:
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: "bms_limit_invalid"
                  cycle_id: "{{ entry_cycle }}"
          # 4303 is guarded immediately before and checked immediately after.
          - if:
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_apply_authorized
                state: "on"
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                        | float(-999)) - 100) | abs >= 0.5 }}
                then:
                  - condition: state
                    entity_id: >-
                      binary_sensor.hoymiles_battery_balancing_apply_authorized
                    state: "on"
                  - action: script.hoymiles_verified_set_ems_force_charge_soc
                    continue_on_error: true
                    data:
                      value: 100
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                            'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                            | float(-999)) - 100) | abs >= 0.5 }}
                    then:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "force_soc_ack_failed"
                          cycle_id: "{{ entry_cycle }}"
          # Current sun is sampled immediately before the mode helper.
          - variables:
              first_mode_request: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
              mode_correction_used: false
          - if:
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_apply_authorized
                state: "on"
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                        'sensor.hoymiles_ems_hardware_mode', first_mode_request) }}
                then:
                  - condition: state
                    entity_id: >-
                      binary_sensor.hoymiles_battery_balancing_apply_authorized
                    state: "on"
                  - action: script.hoymiles_verified_set_ems_mode
                    continue_on_error: true
                    data:
                      option: "{{ first_mode_request }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                        'sensor.hoymiles_ems_hardware_mode', first_mode_request) }}
                then:
                  - action: script.hoymiles_battery_balancing_request_abort
                    data:
                      reason_code: "mode_ack_failed"
                      cycle_id: "{{ entry_cycle }}"
          # One bounded correction handles a sun transition during the wait.
          - variables:
              required_mode_after_ack: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
          - if:
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_apply_authorized
                state: "on"
              - condition: template
                value_template: >-
                  {{ required_mode_after_ack != first_mode_request }}
            then:
              - action: script.hoymiles_verified_set_ems_mode
                continue_on_error: true
                data:
                  option: "{{ required_mode_after_ack }}"
              - variables:
                  mode_correction_used: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                        'sensor.hoymiles_ems_hardware_mode',
                        required_mode_after_ack) }}
                then:
                  - action: script.hoymiles_battery_balancing_request_abort
                    data:
                      reason_code: "mode_ack_failed"
                      cycle_id: "{{ entry_cycle }}"
          # Re-evaluate sun before power reconciliation.
          - variables:
              required_mode_before_power: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
          - if:
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_apply_authorized
                state: "on"
              - condition: template
                value_template: >-
                  {{ not is_state(
                    'sensor.hoymiles_ems_hardware_mode',
                    required_mode_before_power) }}
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ not mode_correction_used }}"
                    sequence:
                      - condition: state
                        entity_id: >-
                          binary_sensor.hoymiles_battery_balancing_apply_authorized
                        state: "on"
                      - action: script.hoymiles_verified_set_ems_mode
                        continue_on_error: true
                        data:
                          option: "{{ required_mode_before_power }}"
                      - variables:
                          mode_correction_used: true
                default:
                  - action: script.hoymiles_battery_balancing_request_abort
                    data:
                      reason_code: "mode_ack_failed"
                      cycle_id: "{{ entry_cycle }}"
          - variables:
              final_target: >-
                {{ state_attr(
                  target_sensor, required_mode_before_power ~ '_percent') }}
          - if:
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_apply_authorized
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state(
                       'sensor.hoymiles_ems_hardware_mode',
                       required_mode_before_power)
                     and is_number(final_target)
                     and (final_target | float(0)) >= 0.1
                     and (final_target | float(0)) <= 100 }}
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                        | float(-999)) - (final_target | float(0))) | abs >= 0.05 }}
                then:
                  - condition: state
                    entity_id: >-
                      binary_sensor.hoymiles_battery_balancing_apply_authorized
                    state: "on"
                  - action: script.hoymiles_verified_set_ems_maximum_charge_power
                    continue_on_error: true
                    data:
                      value: "{{ final_target | float | round(1) }}"
            else:
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: "bms_limit_invalid"
                  cycle_id: "{{ entry_cycle }}"
          # Re-evaluate after power. A second sun transition after the one
          # allowed correction aborts instead of looping without a bound.
          - variables:
              required_mode_after_power: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
          - if:
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_apply_authorized
                state: "on"
              - condition: template
                value_template: >-
                  {{ not is_state(
                    'sensor.hoymiles_ems_hardware_mode',
                    required_mode_after_power) }}
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ not mode_correction_used }}"
                    sequence:
                      - condition: state
                        entity_id: >-
                          binary_sensor.hoymiles_battery_balancing_apply_authorized
                        state: "on"
                      - action: script.hoymiles_verified_set_ems_mode
                        continue_on_error: true
                        data:
                          option: "{{ required_mode_after_power }}"
                      - variables:
                          mode_correction_used: true
                          corrected_target: >-
                            {{ state_attr(
                              target_sensor,
                              required_mode_after_power ~ '_percent') }}
                      - if:
                          - condition: state
                            entity_id: >-
                              binary_sensor.hoymiles_battery_balancing_apply_authorized
                            state: "on"
                          - condition: template
                            value_template: >-
                              {{ is_state(
                                   'sensor.hoymiles_ems_hardware_mode',
                                   required_mode_after_power)
                                 and is_number(corrected_target)
                                 and (corrected_target | float(0)) >= 0.1
                                 and (corrected_target | float(0)) <= 100 }}
                        then:
                          - action: script.hoymiles_verified_set_ems_maximum_charge_power
                            continue_on_error: true
                            data:
                              value: "{{ corrected_target | float | round(1) }}"
                default:
                  - action: script.hoymiles_battery_balancing_request_abort
                    data:
                      reason_code: "mode_ack_failed"
                      cycle_id: "{{ entry_cycle }}"
          # Final tail authorization samples sun and target once more before any
          # phase change or timer start.
          - variables:
              committed_mode: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
              committed_target: >-
                {{ state_attr(target_sensor, committed_mode ~ '_percent') }}
              final_transaction_ack: >-
                {{ is_state(
                     'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                     'on')
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode', committed_mode)
                   and is_number(committed_target)
                   and ((states(
                     'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                     | float(-999)) - (committed_target | float(0))) | abs < 0.05
                   and ((states(
                     'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                     | float(-999)) - 100) | abs < 0.5 }}
          - if:
              - condition: template
                value_template: "{{ not final_transaction_ack }}"
            then:
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: >-
                    {{ 'mode_ack_failed' if not is_state(
                         'sensor.hoymiles_ems_hardware_mode', committed_mode)
                       else 'max_charge_power_ack_failed' }}
                  cycle_id: "{{ entry_cycle }}"
              - stop: "Final transactional sun/power acknowledgement failed"
          # The final steady-phase service re-reads sun and physical mode inside
          # the transition script, after EVENT_CALL_SERVICE has fired. If that
          # guard rejects a boundary flip, this worker performs at most one
          # verified correction and never loops.
          - variables:
              final_steady_state: >-
                {{ entry_state if entry_state in ['HOLD_ARMING', 'HOLDING']
                   else ('SLOW' if slow_latched else 'OPERATIONAL') }}
          - action: script.hoymiles_battery_balancing_transition
            data:
              expected_cycle_id: "{{ entry_cycle }}"
              transaction_state: "{{ final_steady_state }}"
              steady_commit_guard: true
              expected_owner_generation: "{{ entry_owner_generation }}"
          - variables:
              final_phase_required_mode_now: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
              final_phase_commit_valid: >-
                {{ states('sensor.hoymiles_battery_balancing_transaction')
                     == final_steady_state
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'cycle_id') == entry_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner_generation') | int(-1))
                     == (entry_owner_generation | int(-2))
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner') == 'balancing'
                   and is_state(
                     'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                     'on')
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode',
                     final_phase_required_mode_now)
                   and not (is_state(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'PENDING') and state_attr(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'cycle_id') == entry_cycle) }}
          - if:
              - condition: template
                value_template: >-
                  {{ not final_phase_commit_valid }}
            then:
              - variables:
                  final_correction_required_mode: >-
                    {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                       else 'grid_charge' }}
                  final_correction_target: >-
                    {{ state_attr(
                      target_sensor, final_correction_required_mode ~ '_percent') }}
                  final_correction_eligible: >-
                    {{ is_state(
                         'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                         'on')
                       and state_attr(
                         'sensor.hoymiles_battery_balancing_transaction',
                         'cycle_id') == entry_cycle
                       and (state_attr(
                         'sensor.hoymiles_battery_balancing_transaction',
                         'owner_generation') | int(-1))
                         == (entry_owner_generation | int(-2))
                       and state_attr(
                         'sensor.hoymiles_battery_balancing_transaction',
                         'owner') == 'balancing'
                       and not (is_state(
                         'sensor.hoymiles_battery_balancing_abort_request',
                         'PENDING') and state_attr(
                         'sensor.hoymiles_battery_balancing_abort_request',
                         'cycle_id') == entry_cycle)
                       and not is_state(
                         'sensor.hoymiles_ems_hardware_mode',
                         final_correction_required_mode)
                       and is_number(final_correction_target)
                       and (final_correction_target | float(0)) >= 0.1
                       and (final_correction_target | float(0)) <= 100 }}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ final_correction_eligible }}"
                    sequence:
                      - action: script.hoymiles_verified_set_ems_mode
                        continue_on_error: true
                        data:
                          option: "{{ final_correction_required_mode }}"
                      - variables:
                          final_mode_after_correction: >-
                            {{ states('sensor.hoymiles_ems_hardware_mode') }}
                          final_sun_mode_after_correction: >-
                            {{ 'self_use'
                               if is_state('sun.sun', 'above_horizon')
                               else 'grid_charge' }}
                          final_target_after_correction: >-
                            {{ state_attr(
                              target_sensor,
                              final_sun_mode_after_correction ~ '_percent') }}
                      - if:
                          - condition: template
                            value_template: >-
                              {{ is_state(
                                   'sensor.hoymiles_battery_balancing_abort_request',
                                   'PENDING')
                                 and state_attr(
                                   'sensor.hoymiles_battery_balancing_abort_request',
                                   'cycle_id') == entry_cycle }}
                        then:
                          - stop: >-
                              Durable hard-stop won during final mode correction
                      - if:
                          - condition: template
                            value_template: >-
                              {{ final_sun_mode_after_correction
                                   != final_correction_required_mode
                                 or final_mode_after_correction
                                   != final_correction_required_mode }}
                        then:
                          - action: script.hoymiles_battery_balancing_request_abort
                            data:
                              reason_code: "mode_ack_failed"
                              cycle_id: "{{ entry_cycle }}"
                          - stop: >-
                              Sun changed during the single final mode correction
                      - if:
                          - condition: template
                            value_template: >-
                              {{ ((states(
                                'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                                | float(-999)) - (final_target_after_correction
                                | float(0))) | abs >= 0.05 }}
                        then:
                          - condition: state
                            entity_id: >-
                              binary_sensor.hoymiles_battery_balancing_apply_authorized
                            state: "on"
                          - action: >-
                              script.hoymiles_verified_set_ems_maximum_charge_power
                            continue_on_error: true
                            data:
                              value: >-
                                {{ final_target_after_correction
                                   | float | round(1) }}
                      - variables:
                          final_commit_required_mode_after_ack: >-
                            {{ 'self_use'
                               if is_state('sun.sun', 'above_horizon')
                               else 'grid_charge' }}
                          final_commit_target_after_ack: >-
                            {{ state_attr(
                              target_sensor,
                              final_commit_required_mode_after_ack ~ '_percent') }}
                          final_correction_ack: >-
                            {{ is_state(
                                 'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                                 'on')
                               and state_attr(
                                 'sensor.hoymiles_battery_balancing_transaction',
                                 'cycle_id') == entry_cycle
                               and (state_attr(
                                 'sensor.hoymiles_battery_balancing_transaction',
                                 'owner_generation') | int(-1))
                                 == (entry_owner_generation | int(-2))
                               and final_commit_required_mode_after_ack
                                 == final_correction_required_mode
                               and is_state(
                                 'sensor.hoymiles_ems_hardware_mode',
                                 final_commit_required_mode_after_ack)
                               and is_number(final_commit_target_after_ack)
                               and ((states(
                                 'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                                 | float(-999)) - (final_commit_target_after_ack
                                 | float(0))) | abs < 0.05
                               and ((states(
                                 'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                 | float(-999)) - 100) | abs < 0.5
                               and not (is_state(
                                 'sensor.hoymiles_battery_balancing_abort_request',
                                 'PENDING') and state_attr(
                                 'sensor.hoymiles_battery_balancing_abort_request',
                                 'cycle_id') == entry_cycle) }}
                      - if:
                          - condition: template
                            value_template: "{{ not final_correction_ack }}"
                        then:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ is_state(
                                       'sensor.hoymiles_battery_balancing_abort_request',
                                       'PENDING') and state_attr(
                                       'sensor.hoymiles_battery_balancing_abort_request',
                                       'cycle_id') == entry_cycle }}
                            then:
                              - stop: >-
                                  Durable hard-stop won after final correction
                          - action: script.hoymiles_battery_balancing_request_abort
                            data:
                              reason_code: "mode_ack_failed"
                              cycle_id: "{{ entry_cycle }}"
                          - stop: "Final mode correction did not ACK"
                      - action: script.hoymiles_battery_balancing_transition
                        data:
                          expected_cycle_id: "{{ entry_cycle }}"
                          transaction_state: "{{ final_steady_state }}"
                          steady_commit_guard: true
                          expected_owner_generation: >-
                            {{ entry_owner_generation }}
                default:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ is_state(
                               'sensor.hoymiles_battery_balancing_abort_request',
                               'PENDING') and state_attr(
                               'sensor.hoymiles_battery_balancing_abort_request',
                               'cycle_id') == entry_cycle }}
                    then:
                      - stop: >-
                          Durable hard-stop rejected the final phase commit
                  - action: script.hoymiles_battery_balancing_request_abort
                    data:
                      reason_code: "mode_ack_failed"
                      cycle_id: "{{ entry_cycle }}"
                  - stop: "Final phase commit guard failed closed"
          - variables:
              final_phase_required_mode_after_attempt: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
              final_phase_commit_valid_after_attempt: >-
                {{ states('sensor.hoymiles_battery_balancing_transaction')
                     == final_steady_state
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'cycle_id') == entry_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner_generation') | int(-1))
                     == (entry_owner_generation | int(-2))
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner') == 'balancing'
                   and is_state(
                     'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                     'on')
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode',
                     final_phase_required_mode_after_attempt)
                   and not (is_state(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'PENDING') and state_attr(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'cycle_id') == entry_cycle) }}
          - if:
              - condition: template
                value_template: >-
                  {{ not final_phase_commit_valid_after_attempt }}
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_state(
                           'sensor.hoymiles_battery_balancing_abort_request',
                           'PENDING') and state_attr(
                           'sensor.hoymiles_battery_balancing_abort_request',
                           'cycle_id') == entry_cycle }}
                then:
                  - stop: "Durable hard-stop prevented the final phase commit"
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: "mode_ack_failed"
                  cycle_id: "{{ entry_cycle }}"
              - stop: "Single final correction was exhausted"
          - variables:
              hold_soc_value: >-
                {{ states('sensor.hoymiles_hit_overview_battery_soc') }}
              hold_soc_age_seconds: >-
                {% set item =
                  states.sensor.hoymiles_hit_overview_battery_soc %}
                {% set reported = item.last_reported
                   if item.last_reported is defined else item.last_updated %}
                {{ as_timestamp(now()) - as_timestamp(reported, 0) }}
              hold_generation_before_arm: >-
                {{ state_attr(
                  'sensor.hoymiles_battery_balancing_timing_transaction',
                  'hold_generation') | int(-1) }}
              hold_required_mode: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
              fresh_full_soc: >-
                {{ is_number(hold_soc_value)
                   and (hold_soc_value | float(0)) | abs < 1000000000
                   and (hold_soc_value | float(-1)) >= 99.9
                   and (hold_soc_value | float(101)) <= 100
                   and (hold_soc_age_seconds | float(999)) >= -5
                   and (hold_soc_age_seconds | float(999)) <= 120 }}
              arm_new_hold: >-
                {{ slow_latched and fresh_full_soc
                   and entry_state not in ['HOLD_ARMING', 'HOLDING']
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'cycle_id') == entry_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner_generation') | int(-1))
                     == (entry_owner_generation | int(-2))
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_timing_transaction',
                     'cycle_id') == entry_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_timing_transaction',
                     'hold_generation') | int(-2))
                     == (hold_generation_before_arm | int(-1))
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode', hold_required_mode)
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner') == 'balancing'
                   and not (is_state(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'PENDING') and state_attr(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'cycle_id') == entry_cycle) }}
          - choose:
              # HOLD_ARMING and absolute deadline are durable before timer.start.
              - conditions:
                  - condition: template
                    value_template: "{{ arm_new_hold }}"
                  - condition: state
                    entity_id: >-
                      binary_sensor.hoymiles_battery_balancing_apply_authorized
                    state: "on"
                sequence:
                  - variables:
                      next_hold_generation: >-
                        {{ hold_generation_before_arm | int(0) + 1 }}
                      new_hold_deadline: >-
                        {{ (as_timestamp(now()) * 1000
                            + states(
                              'input_number.hoymiles_battery_balancing_hold_hours')
                              | float(2) * 3600000) | int }}
                  - action: script.hoymiles_battery_balancing_write_timing
                    data:
                      cycle_id: "{{ entry_cycle }}"
                      gap_generation: >-
                        {{ state_attr(
                          'sensor.hoymiles_battery_balancing_timing_transaction',
                          'gap_generation') | int(0) + 1 }}
                      gap_start_epoch_ms: 0
                      gap_deadline_epoch_ms: 0
                      hold_generation: "{{ next_hold_generation }}"
                      hold_deadline_epoch_ms: "{{ new_hold_deadline }}"
                      timing_state: "HOLD_ARMING"
                  # Let state changes fired at the inner input_text boundary
                  # settle before accepting the durable hold-arm certificate.
                  - delay: 0
                  - variables:
                      hold_soc_after_timing_write: >-
                        {{ states('sensor.hoymiles_hit_overview_battery_soc') }}
                      hold_soc_age_after_timing_write: >-
                        {% set item =
                          states.sensor.hoymiles_hit_overview_battery_soc %}
                        {% set reported = item.last_reported
                           if item.last_reported is defined
                           else item.last_updated %}
                        {{ as_timestamp(now()) - as_timestamp(reported, 0) }}
                      hold_mode_after_timing_write: >-
                        {{ 'self_use'
                           if is_state('sun.sun', 'above_horizon')
                           else 'grid_charge' }}
                      hold_arm_after_timing_valid: >-
                        {{ is_state(
                           'sensor.hoymiles_battery_balancing_timing_transaction',
                           'HOLD_ARMING')
                         and state_attr(
                           'sensor.hoymiles_battery_balancing_timing_transaction',
                           'cycle_id') == entry_cycle
                         and (state_attr(
                           'sensor.hoymiles_battery_balancing_timing_transaction',
                           'hold_generation') | int(-1))
                           == (next_hold_generation | int(-2))
                         and (state_attr(
                           'sensor.hoymiles_battery_balancing_timing_transaction',
                           'hold_deadline_epoch_ms') | int(-1))
                           == (new_hold_deadline | int(-2))
                         and is_number(hold_soc_after_timing_write)
                         and (hold_soc_after_timing_write | float(0))
                           | abs < 1000000000
                         and (hold_soc_after_timing_write | float(-1)) >= 99.9
                         and (hold_soc_after_timing_write | float(101)) <= 100
                         and (hold_soc_age_after_timing_write | float(999)) >= -5
                         and (hold_soc_age_after_timing_write | float(999)) <= 120
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode',
                           hold_mode_after_timing_write)
                         and is_state(
                           'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                           'on')
                          and not (is_state(
                            'sensor.hoymiles_battery_balancing_abort_request',
                            'PENDING') and state_attr(
                            'sensor.hoymiles_battery_balancing_abort_request',
                            'cycle_id') == entry_cycle) }}
                  - if:
                      - condition: template
                        value_template: >-
                          {{ not hold_arm_after_timing_valid }}
                    then:
                      # The raw candidate is invalidated before this run can
                      # expose HOLD_ARMING or start the timer.
                      - action: script.hoymiles_battery_balancing_write_timing
                        data:
                          cycle_id: "{{ entry_cycle }}"
                          gap_generation: >-
                            {{ state_attr(
                              'sensor.hoymiles_battery_balancing_timing_transaction',
                              'gap_generation') | int(0) + 1 }}
                          gap_start_epoch_ms: 0
                          gap_deadline_epoch_ms: 0
                          hold_generation: >-
                            {{ state_attr(
                              'sensor.hoymiles_battery_balancing_timing_transaction',
                              'hold_generation') | int(0) + 1 }}
                          hold_deadline_epoch_ms: 0
                          timing_state: "NONE"
                      - stop: >-
                          Fresh SOC or transaction authority changed at the
                          HOLD_ARMING persistence boundary
                  - action: script.hoymiles_battery_balancing_transition
                    data:
                      expected_cycle_id: "{{ entry_cycle }}"
                      transaction_state: "HOLD_ARMING"
                      steady_commit_guard: true
                      expected_owner_generation: "{{ entry_owner_generation }}"
                  - if:
                      - condition: template
                        value_template: >-
                          {{ not is_state(
                            'sensor.hoymiles_battery_balancing_transaction',
                            'HOLD_ARMING') }}
                    then:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ is_state(
                                   'sensor.hoymiles_battery_balancing_abort_request',
                                   'PENDING') and state_attr(
                                   'sensor.hoymiles_battery_balancing_abort_request',
                                   'cycle_id') == entry_cycle }}
                        then:
                          - stop: "Hard-stop prevented HOLD_ARMING commit"
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "mode_ack_failed"
                          cycle_id: "{{ entry_cycle }}"
                      - stop: "Current sun/mode rejected HOLD_ARMING"
                  - condition: state
                    entity_id: >-
                      binary_sensor.hoymiles_battery_balancing_apply_authorized
                    state: "on"
                  - condition: template
                    value_template: >-
                      {{ state_attr(
                           'sensor.hoymiles_battery_balancing_transaction',
                           'cycle_id') == entry_cycle
                         and (state_attr(
                           'sensor.hoymiles_battery_balancing_timing_transaction',
                           'hold_generation') | int(-1))
                           == (next_hold_generation | int(-2))
                         and state_attr(
                           'sensor.hoymiles_battery_balancing_timing_transaction',
                           'cycle_id') == entry_cycle
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode',
                           ('self_use' if is_state(
                             'sun.sun', 'above_horizon') else 'grid_charge'))
                         and not (is_state(
                           'sensor.hoymiles_battery_balancing_abort_request',
                           'PENDING')
                         and state_attr(
                           'sensor.hoymiles_battery_balancing_abort_request',
                           'cycle_id') == entry_cycle) }}
                  - action: timer.start
                    target:
                      entity_id: timer.hoymiles_battery_balancing_hold
                    data:
                      duration: >-
                        {{ [((new_hold_deadline | int(0))
                          - (as_timestamp(now()) * 1000)) / 1000, 1] | max }}
                  - wait_template: >-
                      {{ is_state(
                        'timer.hoymiles_battery_balancing_hold', 'active') }}
                    timeout: "00:00:05"
                    continue_on_timeout: true
                  - if:
                      - condition: state
                        entity_id: timer.hoymiles_battery_balancing_hold
                        state: "active"
                      - condition: state
                        entity_id: >-
                          binary_sensor.hoymiles_battery_balancing_apply_authorized
                        state: "on"
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_battery_balancing_transaction',
                               'cycle_id') == entry_cycle
                             and state_attr(
                               'sensor.hoymiles_battery_balancing_timing_transaction',
                               'cycle_id') == entry_cycle
                             and (state_attr(
                               'sensor.hoymiles_battery_balancing_timing_transaction',
                               'hold_generation') | int(-1))
                               == (next_hold_generation | int(-2)) }}
                    then:
                      - action: script.hoymiles_battery_balancing_write_timing
                        data:
                          cycle_id: "{{ entry_cycle }}"
                          gap_generation: >-
                            {{ state_attr(
                              'sensor.hoymiles_battery_balancing_timing_transaction',
                              'gap_generation') }}
                          gap_start_epoch_ms: 0
                          gap_deadline_epoch_ms: 0
                          hold_generation: "{{ next_hold_generation }}"
                          hold_deadline_epoch_ms: "{{ new_hold_deadline }}"
                          timing_state: "HOLDING"
                      - action: script.hoymiles_battery_balancing_transition
                        data:
                          expected_cycle_id: "{{ entry_cycle }}"
                          transaction_state: "HOLDING"
                          steady_commit_guard: true
                          expected_owner_generation: "{{ entry_owner_generation }}"
                      - if:
                          - condition: state
                            entity_id: >-
                              sensor.hoymiles_battery_balancing_transaction
                            state: "HOLDING"
                        then:
                          - action: script.turn_on
                            target:
                              entity_id: >-
                                script.hoymiles_battery_balancing_hold_guard
                            data:
                              variables:
                                cycle_id: "{{ entry_cycle }}"
                                hold_generation: "{{ next_hold_generation }}"
                                hold_deadline_epoch_ms: "{{ new_hold_deadline }}"
                        else:
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ is_state(
                                       'sensor.hoymiles_battery_balancing_abort_request',
                                       'PENDING') and state_attr(
                                       'sensor.hoymiles_battery_balancing_abort_request',
                                       'cycle_id') == entry_cycle }}
                            then:
                              - stop: "Hard-stop prevented HOLDING commit"
                          - action: script.hoymiles_battery_balancing_request_abort
                            data:
                              reason_code: "mode_ack_failed"
                              cycle_id: "{{ entry_cycle }}"
                    else:
                      - action: script.hoymiles_battery_balancing_request_abort
                        data:
                          reason_code: "physical_transaction_failure"
                          cycle_id: "{{ entry_cycle }}"
            default:
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_battery_balancing_transaction')
                       == final_steady_state }}
          # The physical operational fact is committed independently of phone
          # capacity. STARTED remains a durable intent and is retried while the
          # cycle is operational if both bounded outbox slots are occupied.
          - variables:
              committed_state: >-
                {{ states('sensor.hoymiles_battery_balancing_transaction') }}
              started_already: >-
                {{ state_attr(
                  'sensor.hoymiles_battery_balancing_transaction',
                  'operational_started') | bool(false) }}
          - if:
              - condition: template
                value_template: >-
                  {{ committed_state in ['OPERATIONAL', 'SLOW', 'HOLDING']
                     and not started_already
                     and not (is_state(
                       'sensor.hoymiles_battery_balancing_abort_request',
                       'PENDING') and state_attr(
                       'sensor.hoymiles_battery_balancing_abort_request',
                       'cycle_id') == entry_cycle) }}
            then:
              - action: script.hoymiles_battery_balancing_transition
                data:
                  expected_cycle_id: "{{ entry_cycle }}"
                  transaction_state: "{{ committed_state }}"
                  steady_commit_guard: true
                  expected_owner_generation: "{{ entry_owner_generation }}"
                  operational_started: true
                  event_marker: "STARTED"
          - variables:
              started_commit_required_mode: >-
                {{ 'self_use' if is_state('sun.sun', 'above_horizon')
                   else 'grid_charge' }}
              started_fact_committed: >-
                {{ state_attr(
                  'sensor.hoymiles_battery_balancing_transaction',
                  'operational_started') | bool(false) }}
              started_commit_valid: >-
                {{ states('sensor.hoymiles_battery_balancing_transaction')
                     == committed_state
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'cycle_id') == entry_cycle
                   and (state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner_generation') | int(-1))
                     == (entry_owner_generation | int(-2))
                   and state_attr(
                     'sensor.hoymiles_battery_balancing_transaction',
                     'owner') == 'balancing'
                   and is_state(
                     'binary_sensor.hoymiles_battery_balancing_apply_authorized',
                     'on')
                   and is_state(
                     'sensor.hoymiles_ems_hardware_mode',
                     started_commit_required_mode)
                   and not (is_state(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'PENDING') and state_attr(
                     'sensor.hoymiles_battery_balancing_abort_request',
                     'cycle_id') == entry_cycle) }}
              started_event_present: >-
                {{ entry_cycle ~ '.ST' in [
                  state_attr(
                    'sensor.hoymiles_battery_balancing_notification_outbox',
                    'slot_1_event_id'),
                  state_attr(
                    'sensor.hoymiles_battery_balancing_notification_outbox',
                    'slot_2_event_id')] }}
          - if:
              - condition: template
                value_template: "{{ not started_commit_valid }}"
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_state(
                           'sensor.hoymiles_battery_balancing_abort_request',
                           'PENDING') and state_attr(
                           'sensor.hoymiles_battery_balancing_abort_request',
                           'cycle_id') == entry_cycle }}
                then:
                  - stop: "Durable hard-stop won at the STARTED fact boundary"
              - action: script.hoymiles_battery_balancing_request_abort
                data:
                  reason_code: "mode_ack_failed"
                  cycle_id: "{{ entry_cycle }}"
              - stop: "STARTED fact boundary lost the current sun/mode invariant"
          - if:
              - condition: template
                value_template: >-
                  {{ committed_state in ['OPERATIONAL', 'SLOW', 'HOLDING']
                     and started_fact_committed
                     and not started_event_present
                     and state_attr(
                       'sensor.hoymiles_battery_balancing_transaction',
                       'event_marker') == 'STARTED'
                     and not (is_state(
                       'sensor.hoymiles_battery_balancing_abort_request',
                       'PENDING') and state_attr(
                       'sensor.hoymiles_battery_balancing_abort_request',
                       'cycle_id') == entry_cycle) }}
            then:
              - action: script.hoymiles_notify_battery_balancing_lifecycle
                continue_on_error: true
                data:
                  event: "started"
                  reason_code: "none"
                  cycle_id: "{{ entry_cycle }}"
          # Final tail check: a request arriving during the last local helper
          # always queues restoration even if no further routine trigger occurs.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state(
                       'sensor.hoymiles_battery_balancing_abort_request',
                       'PENDING')
                     and state_attr(
                       'sensor.hoymiles_battery_balancing_abort_request',
                       'cycle_id') == entry_cycle }}
            then:
              - stop: >-
                  Durable hard-stop observed at the final tail; its capture
                  path already queued the serialized restore boundary

automation:
  # Independent FIFO lanes reserve admission per burstable priority class. A
  # lower-priority queue therefore cannot discard the later, precise higher
  # reason. Every lane only merges the durable request and wakes the one worker
  # after the shared request serializer has drained.
  - id: hoymiles_battery_balancing_off_grid_hard_stop_capture
    alias: "Battery balancing — priorytetowe przechwycenie Off-Grid"
    mode: queued
    max: 100
    max_exceeded: error
    triggers:
      - trigger: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        to: "off_grid"
        id: ems_off_grid_priority
    variables:
      frozen_transaction_state: >-
        {{ states('sensor.hoymiles_battery_balancing_transaction') }}
      frozen_transaction_cycle: >-
        {{ state_attr(
          'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
      frozen_off_grid_reason: >-
        {{ 'off_grid' if trigger.id == 'ems_off_grid_priority'
             and trigger.from_state is defined
             and trigger.to_state is defined
             and trigger.to_state.state == 'off_grid'
           else 'none' }}
    actions:
      - condition: template
        value_template: >-
          {{ frozen_transaction_state in [
               'REQUESTED', 'OWNER_ACQUIRED', 'SNAPSHOT_VALID', 'APPLYING',
               'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING',
               'ABORT_REQUESTED', 'RESTORING', 'RESTORE_FAILED']
             and frozen_transaction_cycle | string | length > 1
             and frozen_transaction_cycle[0] == 'c'
             and frozen_off_grid_reason == 'off_grid' }}
      - action: script.hoymiles_battery_balancing_request_abort
        data:
          reason_code: "{{ frozen_off_grid_reason }}"
          cycle_id: "{{ frozen_transaction_cycle }}"
          wake_worker: false
      - wait_template: >-
          {{ states('script.hoymiles_battery_balancing_request_abort') != 'on' }}
        timeout: "00:00:05"
        continue_on_timeout: false
      - if:
          - condition: template
            value_template: >-
              {{ (state_attr(this.entity_id, 'current') | int(1)) <= 1
                 and is_state(
                   'sensor.hoymiles_battery_balancing_abort_request', 'PENDING')
                 and state_attr(
                   'sensor.hoymiles_battery_balancing_abort_request', 'cycle_id')
                   == frozen_transaction_cycle }}
        then:
          - action: script.turn_on
            target:
              entity_id: >-
                script.hoymiles_battery_balancing_transaction_worker
            data:
              variables:
                intent: "abort"
                expected_cycle_id: "{{ frozen_transaction_cycle }}"

  - id: hoymiles_battery_balancing_p95_hard_stop_capture
    alias: "Battery balancing — independent hard-stop capture"
    mode: queued
    max: 100
    max_exceeded: error
    triggers:
      - trigger: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        to: "off"
        id: owner_lost_priority
      - trigger: state
        entity_id: binary_sensor.hoymiles_ems_control_conflict
        to: "on"
        id: control_conflict_priority
    variables:
      frozen_transaction_state: >-
        {{ states('sensor.hoymiles_battery_balancing_transaction') }}
      frozen_transaction_cycle: >-
        {{ state_attr(
          'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
      frozen_priority_reason: >-
        {% if trigger.id == 'owner_lost_priority'
              and trigger.to_state is defined
              and trigger.to_state is not none
              and trigger.to_state.state == 'off' %}
          ownership_lost
        {% elif trigger.id == 'control_conflict_priority'
              and trigger.to_state is defined
              and trigger.to_state is not none
              and trigger.to_state.state == 'on' %}
          control_conflict
        {% else %}none{% endif %}
    actions:
      - condition: template
        value_template: >-
          {{ frozen_transaction_state in [
               'REQUESTED', 'OWNER_ACQUIRED', 'SNAPSHOT_VALID', 'APPLYING',
               'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING',
               'ABORT_REQUESTED', 'RESTORING', 'RESTORE_FAILED']
             and frozen_transaction_cycle | string | length > 1
             and frozen_transaction_cycle[0] == 'c'
             and frozen_priority_reason in [
               'ownership_lost', 'control_conflict'] }}
      - action: script.hoymiles_battery_balancing_request_abort
        data:
          reason_code: "{{ frozen_priority_reason }}"
          cycle_id: "{{ frozen_transaction_cycle }}"
          wake_worker: false
      - wait_template: >-
          {{ states('script.hoymiles_battery_balancing_request_abort') != 'on' }}
        timeout: "00:00:05"
        continue_on_timeout: false
      - if:
          - condition: template
            value_template: >-
              {{ (state_attr(this.entity_id, 'current') | int(1)) <= 1
                 and is_state(
                   'sensor.hoymiles_battery_balancing_abort_request', 'PENDING')
                 and state_attr(
                   'sensor.hoymiles_battery_balancing_abort_request', 'cycle_id')
                   == frozen_transaction_cycle }}
        then:
          - action: script.turn_on
            target:
              entity_id: >-
                script.hoymiles_battery_balancing_transaction_worker
            data:
              variables:
                intent: "abort"
                expected_cycle_id: "{{ frozen_transaction_cycle }}"

  - id: hoymiles_battery_balancing_p90_hard_stop_capture
    alias: "Battery balancing — independent hard-stop capture"
    mode: queued
    max: 100
    max_exceeded: error
    triggers:
      - trigger: state
        entity_id: sensor.hoymiles_hit_battery_fault_code_bms
        not_to: "No error"
        id: bms_fault_code_priority
      - trigger: state
        entity_id: sensor.hoymiles_hit_overview_battery_faults
        not_to: "No faults"
        id: bms_overview_fault_priority
      - trigger: state
        entity_id: sensor.hoymiles_hit_inverter_work_status
        not_to:
          - "Standby"
          - "Grid test"
          - "On-grid operation"
        id: inverter_fault_priority
      - trigger: template
        value_template: >-
          {% set value = states(
            'sensor.hoymiles_hit_maximum_charge_current') %}
          {{ not is_number(value) or (value | float(0)) <= 0
             or (value | float(0)) | abs >= 1000000000 }}
        id: bms_current_invalid_priority
      - trigger: template
        value_template: >-
          {% set value = states('sensor.hoymiles_hit_battery_voltage_bms') %}
          {{ not is_number(value) or (value | float(0)) <= 0
             or (value | float(0)) | abs >= 1000000000 }}
        id: bms_voltage_invalid_priority
      - trigger: template
        value_template: >-
          {% set value = states(
            'sensor.hoymiles_battery_balancing_bms_safe_charge_power') %}
          {{ not is_number(value) or (value | float(0)) <= 0
             or (value | float(0)) | abs >= 1000000000 }}
        id: bms_safe_limit_invalid_priority
      - trigger: template
        value_template: >-
          {% set machine_type = states('sensor.hoymiles_hit_machines_type') %}
          {% set machine_count = states(
            'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
          {{ not (is_number(machine_type) and is_number(machine_count)
             and (machine_count | float(0)) == (machine_count | int(-1))
             and (((machine_type | int(-1)) == 0
                   and (machine_count | int(-1)) == 1)
                  or ((machine_type | int(-1)) == 1
                      and (machine_count | int(-1)) >= 2
                      and (machine_count | int(-1)) <= 10))) }}
        id: topology_invalid_priority
    variables:
      frozen_transaction_state: >-
        {{ states('sensor.hoymiles_battery_balancing_transaction') }}
      frozen_transaction_cycle: >-
        {{ state_attr(
          'sensor.hoymiles_battery_balancing_transaction', 'cycle_id') }}
      frozen_priority_reason: >-
        {% if trigger.id in [
              'bms_fault_code_priority', 'bms_overview_fault_priority']
              and trigger.to_state is defined
              and trigger.to_state is not none %}
          bms_fault
        {% elif trigger.id in [
              'bms_current_invalid_priority', 'bms_voltage_invalid_priority'] %}
          bms_data_invalid
        {% elif trigger.id == 'bms_safe_limit_invalid_priority' %}
          bms_limit_invalid
        {% elif trigger.id == 'inverter_fault_priority'
              and trigger.to_state is defined
              and trigger.to_state is not none %}
          inverter_fault
        {% elif trigger.id == 'topology_invalid_priority' %}
          invalid_topology
        {% else %}none{% endif %}
    actions:
      - condition: template
        value_template: >-
          {{ frozen_transaction_state in [
               'REQUESTED', 'OWNER_ACQUIRED', 'SNAPSHOT_VALID', 'APPLYING',
               'OPERATIONAL', 'SLOW', 'HOLD_ARMING', 'HOLDING',
               'ABORT_REQUESTED', 'RESTORING', 'RESTORE_FAILED']
             and frozen_transaction_cycle | string | length > 1
             and frozen_transaction_cycle[0] == 'c'
             and frozen_priority_reason in [
               'bms_fault', 'inverter_fault', 'bms_data_invalid',
               'bms_limit_invalid', 'invalid_topology'] }}
      - action: script.hoymiles_battery_balancing_request_abort
        data:
          reason_code: "{{ frozen_priority_reason }}"
          cycle_id: "{{ frozen_transaction_cycle }}"
          wake_worker: false
      - wait_template: >-
          {{ states('script.hoymiles_battery_balancing_request_abort') != 'on' }}
        timeout: "00:00:05"
        continue_on_timeout: false
      - if:
          - condition: template
            value_template: >-
              {{ (state_attr(this.entity_id, 'current') | int(1)) <= 1
                 and is_state(
                   'sensor.hoymiles_battery_balancing_abort_request', 'PENDING')
                 and state_attr(
