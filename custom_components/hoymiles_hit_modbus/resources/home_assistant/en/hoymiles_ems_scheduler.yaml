      - name: "Hoymiles Tariff Charge Status"
        unique_id: hoymiles_tariff_charge_status
        icon: mdi:battery-clock-outline
        state: >-
          {% set plan = states.sensor.hoymiles_hit_tariff_charge_plan %}
          {% set plan_state = states('sensor.hoymiles_hit_tariff_charge_plan') %}
          {% set status = state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                     'status_code')
                          | default('missing_data', true) %}
          {% set pending = state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                      'recalculation_pending') is sameas true %}
          {% set result_current = state_attr(
               'sensor.hoymiles_hit_tariff_charge_plan',
               'result_current') is sameas true %}
          {% set current_slot = state_attr(
               'sensor.hoymiles_hit_tariff_charge_plan',
               'current_slot_planned') is sameas true %}
          {% set planned_slots = state_attr(
               'sensor.hoymiles_hit_tariff_charge_plan',
               'planned_slots') | default([], true) %}
          {% set active_action = states(
               'input_text.hoymiles_tariff_active_action') %}
          {% set blocking_statuses = [
               'missing_data', 'optimizer_error', 'unsupported_profile',
               'expired_profile', 'soc_limits_conflict',
               'hard_reserve_unavailable'] %}
          {% if is_state('input_boolean.hoymiles_tariff_charge_active', 'on') %}
            {% if is_state('input_boolean.hoymiles_tariff_charge_enabled', 'off') %}
              Disabled — finishing the active slot
            {% elif active_action == 'grid_support' %}
              Active — home supplied from the low-cost grid
            {% elif active_action in ['battery_charge',
                                      'grid_support_and_charge'] %}
              Active — grid charging
            {% else %}
              Active — tariff control
            {% endif %}
          {% elif is_state('input_boolean.hoymiles_tariff_charge_enabled', 'off') %}
            Disabled
          {% elif not is_state('input_boolean.hoymiles_tariff_charge_enabled',
                                'on') %}
            Unavailable — initializing
          {% elif is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on') %}
            Enabled — blocked: RCE policy is enabled
          {% elif plan is none
                or plan_state in ['unknown', 'unavailable', 'none', ''] %}
            Enabled — blocked: plan unavailable
          {% elif pending or not result_current %}
            Enabled — waiting for a current plan
          {% elif status in blocking_statuses %}
            Enabled — blocked: {{ plan_state }}
          {% elif not is_state('binary_sensor.hoymiles_tariff_control_data_ready',
                                'on') %}
            Enabled — blocked: {{
              state_attr('binary_sensor.hoymiles_tariff_control_data_ready',
                         'reason') | default(plan_state, true) }}
          {% elif status == 'no_charge_needed' %}
            Enabled — no charging needed
          {% elif current_slot %}
            Enabled — selected slot waiting to start
          {% elif planned_slots | count > 0 %}
            Enabled — waiting for a selected slot
          {% else %}
            Enabled — {{ plan_state }}
          {% endif %}

      # Single runtime source of truth for the complete parallel system.  Every
      # slow-power calculation below reads this entity; the literal is not
      # repeated at any physical call site.
      - name: "Hoymiles Battery Balancing Slow Target"
        unique_id: hoymiles_battery_balancing_slow_target
        icon: mdi:battery-arrow-up-outline
        unit_of_measurement: "kW"
        state_class: measurement
        state: >-
          {% set BALANCING_SLOW_TARGET_KW = 0.4 %}
          {{ BALANCING_SLOW_TARGET_KW }}
        attributes:
          scope: aggregate_parallel_system

      - name: "Hoymiles Battery Balancing BMS Safe Charge Power"
        unique_id: hoymiles_battery_balancing_bms_safe_charge_power
        icon: mdi:battery-lock-open-outline
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set rated = {
            '5 kW': 5.0, '8 kW': 8.0, '10 kW': 10.0,
            '12 kW': 12.0, '15 kW': 15.0, '20 kW': 20.0
          }.get(states('input_select.hoymiles_rce_inverter_rated_power')) %}
          {% set machine_type = states('sensor.hoymiles_hit_machines_type') %}
          {% set machine_count = states(
            'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
          {% set load_raw = states('sensor.hoymiles_actual_load_power') %}
          {% set current_raw = states(
            'sensor.hoymiles_hit_maximum_charge_current') %}
          {% set voltage_raw = states(
            'sensor.hoymiles_hit_battery_voltage_bms') %}
          {% set topology_valid = is_number(machine_type)
             and is_number(machine_count)
             and (machine_count | float(0)) == (machine_count | int(-1))
             and (((machine_type | int(-1)) == 0
                   and (machine_count | int(-1)) == 1)
                  or ((machine_type | int(-1)) == 1
                      and (machine_count | int(-1)) >= 2
                      and (machine_count | int(-1)) <= 10)) %}
          {{ rated is number and rated > 0 and topology_valid
             and is_number(load_raw) and (load_raw | float(-1)) >= 0
             and (load_raw | float(0)) | abs < 1000000000
             and is_number(current_raw) and (current_raw | float(0)) > 0
             and (current_raw | float(0)) | abs < 1000000000
             and is_number(voltage_raw) and (voltage_raw | float(0)) > 0
             and (voltage_raw | float(0)) | abs < 1000000000 }}
        state: >-
          {% set rated = {
            '5 kW': 5.0, '8 kW': 8.0, '10 kW': 10.0,
            '12 kW': 12.0, '15 kW': 15.0, '20 kW': 20.0
          }.get(states('input_select.hoymiles_rce_inverter_rated_power')) %}
          {% set machines = states(
            'sensor.hoymiles_hit_number_of_machines_master_and_slave') | int(0) %}
          {% set system_power = (rated | default(0, true)) * machines %}
          {% set load_power = states('sensor.hoymiles_actual_load_power')
             | float(0) / 1000 %}
          {% set bms_power =
             (states('sensor.hoymiles_hit_maximum_charge_current') | float(0))
             * (states('sensor.hoymiles_hit_battery_voltage_bms') | float(0))
             / 1000 %}
          {% set direct_raw = [bms_power / system_power * 100, 100] | min
             if system_power > 0 and bms_power > 0 else 0 %}
          {% set grid_raw = [(bms_power + load_power) / system_power * 100,
                             100] | min
             if system_power > 0 and bms_power > 0 and load_power >= 0 else 0 %}
          {% set direct = ((direct_raw * 10) | round(0, 'floor') / 10)
             if direct_raw >= 0.1 else 0 %}
          {% set grid = ((grid_raw * 10) | round(0, 'floor') / 10)
             if grid_raw >= 0.1 else 0 %}
          {{ (grid if is_state('sensor.hoymiles_ems_hardware_mode',
                               'grid_charge') else direct) | round(1) }}
        attributes:
          self_use_percent: >-
            {% set rated = {
              '5 kW': 5.0, '8 kW': 8.0, '10 kW': 10.0,
              '12 kW': 12.0, '15 kW': 15.0, '20 kW': 20.0
            }.get(states('input_select.hoymiles_rce_inverter_rated_power')) %}
            {% set machines = states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') | int(0) %}
            {% set system_power = (rated | default(0, true)) * machines %}
            {% set bms_power =
               (states('sensor.hoymiles_hit_maximum_charge_current') | float(0))
               * (states('sensor.hoymiles_hit_battery_voltage_bms') | float(0))
               / 1000 %}
            {% set raw = [bms_power / system_power * 100, 100] | min
               if system_power > 0 and bms_power > 0 else 0 %}
            {{ (((raw * 10) | round(0, 'floor')) / 10
                if raw >= 0.1 else 0) | round(1) }}
          grid_charge_percent: >-
            {% set rated = {
              '5 kW': 5.0, '8 kW': 8.0, '10 kW': 10.0,
              '12 kW': 12.0, '15 kW': 15.0, '20 kW': 20.0
            }.get(states('input_select.hoymiles_rce_inverter_rated_power')) %}
            {% set machines = states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') | int(0) %}
            {% set system_power = (rated | default(0, true)) * machines %}
            {% set load_power = states('sensor.hoymiles_actual_load_power')
               | float(0) / 1000 %}
            {% set bms_power =
               (states('sensor.hoymiles_hit_maximum_charge_current') | float(0))
               * (states('sensor.hoymiles_hit_battery_voltage_bms') | float(0))
               / 1000 %}
            {% set raw = [(bms_power + load_power) / system_power * 100,
                           100] | min
               if system_power > 0 and bms_power > 0 and load_power >= 0 else 0 %}
            {{ (((raw * 10) | round(0, 'floor')) / 10
                if raw >= 0.1 else 0) | round(1) }}
          quantization: floor_to_0.1_percent
          description: >-
            BMS limit for the single EMS 4304 field. In Self-Use it limits
            battery charging; in Grid Charge it covers LOAD and battery power.

      - name: "Hoymiles Battery Balancing Slow Charge Power"
        unique_id: hoymiles_battery_balancing_slow_charge_power
        icon: mdi:speedometer-slow
        unit_of_measurement: "%"
