  hoymiles_rce_soc_safety_margin:
    name: "EMS RCE — SOC safety correction"
    min: 0
    max: 50
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:shield-plus-outline

  hoymiles_rce_fallback_daily_load:
    name: "EMS RCE — fallback daily consumption before history is available"
    min: 1
    max: 200
    step: 0.5
    initial: 10
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:home-lightning-bolt-outline

  hoymiles_rce_export_efficiency:
    name: "EMS RCE — battery export efficiency"
    min: 80
