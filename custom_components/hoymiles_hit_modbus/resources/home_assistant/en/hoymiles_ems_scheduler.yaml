             in ['self_use', 'off_grid'] }}
        timeout: "00:00:35"
        continue_on_timeout: false
      # Clear ownership only after positive readback and a final idle check.
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode')
             in ['self_use', 'off_grid'] }}
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_charge', 'idle') }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active

  - id: hoymiles_restore_ems_cycle_after_ha_restart
    alias: "EMS — restore cycle after Home Assistant restart"
    description: "Restores an active cycle or returns to Self-Use if its timer expired while HA was offline."
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_discharge
                state: "active"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['off_grid', 'unknown', 'unavailable', 'none', ''] }}
            sequence:
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_discharge
                state: "active"
              # The five-minute readback wait can outlive the sale window.
              # Re-evaluate it immediately before any Grid Discharge request.
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - variables:
                  recovery_parallel_generation_before_mode: >-
                    {{ states(
                      'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation')
                       | float(-1) }}
                  recovery_response_transaction_id: >-
                    {{ now().strftime('%Y%m%dT%H%M%S.%f%z') }}-manual-recovery
                  recovery_response_transaction_started_epoch: >-
                    {{ as_timestamp(now()) }}
                  recovery_latched_machine_type: >-
                    {{ states('sensor.hoymiles_hit_machines_type') | int(-1) }}
                  recovery_latched_inverter_count: >-
                    {{ states(
                      'sensor.hoymiles_hit_number_of_machines_master_and_slave')
                       | int(-1) }}
                  recovery_latched_esp_uptime_seconds: >-
                    {{ states('sensor.hoymiles_hit_esp_uptime') | float(-1) }}
                  recovery_latched_esp_uptime_reported_epoch: >-
                    {% set item = states.sensor.hoymiles_hit_esp_uptime %}
                    {{ as_timestamp(item.last_reported
                         if item.last_reported is defined
                         else item.last_updated, 0) }}
              - variables:
                  recovery_topology_known: >-
                    {{ ((recovery_latched_machine_type | int(-1)) == 0
                         and (recovery_latched_inverter_count | int(-1)) == 1)
                       or ((recovery_latched_machine_type | int(-1)) == 1
                           and (recovery_latched_inverter_count | int(-1)) >= 2
                           and (recovery_latched_inverter_count | int(-1)) <= 10) }}
                  recovery_requires_parallel_proof: >-
                    {{ (recovery_latched_machine_type | int(-1)) == 1
                       and (recovery_latched_inverter_count | int(-1)) >= 2
                       and (recovery_latched_inverter_count | int(-1)) <= 10 }}
                  recovery_esp_uptime_ready: >-
                    {% set age =
                      (recovery_response_transaction_started_epoch | float(0))
                      - (recovery_latched_esp_uptime_reported_epoch | float(0)) %}
                    {{ (recovery_latched_esp_uptime_seconds | float(-1)) >= 180
                       and age >= -5 and age <= 180 }}
              - condition: template
                value_template: "{{ recovery_topology_known | bool(false) }}"
              - condition: template
                value_template: "{{ recovery_esp_uptime_ready | bool(false) }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'off_grid')
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode',
                           'grid_discharge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_discharge"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                timeout: "00:02:00"
                continue_on_timeout: false
              - action: >-
                  script.hoymiles_verify_parallel_aggregate_discharge_response
                data:
                  transaction_id: "{{ recovery_response_transaction_id }}"
                  transaction_started_epoch: >-
                    {{ recovery_response_transaction_started_epoch }}
                  baseline_generation: >-
                    {{ recovery_parallel_generation_before_mode }}
                  latched_esp_uptime_seconds: >-
                    {{ recovery_latched_esp_uptime_seconds }}
                  owner: manual_recovery
                  latched_machine_type: "{{ recovery_latched_machine_type }}"
                  latched_inverter_count: "{{ recovery_latched_inverter_count }}"
                  topology_known: "{{ recovery_topology_known }}"
                  requires_parallel_proof: >-
                    {{ recovery_requires_parallel_proof }}
                  authoritative_expected_power: false
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
            sequence:
              # An active discharge that cannot continue because the sale
              # block is now active is finalized through the same safe path.
              - if:
                  - condition: state
                    entity_id: timer.hoymiles_discharge
                    state: "active"
                then:
                  - action: timer.cancel
                    target:
                      entity_id: timer.hoymiles_discharge
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_discharge', 'idle') }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     in ['self_use', 'off_grid'] }}
                timeout: "00:02:00"
                continue_on_timeout: false
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     in ['self_use', 'off_grid'] }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_discharge', 'idle') }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_discharge_cycle_active
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_charge
                state: "active"
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['off_grid', 'unknown', 'unavailable', 'none', ''] }}
            sequence:
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_charge
                state: "active"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'off_grid')
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                timeout: "00:02:00"
                continue_on_timeout: false
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_charge', 'idle')
                     or is_state(
                       'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
            sequence:
              - if:
                  - condition: state
                    entity_id: timer.hoymiles_charge
                    state: "active"
                then:
                  - action: timer.cancel
                    target:
                      entity_id: timer.hoymiles_charge
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_charge', 'idle') }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     in ['self_use', 'off_grid'] }}
                timeout: "00:02:00"
                continue_on_timeout: false
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     in ['self_use', 'off_grid'] }}
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_charge', 'idle') }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_charge_cycle_active

  - id: hoymiles_rcm_voltage_charge_control
    alias: "RCEm 253 V+ — battery and safe-export control"
    description: >-
      Applies the voltage planner recommendation to the global limit every minute
      Battery Max Charge Power and, when separately enabled, the maximum
      export limit. Observation mode never writes to the inverter. RCEm does not
      switch GCF, Grid Charge, unbalance or protection settings.
    # A 253 V transition must interrupt normal readback waits immediately.
    # Every write path claims ownership before its first actuator change, so a
    # restarted run can safely continue emergency control or restore pending
    # user settings without losing the transaction.
    mode: restart
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_rcm_shadow_mode
          - input_boolean.hoymiles_rcm_export_control_enabled
          - input_number.hoymiles_rcm_export_cap_percent
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - sensor.hoymiles_ems_hardware_mode
          - select.hoymiles_hit_generation_control_function
          - sensor.hoymiles_hit_direct_register_verified_readback_supported
      - trigger: numeric_state
        entity_id: sensor.hoymiles_rcem_maximum_grid_voltage
        # Trigger exactly at the emergency contract boundary. A lower crossing
        # can be consumed by a non-emergency run and HA would not fire again at
        # 253 V while the value remains above that lower threshold.
        above: 252.99
        id: voltage_emergency
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          plan_status: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'status_code') | default('missing_data', true) }}
          result_current: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'result_current') | default(false, true) }}
          recommended_limit: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'recommended_charge_limit_percent') | float(0) }}
          recommended_export_limit: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'recommended_export_limit_percent') | float(-1) }}
          maximum_voltage: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'maximum_voltage_v') | float(999) }}
          live_emergency: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'live_emergency') | default(false, true) }}
          emergency_action_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'emergency_action_ready') | default(false, true) }}
          prediction_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'prediction_ready') | default(false, true) }}
          voltage_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'voltage_data_fresh') | default(false, true) }}
          emergency_voltage_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'emergency_voltage_data_fresh')
               | default(false, true) }}
          actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'actuator_data_fresh') | default(false, true) }}
          charge_actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'charge_actuator_data_fresh')
               | default(false, true) }}
          export_actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'export_actuator_data_fresh')
               | default(false, true) }}
          export_register_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'export_register_data_fresh')
               | default(false, true) }}
          pre_discharge_actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_actuator_data_fresh')
               | default(false, true) }}
          ems_mode_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'ems_mode_data_fresh') | default(false, true) }}
          rcm_plan_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_rcm_voltage_plan %}
            {% set reported = item.last_reported
              if item.last_reported is defined else item.last_updated %}
            {{ as_timestamp(now()) - as_timestamp(reported, 0) }}
          forecast_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'forecast_data_fresh') | default(false, true) }}
          history_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'history_data_fresh') | default(false, true) }}
          live_power_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'live_power_data_fresh') | default(false, true) }}
          bms_charge_available: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'bms_charge_available') | default(false, true) }}
          bms_charge_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'bms_charge_data_fresh') | default(false, true) }}
          system_power_data_valid: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'system_power_data_valid')
               | default(false, true) }}
          gcf_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'gcf_data_fresh') | default(false, true) }}
          direct_register_write_ready: >-
            {{ is_state(
                 'binary_sensor.hoymiles_direct_register_execution_ready', 'on') }}
          export_control_requested: >-
            {{ is_state('input_boolean.hoymiles_rcm_export_control_enabled',
                        'on') }}
          export_control_available: >-
            {{ gcf_data_fresh
               and is_number(states(
                  'sensor.hoymiles_hit_gcf_maximum_export_power_readback'))
               and (states(
                    'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                    | float(-1)) >= 0
               and (states('sensor.hoymiles_hit_gcf_enable_readback_code')
                    | int(-1)) == 1 }}
          rcm_blocked: >-
            {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
               or is_state('input_boolean.hoymiles_rce_discharge_active', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_active', 'on')
               or is_state('input_boolean.hoymiles_battery_balancing_active', 'on')
               or is_state('input_boolean.hoymiles_discharge_cycle_active', 'on')
               or is_state('input_boolean.hoymiles_charge_cycle_active', 'on')
               or is_state('timer.hoymiles_discharge', 'active')
               or is_state('timer.hoymiles_charge', 'active')
               or is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
          emergency_charge_path: >-
            {{ direct_register_write_ready
               and charge_actuator_data_fresh
               and ems_mode_data_fresh
               and system_power_data_valid
               and bms_charge_available
               and bms_charge_data_fresh
               and recommended_limit >= 10
               and is_number(states(
                 'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
          emergency_export_path: >-
            {{ direct_register_write_ready
               and export_control_requested
               and export_control_available
               and export_actuator_data_fresh
               and recommended_export_limit >= 0 }}
          normal_export_path: >-
            {{ direct_register_write_ready
               and export_control_requested
               and export_control_available
               and export_actuator_data_fresh
               and recommended_export_limit >= 0 }}
      - choose:
          # Voltage >=253 V jest zdarzeniem wykonawczym, nie prognozą. Ta
          # ścieżka ma najwyższy priorytet i działa także podczas uczenia lub
          # chwilowego braku Solcast/historii. Nadal wymaga świeżego napięcia,
          # odczytu nastaw i co najmniej jednego fizycznie dostępnego aktuatora.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_shadow_mode
                state: "off"
              - condition: template
                value_template: >-
                  {{ not rcm_blocked
                     and result_current
                     and rcm_plan_age_seconds >= 0
                     and rcm_plan_age_seconds <= 60
                     and live_emergency
                     and emergency_action_ready
                     and maximum_voltage >= 253.0
                     and emergency_voltage_data_fresh
                     and (emergency_charge_path or emergency_export_path) }}
            sequence:
              # Emergency always cancels an in-flight morning export before
              # attempting to absorb PV or clamp export.
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                    state: "on"
                then:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ems_mode_data_fresh }}
                    then:
                      - if:
                          - condition: state
                            entity_id: sensor.hoymiles_ems_hardware_mode
                            state: "grid_discharge"
                        then:
                          - action: script.hoymiles_verified_set_ems_mode
                            data:
                              option: "self_use"
                          - wait_template: >-
                              {{ is_state(
                                'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                            timeout: "00:01:00"
                            continue_on_timeout: true

              # Charge and export ownership are independent. In an export-only
              # emergency, never snapshot or restore an unavailable charge
              # register with a synthetic fallback value.
              - if:
                  - condition: template
                    value_template: >-
                      {{ emergency_charge_path
                         and is_state(
                           'binary_sensor.hoymiles_direct_register_execution_ready',
                           'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_active', 'off') }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rcm_saved_battery_charge_power
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(100) | round(1) }}
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active
              - if:
                  - condition: template
                    value_template: >-
                      {{ emergency_charge_path
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    continue_on_error: true
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true

              # A zero/stale BMS charge limit never produces a charge write.
              # Final live charge-write interlock after every prior mode ACK.
              # This is actuator-local: a failure skips only the charge write,
              # then the independent finalizers restore any pending owner.
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = 'sensor.hoymiles_hit_rcm_voltage_plan' %}
                      {% set plan_state = states.sensor
                           .hoymiles_hit_rcm_voltage_plan %}
                      {% set reported = plan_state.last_reported
                           if plan_state.last_reported is defined
                           else plan_state.last_updated %}
                      {% set age = as_timestamp(now())
                           - as_timestamp(reported, 0) %}
                      {% set live_limit = state_attr(
                           plan, 'recommended_charge_limit_percent')
                           | float(-999) %}
                      {{ emergency_charge_path
                         and age >= 0 and age <= 60
                         and (state_attr(plan, 'result_current')
                              | default(false, true))
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and is_state('input_boolean.hoymiles_rcm_active', 'on')
                         and is_state(
                           'binary_sensor.hoymiles_ems_control_conflict', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_battery_balancing_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_charge_cycle_active', 'off')
                         and not is_state('timer.hoymiles_discharge', 'active')
                         and not is_state('timer.hoymiles_charge', 'active')
                         and is_state(
                           'binary_sensor.hoymiles_direct_register_execution_ready',
                           'on')
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and (state_attr(plan, 'live_emergency')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_action_ready')
                              | default(false, true))
                         and (state_attr(plan, 'maximum_voltage_v')
                              | float(0)) >= 253.0
                         and (state_attr(plan, 'emergency_voltage_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'system_power_data_valid')
                              | default(false, true))
                         and (state_attr(plan, 'ems_mode_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'charge_actuator_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'bms_charge_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'bms_charge_available')
                              | default(false, true))
                         and live_limit >= 10
                         and (live_limit - (recommended_limit | float(0)))
                              | abs < 1.0
                         and is_number(states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_battery_max_charge_power
                    continue_on_error: true
                    data:
                      value: "{{ recommended_limit | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (recommended_limit | float(0)))
                           | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true

              - if:
                  - condition: template
                    value_template: "{{ emergency_export_path }}"
                then:
                  - if:
                      - condition: state
                        entity_id: input_boolean.hoymiles_rcm_export_control_active
                        state: "off"
                    then:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.hoymiles_rcm_saved_export_limit
                        data:
                          value: >-
                            {{ states(
                              'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(0) | round(1) }}
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active
                  # Final live export-write interlock after the optional charge
                  # ACK. A lost topology/policy skips only this GCF write; the
                  # actuator-local finalizers below preserve the charge path.
                  - if:
                      - condition: template
                        value_template: >-
                          {% set plan =
                            'sensor.hoymiles_hit_rcm_voltage_plan' %}
                          {% set plan_state = states.sensor
                               .hoymiles_hit_rcm_voltage_plan %}
                          {% set reported = plan_state.last_reported
                               if plan_state.last_reported is defined
                               else plan_state.last_updated %}
                          {% set age = as_timestamp(now())
                               - as_timestamp(reported, 0) %}
                          {% set live_limit = state_attr(
                               plan, 'recommended_export_limit_percent')
                               | float(-999) %}
                          {% set gcf = states(
                               'sensor.hoymiles_hit_gcf_enable_readback_code') %}
                          {% set readback = states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback') %}
                          {{ emergency_export_path
                             and age >= 0 and age <= 60
                             and (state_attr(plan, 'result_current')
                                  | default(false, true))
                             and is_state(
                               'input_boolean.hoymiles_rcm_enabled', 'on')
                             and is_state(
                               'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_export_control_enabled',
                               'on')
                             and is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'on')
                             and is_state(
                               'binary_sensor.hoymiles_ems_control_conflict',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_enabled',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_enabled',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_battery_balancing_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_discharge_cycle_active',
                               'off')
                             and is_state(
                               'input_boolean.hoymiles_charge_cycle_active',
                               'off')
                             and not is_state(
                               'timer.hoymiles_discharge', 'active')
                             and not is_state(
                               'timer.hoymiles_charge', 'active')
                             and is_state(
                               'binary_sensor.hoymiles_direct_register_execution_ready',
                               'on')
                             and states('sensor.hoymiles_ems_hardware_mode')
                               not in ['off_grid', 'unknown', 'unavailable',
                                       'none', '']
                             and (state_attr(plan, 'live_emergency')
                                  | default(false, true))
                             and (state_attr(plan, 'emergency_action_ready')
                                  | default(false, true))
                             and (state_attr(plan, 'maximum_voltage_v')
                                  | float(0)) >= 253.0
                             and (state_attr(
                               plan, 'emergency_voltage_data_fresh')
                                  | default(false, true))
                             and (state_attr(plan, 'export_actuator_data_fresh')
                                  | default(false, true))
                             and (state_attr(plan, 'gcf_data_fresh')
                                  | default(false, true))
                             and (gcf | int(-1)) == 1
                             and is_number(readback)
                             and (readback | float(-1)) >= 0
                             and live_limit >= 0
                             and (live_limit
                                  - (recommended_export_limit | float(0)))
                                  | abs < 1.0 }}
                    then:
                      - action: script.hoymiles_verified_set_gcf_export_limit
                        continue_on_error: true
                        data:
                          value: "{{ recommended_export_limit | round(1) }}"
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999))
                              - (recommended_export_limit | float(0))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true

              # Final emergency interlocks are actuator-local. A failed charge
              # acknowledgement must never roll back a successful export clamp,
              # and a failed export acknowledgement must never undo absorption.
              # Each transaction retains only its own durable owner until its
              # previous physical value is positively read back.
              # Charge emergency finalization (independent actuator path).
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = 'sensor.hoymiles_hit_rcm_voltage_plan' %}
                      {% set plan_state = states.sensor
                           .hoymiles_hit_rcm_voltage_plan %}
                      {% set plan_reported = plan_state.last_reported
                           if plan_state.last_reported is defined
                           else plan_state.last_updated %}
                      {% set plan_age = as_timestamp(now())
                           - as_timestamp(plan_reported, 0) %}
                      {% set recommendation_same =
                           ((state_attr(plan,
                              'recommended_charge_limit_percent') | float(-999))
                            - (recommended_limit | float(0))) | abs < 1.0 %}
                      {% set charge_ack =
                           ((states(
                              'sensor.hoymiles_hit_battery_max_charge_power_readback')
                              | float(-999))
                            - (recommended_limit | float(0))) | abs < 1.0 %}
                      {{ emergency_charge_path
                         and is_state(
                           'binary_sensor.hoymiles_direct_register_execution_ready',
                           'on')
                         and (state_attr(plan, 'result_current')
                              | default(false, true))
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and plan_age >= 0 and plan_age <= 60
                         and not rcm_blocked
                         and (state_attr(plan, 'live_emergency')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_action_ready')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_voltage_data_fresh')
                              | default(false, true))
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and (state_attr(plan, 'charge_actuator_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'bms_charge_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'bms_charge_available')
                              | default(false, true))
                         and recommendation_same
                         and charge_ack }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active
                else:
                  - if:
                      - condition: template
                        value_template: "{{ emergency_charge_path }}"
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.hoymiles_rcm_active
                      - if:
                          - condition: template
                            value_template: >-
                              {{ state_attr(
                                   'sensor.hoymiles_hit_rcm_voltage_plan',
                                   'charge_actuator_data_fresh')
                                   | default(false, true)
                                 and is_number(states(
                                   'input_number.hoymiles_rcm_saved_battery_charge_power'))
                                 and is_number(states(
                                   'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
                        then:
                          - action: script.hoymiles_verified_set_battery_max_charge_power
                            continue_on_error: true
                            data:
                              value: >-
                                {{ states(
                                  'input_number.hoymiles_rcm_saved_battery_charge_power')
                                   | float(100) | round(1) }}
                          - wait_template: >-
                              {{ ((states(
                                   'sensor.hoymiles_hit_battery_max_charge_power_readback')
                                   | float(-999)) - (states(
                                   'input_number.hoymiles_rcm_saved_battery_charge_power')
                                   | float(100))) | abs < 1.0 }}
                            timeout: "00:01:00"
                            continue_on_timeout: true
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ ((states(
                                       'sensor.hoymiles_hit_battery_max_charge_power_readback')
                                       | float(-999)) - (states(
                                       'input_number.hoymiles_rcm_saved_battery_charge_power')
                                       | float(100))) | abs < 1.0 }}
                            then:
                              - action: input_boolean.turn_off
                                target:
                                  entity_id: input_boolean.hoymiles_rcm_active

              # Export emergency finalization (independent actuator path).
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = 'sensor.hoymiles_hit_rcm_voltage_plan' %}
                      {% set plan_state = states.sensor
                           .hoymiles_hit_rcm_voltage_plan %}
                      {% set plan_reported = plan_state.last_reported
                           if plan_state.last_reported is defined
                           else plan_state.last_updated %}
                      {% set plan_age = as_timestamp(now())
                           - as_timestamp(plan_reported, 0) %}
                      {% set recommendation_same =
                           ((state_attr(plan,
                              'recommended_export_limit_percent') | float(-999))
                            - (recommended_export_limit | float(0))) | abs < 1.0 %}
                      {% set export_ack =
                           ((states(
                              'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                              | float(-999))
                            - (recommended_export_limit | float(0))) | abs < 1.0 %}
                      {{ emergency_export_path
                         and is_state(
                           'binary_sensor.hoymiles_direct_register_execution_ready',
                           'on')
                         and (state_attr(plan, 'result_current')
                              | default(false, true))
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and plan_age >= 0 and plan_age <= 60
                         and not rcm_blocked
                         and (state_attr(plan, 'live_emergency')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_action_ready')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_voltage_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'export_actuator_data_fresh')
                              | default(false, true))
                         and recommendation_same
                         and export_ack }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ emergency_export_path
                             or is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'on') }}
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.hoymiles_rcm_export_control_active
                      - if:
                          - condition: template
                            value_template: >-
                              {{ state_attr(
                                   'sensor.hoymiles_hit_rcm_voltage_plan',
                                   'export_register_data_fresh')
                                   | default(false, true)
                                 and is_number(states(
                                   'input_number.hoymiles_rcm_saved_export_limit'))
                                 and is_number(states(
                                   'sensor.hoymiles_hit_gcf_maximum_export_power_readback')) }}
                        then:
                          - action: script.hoymiles_verified_set_gcf_export_limit
                            continue_on_error: true
                            data:
                              value: >-
                                {{ states(
                                     'input_number.hoymiles_rcm_saved_export_limit')
                                      | float(0) | round(1) }}
                          - wait_template: >-
                              {{ ((states(
                                   'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                                   | float(-999)) - (states(
                                   'input_number.hoymiles_rcm_saved_export_limit')
                                   | float(0))) | abs < 1.0 }}
                            timeout: "00:01:00"
                            continue_on_timeout: true
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ ((states(
                                       'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                                       | float(-999)) - (states(
                                       'input_number.hoymiles_rcm_saved_export_limit')
                                       | float(0))) | abs < 1.0 }}
                            then:
                              - action: input_boolean.turn_off
                                target:
                                  entity_id: >-
                                    input_boolean.hoymiles_rcm_export_control_active

          # Zwolnienie własności parametru zawsze odtwarza ustawienie użytkownika.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on')
                      or rcm_blocked
                      or not is_state(
                        'binary_sensor.hoymiles_direct_register_execution_ready',
                        'on')
                      or not system_power_data_valid
                     or rcm_plan_age_seconds < 0
                     or rcm_plan_age_seconds > 60
                     or (is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                         and (not prediction_ready
                              or not voltage_data_fresh
                              or not charge_actuator_data_fresh
                              or not forecast_data_fresh
                              or not history_data_fresh
                              or not live_power_data_fresh
                              or not bms_charge_data_fresh
                              or not bms_charge_available
                              or plan_status in
                                ['missing_data', 'optimizer_error', 'learning'])) }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ charge_actuator_data_fresh
                         and is_number(states(
                           'input_number.hoymiles_rcm_saved_battery_charge_power'))
                         and is_number(states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_battery_max_charge_power
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_battery_charge_power')
                           | float(100) | round(1) }}
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999))
                          - (states(
                           'input_number.hoymiles_rcm_saved_battery_charge_power')
                           | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_export_control_active
                    state: "on"
                  - condition: template
                    value_template: >-
                      {{ export_register_data_fresh
                         and is_number(states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_gcf_export_limit
                    data:
                      value: >-
                            {{ states(
                                 'input_number.hoymiles_rcm_saved_export_limit')
                                  | float(0) | round(1) }}
                  - wait_template: >-
                      {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.hoymiles_rcm_export_control_active
              # Ownership is retained when a register is stale or a restore
              # write is not acknowledged. A later minute retries safely.
              - if:
                  - condition: template
                    value_template: >-
                      {{ charge_actuator_data_fresh
                         and ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_battery_charge_power')
                           | float(100))) | abs < 1.0
                         and is_state(
                           'input_boolean.hoymiles_rcm_export_control_active',
                           'off') }}
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active

          # Odtwórz limit eksportu także po restarcie lub wyłączeniu samego
          # regulatora eksportu, bez zatrzymywania części magazynowej RCEm.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_export_control_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_active', 'off')
                     or not export_control_requested
                     or not export_control_available }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ export_register_data_fresh
                         and is_number(states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_gcf_export_limit
                    data:
                      value: >-
                            {{ states(
                                 'input_number.hoymiles_rcm_saved_export_limit')
                                  | float(0) | round(1) }}
                  - wait_template: >-
                      {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.hoymiles_rcm_export_control_active

          # Normalny regulator zaczyna dopiero po pełnej gotowości predykcji i
          # wszystkich odczytów. Nastawy, readback oraz przejęcie własności są
          # jednym fail-closed przebiegiem transakcyjnym.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_shadow_mode
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not rcm_blocked
                     and result_current
                     and is_state(
                       'binary_sensor.hoymiles_direct_register_execution_ready',
                       'on')
                     and rcm_plan_age_seconds >= 0
                     and rcm_plan_age_seconds <= 60
                     and prediction_ready
                     and voltage_data_fresh
                     and charge_actuator_data_fresh
                     and forecast_data_fresh
                     and history_data_fresh
                     and live_power_data_fresh
                     and bms_charge_data_fresh
                     and bms_charge_available
                     and plan_status not in
                       ['missing_data', 'optimizer_error', 'learning']
                     and recommended_limit >= 10
                     and is_number(states(
                       'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_battery_charge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_battery_max_charge_power_readback')
                       | float(100) | round(1) }}
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rcm_active
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ normal_export_path }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rcm_saved_export_limit
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                           | float(0) | round(1) }}
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active
              - action: script.hoymiles_verified_set_battery_max_charge_power
                data:
                  value: "{{ recommended_limit | round(1) }}"
              - wait_template: >-
                  {{ ((states('sensor.hoymiles_hit_battery_max_charge_power_readback')
                       | float(-999)) - (recommended_limit | float(0)))
                       | abs < 1.0 }}
                timeout: "00:01:00"
                continue_on_timeout: true
              # The charge ACK may consume the whole restart-mode run. Before
              # adding the optional GCF write, re-read the complete current
              # plan, ownership and direct-register execution contract. A
              # failed predicate falls through to the final rollback below.
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
                      {% set reported = plan.last_reported
                           if plan.last_reported is defined else plan.last_updated %}
                      {% set age = as_timestamp(now())
                           - as_timestamp(reported, 0) %}
                      {{ normal_export_path
                         and age >= 0 and age <= 60
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'result_current') | default(false, true)
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and is_state('input_boolean.hoymiles_rcm_active', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_battery_balancing_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_charge_cycle_active', 'off')
                         and not is_state('timer.hoymiles_discharge', 'active')
                         and not is_state('timer.hoymiles_charge', 'active')
                         and is_state(
                           'binary_sensor.hoymiles_direct_register_execution_ready',
                           'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_export_control_enabled',
                           'on')
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'system_power_data_valid') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'prediction_ready') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'voltage_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'charge_actuator_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'forecast_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'history_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'live_power_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_charge_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_charge_available') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'export_actuator_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'gcf_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'status_code') not in
                           ['missing_data', 'optimizer_error', 'learning']
                         and (states(
                           'sensor.hoymiles_hit_gcf_enable_readback_code')
                           | int(-1)) == 1
                         and ((state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'recommended_charge_limit_percent') | float(-999))
                           - (recommended_limit | float(0))) | abs < 1.0
                         and ((state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'recommended_export_limit_percent') | float(-999))
                           - (recommended_export_limit | float(0))) | abs < 1.0
                         and ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (recommended_limit | float(0)))
                           | abs < 1.0 }}
                then:
                  - action: script.hoymiles_verified_set_gcf_export_limit
                    data:
                      value: "{{ recommended_export_limit | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                           | float(-999))
                          - (recommended_export_limit | float(0))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              # Final normal-control interlock: fresh inputs and identical
              # recommendation are checked again after Modbus readbacks.
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
                      {% set reported = plan.last_reported
                           if plan.last_reported is defined else plan.last_updated %}
                      {% set age = as_timestamp(now())
                           - as_timestamp(reported, 0) %}
