    binary_sensor:
      - name: "Hoymiles EMS Control Conflict"
        unique_id: hoymiles_ems_control_conflict
        icon: mdi:alert-octagon-outline
        state: >-
          {% set configured =
               (1 if is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                    and is_state('input_boolean.hoymiles_rcm_shadow_mode', 'off')
                  else 0) %}
          {% set running =
               (1 if is_state('input_boolean.hoymiles_rce_discharge_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_tariff_charge_active', 'on') else 0)
