                        'voltage_risk_score_percent') is number }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                        'voltage_risk_score_percent') | float(0) | round(1) }}

      - name: "Hoymiles RCEm Recommended Battery Charge Limit"
        unique_id: hoymiles_rcm_recommended_battery_charge_limit
        icon: mdi:battery-arrow-up-outline
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
