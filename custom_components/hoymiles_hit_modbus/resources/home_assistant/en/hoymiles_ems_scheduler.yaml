# Pakiet Home Assistant: daily harmonogramy EMS dla falownika Hoymiles.
# Wymaga encji sensor.hoymiles_ems_hardware_mode z integracji ESPHome.

input_boolean:
  hoymiles_ems_push_notifications_enabled:
    name: "EMS — push notifications for status changes"
    icon: mdi:cellphone-message

  # Allows EMS Supervisor to consider RCE only in Shadow arbitration. It does
  # not enable RCE automation, change its enable helper, or grant physical
  # write authority.
  hoymiles_ems_supervisor_allow_rce:
    name: "EMS Supervisor — consider RCE"
    icon: mdi:chart-line

  # Allows EMS Supervisor to consider tariff charging only in Shadow
  # arbitration. It does not enable tariff charging, change its enable
  # helper, or grant physical write authority.
  hoymiles_ems_supervisor_allow_tariff:
    name: "EMS Supervisor — consider tariff charging"
    icon: mdi:battery-clock-outline

  # Allows EMS Supervisor to consider RCEm only in Shadow arbitration. It
  # does not enable RCEm, change its helpers, or grant physical write
  # authority.
  hoymiles_ems_supervisor_allow_rcm:
    name: "EMS Supervisor — consider RCEm"
    icon: mdi:transmission-tower

  hoymiles_discharge_schedule_enabled:
    name: "EMS — daily discharge enabled"
    icon: mdi:transmission-tower-export

  hoymiles_charge_schedule_enabled:
    name: "EMS — daily charge enabled"
    icon: mdi:transmission-tower-import

  # Wewnętrzne znaczniki pozwalają bezpiecznie obsłużyć restart HA podczas cyklu.
  hoymiles_discharge_cycle_active:
    name: "EMS — discharge cycle active"
    icon: mdi:battery-arrow-down

  hoymiles_charge_cycle_active:
    name: "EMS — charge cycle active"
    icon: mdi:battery-arrow-up

  hoymiles_rce_discharge_enabled:
    name: "EMS RCE — automatyczne discharge enabled"
    icon: mdi:chart-line

  hoymiles_rce_dynamic_soc_enabled:
    name: "EMS RCE — dynamic SOC reserve"
    icon: mdi:weather-partly-cloudy

  # Wyłącznie preferencja interfejsu: pokazuje techniczne dane planu RCE.
  # Nie bierze udziału w sterowaniu falownikiem.
  hoymiles_rce_advanced_view:
    name: "EMS RCE — show advanced data"
    icon: mdi:tune-variant
    initial: false

  # Wewnętrzny znacznik: tylko cykl rozpoczęty przez automatykę RCE może zostać
  # przez nią finishony. Ręczne harmonogramy zachowują pierwszeństwo.
  hoymiles_rce_discharge_active:
    name: "EMS RCE — trwa discharge"
    icon: mdi:battery-arrow-down-outline

  hoymiles_sale_block_enabled:
    name: "EMS — export lockout in selected hours"
    icon: mdi:transmission-tower-off

  hoymiles_tariff_charge_enabled:
    name: "Tariff EMS — automatic charging enabled"
    icon: mdi:battery-clock-outline

  # Wyłącznie preferencja interfejsu: pokazuje techniczne dane planu taryfowego.
  # Nie bierze udziału w sterowaniu falownikiem.
  hoymiles_tariff_advanced_view:
    name: "Tariff EMS — show advanced data"
    icon: mdi:tune-variant
    initial: false

  hoymiles_tariff_charge_active:
    name: "Tariff EMS — automatic charging in progress"
    icon: mdi:battery-charging-clock

  hoymiles_rcm_enabled:
    name: "RCEm 253 V+ — automation enabled"
    icon: mdi:transmission-tower-export

  # Wyłącznie preferencja interfejsu. Dane diagnostyczne pozostają dostępne,
  # ale nie obciążają podstawowego widoku użytkownika.
  hoymiles_rcm_advanced_view:
    name: "RCEm 253 V+ — show advanced data"
    icon: mdi:tune-variant
    initial: false

  # Tryb obserwacyjny jest domyślnie włączony. Obliczenia i historia działają,
  # ale żaden rejestr falownika nie jest zapisywany.
  hoymiles_rcm_shadow_mode:
    name: "RCEm 253 V+ — observation only"
    icon: mdi:eye-outline
    initial: true

  # Opcjonalny drugi regulator. Pozostaje domyślnie wyłączony i nigdy nie
  # podnosi limitu ponad value zastaną w falowniku ani limit użytkownika.
  hoymiles_rcm_export_control_enabled:
    name: "RCEm 253 V+ — variable export-limit control"
    icon: mdi:transmission-tower-export

  # Opcjonalne przyreadynie miejsca przed dziennym oknem wysokiego napięcia.
  # Funkcja jest domyślnie disabled i wymaga aktywnego eksportu w falowniku.
  hoymiles_rcm_pre_discharge_enabled:
    name: "RCEm 253 V+ — morning headroom-preparation discharge"
    icon: mdi:battery-arrow-down-outline

  # Wewnętrzny znacznik własności globalnego limitu ładowania baterii.
  hoymiles_rcm_active:
    name: "RCEm 253 V+ — active control in progress"
    icon: mdi:battery-sync

  # Wewnętrzny znacznik własności limitu eksportu. Dzięki niemu RCEm odtwarza
  # dokładnie bezpieczną value po wyłączeniu lub przejęciu sterowania.
  hoymiles_rcm_export_control_active:
    name: "RCEm 253 V+ — export-limit control active"
    icon: mdi:transmission-tower-export

  # Wewnętrzny znacznik własności trybu Grid Discharge i jego dwóch nastaw.
  hoymiles_rcm_pre_discharge_active:
    name: "RCEm 253 V+ — morning headroom preparation active"
    icon: mdi:battery-arrow-down

  hoymiles_tariff_weekend_low_price:
    name: "Tariff — low-cost period for the entire weekend"
    icon: mdi:calendar-weekend-outline
    initial: true

  hoymiles_tariff_polish_holidays_low_price:
    name: "Tariff — Polish public holidays in the low-cost period"
    icon: mdi:calendar-star
    initial: true

  hoymiles_battery_balancing_enabled:
    name: "Battery balancing — automation enabled"
    icon: mdi:battery-sync-outline

  # Wewnętrzny znacznik blokuje RCE, automatykę taryfową i ręczne plany EMS.
  # Przełącznik użytkownika powyżej pozostaje włączony pomiędzy cyklami.
  hoymiles_battery_balancing_active:
    name: "Battery balancing — service cycle in progress"
    icon: mdi:battery-sync

input_datetime:
  hoymiles_discharge_start:
    name: "EMS — discharge start time"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_charge_start:
    name: "EMS — charge start time"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_sale_block_start:
    name: "EMS — export lockout start"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_sale_block_end:
    name: "EMS — export lockout end"
    has_date: false
    has_time: true
    icon: mdi:clock-end

  hoymiles_tariff_cheap_1_start:
    name: "Tariff — low-cost window 1 start"
    has_date: false
    has_time: true
    initial: "22:00:00"
    icon: mdi:clock-start

  hoymiles_tariff_cheap_1_end:
    name: "Tariff — low-cost window 1 end"
    has_date: false
    has_time: true
    initial: "06:00:00"
    icon: mdi:clock-end

  hoymiles_tariff_cheap_2_start:
    name: "Tariff — low-cost window 2 start"
    has_date: false
    has_time: true
    initial: "13:00:00"
    icon: mdi:clock-start

  hoymiles_tariff_cheap_2_end:
    name: "Tariff — low-cost window 2 end"
    has_date: false
    has_time: true
    initial: "15:00:00"
    icon: mdi:clock-end

  hoymiles_tariff_medium_start:
    name: "G13 tariff — medium period start"
    has_date: false
    has_time: true
    initial: "07:00:00"
    icon: mdi:clock-start

  hoymiles_tariff_medium_end:
    name: "G13 tariff — medium period end"
    has_date: false
    has_time: true
    initial: "13:00:00"
    icon: mdi:clock-end

  hoymiles_battery_balancing_last_completed:
    name: "Battery balancing — last completed cycle"
    has_date: true
    has_time: true
    icon: mdi:calendar-check-outline

  # Internal state: end of the contiguous tariff block accepted at cycle start.
  hoymiles_tariff_latched_slot_end:
    name: "Tariff EMS — latched active-slot end"
    has_date: true
    has_time: true
    icon: mdi:clock-end

  # Internal state: an accepted RCE half-hour remains owned by the controller
  # until its boundary. A later forecast refresh cannot interrupt it mid-slot.
  hoymiles_rce_latched_slot_end:
    name: "EMS RCE — latched slot end"
    has_date: true
    has_time: true
    icon: mdi:clock-end

  # Internal state: deadline accepted by the RCEm pre-discharge transaction.
  # Forecast refreshes cannot shorten an active cycle after readback succeeds.
  hoymiles_rcm_latched_pre_discharge_deadline:
    name: "RCEm 253 V+ — latched headroom-preparation deadline"
    has_date: true
    has_time: true
    icon: mdi:clock-lock-outline

  # Internal rate limiter for status notifications. It survives automation
  # reloads and prevents an unstable upstream state from flooding the phone.
  hoymiles_ems_last_push_at:
    name: "EMS — czas ostatniego powiadomienia"
    has_date: true
    has_time: true
    icon: mdi:bell-check-outline

input_text:
  hoymiles_ems_push_notify_target:
    name: "EMS — notification phone (notify entity)"
    max: 255
    icon: mdi:cellphone-cog

  hoymiles_solcast_forecast_today_entity:
    name: "EMS RCE — Solcast today forecast entity"
    max: 255
    icon: mdi:solar-power-variant

  hoymiles_solcast_forecast_tomorrow_entity:
    name: "EMS RCE — Solcast tomorrow forecast entity"
    max: 255
    icon: mdi:solar-power-variant

  # Day 3 is optional. When it is unavailable the optimizers deliberately
  # retain their safe two-day planning horizon instead of blocking execution.
  hoymiles_solcast_forecast_day_3_entity:
    name: "EMS RCE — Solcast Day 3 forecast entity"
    max: 255
    icon: mdi:solar-power-variant-outline

  # Data ostatniego rozliczenia umożliwia poprawne wyzerowanie liczników
  # dziennych również po restarcie restarts.
  hoymiles_rce_accounting_date:
    name: "EMS RCE — export accounting date"
    max: 10
    icon: mdi:calendar-check

  # Internal state: freezes the SOC target while Grid Charge only supplies LOAD.
  # It is not a user configuration field.
  hoymiles_tariff_active_action:
    name: "Tariff EMS — internal active-slot action"
    max: 32
    icon: mdi:cog-clockwise

  hoymiles_ems_last_push_fingerprint:
    name: "EMS — sygnatura ostatniego powiadomienia"
    max: 255
    icon: mdi:fingerprint

  hoymiles_battery_balancing_phase:
    name: "Battery balancing — transaction state (compatibility)"
    max: 32
    icon: mdi:state-machine

  # Canonical b2 transaction record. The phase helper above is only a display
  # mirror; it never grants physical execution or restoration authority.
  # Schema (18 exact fields):
  # b2|cycle|state|owner|owner_gen|snapshot_valid|snapshot_cycle|snapshot_mode|
  # 4303|4304|ems_gen|topology_gen|snapshot_ms|write_started|reason|
  # operational_started|cooldown_ms|event_marker
  hoymiles_battery_balancing_lifecycle:
    name: "Battery balancing — transactional b2 cycle state"
    max: 255
    icon: mdi:book-lock-outline

  # Durable deadlines and generations are separate from the trusted physical
  # snapshot so every serialized b2 lifecycle record remains below 255 bytes.
  # Schema: t1|cycle|gap_gen|gap_start_ms|gap_deadline_ms|hold_gen|
  # hold_deadline_ms|state
  hoymiles_battery_balancing_timing:
    name: "Battery balancing — transaction deadlines and generations"
    max: 160
    icon: mdi:timer-lock-outline

  # A short independent capture path writes this record even while the one
  # physical transaction worker is waiting for a verified FC03 acknowledgement.
  # Schema: a1|cycle|generation|priority|reason|state|requested_ms
  hoymiles_battery_balancing_abort_request:
    name: "Battery balancing — durable safe-abort request"
    max: 160
    icon: mdi:shield-alert-outline

  # Two durable notification slots. Delivery is handled by a separate worker;
  # physical closeout never waits for a phone provider. Each slot contains:
  # event_id|cycle|kind|reason|delivery_state|attempt|stable_tag.
  hoymiles_battery_balancing_notification_outbox:
    name: "Battery balancing — durable notification outbox"
    max: 255
    icon: mdi:bell-badge-outline

input_select:
  # EMS Supervisor observation mode. Off disables arbitration, while Shadow
  # publishes an observation-only decision. Neither option starts physical
  # execution or changes legacy automation.
  hoymiles_ems_supervisor_mode:
    name: "EMS Supervisor — mode"
    options:
      - "Off"
      - "Shadow"
    icon: mdi:eye-outline

  # The profile is only published in Shadow arbitration. Profile effects
  # remain unapplied and do not change physical execution or legacy
  # automation.
  hoymiles_ems_supervisor_profile:
    name: "EMS Supervisor — profile"
    options:
      - "Balanced"
      - "Maximum Profit"
      - "High Reserve — Winter"
    icon: mdi:tune-variant

  hoymiles_tariff_operator:
    name: "Tariff EMS — DSO / price profile"
    options:
      - "Manual"
      - "PGE"
      - "TAURON"
      - "ENEA"
      - "ENERGA"
      - "STOEN"
    icon: mdi:transmission-tower

  hoymiles_rce_inverter_rated_power:
    name: "EMS RCE — rated power of one inverter"
    options:
      - "10 kW"
      - "5 kW"
      - "8 kW"
      - "12 kW"
      - "15 kW"
      - "20 kW"
    icon: mdi:solar-power

  hoymiles_tariff_type:
    name: "Tariff EMS — tariff group"
    options:
      - "G12w"
      - "G12"
      - "G13"
      - "G11"
    icon: mdi:transmission-tower-import

input_number:
  # Internal state: target SOC is frozen when a tariff Grid Charge cycle starts.
  # Live forecasts may still be recalculated, but they cannot move the stop
  # threshold back and forth while the inverter is already charging.
  hoymiles_tariff_latched_target_soc:
    name: "Tariff EMS — latched active charging target"
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  # Internal safety floor owned by an active RCE slot. It may rise when the
  # reserve model becomes more conservative, but can never fall before the
  # accepted slot/run boundary.
  hoymiles_rce_latched_minimum_soc:
    name: "EMS RCE — latched minimum SOC for the active slot"
    min: 0
    max: 100
    step: 1
    initial: 0
    mode: box
    unit_of_measurement: "%"
    icon: mdi:shield-lock-outline

  # Baselines owned by an automatic tariff/RCE transaction. A failed start
  # restores these values before releasing its durable ownership marker.
  hoymiles_tariff_saved_max_charge_power:
    name: "Tariff EMS — saved charging-power limit"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_tariff_saved_force_charge_soc:
    name: "Tariff EMS — saved charging target"
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_rce_saved_max_discharge_power:
    name: "RCE EMS — saved discharging-power limit"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_rce_saved_force_discharge_soc:
    name: "RCE EMS — saved discharge threshold"
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  # Internal values frozen before the RCEm Grid Discharge transaction. They
  # are deliberately separate from live forecast recommendations.
  hoymiles_rcm_latched_pre_discharge_target_soc:
    name: "RCEm 253 V+ — latched headroom-preparation SOC target"
    min: 0
    max: 100
    step: 0.1
    initial: 100
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-lock

  hoymiles_rcm_latched_pre_discharge_power:
    name: "RCEm 253 V+ — latched headroom-preparation power"
    min: 0
    max: 100
    step: 0.1
    initial: 0
    mode: box
    unit_of_measurement: "%"
    icon: mdi:flash-lock-outline

  hoymiles_rcm_soc_safety_margin:
    name: "RCEm 253 V+ — SOC safety correction"
    min: 0
    max: 20
    step: 1
    initial: 2
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:shield-plus-outline

  hoymiles_rcm_charge_efficiency:
    name: "RCEm 253 V+ — battery charging efficiency"
    min: 80
    max: 100
    step: 1
    initial: 95
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:percent-outline

  # Pamięć ustawienia użytkownika. Pole nie jest pokazywane na dashboardzie.
  hoymiles_rcm_saved_battery_charge_power:
    name: "RCEm 253 V+ — saved global charging limit"
    min: 10
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_rcm_export_cap_percent:
    name: "RCEm 253 V+ — maximum permitted export"
    min: 0
    max: 100
    step: 1
    initial: 100
    mode: box
    unit_of_measurement: "%"
    icon: mdi:shield-lock-outline

  # Pamięć wartości zastanej w falowniku. Nie jest pokazywana użytkownikowi.
  hoymiles_rcm_saved_export_limit:
    name: "RCEm 253 V+ — saved export limit"
    min: -10
    max: 200
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  # Wewnętrzne kopie nastaw użytkownika odtwarzane po finisheniu porannego
  # rozładowania. Nie są pokazywane na dashboardzie.
  hoymiles_rcm_saved_max_discharge_power:
    name: "RCEm 253 V+ — saved maximum discharge power"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_rcm_saved_force_discharge_soc:
    name: "RCEm 253 V+ — saved discharge threshold"
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_battery_balancing_interval_days:
    name: "Battery balancing — interval between cycles"
    min: 1
    max: 180
    step: 1
    initial: 30
    mode: box
    unit_of_measurement: "d"
    icon: mdi:calendar-sync-outline

  hoymiles_battery_balancing_hold_hours:
    name: "Battery balancing — hold time at 100% SOC"
    min: 0.5
    max: 12
    step: 0.5
    initial: 2
    mode: box
    unit_of_measurement: "h"
    icon: mdi:timer-sand-complete

  # Persistent monotonic transaction identity. There is exactly one serialized
  # creator in the balancing transaction worker; wall-clock time is never used
  # as a cycle identity.
  hoymiles_battery_balancing_cycle_sequence:
    name: "Battery balancing — durable transaction counter"
    min: 0
    max: 2147483647
    step: 1
    mode: box
    icon: mdi:counter

  # Dwa poniższe pola są wyłącznie pamięcią ustawień falownika. Nie są
  # pokazywane użytkownikowi na dashboardzie.
  hoymiles_battery_balancing_saved_charge_power:
    name: "Battery balancing — saved charge-power limit"
    min: 0
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_battery_balancing_saved_force_charge_soc:
    name: "Battery balancing — saved target SOC"
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:memory

  hoymiles_discharge_duration:
    name: "EMS — discharge duration"
    min: 1
    max: 720
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  hoymiles_charge_duration:
    name: "EMS — charge duration"
    min: 1
    max: 720
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  hoymiles_rce_soc_safety_margin:
    name: "EMS RCE — SOC safety correction"
    min: 0
    max: 50
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:shield-plus-outline

  hoymiles_rce_fallback_daily_load:
    name: "EMS RCE — fallback daily consumption before history is available"
    min: 1
    max: 200
    step: 0.5
    initial: 10
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:home-lightning-bolt-outline

  hoymiles_rce_export_efficiency:
    name: "EMS RCE — battery export efficiency"
    min: 80
    max: 100
    step: 1
    initial: 95
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:percent-outline

  hoymiles_rce_requested_discharge_power:
    name: "EMS RCE — requested grid discharge power"
    min: 0
    max: 100
    step: 0.1
    initial: 100
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-down-outline

  # Wewnętrzne, odtwarzane po restarcie magazyny danych rozdzielają energię
  # faktycznie wysłaną przez automatykę RCE od naturalnej nadwyżki Self-Use.
  hoymiles_rce_realized_controlled_export_store:
    name: "EMS RCE — realized controlled export (store)"
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:battery-arrow-down-outline

  hoymiles_rce_realized_natural_export_store:
    name: "EMS RCE — realized natural surplus (store)"
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:solar-power-variant-outline

  hoymiles_rce_realized_controlled_revenue_store:
    name: "EMS RCE — controlled export revenue (store)"
    min: -100000
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "PLN"
    icon: mdi:cash-plus

  hoymiles_rce_realized_natural_revenue_store:
    name: "EMS RCE — natural surplus revenue (store)"
    min: -100000
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "PLN"
    icon: mdi:cash

  hoymiles_rce_unclassified_export_store:
    name: "EMS RCE — unclassified export (store)"
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:help-rhombus-outline

  hoymiles_rce_grid_sell_checkpoint:
    name: "EMS RCE — grid sell meter checkpoint"
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:counter

  hoymiles_tariff_g11_price:
    name: "Tariff — G11 reference price"
    min: 0
    max: 5
    step: 0.001
