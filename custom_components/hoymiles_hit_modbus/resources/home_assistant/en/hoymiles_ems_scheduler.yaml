            {{ states(
              'sensor.hoymiles_hit_battery_charge_power_readback_generation') }}
      - wait_template: >-
          {{ (states(
               'sensor.hoymiles_hit_direct_register_verified_readback_supported')
               | float(0) > 0.5)
             and states(
               'sensor.hoymiles_hit_battery_charge_power_readback_generation')
                 not in ['unknown', 'unavailable', 'none', '']
             and states(
               'sensor.hoymiles_hit_battery_charge_power_readback_generation')
                 != battery_generation_after_write
             and ((states(
               'sensor.hoymiles_hit_battery_max_charge_power_readback')
                 | float(-999)) - (value | float(0))) | abs < 0.05 }}
