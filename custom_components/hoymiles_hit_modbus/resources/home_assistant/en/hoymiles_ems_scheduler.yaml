          {% set grid_reported = grid.last_reported
            if grid.last_reported is defined else grid.last_updated %}
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'grid_discharge')
             or not is_number(states('sensor.hoymiles_hit_esp_uptime'))
             or (states('sensor.hoymiles_hit_esp_uptime') | float(-1))
                  < (response_latched_esp_uptime_seconds | float(-1))
             or (is_number(states(
                   'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation'))
                 and is_number(states('sensor.hoymiles_hit_esp_uptime'))
                 and (states('sensor.hoymiles_hit_esp_uptime') | float(-1))
                   >= (response_latched_esp_uptime_seconds | float(-1))
                 and (states(
                   'sensor.hoymiles_hit_parallel_aggregate_power_readback_generation')
                   | float(-1))
                   > (response_collection_baseline_generation | float(-1))
                 and is_number(battery.state)
