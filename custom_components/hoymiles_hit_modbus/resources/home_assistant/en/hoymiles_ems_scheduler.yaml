                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'prediction_ready') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'voltage_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'charge_actuator_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'forecast_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'history_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'live_power_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_charge_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_charge_available') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'status_code') not in
                           ['missing_data', 'optimizer_error', 'learning']
                         and is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (recommended_limit | float(0)))
                           | abs < 1.0
                         and ((state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'recommended_charge_limit_percent') | float(-999))
                           - (recommended_limit | float(0))) | abs < 1.0
                         and (not normal_export_path
                              or (is_state(
                                'input_boolean.hoymiles_rcm_export_control_enabled',
                                'on')
                              and state_attr(
                                'sensor.hoymiles_hit_rcm_voltage_plan',
                                'export_actuator_data_fresh')
                                | default(false, true)
                              and state_attr(
                                'sensor.hoymiles_hit_rcm_voltage_plan',
                                'gcf_data_fresh') | default(false, true)
                              and (states(
                                'sensor.hoymiles_hit_gcf_enable_readback_code')
                                | int(-1)) == 1
                              and ((states(
                                'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                                | float(-999))
                               - (recommended_export_limit | float(0)))
                               | abs < 1.0
                              and ((state_attr(
                                'sensor.hoymiles_hit_rcm_voltage_plan',
                                'recommended_export_limit_percent')
                                | float(-999))
                               - (recommended_export_limit | float(0)))
                               | abs < 1.0)) }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active
                  - if:
                      - condition: template
