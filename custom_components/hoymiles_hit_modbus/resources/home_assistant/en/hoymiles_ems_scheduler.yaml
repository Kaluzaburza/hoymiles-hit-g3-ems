        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_schedule_enabled
        state: "on"
      - condition: template
        value_template: >-
          {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
    actions:
      - action: script.hoymiles_start_grid_charge

  - id: hoymiles_finish_grid_discharge
    alias: "EMS — finish discharge i return do Self-Use"
    description: >-
      Ends a manual cycle only after a confirmed Self-Use readback.
      A one-minute watchdog retries unfinished finalization after API loss
      or a Home Assistant restart without releasing ownership early.
    mode: single
    triggers:
      - trigger: timer.finished
        target:
          entity_id: timer.hoymiles_discharge
        id: timer_finished
      - trigger: time_pattern
        minutes: "/1"
        id: watchdog
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_discharge', 'idle') }}
      # Ownership is claimed before the start write. This grace keeps the
      # watchdog out of that short owner=on/timer=idle start phase.
      - condition: template
        value_template: >-
          {{ trigger.id == 'timer_finished'
             or (as_timestamp(now())
                 - as_timestamp(states.input_boolean.hoymiles_discharge_cycle_active.last_changed, 0))
                >= 60 }}
    actions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      # Re-check the frozen owner and idle timer immediately before the write;
      # a new cycle may have started while the select was unavailable.
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_discharge', 'idle') }}
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      # ESPHome publishes the template select optimistically. Allow the fast
      # control poll to overwrite it before accepting the state as readback.
      - delay: "00:00:05"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode')
             in ['self_use', 'off_grid'] }}
        timeout: "00:00:35"
        continue_on_timeout: false
      # Clear ownership only after positive readback and a final idle check.
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode')
             in ['self_use', 'off_grid'] }}
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_discharge', 'idle') }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active

