      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_charge', 'idle') }}
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                 and not is_state(
                   'sensor.hoymiles_ems_hardware_mode', 'off_grid') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
