          **Risk assessment:** {{ risk_labels.get(status_code, 'No data') }}<br>
          **Next risk period:** {{ plan.attributes.next_risk_start | default('No data', true) }}<br>
          **Required battery headroom:** {{ (plan.attributes.required_headroom_kwh | round(2)) ~ ' kWh' if plan.attributes.required_headroom_kwh is number else 'No data' }}<br>
          **Available battery headroom:** {{ (plan.attributes.available_headroom_kwh | round(2)) ~ ' kWh' if plan.attributes.available_headroom_kwh is number else 'No data' }}<br>
          **PV forecast for the risk window:**
          {{ (plan.attributes.selected_forecast_kwh | round(2)) ~ ' kWh'
