      - type: markdown
        title: Low-cost top-up plan
        entity_id: sensor.hoymiles_hit_tariff_charge_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_tariff_charge_plan %}
          {% if plan is not none %}
          {% set slots = plan.attributes.planned_slots | default([], true) %}
          {% set status = plan.attributes.status_code | default('missing_data', true) %}
          {% set missing = plan.attributes.missing_entities | default([], true) %}
          {% set low_direct = plan.attributes.remaining_low_direct_import_kwh
             | default(0) | float(0) %}
          {% set expensive = plan.attributes.remaining_expensive_import_kwh
             | default(0) | float(0) %}
          {% set physical = plan.attributes.capacity_or_power_shortfall_kwh
             | default(expensive) | float(0) %}
          {% set terminal = plan.attributes.terminal_shortfall_kwh
             | default(0) | float(0) %}
          **Plan mode:** {{ 'active' if is_state(
             'input_boolean.hoymiles_tariff_charge_enabled', 'on')
             else 'preview — automatic charging is disabled' }}<br>
          **Decision:** {{ states('sensor.hoymiles_hit_tariff_charge_plan') }}<br>
          **Energy in selected Grid Charge slots:**
          {{ plan.attributes.planned_grid_import_kwh
             | default(0) }} kWh<br>
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          **Shortage without optimization:**
          {{ plan.attributes.baseline_shortage_kwh | default(0) }} kWh<br>
          **Remaining direct import in the low-cost period:**
          {{ low_direct | round(2) }} kWh<br>
          **Remaining import in a medium- or high-cost period:**
          {{ expensive | round(2) }} kWh<br>
          **Shortfall caused by power or capacity limits:**
          {{ physical | round(2) }} kWh<br>
          **Missing reserve at the end of the horizon:**
          {{ terminal | round(2) }} kWh<br>
          **Remaining model shortage — technical value:**
          {{ plan.attributes.remaining_shortage_kwh | default(0) }} kWh<br>
          **Direct grid → home:**
          {{ plan.attributes.planned_direct_load_kwh | default(0) }} kWh<br>
          **Stored in the battery after losses:**
          {{ plan.attributes.planned_stored_energy_kwh | default(0) }} kWh<br>
          {% endif %}
          **Plan cost:** {{ plan.attributes.planned_cost_pln | default(0) }} PLN<br>
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          **Cost without optimization in this tariff:**
          {{ plan.attributes.baseline_grid_cost_pln | default(0) }} PLN<br>
          **Cost after optimization in this tariff:**
          {{ plan.attributes.optimized_grid_cost_pln | default(0) }} PLN<br>
          **Savings from shifting grid consumption:**
          {{ plan.attributes.automation_savings_pln | default(0) }} PLN<br>
          **Same import in G11:**
          {{ plan.attributes.g11_reference_cost_pln | default(0) }} PLN<br>
          {% endif %}
          **Estimated savings versus G11:**
          {{ plan.attributes.estimated_savings_pln | default(0) }} PLN<br>
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          **Load model:**
          {{ plan.attributes.load_profile_mode | default('flat_day_night_fallback') }}<br>
          **Planning reserve:**
          {{ plan.attributes.self_use_reserve_soc_percent | default(0) }}% Self-Use +
          {{ plan.attributes.safety_margin_soc_percentage_points | default(0) }} p.p. =
          **{{ plan.attributes.reserve_soc_percent | default(0) }}%**<br>
          **Historical PV forecast correction:**
          {{ (plan.attributes.forecast_accuracy_factor | default(0.9) * 100) | round(1) }}%
          ({{ plan.attributes.forecast_accuracy_history_days | default(0) }} history days)<br>
          **Effective forecast correction for today:**
          {{ (plan.attributes.forecast_today_effective_factor
              | default(plan.attributes.forecast_accuracy_factor | default(0.9))
              * 100) | round(1) }}%<br>
          {% set expected = plan.attributes.forecast_live_expected_elapsed_kwh %}
          {% if expected is number %}
          **Live production check:** forecast through now {{ expected }} kWh ·
          actual {{ plan.attributes.forecast_live_actual_elapsed_kwh | default(0) }} kWh ·
          correction confidence {{ (plan.attributes.forecast_live_confidence
             | default(0) * 100) | round(0) }}%<br>
          {% endif %}
          **Simulation horizon:** {{ plan.attributes.planning_horizon_days
             | default(2) }} days, until
          {{ plan.attributes.planning_horizon_end | default('—', true) }}<br>
          **Tomorrow forecast P10 / P50 / P90:**
          {{ plan.attributes.forecast_tomorrow_p10_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_tomorrow_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_tomorrow_p90_kwh | default('—', true) }} kWh<br>
          **Day 3 forecast:** {{ plan.attributes.forecast_day_3_kwh
             | default('unavailable — safe fallback reserve', true) }}
          {{ 'kWh' if plan.attributes.forecast_day_3_kwh is number else '' }}<br>
          {% set day3_entity = plan.attributes.forecast_day_3_entity | default(none) %}
          {% set day3_configured = plan.attributes.forecast_day_3_configured_entity
             | default(none) %}
          {% set day3_status = plan.attributes.forecast_day_3_status | default(none) %}
          {% set day3_fresh = plan.attributes.forecast_day_3_data_fresh | default(none) %}
          {% set day3_age = plan.attributes.forecast_day_3_age_seconds | default(none) %}
          {% set day3_reason = plan.attributes.forecast_day_3_data_reason | default(none) %}
          **Day 3 — entity:**
          {{ day3_entity if day3_entity not in [none, '', 'not_enabled',
             'not_available', 'unknown', 'unavailable'] else 'no detected entity' }} ·
          configuration:
          {{ day3_configured if day3_configured not in [none, '', 'automatic',
             'unknown', 'unavailable'] else 'automatic' }}<br>
          **Day 3 — status / fresh:**
          {{ day3_status if day3_status not in [none, ''] else 'no status' }} /
          {% if day3_fresh is none %}data unavailable{% elif day3_fresh %}yes{% else %}no{% endif %}<br>
          **Day 3 — signed age:**
          {{ ((day3_age | float(0)) | round(1)) ~ ' s'
             if day3_age is number else 'no timestamp' }} · reason:
          {{ day3_reason if day3_reason not in [none, ''] else 'no information' }}<br>
          **Grid Charge power budget:** requested
          {{ plan.attributes.requested_charge_power_kw | default(0) }} kW · effective
          {{ plan.attributes.effective_charge_power_kw | default(0) }} kW ·
          source {{ plan.attributes.effective_charge_power_source
             | default('configuration') }}<br>
          **Actual power learning:**
          {{ plan.attributes.effective_charge_power_feedback_samples | default(0) }} samples ·
          factor {{ ((plan.attributes.effective_charge_power_factor
             | default(1)) * 100) | round(0) }}% ·
          {{ 'model calibrated' if plan.attributes.charge_power_feedback_ready
             | default(false) else 'collecting samples — configured limit is used' }}<br>
          **Terminal uncertainty reserve:**
          {{ plan.attributes.terminal_reserve_soc_percent | default(0) }}% SOC ·
          margin {{ plan.attributes.terminal_uncertainty_margin_kwh
             | default(0) }} kWh<br>
          **Planned battery wear cost:**
          {{ plan.attributes.planned_battery_wear_cost_pln | default(0) }} PLN<br>
          **Decision stability:** {{ plan.attributes.plan_stable_for_minutes
             | default(0) }} min without a material change<br>
          {% endif %}
          **Forecast SOC at the end of the horizon:**
          {{ plan.attributes.ending_battery_soc_percent | default(0) }}%

          {% if missing %}
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          ⚠️ **Required data missing:** {{ missing | join(', ') }}
          {% else %}
          ⚠️ **Some data required for the complete plan is missing.** Open advanced data
          to view diagnostic details.
          {% endif %}
          {% endif %}

          **Selected slots:**
          {% if slots %}
          {% for slot in slots %}
          {% set action_name = {
             'grid_support': 'grid → home; battery preserved',
             'battery_charge': 'battery charging',
             'grid_support_and_charge': 'home supply + battery charging'
             }.get(slot.action, 'charging') %}
          - {{ slot.date }} {{ slot.start }}–{{ slot.end }} ·
            {{ slot.grid_import_kwh }} kWh · {{ slot.price }} PLN/kWh ·
            **{{ action_name }}** · target {{ slot.target_soc_percent }}% SOC
          {% endfor %}
          {% else %}
          - No top-up is planned.
          {% endif %}
          {% endif %}
