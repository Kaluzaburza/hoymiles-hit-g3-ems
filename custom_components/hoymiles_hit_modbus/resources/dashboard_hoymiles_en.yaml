            name: SOC
            color: "#58D6FF"
            value_mode: raw
            unit: "%"
            digits: 1
        history_visual_mode: battery_soc
        secondary_history_entities: []
        detail_cards:
          - type: custom:hoymiles-aurora-disclosure-card
            title: Battery balancing — settings and status
            accent: battery
            card:
              type: custom:hoymiles-zebra-entities-card
              title: Battery balancing — settings and status
              show_header_toggle: false
              state_color: true
              entities:
                - entity: input_boolean.hoymiles_battery_balancing_enabled
                  name: Enable automatic balancing
                - entity: input_number.hoymiles_battery_balancing_interval_days
                  name: Run every specified number of days
                - entity: input_number.hoymiles_battery_balancing_hold_hours
                  name: Balancing time at 100% SOC
                - entity: sensor.hoymiles_battery_balancing_status
                  name: Automation status
                - entity: sensor.hoymiles_battery_balancing_next_run
                  name: Next scheduled cycle
                - entity: timer.hoymiles_battery_balancing_hold
                  name: Remaining time at 100% SOC
                - entity: sensor.hoymiles_battery_balancing_slow_charge_power
                  name: Current slow-charge limit
          - type: custom:hoymiles-aurora-disclosure-card
            title: How battery balancing works
            content: |-
              A periodic service cycle for LiFePO4 batteries. On the scheduled day it
              first uses PV production and the normal BMS limit to 95% SOC.
              From the first valid reading at or above 95%, it maintains slow
              charging at approximately 0.4 kW net for the complete battery. After sunset it uses
              verified grid charging and adds home consumption exactly once.
              The configured balancing hold starts only after physical
              acknowledgement of the mode and settings at 99.9% SOC.

              During the cycle, RCE, tariff charging, and manual EMS schedules are
              blocked by existing EMS ownership; their settings remain
              unchanged. A short Self-Use freshness gap only pauses
              writes, while safety failures stop the cycle immediately. Completion
              or disabling the feature restores the exact prior settings and EMS mode;
              physical Off-Grid operation always has priority. Use this feature in accordance
              with the battery-storage manufacturer's recommendations.
          - type: custom:hoymiles-aurora-disclosure-card
            title: BMS limits and temperatures
            description: Full current and voltage limits plus cell-temperature history.
            accent: battery
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  title: Available battery-storage power from BMS
                  entity_id: sensor.hoymiles_hit_ems_shared_inputs
                  content: |-
                    {% set shared = states.sensor.hoymiles_hit_ems_shared_inputs %}
                    {% set bms = shared.attributes.bms | default({}, true) if shared is not none else {} %}
                    {% set charge = bms.maximum_charge_power_kw | default({}, true) %}
                    {% set discharge = bms.maximum_discharge_power_kw | default({}, true) %}
                    **Charging:**
                    {{ (charge.value | round(2)) ~ ' kW'
                       if charge.fresh | default(false) and charge.value is number else 'No data' }}<br>
                    **Discharging:**
                    {{ (discharge.value | round(2)) ~ ' kW'
                       if discharge.fresh | default(false) and discharge.value is number else 'No data' }}

                    These are direct, fresh capabilities published by the BMS. The interface
                    does not convert current into power.
                - type: custom:hoymiles-zebra-entities-card
                  title: Battery storage — status, power, and BMS limits
                  show_header_toggle: false
                  state_color: true
                  entities:
                    - entity: sensor.hoymiles_hit_battery_capacity
                      name: "Capacity configured in the inverter"
                    - entity: sensor.hoymiles_hit_total_capacity
                      name: "Effective capacity (BMS emergency fallback)"
                    - entity: sensor.hoymiles_hit_charge_cut_off_voltage
                      name: "Charging cut-off voltage"
                    - entity: sensor.hoymiles_hit_discharge_cut_off_voltage
                      name: "Discharging cut-off voltage"
                    - entity: sensor.hoymiles_hit_maximum_charge_current
                      name: Available charging current
                    - entity: sensor.hoymiles_hit_maximum_discharge_current
                      name: Available discharging current
                    - entity: sensor.hoymiles_hit_cell_max_temperature
                      name: Maximum cell temperature
                    - entity: sensor.hoymiles_hit_cell_min_temperature
                      name: Minimum cell temperature
                - type: custom:hoymiles-aurora-history-card
                  title: Cell temperature — last 7 days
                  hours_to_show: 168
                  value_mode: raw
                  unit: "°C"
                  digits: 1
                  entities:
                    - entity: sensor.hoymiles_hit_cell_max_temperature
                      name: Maximum
                      color: "#FF1744"
                    - entity: sensor.hoymiles_hit_cell_min_temperature
                      name: Minimum
                      color: "#00B0FF"
