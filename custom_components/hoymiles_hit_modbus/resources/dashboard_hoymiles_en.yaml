      - type: markdown
        title: Required forecast source
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rce_advanced_view
            state: "on"
        view_layout:
          position: sidebar
        entity_id:
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - sensor.hoymiles_rce_reserve_status
          - sensor.hoymiles_rce_dynamic_minimum_soc
        content: |-
          The automation requires the external integration
          **Solcast PV Forecast** by **BJReplay**:
          [installation and configuration](https://github.com/BJReplay/ha-solcast-solar).

          **Forecast Today** and **Forecast Tomorrow** are required.
          If Solcast provides **Forecast Day 3**, the integration uses it
          automatically to value energy worth retaining after the end of the
          48-hour market horizon. Its absence does not block operation. Entities are
          detected automatically in Polish and English HA; for
          custom names, the Today and Tomorrow entities can be entered above.

          The optimizer simulates the balance every 30 minutes from now through tonight,
          the whole next day and the following night until **90 minutes after sunrise**.
          It first excludes the Self-Use outage reserve, the safety
          correction, and the full forecast home consumption through
          the end of the nearest protected night from export. Forecast PV before sunset does not
          reduce this night reserve. Only the remaining energy is assigned
          do the most valuable available RCE slots today or tomorrow.

          The export price is not configured manually. The optimizer compares
          the full financial result of every available slot in the horizon,
          selects the highest prices and includes natural PV export, battery
          wear cost, and the value of energy retained for the following day.
          An earlier discharge is used only when it increases the net result
          or creates battery headroom before a later surplus would be sold
          more cheaply.

          System power is calculated as **one inverter's rated power × the automatically
          detected inverter count × the configured discharge percentage**.
          Until at least 24 hours of history is collected, the configured fallback
          daily consumption entered above. The algorithm then learns from up to
          28 complete days, gives recent days more weight, rejects
          isolated spikes, and builds separate 48 half-hour profiles
          for weekdays and weekends. The latest four days remain a fast
          fallback after a fresh installation. Actual coverage and the selected
          model are shown in diagnostics.

          The reserve is conservatively derived from Solcast **P10/P50/P90**
          bands and forecast error measured on previous days. During
          the day, correction compares forecast with actual production but does not
          reduce home protection based on a short post-sunrise sample.

          The Self-Use reserve setting is not changed. This energy remains available
          below the normal threshold only during a grid outage.
      - type: markdown
        title: RCE discharge plan
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - sensor.hoymiles_rce_automatic_price_floor
          - sensor.hoymiles_rce_optimization_gain
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
          {% if plan is not none %}
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set dates = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_dates') %}
          {% set export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'expected_export_kwh') | float(0) %}
          {% set battery_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                             'planned_battery_export_kwh')
                                             | float(0) %}
          {% set pv_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                        'natural_pv_export_kwh') | float(0) %}
          {% set baseline_export = states(
               'sensor.hoymiles_rce_self_use_baseline_export') | float(0) %}
          {% set battery_revenue = state_attr(
               'sensor.hoymiles_rce_discharge_plan',
               'planned_battery_revenue_pln') | float(0) %}
          {% set pv_revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                         'natural_pv_revenue_pln') | float(0) %}
          {% set revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'estimated_revenue_pln') | float(0) %}
          {% set price_floor = states(
               'sensor.hoymiles_rce_automatic_price_floor') %}
          {% set gain = plan.attributes.net_optimization_gain_pln
             | default(0) | float(0) %}
          {% set preview = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'plan_is_preview') %}
          {% set scope = state_attr('sensor.hoymiles_rce_discharge_plan',
                                    'planning_scope') %}
          **Horizon:** {{ dates }}<br>
          **Price-data scope:** {{ 'today and tomorrow'
             if scope == 'today_and_tomorrow'
             else 'today only — tomorrow will be added automatically' }}<br>
          **Plan mode:** {{ 'preview — automatic discharge is disabled'
             if preview else 'active' }}<br>
          **Automatic plan price floor:** {{ price_floor
             if price_floor not in ['unknown', 'unavailable'] else 'no export planned' }}
          {{ 'PLN/kWh' if price_floor not in ['unknown', 'unavailable'] else '' }}<br>
          **Net optimization benefit:** {{ gain | round(2) }} PLN<br>
          **Most profitable periods selected by the optimizer:**<br>
          {{ periods or 'No data available to build a plan.' }}

          **Total plan:** {{ minutes // 60 }} h
          {{ minutes % 60 }} min ({{ states('sensor.hoymiles_rce_discharge_plan') }}
          30-minute blocks)<br>
          **Planned controlled export from now:** {{ battery_export | round(2) }}
          kWh → {{ battery_revenue | round(2) }} PLN<br>
          **Forecast surplus if Self-Use remains active:**
          {{ baseline_export | round(2) }} kWh<br>
          **Unavoidable PV surplus remaining after optimization:**
          {{ pv_export | round(2) }}
          kWh → {{ pv_revenue | round(2) }} PLN<br>
          **Total future export from now:** {{ export | round(2) }} kWh<br>
          **Total future estimated revenue:** {{ revenue | round(2) }} PLN

          {% if is_state('input_boolean.hoymiles_rce_advanced_view', 'on') %}
          ---
          **Data quality:** {{ plan.attributes.data_quality_score | default(0) }}/100
          ({{ plan.attributes.data_quality_level | default('not assessed') }}){% set issues =
          plan.attributes.data_quality_issues | default([], true) %}{% if issues %}
          · issues: {{ issues | join(', ') }}{% endif %}<br>
          **Today forecast P10 / P50 / P90:**
          {{ plan.attributes.forecast_today_p10_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_today_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_today_p90_kwh | default('—', true) }} kWh<br>
          **Tomorrow forecast P10 / P50 / P90:**
          {{ plan.attributes.forecast_tomorrow_p10_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_tomorrow_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_tomorrow_p90_kwh | default('—', true) }} kWh<br>
          {% set day3_entity = plan.attributes.forecast_day3_entity | default(none) %}
          {% set day3_configured = plan.attributes.forecast_day3_configured_entity
             | default(none) %}
          {% set day3_status = plan.attributes.forecast_day3_status | default(none) %}
          {% set day3_fresh = plan.attributes.forecast_day3_data_fresh | default(none) %}
          {% set day3_age = plan.attributes.forecast_day3_age_seconds | default(none) %}
          {% set day3_reason = plan.attributes.forecast_day3_data_reason | default(none) %}
          **Day 3 — entity:**
          {{ day3_entity if day3_entity not in [none, '', 'not_enabled',
             'not_available', 'unknown', 'unavailable'] else 'no detected entity' }} ·
          configuration:
          {{ day3_configured if day3_configured not in [none, '', 'automatic',
             'unknown', 'unavailable'] else 'automatic' }}<br>
          **Day 3 — status / fresh:**
          {{ day3_status if day3_status not in [none, ''] else 'no status' }} /
          {% if day3_fresh is none %}data unavailable{% elif day3_fresh %}yes{% else %}no{% endif %}<br>
          **Day 3 — signed age:**
          {{ ((day3_age | float(0)) | round(1)) ~ ' s'
             if day3_age is number else 'no timestamp' }} · reason:
          {{ day3_reason if day3_reason not in [none, ''] else 'no information' }}<br>
          **Forecast confidence / conservative-case share:**
          {{ plan.attributes.forecast_confidence_percent | default(0) }}% /
          {{ ((plan.attributes.forecast_uncertainty_risk_weight | default(0))
              * 100) | round(0) }}%<br>
          **Load model:** {{ plan.attributes.load_profile_mode
             | default('fallback mode') }} ·
          {{ plan.attributes.recorder_load_history_days | default(0) }} history days<br>
          **Physical plan power:** requested
          {{ plan.attributes.requested_export_power_kw | default(0) }} kW · available
          {{ plan.attributes.maximum_export_power_kw | default(0) }} kW · limit source:
          {{ plan.attributes.physical_limit_source | default('none') }}<br>
          **GCF:** {{ 'enabled' if plan.attributes.gcf_enabled | default(false)
             else 'disabled' }} · limit
          {{ plan.attributes.gcf_export_limit_percent | default('—', true) }}%<br>
          **Planned battery wear cost:**
          {{ plan.attributes.battery_wear_cost_pln | default(0) }} PLN ·
          **net benefit:** {{ plan.attributes.net_optimization_gain_pln
             | default(0) }} PLN<br>
          **Gross revenue increase before battery wear cost:**
          {{ plan.attributes.gross_optimization_gain_pln
             | default(plan.attributes.optimization_gain_pln | default(0)) }} PLN<br>
          **Additional reserve after the horizon (day-three deficit):**
          {{ plan.attributes.terminal_energy_target_kwh | default(0) }} kWh ·
          {{ plan.attributes.terminal_energy_target_reason
             | default('reason unavailable') }} · value
          {{ plan.attributes.terminal_energy_value_pln | default(0) }} PLN
          {% endif %}

          Future-plan values do not include energy sold earlier
          today. Realized export is split above into
          RCE-controlled sales and natural surplus exported in Self-Use.

          The automation returns to **Self-Use** after the selected
          slot ends, the minimum SOC is reached, or the
          switch is disabled. The export lockout excludes the configured hours.
          {% endif %}
      - type: custom:hoymiles-aurora-finance-card
      - type: custom:hoymiles-responsive-stack-card
        minimum_width: 320
        gap: 12
        cards:
          - type: custom:hoymiles-aurora-frame-card
