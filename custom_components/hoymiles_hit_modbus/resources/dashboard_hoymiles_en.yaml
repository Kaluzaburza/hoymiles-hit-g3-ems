          **Grid status:** {{ status_labels.get(status_code, status_code) }}<br>
          **L1 / L2 / L3 voltages:** {{ (l1 | round(1)) ~ ' V' if l1 is number and l1 > 0 else 'No data' }} / {{ (l2 | round(1)) ~ ' V' if l2 is number and l2 > 0 else 'No data' }} / {{ (l3 | round(1)) ~ ' V' if l3 is number and l3 > 0 else 'No data' }}<br>
          **Highest voltage and phase:** {{ (maximum | round(1)) ~ ' V · ' ~ maximum_phase if maximum is number and maximum > 0 else 'No data' }}<br>
