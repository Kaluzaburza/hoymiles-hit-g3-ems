          {% set status_labels = {'ready': 'Grid within the safe range', 'learning': 'Learning voltage history', 'preparing_headroom': 'Forecast risk — preserve headroom', 'preparing_discharge': 'Forecast risk — prepare headroom', 'controlling': 'Elevated voltage — active regulation', 'battery_limited': 'Elevated voltage — battery storage limited', 'emergency': '253 V threshold reached', 'emergency_actuator_unavailable': '253 V threshold without fresh actuators', 'battery_charge_unavailable': 'Elevated voltage — BMS cannot accept energy', 'stale_voltage': 'Grid state unknown — voltage data stale', 'history_stale': 'Current grid available, prediction suspended', 'forecast_stale': 'Current grid available, forecast stale', 'missing_data': 'Grid state unknown — data unavailable', 'optimizer_error': 'Grid state unknown — calculation error'} %}
          {% set risk_labels = {'ready': 'Low', 'learning': 'No predictive assessment', 'preparing_headroom': 'Forecast', 'preparing_discharge': 'Forecast', 'controlling': 'High', 'battery_limited': 'High', 'emergency': 'Critical', 'emergency_actuator_unavailable': 'Critical', 'battery_charge_unavailable': 'High', 'stale_voltage': 'No data', 'history_stale': 'No predictive assessment', 'forecast_stale': 'No predictive assessment'} %}
          {% set action_labels = {'absorb_pv': 'Increase PV absorption by battery storage', 'limit_export': 'Limit export', 'monitor': 'Monitor without changing settings', 'hold': 'Hold action', 'restore': 'Restore baseline setting', 'release_export': 'Gradually release the export limit', 'grid_discharge_preparation': 'Prepare headroom with controlled discharge', 'preserve_headroom': 'Preserve headroom', 'none': 'No action'} %}
          {% set horizon_labels = {
