          - entity: input_text.hoymiles_ems_push_notify_target
            name: "Phone — notification service"
          - entity: sensor.hoymiles_ems_push_notification_status
            name: "Notification status"
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          **Warning:** changing “System operation” may stop the inverter.
          The `select.hoymiles_hit_parallel_networking_command` entity is intentionally omitted,
          because ESPHome marks it `disabled_by_default: true`. Enable it in Home
          Assistant only when configuring parallel operation.
