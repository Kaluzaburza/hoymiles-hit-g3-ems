             if plan.attributes.recommended_charge_limit_percent is number else 'No data' }} ·
          {{ (plan.attributes.recommended_charge_power_kw | round(2)) ~ ' kW'
             if plan.attributes.recommended_charge_power_kw is number else 'No data' }}<br>
          **Export limit:**
          {{ (plan.attributes.recommended_export_limit_percent | round(1)) ~ '%'
             if plan.attributes.recommended_export_limit_percent is number else 'No data' }}<br>
          **Action:** {{ action_labels.get(action, action) }}
          {% elif plan is not none %}
          **Last plan — no execution authority.** RCEm is waiting for a result that matches
          current inputs. Outdated values are not shown as
          readiness or a current decision.
          {% else %}
          **No data.** RCEm is waiting for its own current plan; the other policies
