          {{ horizon_labels.get(horizon, 'data unavailable') }}<br>
          **SOC target before the risk:**
          {{ (plan.attributes.target_soc_before_risk_percent | round(1)) ~ '%'
             if plan.attributes.target_soc_before_risk_percent is number else 'No data' }}<br>
          **Charging limit:**
