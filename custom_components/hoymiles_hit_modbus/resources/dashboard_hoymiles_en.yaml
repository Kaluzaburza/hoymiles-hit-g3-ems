      - type: custom:hoymiles-zebra-entities-card
        title: Tariff charging — settings
        view_layout:
          position: sidebar
        show_header_toggle: false
        state_color: true
        readiness_entity: binary_sensor.hoymiles_tariff_control_data_ready
        readiness_title: Configuration readiness
        entities:
          - entity: input_boolean.hoymiles_tariff_charge_enabled
            name: Enable tariff charging
            requirement: required
            description: Lets this policy prepare a grid-charging candidate.
          - entity: input_select.hoymiles_tariff_operator
            name: Operator
            requirement: required
            description: Selects the DSO whose time-period schedule is used.
          - entity: input_select.hoymiles_tariff_type
            name: Tariff
            requirement: required
            description: Selects the applicable time and energy-price profile.
          - entity: input_number.hoymiles_tariff_requested_charge_power
            name: Maximum import power
            requirement: required
            description: Limits the grid-import power used by this policy.
          - entity: input_number.hoymiles_tariff_maximum_soc
            name: Target battery-storage level
            requirement: required
            description: Sets the highest SOC reached by low-cost charging.
          - entity: input_number.hoymiles_tariff_soc_safety_margin
            name: Additional SOC reserve
            requirement: optional
            description: Increases the energy reserve required by the tariff plan.
          - entity: input_boolean.hoymiles_tariff_advanced_view
            name: Advanced data (expert mode)
      - type: custom:hoymiles-aurora-disclosure-card
        title: What the settings mean
        accent: battery
        view_layout:
          position: sidebar
        content: |-
          **Required**

          - **Enable low-cost energy** — lets this policy prepare a charging candidate.
          - **DSO and tariff** — select the applicable time periods and energy prices.
          - **Maximum import power** — limits grid power imported in the selected period.
          - **Target storage level** — sets this policy's maximum charging level.

          **Optional**

          - **Additional SOC reserve** — increases the energy reserve required by the tariff plan.
          - **Manual mode** — lets you enter custom periods and prices when the Manual DSO is selected.

          The value shown in every field is the effective value. A missing or
          stale required field is reported by readiness status and
          blocks only this policy from starting.
      - type: markdown
        title: Selected profile — overview
        entity_id: sensor.hoymiles_hit_tariff_charge_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_tariff_charge_plan %}
          {% if plan is not none %}
          {% set operator = states('input_select.hoymiles_tariff_operator') %}
          {% set group = states('input_select.hoymiles_tariff_type') %}
          {% if plan.attributes.tariff_profile_expired | default(false) %}
          ⚠️ **The tariff profile has expired. Automatic charging is blocked.**
          Update the integration or select the **Manual** profile and enter current prices.

          {% endif %}
          {% if operator == 'Manual' %}
          **Manual mode · {{ group }}**

          Time periods and total marginal prices are taken from the manual fields below.
          {% elif plan.attributes.tariff_profile_supported | default(false) %}
          **{{ plan.attributes.tariff_operator_name }} · {{ group }}**<br>
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          Assumed supplier: **{{ plan.attributes.tariff_supplier_assumption }}**<br>
          Price list: **{{ plan.attributes.tariff_profile_year }}** · season:
          **{{ 'summer' if plan.attributes.tariff_profile_season == 'summer'
             else 'winter' }}**<br>
          {% endif %}
          Current period: **{{ plan.attributes.tariff_profile_current_zone }}** ·
          **{{ plan.attributes.tariff_profile_current_price }} PLN/kWh**<br>
          Low-cost hours: **{{ plan.attributes.tariff_profile_low_windows }}**<br>
          {% if group == 'G13' %}
          Medium period: **{{ plan.attributes.tariff_profile_medium_windows }}**<br>
          {% endif %}
          Weekend in low-cost period:
          **{{ 'yes' if plan.attributes.tariff_profile_weekend_low else 'no' }}** ·
          public holidays: **{{ 'yes' if plan.attributes.tariff_profile_holiday_low else 'no' }}**

          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          | Period | Indicative price |
          |---|---:|
          | G11 (comparison) | {{ plan.attributes.tariff_profile_g11_price }} PLN/kWh |
          | Low-cost | {{ plan.attributes.tariff_profile_low_price }} PLN/kWh |
          {% if group == 'G13' %}| Medium | {{ plan.attributes.tariff_profile_medium_price }} PLN/kWh |
          {% endif %}| Peak | {{ plan.attributes.tariff_profile_peak_price }} PLN/kWh |

          [Official DSO tariffs]({{ plan.attributes.tariff_profile_source_url }})
          {% endif %}
          {% else %}
          ⚠️ Profile **{{ operator }} · {{ group }}** is not supported.
          Automatic charging will remain blocked. Select another group
          or the **Manual** profile.
          {% endif %}

          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          Prices include energy from the regional incumbent supplier and variable
          gross distribution charges. Fixed fees are excluded. With another
          supplier, select the **Manual** profile and copy the prices from your bill.
          {% endif %}
          {% endif %}
