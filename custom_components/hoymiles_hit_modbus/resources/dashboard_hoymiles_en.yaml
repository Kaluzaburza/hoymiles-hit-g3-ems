            card:
              type: statistics-graph
              title: Export — last 30 days
              chart_type: bar
              period: day
              days_to_show: 30
              hide_legend: true
              fit_y_data: true
              stat_types:
                - change
              entities:
                - entity: sensor.hoymiles_rce_grid_export_energy_total
                  name: Energy to grid
                  color: "#FFC857"
      - type: custom:hoymiles-zebra-entities-card
        title: RCE — details and diagnostics
        show_header_toggle: false
        state_color: true
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rce_advanced_view
            state: "on"
        entities:
          - entity: sensor.hoymiles_ems_control_owner
            name: Current controller
          - entity: binary_sensor.hoymiles_ems_control_conflict
            name: Control conflict
          - entity: sensor.hoymiles_rce_status
            name: Automation status
          - entity: sensor.hoymiles_hit_rce_optimized_plan
            name: Optimizer status
          - entity: binary_sensor.hoymiles_rce_control_data_ready
            name: Data and control ready
          - entity: binary_sensor.hoymiles_ems_export_allowed
            name: Physical export permitted
          - entity: binary_sensor.hoymiles_ems_execution_ready
            name: Inverter ready for EMS writes
          - entity: sensor.hoymiles_rce_current_price
            name: Current RCE price
          - entity: sensor.hoymiles_rce_automatic_price_floor
            name: Automatic plan price floor
          - entity: sensor.hoymiles_rce_optimization_gain
            name: Gain versus uncontrolled export
          - entity: sensor.hoymiles_rce_bms_safe_discharge_power
            name: Safe discharge power reported by BMS
          - entity: sensor.hoymiles_rce_effective_discharge_power_percent
            name: Effective discharge limit
          - entity: binary_sensor.hoymiles_sale_block_active
            name: Lockout active now
          - entity: sensor.hoymiles_solcast_forecast_today
            name: Forecast PV production today
          - entity: sensor.hoymiles_solcast_forecast_remaining_today
            name: Remaining forecast PV production today
          - entity: sensor.hoymiles_solcast_forecast_tomorrow
            name: Forecast PV production tomorrow
          - entity: sensor.hoymiles_load_average_4_days
            name: Adaptive daily load consumption
          - entity: sensor.hoymiles_load_history_coverage
            name: Load history coverage
          - entity: sensor.hoymiles_night_load_average_4_days
            name: Adaptive protected-night consumption
          - entity: sensor.hoymiles_night_load_history_coverage
            name: Night-load history coverage
          - entity: sensor.hoymiles_actual_load_energy_today
            name: Actual load consumption today
          - entity: sensor.hoymiles_rce_pv_self_consumption_today
            name: PV → loads — diagnostic register
          - entity: sensor.hoymiles_rce_battery_to_load_today
            name: Energy supplied by battery — diagnostic
          - entity: sensor.hoymiles_rce_grid_to_load_today
