      - type: custom:hoymiles-aurora-disclosure-card
        title: Plan, readiness, and execution
        accent: battery
        entity_id:
          - sensor.hoymiles_hit_tariff_charge_plan
          - binary_sensor.hoymiles_tariff_control_data_ready
          - sensor.hoymiles_hit_ems_supervisor
          - sensor.hoymiles_tariff_grid_charge_energy_daily
        content: |-
          {% set plan = states.sensor.hoymiles_hit_tariff_charge_plan %}
          {% set supervisor = states.sensor.hoymiles_hit_ems_supervisor %}
          {% set readiness_entity = states.binary_sensor.hoymiles_tariff_control_data_ready %}
          {% set readiness = states('binary_sensor.hoymiles_tariff_control_data_ready') %}
          {% set plan_current = plan is not none
             and plan.attributes.result_current is sameas true
             and plan.attributes.recalculation_pending is sameas false %}
          {% if plan_current %}
          {% set slots = plan.attributes.planned_slots | default([], true) %}
          {% set next = slots | first if slots else none %}
          {% set selected_action = supervisor.attributes.selected_action | default(none, true) if supervisor is not none else none %}
          {% set selected_policy = supervisor.attributes.selected_policy | default(none, true) if supervisor is not none else none %}
          {% set transaction_id = supervisor.attributes.transaction_id | default(none, true) if supervisor is not none else none %}
          {% set expected = supervisor.attributes.expected_readback | default(none, true) if supervisor is not none else none %}
          {% set physical = supervisor.attributes.physical_verification | default(none, true) if supervisor is not none else none %}
          {% set physical_status = physical.status | default(none, true) if physical is mapping else none %}
          {% set physical_evidence = physical.evidence | default([], true) if physical is mapping else [] %}
          {% set physical_labels = {'pending': 'Awaiting physical confirmation', 'confirmed': 'Physically confirmed', 'contradicted': 'Contradicted by physical readback', 'unavailable': 'Physical confirmation unavailable'} %}
          {% set action_labels = {'grid_support': 'Supply home from the low-cost grid', 'battery_charge': 'Charge battery storage from the grid', 'grid_support_and_charge': 'Supply home and charge battery storage', 'none': 'No action'} %}
          {% set need_labels = {'required_energy': 'Restore required energy', 'economic': 'Cost-effective energy shifting', 'mixed': 'Restore energy and gain a tariff benefit', 'none': 'No action needed'} %}
          {% set status_labels = {'ready': 'Plan ready', 'no_charge_needed': 'PV and battery storage cover demand', 'no_discount_window': 'No lower-cost period', 'no_cheap_window': 'No low-cost period before the shortage', 'not_economically_beneficial': 'Charging is not economical', 'shortage_in_low_period': 'The shortage falls in the low-cost period', 'insufficient_cheap_window': 'Low-cost periods do not cover the shortage', 'hard_reserve_unavailable': 'The reserve cannot be restored', 'missing_data': 'Required data missing', 'optimizer_error': 'Calculation error'} %}
          {% set next_action = next.action | default('none', true) if next is not none else 'none' %}
          {% set need = plan.attributes.current_run_need_class | default('none', true) %}
          {% set status_code = plan.attributes.status_code | default('missing_data', true) %}
          {% set base_generation = expected.base_ems_generation | default(none, true) if expected is mapping else none %}
          {% set legacy_daily = states('sensor.hoymiles_tariff_grid_charge_energy_daily') %}
          **Plan:** {{ 'No data' if plan.state in ['unknown', 'unavailable', 'none', ''] else plan.state }}<br>
          **Policy readiness:** {{ 'Yes' if readiness == 'on' else 'No' if readiness == 'off' else 'No data' }} · {{ readiness_entity.attributes.reason | default('No data', true) if readiness_entity is not none else 'No data' }}<br>
          **Transaction intent:** {{ action_labels.get(selected_action, selected_action) if selected_policy == 'tariff' and transaction_id is not none and selected_action is not none else 'No active tariff intent' }}<br>
          **Command sent:** No data — EMS does not publish a command or its send time<br>
          **Expected readback:** {{ expected.written_families | join(', ') if selected_policy == 'tariff' and transaction_id is not none and expected is mapping else 'No active tariff transaction' }}<br>
          **Transaction FC03 baseline generation:** {{ base_generation if selected_policy == 'tariff' and transaction_id is not none and base_generation is not none else 'No data' }}<br>
          **Physical confirmation:** {{ physical_labels.get(physical_status, 'No data') if selected_policy == 'tariff' and transaction_id is not none else 'No active tariff transaction' }} · {{ physical_evidence | join(' · ') if selected_policy == 'tariff' and transaction_id is not none and physical_evidence else 'No published evidence' }}

          | Next action | Time | Grid import | To battery storage | Directly to home |
          |---|---|---:|---:|---:|
          | {{ action_labels.get(next_action, next_action) }} | {{ next.date ~ ' · ' ~ next.start ~ '–' ~ next.end if next is not none else 'No data' }} | {{ (next.grid_import_kwh | round(3)) ~ ' kWh' if next is not none and next.grid_import_kwh is number else 'No data' }} | {{ (next.stored_energy_kwh | round(3)) ~ ' kWh' if next is not none and next.stored_energy_kwh is number else 'No data' }} | {{ (next.direct_load_kwh | round(3)) ~ ' kWh' if next is not none and next.direct_load_kwh is number else 'No data' }} |

