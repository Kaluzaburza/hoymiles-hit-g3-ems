            name: Required free battery capacity
          - entity: sensor.hoymiles_rcem_headroom_shortfall
            name: Missing free battery capacity
          - entity: sensor.hoymiles_rcem_natural_headroom_before_risk
            name: Natural headroom from supplying the home before the peak
          - entity: sensor.hoymiles_rcem_planned_grid_discharge
            name: Planned morning discharge to the grid
          - entity: sensor.hoymiles_rcem_pre_discharge_target_soc
            name: Morning-discharge target SOC
          - entity: sensor.hoymiles_rcem_pre_discharge_power
            name: Automatically selected discharge power
          - entity: sensor.hoymiles_rcem_recommended_battery_charge_limit
            name: Recommended global charging limit
          - entity: number.hoymiles_hit_battery_max_charge_power
            name: Actual global battery charging limit
          - entity: sensor.hoymiles_rcem_recommended_export_limit
            name: Recommended export limit
          - entity: number.hoymiles_hit_maximum_export_power_limit
            name: Actual maximum export limit
          - entity: sensor.hoymiles_hit_maximum_charge_current
            name: Maximum BMS charging current
          - entity: sensor.hoymiles_hit_overview_battery_soc
            name: SOC magazynu

      - type: markdown
        title: Safety rules
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        view_layout:
          position: sidebar
        content: |-
          During normal regulation the automation remains in **Self-Use**. It combines
          the Solcast forecast for today and
          tomorrow, the actual four-day LOAD profile, protected home demand,
          SOC, battery capacity and historical L1/L2/L3 voltages. It subtracts
          home consumption from the PV forecast and only treats the remaining surplus as
          energy requiring battery headroom.

          It first subtracts the headroom created naturally while the home is
          supplied from the battery before the peak. If capacity is still missing,
          **Morning discharge** may switch EMS to Grid Discharge beforehand
          and sell only the calculated shortfall. Power is selected from
          the missing kWh and time remaining until the window, with a 30-minute buffer.
          The cycle ends at the target SOC or earlier if
          the highest phase reaches 248.4 V or the 10-minute average reaches 249.2 V.
          It never discharges below the protected home-and-outage-reserve SOC.

          Morning discharge requires active GCF, an actual
          export limit above 0%, no export lockout and disabled
          observation mode. It changes neither GCF nor **Maximum Export Power Limit**;
          it uses the existing value and grid-agreement cap. After
          completion it restores the previous maximum discharge power, SOC threshold
          and Self-Use mode.

          Before the predicted peak RCEm still limits **Battery Max Charge
          Power** to avoid filling the battery too early. If morning
          discharge remains disabled or export is capped at 0%, the
          **Planned morning discharge** field is informational only.

          Optional export control changes only **Maximum Export Power
          Limit**. It never exceeds the lower of two values: the limit
          found at activation and **Maximum export permitted by the
          grid agreement**. Example: a 20 kW inverter with a 50% cap can export at most
          10 kW. RCEm does not enable GCF; the user enables it deliberately in
          the inverter settings.

          It does not change three-phase unbalance, Q(U), P(U), power factor or
          protection thresholds. The highest L1/L2/L3 phase always has priority.

          RCE, tariff charging and RCEm 253 V+ are mutually exclusive.
          Battery balancing and manual EMS plans have priority.

          During initial testing, leave **Observation only** enabled.
          enabled. Disabling it allows the controller to change the charging limit
          by at most 10 percentage points per minute and the export limit by 5–15
          points depending on voltage. At 253 V export may be immediately
          reduced to 0%, while the battery uses the full BMS-safe limit.

