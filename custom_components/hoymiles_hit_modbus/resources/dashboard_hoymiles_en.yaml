          {% set status_labels = {'ready': 'Voltage safe', 'learning': 'Learning voltage history', 'preparing_headroom': 'Preparing battery-storage headroom', 'preparing_discharge': 'Controlled headroom preparation', 'controlling': 'Regulating protection below 253 V', 'battery_limited': 'Battery-storage capability limited', 'emergency': 'Fast protection at or above 253 V', 'emergency_actuator_unavailable': '253 V protection without fresh actuators', 'battery_charge_unavailable': 'BMS cannot accept charging', 'stale_voltage': 'Voltage data stale', 'history_stale': 'Voltage history stale', 'forecast_stale': 'Forecast stale', 'missing_data': 'Required data missing', 'optimizer_error': 'Calculation error'} %}
