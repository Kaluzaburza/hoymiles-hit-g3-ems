      - type: custom:hoymiles-zebra-entities-card
        title: Voltage management — settings
        view_layout:
          position: sidebar
        show_header_toggle: false
        state_color: true
        readiness_title: Configuration readiness
        entities:
          - entity: input_boolean.hoymiles_rcm_enabled
            name: Enable voltage management
            requirement: required
            description: Lets RCEm prepare its own action candidate.
          - entity: input_boolean.hoymiles_rcm_export_control_enabled
            name: Smooth export control
            requirement: optional
            description: Reduces export when confirmed voltage rises.
          - entity: input_boolean.hoymiles_rcm_pre_discharge_enabled
            name: Create battery headroom before high PV production
            requirement: optional
            description: May create exactly the calculated battery headroom in advance.
          - entity: input_number.hoymiles_rcm_export_cap_percent
            name: Maximum export permitted by the grid agreement
            requirement: required
            description: Sets a hard export limit that RCEm cannot exceed.
          - entity: input_number.hoymiles_rcm_soc_safety_margin
            name: Additional SOC reserve
            requirement: optional
            description: Increases the reserve protected by RCEm only.
          - entity: input_boolean.hoymiles_rcm_advanced_view
            name: Advanced data (expert mode)

      - type: custom:hoymiles-aurora-disclosure-card
        title: What the settings mean
        accent: warning
        view_layout:
          position: sidebar
        content: |-
          **Required**

          - **Enable voltage management** — allows RCEm to prepare its own candidate.
          - **Maximum export permitted by the grid agreement** — is a hard limit that RCEm cannot exceed.

          **Optional**

          - **Smooth export control** — reduces export as voltage rises.
          - **Create battery headroom** — may schedule an earlier partial battery discharge.
          - **Additional SOC reserve** — increases the reserve protected by RCEm only.

