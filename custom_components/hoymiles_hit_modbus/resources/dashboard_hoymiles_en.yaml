            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
      - type: custom:hoymiles-aurora-finance-card
      - type: custom:hoymiles-zebra-entities-card
        title: Dynamic export
        view_layout:
          position: sidebar
        show_header_toggle: false
        state_color: true
        readiness_entity: binary_sensor.hoymiles_rce_control_data_ready
        readiness_title: Configuration readiness
        entities:
          - entity: input_select.hoymiles_dynamic_sale_provider
            name: Export price provider
            requirement: required
            description: Pstryk binds purchase and export to the public hourly net price.
          - entity: input_boolean.hoymiles_rce_discharge_enabled
            name: Enable energy sales
            requirement: required
            description: Allows this policy to prepare a plan; EMS still decides whether it is executed.
          - entity: input_boolean.hoymiles_pv_charge_delay_enabled
            name: Delay PV charging
            requirement: optional
            description: Exports morning PV surplus and delays charging to cheaper hours when enough energy remains for the battery and home.
          - entity: input_select.hoymiles_pv_charge_delay_profile
            name: PV charge delay — profile
            requirement: optional
            description: Conservative, Balanced or Maximum. A smaller forecast margin allows more planned export but increases the risk of incomplete charging.
          - entity: input_number.hoymiles_rce_requested_discharge_power
            name: Maximum export power
            requirement: required
            description: Limits battery-storage export power.
          - entity: input_number.hoymiles_rce_minimum_net_export_power
            name: Minimum planned net export
            requirement: optional
            description: Minimum after household consumption. Blocks that are too small leave energy for self-consumption; a temporary export drop does not trigger STOP.
          - entity: input_boolean.hoymiles_rce_dynamic_soc_enabled
            name: Automatic home-energy protection
            requirement: required
            description: Protects energy needed for forecast home consumption.
          - entity: input_number.hoymiles_rce_soc_safety_margin
            name: Additional protection from sale
            requirement: optional
            description: Adds a reserve only to the RCE plan's protected threshold.
          - entity: input_boolean.hoymiles_sale_block_enabled
            name: Export lockout hours
            requirement: optional
            description: Excludes the selected period from automatic energy sales.
          - entity: input_datetime.hoymiles_sale_block_start
            name: Lockout start
            requirement: optional
            description: Sets the start of the automatic-sales lockout period.
          - entity: input_datetime.hoymiles_sale_block_end
            name: Lockout end
            requirement: optional
            description: Sets the end of the automatic-sales lockout period.
          - entity: input_boolean.hoymiles_rce_advanced_view
            name: Advanced data (expert mode)
      - type: custom:hoymiles-aurora-disclosure-card
        title: What the settings mean
        content: |-
          **Required**

          - **Enable energy sales** — allows this policy to prepare a candidate; EMS still controls execution.
          - **Maximum export power** — limits power discharged from battery storage to the grid.
          - **Automatic home-energy protection** — retains the energy needed for forecast home consumption.

          **Optional**

          - **Additional protection from sale** — adds 0–90 percentage points to the battery reserve while automatic home-energy protection is enabled. Applies to RCE and Pstryk. The total is capped at 100%; the home can still use this extra reserve.
          - **Export lockout hours** — exclude the selected hours from the RCE plan.

          The value shown in every field is the effective value. If the
          readiness card reports missing data, the plan remains informational and does not
          receive execution authority.
      - type: custom:hoymiles-aurora-disclosure-card
        title: Energy-sales plan at a glance
        accent: grid
        entity_id: sensor.hoymiles_hit_rce_optimized_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
          {% set power_percent = states('input_number.hoymiles_rce_requested_discharge_power') %}
          {% set plan_current = plan is not none
             and plan.attributes.result_current is sameas true
             and plan.attributes.recalculation_pending is sameas false %}
          {% if plan_current %}
          {% set slots = plan.attributes.planned_slots | default([], true) %}
          {% set next = slots | first if slots else none %}
          **Maximum export power:**
          {{ 'No data' if power_percent in ['unknown', 'unavailable', 'none', ''] else power_percent ~ '%' }} ·
          {{ (plan.attributes.requested_export_power_kw | round(2)) ~ ' kW'
             if plan.attributes.requested_export_power_kw is number else 'No kW data' }}

          | Next 30-minute slot | Planned energy sale | Estimated plan revenue | SOC at the end of the horizon |
          |---|---:|---:|---:|
          | {{ next.date ~ ' · ' ~ next.start ~ '–' ~ next.end if next is not none else 'No data' }} | {{ (plan.attributes.planned_export_kwh | round(2)) ~ ' kWh' if plan.attributes.planned_export_kwh is number else 'No data' }} | {{ (plan.attributes.planned_revenue_pln | round(2)) ~ ' PLN' if plan.attributes.planned_revenue_pln is number else 'No data' }} | {{ (plan.attributes.ending_battery_soc | round(1)) ~ '%' if plan.attributes.ending_battery_soc is number else 'No data' }} |

          {% if plan.attributes.pv_charge_delay_enabled | default(false) %}
          **Delay PV charging:**
          {% if plan.attributes.pv_charge_delay_start %}
          {{ as_timestamp(plan.attributes.pv_charge_delay_start) | timestamp_custom('%H:%M') }}–{{ as_timestamp(plan.attributes.pv_charge_delay_end) | timestamp_custom('%H:%M') }} ·
          **Estimated additional benefit:** {{ plan.attributes.pv_charge_delay_benefit_pln | round(2) }} PLN.
          {% else %}
          No profitable window with sufficient battery refill.
          {% endif %}
          {% endif %}

          **Selected slots:** {{ slots | length }}<br>
          **Battery-storage wear cost:** {{ (plan.attributes.battery_wear_cost_pln | round(2)) ~ ' PLN' if plan.attributes.battery_wear_cost_pln is number else 'No data' }}<br>
          **Plan execution reserve:** {{ (plan.attributes.control_reserve_energy_kwh | round(2)) ~ ' kWh' if plan.attributes.control_reserve_energy_kwh is number else 'No data' }}

          Data comes directly from the current plan. A missing backend field
          is shown as **No data**, without calculations in the interface.
          {% elif plan is not none %}
          **Last plan — no execution authority.** Recalculation is in progress or the result
          no longer matches current inputs. Previous-result details are not
          presented as a current plan.
          {% else %}
          **No data.** The RCE policy has not published a plan yet.
          {% endif %}
      - type: custom:hoymiles-zebra-entities-card
        title: Current status and next plan
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hoymiles_rce_status
            name: Automation status
          - entity: sensor.hoymiles_hit_rce_optimized_plan
            name: Optimizer decision
          - entity: sensor.hoymiles_rce_dynamic_minimum_soc
            name: Protected minimum SOC
          - entity: sensor.hoymiles_rce_available_energy_now
            name: Energy available above reserve
          - entity: sensor.hoymiles_rce_planned_battery_export
            name: Planned battery-storage export
          - entity: sensor.hoymiles_rce_ending_battery_soc
            name: SOC at the end of the horizon
      - type: markdown
        title: Plan execution eligibility
        entity_id: sensor.hoymiles_hit_rce_optimized_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
          {% if plan is not none and plan.attributes.gcf_enabled | default(false)
                and plan.attributes.gcf_export_limit_percent | default(0) | float(0) <= 0 %}
          **The sales plan is available, but execution is blocked.**
          This installation operates with zero export to the grid. This is not
          a planner fault and does not block the other policies.
          {% else %}
          Planning and execution are separate. EMS may start energy export
          only after its own readiness check, ownership acquisition, and
          physical readback confirmation.
          {% endif %}
      - type: custom:hoymiles-aurora-disclosure-card
        title: How energy sales automation works
        accent: grid
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rce_advanced_view
            state: "on"
        view_layout:
          position: sidebar
        entity_id:
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - sensor.hoymiles_rce_reserve_status
          - sensor.hoymiles_rce_dynamic_minimum_soc
        content: |-
          The automation requires the external integration
          **Solcast PV Forecast** by **BJReplay**:
          [installation and configuration](https://github.com/BJReplay/ha-solcast-solar).

          Forecasts for **today** and **tomorrow** are required.
          If Solcast provides a **day-three forecast**, the integration uses it
          automatically to value energy worth retaining after the end of the
          48-hour market horizon. Its absence does not block operation. Entities are
          detected automatically in Polish and English HA; for
          custom names, the Today and Tomorrow entities can be entered above.

          The optimizer simulates the balance every 30 minutes from now through tonight,
          the whole next day and the following night until **90 minutes after sunrise**.
          It first withholds the emergency Self-Use reserve and the safety
          correction, and the full forecast home consumption through
          the end of the nearest protected night from export. Forecast PV before sunset does not
          reduce this night reserve. Only the remaining energy is assigned
          to the most valuable available RCE slots today or tomorrow.

          The export price is not configured manually. The optimizer compares
          the full financial result of every available slot in the horizon,
          selects the highest prices and includes natural PV export, battery-storage
          wear, and the value of energy retained for the next day.
          An earlier discharge is used only when it increases the net result
          or creates battery-storage headroom before a later surplus sold
          more cheaply.

          System power is calculated as **one inverter's rated power × the automatically
          detected inverter count × the configured discharge percentage**.
          Until at least 24 hours of history has been collected, the fallback
          daily consumption entered above is used. The algorithm then learns from up to
          28 complete days, gives recent days more weight, rejects
          isolated spikes, and builds separate 48 half-hour profiles
          for weekdays and weekends. The latest four days remain a fast
          fallback after a fresh installation. Actual coverage and the selected
          model are shown in diagnostics.

          The reserve is conservatively derived from Solcast **P10/P50/P90**
          bands and forecast error measured on previous days. During
          the day, correction compares forecast with actual production but does not
          reduce home protection based on a short post-sunrise sample.

          The Self-Use reserve setting is not changed. That energy remains available
          below the normal threshold only during a grid outage.
      - type: custom:hoymiles-aurora-disclosure-card
        title: Full RCE plan details
        accent: grid
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - sensor.hoymiles_rce_automatic_price_floor
          - sensor.hoymiles_rce_optimization_gain
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
          {% if plan is not none %}
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set dates = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_dates') %}
          {% set export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'expected_export_kwh') | float(0) %}
          {% set battery_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                             'planned_battery_export_kwh')
                                             | float(0) %}
          {% set pv_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                        'natural_pv_export_kwh') | float(0) %}
          {% set baseline_export = states(
               'sensor.hoymiles_rce_self_use_baseline_export') | float(0) %}
          {% set battery_revenue = state_attr(
               'sensor.hoymiles_rce_discharge_plan',
               'planned_battery_revenue_pln') | float(0) %}
          {% set pv_revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                         'natural_pv_revenue_pln') | float(0) %}
          {% set revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'estimated_revenue_pln') | float(0) %}
