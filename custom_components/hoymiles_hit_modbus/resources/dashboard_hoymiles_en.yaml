                  name: Stop and restore safely
                  tap_action:
                    action: toggle
                    confirmation:
                      text: Stop the battery-balancing cycle and safely restore the settings?
      - type: custom:hoymiles-zebra-entities-card
        title: Safe shutdown
        show_header_toggle: false
        state_color: true
        safe_off_banner: false
        safe_off_entities:
          - select.hoymiles_hit_ems_mode
          - number.hoymiles_hit_self_use_soc
        safe_off_off_grid_option: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Operating mode — including off-grid operation
          - entity: number.hoymiles_hit_self_use_soc
            name: SOC reserve — Self-Use
          - entity: script.hoymiles_stop_scheduled_cycle
            name: Stop and return to Self-Use
          - entity: sensor.hoymiles_hit_ems_mode_readback_code
            name: Confirmed inverter mode
      - type: markdown
        title: Safe-shutdown status
        entity_id:
          - sensor.hoymiles_hit_ems_supervisor
          - sensor.hoymiles_hit_ems_mode_readback_code
        content: |-
          {% set supervisor = states.sensor.hoymiles_hit_ems_supervisor %}
          {% set stop = supervisor.attributes.master_stop | default(none, true) if supervisor is not none else none %}
          {% set status = stop.status | default('not_requested', true) if stop is mapping else 'not_requested' %}
          {% set labels = {'not_requested': 'Not started', 'requested': 'Sending safe-shutdown command', 'in_progress': 'Command sent — waiting for physical readback', 'completed': 'Success — safe state confirmed', 'blocked': 'Error — safe shutdown blocked', 'failed': 'Error — safe shutdown failed'} %}
          **Result:** {{ labels.get(status, 'No data') }}<br>
          **Transaction:** {{ stop.transaction_id | default('No data', true) if stop is mapping else 'No data' }}<br>
          **Requested:** {{ stop.requested_at | default('No data', true) if stop is mapping else 'No data' }} · **Completed:** {{ stop.completed_at | default('No data', true) if stop is mapping else 'No data' }}<br>
          **Reason:** {{ stop.reason | default('No data', true) if stop is mapping else 'No data' }}<br>
          **Off-Grid preserved:** {{ 'Yes' if stop is mapping and stop.off_grid_preserved is sameas true else 'No' if stop is mapping and stop.off_grid_preserved is sameas false else 'No data' }}<br>
          **Rollback:** {{ supervisor.attributes.rollback_status | default('No data', true) if supervisor is not none else 'No data' }} · {{ supervisor.attributes.rollback_result | default('No data', true) if supervisor is not none else 'No data' }}<br>
          **Confirmed mode:** {{ states('sensor.hoymiles_hit_ems_mode_readback_code') if states('sensor.hoymiles_hit_ems_mode_readback_code') not in ['unknown', 'unavailable', 'none', ''] else 'No data' }}<br>
          The current mode and generation are live diagnostics. The backend does not publish
          a correlated FC03 payload for a completed STOP transaction.
      - type: custom:hoymiles-zebra-entities-card
        title: System control
        show_header_toggle: false
        state_color: true
        safe_off_only: true
        safe_off_banner: false
