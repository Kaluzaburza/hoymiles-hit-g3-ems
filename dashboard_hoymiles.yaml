  - title: Ładowanie taryfowe
    path: ladowanie-taryfowe
    icon: mdi:battery-clock-outline
    type: sidebar
    subview: true
    badges: []
    cards:
      - type: custom:hoymiles-local-nav-card
        group: settings
        current_path: ladowanie-taryfowe
        placement: sidebar
        view_layout:
          position: sidebar
      - type: custom:hoymiles-zebra-entities-card
        title: Ładowanie taryfowe — ustawienia
        view_layout:
          position: sidebar
        show_header_toggle: false
        state_color: true
        readiness_entity: binary_sensor.hoymiles_tariff_control_data_ready
        readiness_title: Gotowość konfiguracji
        entities:
          - entity: input_boolean.hoymiles_tariff_charge_enabled
            name: Włącz ładowanie taryfowe
            requirement: required
            description: Pozwala polityce przygotować kandydata do ładowania z sieci.
          - entity: input_select.hoymiles_tariff_operator
            name: Operator
            requirement: required
            description: Wybiera operatora, którego kalendarz stref ma być używany.
          - entity: input_select.hoymiles_tariff_type
            name: Taryfa
            requirement: required
            description: Wybiera obowiązujący profil godzin i cen energii.
          - entity: input_number.hoymiles_tariff_requested_charge_power
            name: Maksymalna moc poboru
            requirement: required
            description: Ogranicza moc pobieraną z sieci przez tę politykę.
          - entity: input_number.hoymiles_tariff_maximum_soc
            name: Docelowy poziom magazynu
            requirement: required
            description: Wyznacza najwyższy SOC osiągany przez tanie ładowanie.
          - entity: input_number.hoymiles_tariff_soc_safety_margin
            name: Dodatkowy zapas SOC
            requirement: optional
            description: Zwiększa zapas energii wymagany przez plan taryfowy.
          - entity: input_boolean.hoymiles_tariff_advanced_view
            name: Dane zaawansowane (tryb ekspercki)
      - type: custom:hoymiles-aurora-disclosure-card
        title: Co oznaczają ustawienia
        accent: battery
        view_layout:
          position: sidebar
        content: |-
          **Wymagane**

          - **Włącz tanią energię** — zezwala tej polityce przygotować kandydata do ładowania.
          - **Operator i taryfa** — wybierają obowiązujące okna oraz ceny energii.
          - **Maksymalna moc poboru** — ogranicza moc pobieraną z sieci w wybranym oknie.
          - **Docelowy poziom magazynu** — wyznacza najwyższy poziom ładowania dla tej polityki.

          **Opcjonalne**

          - **Dodatkowy zapas SOC** — zwiększa zapas energii wymagany przez plan taryfowy.
          - **Tryb ręczny** — pozwala podać własne strefy i ceny, gdy wybrany jest operator „Ręczny”.

          Wartość widoczna w każdym polu jest wartością efektywną. Brak lub
          nieaktualność wymaganego pola pojawia się w stanie gotowości i
          blokuje wyłącznie start tej polityki.
      - type: markdown
        title: Wybrany profil — podgląd
        entity_id: sensor.hoymiles_hit_tariff_charge_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_tariff_charge_plan %}
          {% if plan is not none %}
          {% set operator = states('input_select.hoymiles_tariff_operator') %}
          {% set group = states('input_select.hoymiles_tariff_type') %}
          {% if plan.attributes.tariff_profile_expired | default(false) %}
          ⚠️ **Cennik profilu wygasł. Automatyczne ładowanie jest zablokowane.**
          Zaktualizuj integrację albo wybierz profil **Ręczny** z aktualnymi cenami.

          {% endif %}
          {% if operator == 'Manual' %}
          **Tryb ręczny · {{ group }}**

          Godziny i łączne ceny krańcowe są pobierane z pól ręcznych poniżej.
          {% elif plan.attributes.tariff_profile_supported | default(false) %}
          **{{ plan.attributes.tariff_operator_name }} · {{ group }}**<br>
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          Założony sprzedawca: **{{ plan.attributes.tariff_supplier_assumption }}**<br>
          Cennik: **{{ plan.attributes.tariff_profile_year }}** · sezon:
          **{{ 'letni' if plan.attributes.tariff_profile_season == 'summer'
             else 'zimowy' }}**<br>
          {% endif %}
          Bieżąca strefa: **{{ plan.attributes.tariff_profile_current_zone }}** ·
          **{{ plan.attributes.tariff_profile_current_price }} PLN/kWh**<br>
          Tanie godziny: **{{ plan.attributes.tariff_profile_low_windows }}**<br>
          {% if group == 'G13' %}
          Średnia strefa: **{{ plan.attributes.tariff_profile_medium_windows }}**<br>
          {% endif %}
          Weekend w taniej strefie:
          **{{ 'tak' if plan.attributes.tariff_profile_weekend_low else 'nie' }}** ·
          święta: **{{ 'tak' if plan.attributes.tariff_profile_holiday_low else 'nie' }}**

          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          | Strefa | Cena poglądowa |
          |---|---:|
          | G11 (porównanie) | {{ plan.attributes.tariff_profile_g11_price }} PLN/kWh |
          | Tania | {{ plan.attributes.tariff_profile_low_price }} PLN/kWh |
          {% if group == 'G13' %}| Średnia | {{ plan.attributes.tariff_profile_medium_price }} PLN/kWh |
          {% endif %}| Droga | {{ plan.attributes.tariff_profile_peak_price }} PLN/kWh |

          [Oficjalne taryfy operatora]({{ plan.attributes.tariff_profile_source_url }})
          {% endif %}
          {% else %}
          ⚠️ Profil **{{ operator }} · {{ group }}** nie jest obsługiwany.
          Automatyczne ładowanie pozostanie zablokowane. Wybierz inną grupę
          albo profil **Ręczny**.
          {% endif %}

