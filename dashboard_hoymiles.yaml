            title: Balansowanie magazynu — ustawienia i stan
            accent: battery
            card:
              type: custom:hoymiles-zebra-entities-card
              title: Balansowanie magazynu — ustawienia i stan
              show_header_toggle: false
              state_color: true
              entities:
                - entity: input_boolean.hoymiles_battery_balancing_enabled
                  name: Włącz automatyczne balansowanie
                - entity: input_number.hoymiles_battery_balancing_interval_days
                  name: Wykonuj co określoną liczbę dni
                - entity: input_number.hoymiles_battery_balancing_hold_hours
                  name: Czas wyrównywania przy 100% SOC
                - entity: sensor.hoymiles_battery_balancing_status
                  name: Stan automatyki
                - entity: sensor.hoymiles_battery_balancing_next_run
                  name: Następny planowany cykl
                - entity: timer.hoymiles_battery_balancing_hold
                  name: Pozostały czas przy 100% SOC
                - entity: sensor.hoymiles_battery_balancing_slow_charge_power
                  name: Bieżący limit dla wolnego ładowania
          - type: custom:hoymiles-aurora-disclosure-card
            title: Jak działa balansowanie magazynu
            content: |-
              Okresowy cykl serwisowy dla magazynów LiFePO4. W dniu wykonania
              najpierw wykorzystuje produkcję PV i normalny limit BMS do 95% SOC.
              Od pierwszego prawidłowego odczytu co najmniej 95% utrzymuje wolne
              ładowanie około 0,4 kW netto dla całego magazynu. Po zachodzie używa
              zweryfikowanego ładowania z sieci i dodaje zużycie domu dokładnie raz.
              Zadany czas wyrównywania zaczyna liczyć dopiero po fizycznym
              potwierdzeniu trybu i nastaw przy 99,9% SOC.

              Podczas cyklu RCE, ładowanie taryfowe i ręczne harmonogramy EMS są
              blokowane przez istniejącą własność EMS; ich ustawienia pozostają
              niezmienione. Krótka luka świeżości w autokonsumpcji tylko wstrzymuje
              zapis, a błędy bezpieczeństwa zatrzymują cykl natychmiast. Zakończenie
              albo wyłączenie przywraca dokładne wcześniejsze nastawy i tryb EMS;
              fizyczna praca wyspowa zawsze ma pierwszeństwo. Funkcji używaj zgodnie
              z zaleceniami producenta magazynu.
          - type: custom:hoymiles-aurora-disclosure-card
            title: Limity BMS i temperatury
            description: Pełne limity prądu, napięcia i historia temperatur ogniw.
            accent: battery
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  title: Dostępna moc magazynu według BMS
                  entity_id: sensor.hoymiles_hit_ems_shared_inputs
                  content: |-
                    {% set shared = states.sensor.hoymiles_hit_ems_shared_inputs %}
                    {% set bms = shared.attributes.bms | default({}, true) if shared is not none else {} %}
                    {% set charge = bms.maximum_charge_power_kw | default({}, true) %}
                    {% set discharge = bms.maximum_discharge_power_kw | default({}, true) %}
                    **Ładowanie:**
                    {{ (charge.value | round(2)) ~ ' kW'
                       if charge.fresh | default(false) and charge.value is number else 'Brak danych' }}<br>
                    **Rozładowanie:**
                    {{ (discharge.value | round(2)) ~ ' kW'
                       if discharge.fresh | default(false) and discharge.value is number else 'Brak danych' }}

                    To bezpośrednie, świeże możliwości opublikowane przez BMS. Interfejs
                    nie przelicza prądu na moc.
                - type: custom:hoymiles-zebra-entities-card
                  title: Magazyn energii — stan, moc i limity BMS
                  show_header_toggle: false
                  state_color: true
                  entities:
                    - entity: sensor.hoymiles_hit_battery_capacity
                      name: "Pojemność ustawiona w falowniku"
                    - entity: sensor.hoymiles_hit_total_capacity
                      name: "Pojemność efektywna (awaryjne źródło BMS)"
                    - entity: sensor.hoymiles_hit_charge_cut_off_voltage
                      name: "Napięcie graniczne ładowania"
                    - entity: sensor.hoymiles_hit_discharge_cut_off_voltage
                      name: "Napięcie graniczne rozładowania"
                    - entity: sensor.hoymiles_hit_maximum_charge_current
                      name: Dostępny prąd ładowania
                    - entity: sensor.hoymiles_hit_maximum_discharge_current
                      name: Dostępny prąd rozładowania
                    - entity: sensor.hoymiles_hit_cell_max_temperature
                      name: Maksymalna temperatura celi
                    - entity: sensor.hoymiles_hit_cell_min_temperature
                      name: Minimalna temperatura celi
                - type: custom:hoymiles-aurora-history-card
                  title: Temperatura ogniw — ostatnie 7 dni
