        view_layout:
          position: sidebar
      - type: custom:hoymiles-zebra-entities-card
        title: Ochrona napięciowa — ustawienia
        view_layout:
          position: sidebar
        show_header_toggle: false
        state_color: true
        readiness_title: Gotowość konfiguracji
        entities:
          - entity: input_boolean.hoymiles_rcm_enabled
            name: Włącz ochronę napięciową
            requirement: required
            description: Pozwala RCEm przygotować własnego kandydata działania.
          - entity: input_boolean.hoymiles_rcm_export_control_enabled
            name: Płynna regulacja eksportu
            requirement: optional
            description: Ogranicza eksport, gdy potwierdzone napięcie rośnie.
          - entity: input_boolean.hoymiles_rcm_pre_discharge_enabled
            name: Przygotowanie miejsca przed dużą produkcją PV
            requirement: optional
            description: Może wcześniej utworzyć dokładnie wyliczone wolne miejsce.
          - entity: input_number.hoymiles_rcm_export_cap_percent
            name: Maksymalny eksport zgodny ze zgłoszeniem
            requirement: required
            description: Ustala twardy limit eksportu, którego RCEm nie przekroczy.
          - entity: input_number.hoymiles_rcm_soc_safety_margin
            name: Dodatkowy zapas SOC
            requirement: optional
            description: Zwiększa rezerwę chronioną wyłącznie przez RCEm.
          - entity: input_boolean.hoymiles_rcm_advanced_view
            name: Dane zaawansowane (tryb ekspercki)

      - type: custom:hoymiles-aurora-disclosure-card
        title: Co oznaczają ustawienia
        accent: warning
        view_layout:
          position: sidebar
        content: |-
          **Wymagane**

          - **Włącz ochronę napięciową** — zezwala RCEm przygotować własnego kandydata.
          - **Maksymalny eksport zgodny ze zgłoszeniem** — jest twardym limitem, którego RCEm nie może przekroczyć.

          **Opcjonalne**

          - **Płynna regulacja eksportu** — ogranicza eksport przy wzroście napięcia.
          - **Przygotowanie miejsca** — może zaplanować wcześniejsze opróżnienie części magazynu.
          - **Dodatkowy zapas SOC** — zwiększa rezerwę chronioną wyłącznie przez RCEm.

          Wartości widoczne w polach są wartościami efektywnymi. Brak bieżącego
          planu lub gotowości blokuje działania RCEm, ale nie blokuje pozostałych
          polityk EMS.

