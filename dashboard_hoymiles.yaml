      - type: custom:hoymiles-aurora-disclosure-card
        title: Wszystkie zaplanowane przedziały
        accent: battery
        entity_id: sensor.hoymiles_hit_tariff_charge_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_tariff_charge_plan %}
          {% if plan is not none %}
          {% set slots = plan.attributes.planned_slots | default([], true) %}
          {% set status = plan.attributes.status_code | default('missing_data', true) %}
          {% set missing = plan.attributes.missing_entities | default([], true) %}
          {% set low_direct = plan.attributes.remaining_low_direct_import_kwh
             | default(0) | float(0) %}
          {% set expensive = plan.attributes.remaining_expensive_import_kwh
             | default(0) | float(0) %}
          {% set physical = plan.attributes.capacity_or_power_shortfall_kwh
             | default(expensive) | float(0) %}
          {% set terminal = plan.attributes.terminal_shortfall_kwh
             | default(0) | float(0) %}
          **Tryb planu:** {{ 'aktywny' if is_state(
             'input_boolean.hoymiles_tariff_charge_enabled', 'on')
             else 'podgląd — automatyczne ładowanie jest wyłączone' }}<br>
          **Decyzja:** {{ states('sensor.hoymiles_hit_tariff_charge_plan') }}<br>
          **Energia w wybranych blokach ładowania z sieci:**
          {{ plan.attributes.planned_grid_import_kwh
             | default(0) }} kWh<br>
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          **Deficyt bez optymalizacji:**
          {{ plan.attributes.baseline_shortage_kwh | default(0) }} kWh<br>
          **Pozostały bezpośredni pobór w taniej strefie:**
          {{ low_direct | round(2) }} kWh<br>
          **Pozostały pobór w strefie średniej lub drogiej:**
          {{ expensive | round(2) }} kWh<br>
          **Niedobór wynikający z mocy lub pojemności:**
          {{ physical | round(2) }} kWh<br>
          **Brak rezerwy na końcu horyzontu:**
          {{ terminal | round(2) }} kWh<br>
          **Pozostały deficyt modelu — wartość techniczna:**
          {{ plan.attributes.remaining_shortage_kwh | default(0) }} kWh<br>
          **Bezpośrednio sieć → dom:**
          {{ plan.attributes.planned_direct_load_kwh | default(0) }} kWh<br>
          **Zapisane w magazynie po stratach:**
          {{ plan.attributes.planned_stored_energy_kwh | default(0) }} kWh<br>
          {% endif %}
          **Koszt planu:** {{ plan.attributes.planned_cost_pln | default(0) }} PLN<br>
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          **Koszt bez optymalizacji w tej taryfie:**
          {{ plan.attributes.baseline_grid_cost_pln | default(0) }} PLN<br>
          **Koszt po optymalizacji w tej taryfie:**
          {{ plan.attributes.optimized_grid_cost_pln | default(0) }} PLN<br>
          **Oszczędność dzięki przesunięciu poboru:**
          {{ plan.attributes.automation_savings_pln | default(0) }} PLN<br>
          **Ten sam pobór w G11:**
          {{ plan.attributes.g11_reference_cost_pln | default(0) }} PLN<br>
          {% endif %}
          **Szacowana oszczędność względem G11:**
          {{ plan.attributes.estimated_savings_pln | default(0) }} PLN<br>
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          **Model obciążenia:**
          {{ plan.attributes.load_profile_mode | default('flat_day_night_fallback') }}<br>
          **Fizyczna rezerwa Self-Use:**
          **{{ plan.attributes.self_use_reserve_soc_percent | default(0) }}%**<br>
          **Chronione zapotrzebowanie / margines:**
          {{ plan.attributes.protected_demand_kwh | default(0) }} kWh +
          {{ plan.attributes.demand_margin_percent | default(0) }}% =
          {{ plan.attributes.demand_margin_requested_kwh | default(0) }} kWh zapasu<br>
          **Wykonalny / niewykonalny zapas:**
          {{ plan.attributes.demand_margin_feasible_kwh | default(0) }} /
          {{ plan.attributes.demand_margin_unserved_kwh | default(0) }} kWh<br>
          **Cel energii wymagany / wykonalny:**
          {{ plan.attributes.requested_target_energy_kwh | default(0) }} /
          {{ plan.attributes.feasible_target_energy_kwh | default(0) }} kWh<br>
          **Historyczna korekta prognozy PV:**
          {{ (plan.attributes.forecast_accuracy_factor | default(0.9) * 100) | round(1) }}%
          ({{ plan.attributes.forecast_accuracy_history_days | default(0) }} dni historii)<br>
          **Efektywna korekta prognozy na dzisiaj:**
          {{ (plan.attributes.forecast_today_effective_factor
              | default(plan.attributes.forecast_accuracy_factor | default(0.9))
              * 100) | round(1) }}%<br>
          {% set expected = plan.attributes.forecast_live_expected_elapsed_kwh %}
          {% if expected is number %}
          **Kontrola produkcji w locie:** prognoza do teraz {{ expected }} kWh ·
          rzeczywista {{ plan.attributes.forecast_live_actual_elapsed_kwh | default(0) }} kWh ·
          pewność korekty {{ (plan.attributes.forecast_live_confidence
             | default(0) * 100) | round(0) }}%<br>
          {% endif %}
          **Horyzont symulacji:** {{ plan.attributes.planning_horizon_days
             | default(2) }} dni, do
          {{ plan.attributes.planning_horizon_end | default('—', true) }}<br>
          **Prognoza jutro P10 / P50 / P90:**
          {{ plan.attributes.forecast_tomorrow_p10_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_tomorrow_kwh | default('—', true) }} /
          {{ plan.attributes.forecast_tomorrow_p90_kwh | default('—', true) }} kWh<br>
          **Prognoza dnia 3:** {{ plan.attributes.forecast_day_3_kwh
             | default('brak — bezpieczny zapas zastępczy', true) }}
          {{ 'kWh' if plan.attributes.forecast_day_3_kwh is number else '' }}<br>
          {% set day3_entity = plan.attributes.forecast_day_3_entity | default(none) %}
          {% set day3_configured = plan.attributes.forecast_day_3_configured_entity
             | default(none) %}
          {% set day3_status = plan.attributes.forecast_day_3_status | default(none) %}
          {% set day3_fresh = plan.attributes.forecast_day_3_data_fresh | default(none) %}
          {% set day3_age = plan.attributes.forecast_day_3_age_seconds | default(none) %}
          {% set day3_reason = plan.attributes.forecast_day_3_data_reason | default(none) %}
          **Trzeci dzień — encja:**
          {{ day3_entity if day3_entity not in [none, '', 'not_enabled',
             'not_available', 'unknown', 'unavailable'] else 'brak wykrytej encji' }} ·
          konfiguracja:
          {{ day3_configured if day3_configured not in [none, '', 'automatic',
             'unknown', 'unavailable'] else 'automatyczna' }}<br>
          **Trzeci dzień — stan / świeżość:**
          {{ day3_status if day3_status not in [none, ''] else 'brak statusu' }} /
          {% if day3_fresh is none %}brak danych{% elif day3_fresh %}tak{% else %}nie{% endif %}<br>
          **Trzeci dzień — wiek ze znakiem:**
          {{ ((day3_age | float(0)) | round(1)) ~ ' s'
             if day3_age is number else 'brak znacznika czasu' }} · powód:
          {{ day3_reason if day3_reason not in [none, ''] else 'brak informacji' }}<br>
          **Budżet mocy ładowania z sieci:** żądany
          {{ plan.attributes.requested_charge_power_kw | default(0) }} kW · efektywny
          {{ plan.attributes.effective_charge_power_kw | default(0) }} kW ·
          źródło {{ plan.attributes.effective_charge_power_source
             | default('ustawienie') }}<br>
          **Uczenie rzeczywistej mocy:**
          {{ plan.attributes.effective_charge_power_feedback_samples | default(0) }} próbek ·
          współczynnik {{ ((plan.attributes.effective_charge_power_factor
             | default(1)) * 100) | round(0) }}% ·
          {{ 'model skalibrowany' if plan.attributes.charge_power_feedback_ready
             | default(false) else 'zbieranie próbek — używany limit ustawiony' }}<br>
          **Rezerwa końcowa z niepewnością:**
          {{ plan.attributes.terminal_reserve_soc_percent | default(0) }}% SOC ·
          margines {{ plan.attributes.terminal_uncertainty_margin_kwh
             | default(0) }} kWh<br>
          **Koszt zużycia magazynu energii w planie:**
          {{ plan.attributes.planned_battery_wear_cost_pln | default(0) }} PLN<br>
          **Stabilność decyzji:** {{ plan.attributes.plan_stable_for_minutes
             | default(0) }} min bez istotnej zmiany<br>
          {% endif %}
          **Przewidywany SOC na końcu horyzontu:**
          {{ plan.attributes.ending_battery_soc_percent | default(0) }}%

          {% if missing %}
          {% if is_state('input_boolean.hoymiles_tariff_advanced_view', 'on') %}
          ⚠️ **Brak wymaganych danych:** {{ missing | join(', ') }}
          {% else %}
          ⚠️ **Brakuje danych do pełnego planu.** Otwórz dane zaawansowane,
          aby zobaczyć szczegóły diagnostyczne.
          {% endif %}
          {% endif %}

          **Wybrane bloki:**
          {% if slots %}
          {% for slot in slots %}
          {% set action_name = {
             'grid_support': 'sieć → dom; zachowanie energii w magazynie',
             'battery_charge': 'ładowanie magazynu',
             'grid_support_and_charge': 'dom + ładowanie magazynu'
             }.get(slot.action, 'ładowanie') %}
          - {{ slot.date }} {{ slot.start }}–{{ slot.end }} ·
            {{ slot.grid_import_kwh }} kWh · {{ slot.price }} PLN/kWh ·
            **{{ action_name }}** · cel {{ slot.target_soc_percent }}% SOC
          {% endfor %}
          {% else %}
          - Brak zaplanowanego doładowania.
          {% endif %}
          {% endif %}
