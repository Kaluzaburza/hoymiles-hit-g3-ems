                  name: Maks. moc ładowania z sieci
                - entity: timer.hoymiles_charge
                  name: Pozostały czas bieżącego cyklu
                - entity: script.hoymiles_start_grid_charge
                  name: Uruchom ładowanie teraz
                  tap_action:
                    action: toggle
                    confirmation:
                      text: Uruchomić ręczne ładowanie z sieci? Upewnij się, że EMS jest bezpiecznie wyłączony.
            - type: custom:hoymiles-zebra-entities-card
              title: Balansowanie magazynu — działania serwisowe
              show_header_toggle: false
              state_color: true
              entities:
                - entity: sensor.hoymiles_battery_balancing_status
                  name: Stan cyklu
                - entity: sensor.hoymiles_battery_balancing_transaction
                  name: Stan transakcji
                - entity: binary_sensor.hoymiles_battery_balancing_restore_authorized
                  name: Zgoda na bezpieczne odtworzenie
                - entity: script.hoymiles_start_battery_balancing
                  name: Uruchom ręcznie
                  tap_action:
                    action: toggle
                    confirmation:
                      text: Uruchomić ręczny cykl balansowania magazynu?
                - entity: script.hoymiles_stop_battery_balancing
                  name: Zatrzymaj i bezpiecznie odtwórz
                  tap_action:
                    action: toggle
                    confirmation:
                      text: Zatrzymać cykl balansowania i rozpocząć bezpieczne odtworzenie nastaw?
      - type: custom:hoymiles-zebra-entities-card
        title: Bezpieczne zakończenie działania
        show_header_toggle: false
        state_color: true
        safe_off_banner: false
        safe_off_entities:
          - select.hoymiles_hit_ems_mode
          - number.hoymiles_hit_self_use_soc
        safe_off_off_grid_option: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Tryb pracy — w tym praca wyspowa
          - entity: number.hoymiles_hit_self_use_soc
            name: Rezerwa SOC — autokonsumpcja
          - entity: script.hoymiles_stop_scheduled_cycle
            name: Zatrzymaj i wróć do autokonsumpcji
          - entity: sensor.hoymiles_hit_ems_mode_readback_code
            name: Potwierdzony tryb falownika
      - type: markdown
        title: Stan bezpiecznego zatrzymania
        entity_id:
          - sensor.hoymiles_hit_ems_supervisor
          - sensor.hoymiles_hit_ems_mode_readback_code
        content: |-
          {% set supervisor = states.sensor.hoymiles_hit_ems_supervisor %}
          {% set stop = supervisor.attributes.master_stop | default(none, true) if supervisor is not none else none %}
          {% set status = stop.status | default('not_requested', true) if stop is mapping else 'not_requested' %}
          {% set labels = {'not_requested': 'Nie uruchomiono', 'requested': 'Wysyłanie polecenia bezpiecznego zatrzymania', 'in_progress': 'Polecenie wysłane — oczekiwanie na fizyczny odczyt', 'completed': 'Sukces — bezpieczny stan potwierdzony', 'blocked': 'Błąd — bezpieczne zatrzymanie zablokowane', 'failed': 'Błąd — bezpieczne zatrzymanie nie powiodło się'} %}
          **Wynik:** {{ labels.get(status, 'Brak danych') }}<br>
          **Transakcja:** {{ stop.transaction_id | default('Brak danych', true) if stop is mapping else 'Brak danych' }}<br>
          **Zlecono:** {{ stop.requested_at | default('Brak danych', true) if stop is mapping else 'Brak danych' }} · **Zakończono:** {{ stop.completed_at | default('Brak danych', true) if stop is mapping else 'Brak danych' }}<br>
          **Powód:** {{ stop.reason | default('Brak danych', true) if stop is mapping else 'Brak danych' }}<br>
          **Praca wyspowa zachowana:** {{ 'Tak' if stop is mapping and stop.off_grid_preserved is sameas true else 'Nie' if stop is mapping and stop.off_grid_preserved is sameas false else 'Brak danych' }}<br>
          **Rollback:** {{ supervisor.attributes.rollback_status | default('Brak danych', true) if supervisor is not none else 'Brak danych' }} · {{ supervisor.attributes.rollback_result | default('Brak danych', true) if supervisor is not none else 'Brak danych' }}<br>
          **Potwierdzony tryb:** {{ states('sensor.hoymiles_hit_ems_mode_readback_code') if states('sensor.hoymiles_hit_ems_mode_readback_code') not in ['unknown', 'unavailable', 'none', ''] else 'Brak danych' }}<br>
          Bieżący tryb i generacja są diagnostyką live. Backend nie publikuje
          skorelowanego payloadu FC03 dla zakończonej transakcji STOP.
      - type: custom:hoymiles-zebra-entities-card
        title: Sterowanie systemem
        show_header_toggle: false
        state_color: true
        safe_off_only: true
        safe_off_banner: false
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_system_operation
            name: "Praca systemu"
      - type: custom:hoymiles-zebra-entities-card
        title: Powiadomienia telefonu
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: input_boolean.hoymiles_ems_push_notifications_enabled
            name: "Powiadomienia o zmianach EMS"
          - entity: input_text.hoymiles_ems_push_notify_target
            name: "Telefon — usługa powiadomień"
          - entity: sensor.hoymiles_ems_push_notification_status
            name: "Stan powiadomień"
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          **Uwaga:** zmiana ustawienia „Praca systemu” może zatrzymać falownik.
          Encja `select.hoymiles_hit_parallel_networking_command` jest celowo pominięta,
          ponieważ w ESPHome ma `disabled_by_default: true`. Włącz ją w Home
          Assistant tylko wtedy, gdy konfigurujesz pracę równoległą.
