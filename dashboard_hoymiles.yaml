                  tap_action:
                    action: toggle
                    confirmation:
                      text: Uruchomić ręczne rozładowanie do sieci? Upewnij się, że EMS jest bezpiecznie wyłączony.
            - type: custom:hoymiles-zebra-entities-card
              title: Ładowanie z sieci
              show_header_toggle: false
              state_color: true
              safe_off_only: true
              safe_off_banner: false
              entities:
                - entity: input_boolean.hoymiles_charge_schedule_enabled
                  name: Włącz harmonogram codzienny
                - entity: input_datetime.hoymiles_charge_start
                  name: Godzina rozpoczęcia
                - entity: input_number.hoymiles_charge_duration
                  name: Czas trwania
                - entity: number.hoymiles_hit_force_charge_soc
                  name: Docelowy SOC — ładowanie z sieci
