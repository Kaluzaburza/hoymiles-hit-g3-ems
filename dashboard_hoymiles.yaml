      - type: markdown
        title: Stan teraz
        entity_id:
          - sensor.hoymiles_rcem_status
          - sensor.hoymiles_hit_rcm_voltage_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
          {% set status = states('sensor.hoymiles_rcem_status') %}
          {% set status_code = plan.attributes.status_code | default('missing_data', true) if plan is not none else 'missing_data' %}
          {% set plan_current = plan is not none
             and plan.attributes.result_current is sameas true
             and plan.attributes.recalculation_pending is sameas false %}
          {% set status_labels = {'ready': 'Napięcie bezpieczne', 'learning': 'Uczenie historii napięcia', 'preparing_headroom': 'Przygotowanie miejsca w magazynie', 'preparing_discharge': 'Kontrolowane przygotowanie miejsca', 'controlling': 'Regulacja ochrony przed 253 V', 'battery_limited': 'Ograniczenie możliwości magazynu', 'emergency': 'Szybka ochrona przy co najmniej 253 V', 'emergency_actuator_unavailable': 'Ochrona 253 V bez świeżych aktuatorów', 'battery_charge_unavailable': 'BMS nie przyjmuje ładowania', 'stale_voltage': 'Napięcia nieaktualne', 'history_stale': 'Historia napięcia nieaktualna', 'forecast_stale': 'Prognoza nieaktualna', 'missing_data': 'Brak wymaganych danych', 'optimizer_error': 'Błąd obliczeń'} %}
          **Stan automatyki:**
          {% if not plan_current %}
          Ostatni plan bez prawa wykonania — oczekiwanie na aktualny wynik
          {% elif 'Wyłączona' in status or 'Disabled' in status %}
          Wyłączona w EMS
          {% else %}
          {{ status_labels.get(status_code, status_code) }}
          {% endif %}

      - type: markdown
        title: Decyzja i najbliższy plan
        entity_id: sensor.hoymiles_hit_rcm_voltage_plan
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
          {% set plan_current = plan is not none
             and plan.attributes.result_current is sameas true
             and plan.attributes.recalculation_pending is sameas false %}
          {% if plan_current %}
          {% set status_code = plan.attributes.status_code | default('missing_data', true) %}
          {% set action = plan.attributes.action | default('none', true) %}
          {% set horizon = plan.attributes.risk_surplus_horizon | default('missing', true) %}
          {% set l1 = plan.attributes.voltage_l1_v | default(none, true) %}
          {% set l2 = plan.attributes.voltage_l2_v | default(none, true) %}
          {% set l3 = plan.attributes.voltage_l3_v | default(none, true) %}
          {% set maximum = plan.attributes.maximum_voltage_v | default(none, true) %}
          {% set maximum_phase = 'L1' if l1 is number and maximum is number and l1 == maximum else 'L2' if l2 is number and maximum is number and l2 == maximum else 'L3' if l3 is number and maximum is number and l3 == maximum else 'Brak danych' %}
          {% set status_labels = {'ready': 'Sieć w bezpiecznym zakresie', 'learning': 'Uczenie historii napięcia', 'preparing_headroom': 'Przewidywane ryzyko — zachowanie miejsca', 'preparing_discharge': 'Przewidywane ryzyko — przygotowanie miejsca', 'controlling': 'Podwyższone napięcie — aktywna regulacja', 'battery_limited': 'Podwyższone napięcie — magazyn ograniczony', 'emergency': 'Próg 253 V osiągnięty', 'emergency_actuator_unavailable': 'Próg 253 V bez świeżych aktuatorów', 'battery_charge_unavailable': 'Podwyższone napięcie — BMS nie przyjmuje energii', 'stale_voltage': 'Stan sieci nieznany — napięcia nieaktualne', 'history_stale': 'Bieżąca sieć dostępna, predykcja wstrzymana', 'forecast_stale': 'Bieżąca sieć dostępna, prognoza nieaktualna', 'missing_data': 'Stan sieci nieznany — brak danych', 'optimizer_error': 'Stan sieci nieznany — błąd obliczeń'} %}
          {% set risk_labels = {'ready': 'Niskie', 'learning': 'Brak oceny predykcyjnej', 'preparing_headroom': 'Przewidywane', 'preparing_discharge': 'Przewidywane', 'controlling': 'Wysokie', 'battery_limited': 'Wysokie', 'emergency': 'Krytyczne', 'emergency_actuator_unavailable': 'Krytyczne', 'battery_charge_unavailable': 'Wysokie', 'stale_voltage': 'Brak danych', 'history_stale': 'Brak oceny predykcyjnej', 'forecast_stale': 'Brak oceny predykcyjnej'} %}
          {% set action_labels = {'absorb_pv': 'Zwiększ pochłanianie PV przez magazyn', 'limit_export': 'Ogranicz eksport', 'monitor': 'Monitoruj bez zmiany nastaw', 'hold': 'Wstrzymaj działanie', 'restore': 'Przywróć ustawienie bazowe', 'release_export': 'Stopniowo zwolnij ograniczenie eksportu', 'grid_discharge_preparation': 'Przygotuj miejsce kontrolowanym rozładowaniem', 'preserve_headroom': 'Zachowaj wolne miejsce', 'none': 'Brak działania'} %}
          {% set horizon_labels = {
            'today': 'dzisiaj', 'tomorrow': 'jutro', 'none': 'brak',
            'missing': 'brak danych' } %}
          **Stan sieci:** {{ status_labels.get(status_code, status_code) }}<br>
          **Napięcia L1 / L2 / L3:** {{ (l1 | round(1)) ~ ' V' if l1 is number and l1 > 0 else 'Brak danych' }} / {{ (l2 | round(1)) ~ ' V' if l2 is number and l2 > 0 else 'Brak danych' }} / {{ (l3 | round(1)) ~ ' V' if l3 is number and l3 > 0 else 'Brak danych' }}<br>
          **Najwyższe napięcie i faza:** {{ (maximum | round(1)) ~ ' V · ' ~ maximum_phase if maximum is number and maximum > 0 else 'Brak danych' }}<br>
          **Średnia 10 minut:** {{ (plan.attributes.rolling_10m_voltage_v | round(1)) ~ ' V' if plan.attributes.rolling_10m_voltage_v is number and plan.attributes.rolling_10m_voltage_v > 0 else 'Brak danych' }}<br>
          **Ocena ryzyka:** {{ risk_labels.get(status_code, 'Brak danych') }}<br>
          **Najbliższe ryzyko:** {{ plan.attributes.next_risk_start | default('Brak danych', true) }}<br>
          **Wymagane wolne miejsce:** {{ (plan.attributes.required_headroom_kwh | round(2)) ~ ' kWh' if plan.attributes.required_headroom_kwh is number else 'Brak danych' }}<br>
          **Dostępne wolne miejsce:** {{ (plan.attributes.available_headroom_kwh | round(2)) ~ ' kWh' if plan.attributes.available_headroom_kwh is number else 'Brak danych' }}<br>
          **Prognoza PV dla okna ryzyka:**
          {{ (plan.attributes.selected_forecast_kwh | round(2)) ~ ' kWh'
             if plan.attributes.selected_forecast_kwh is number else 'Brak danych' }} ·
          {{ horizon_labels.get(horizon, 'brak danych') }}<br>
          **Cel SOC przed ryzykiem:**
          {{ (plan.attributes.target_soc_before_risk_percent | round(1)) ~ '%'
             if plan.attributes.target_soc_before_risk_percent is number else 'Brak danych' }}<br>
          **Limit ładowania:**
          {{ (plan.attributes.recommended_charge_limit_percent | round(1)) ~ '%'
             if plan.attributes.recommended_charge_limit_percent is number else 'Brak danych' }} ·
          {{ (plan.attributes.recommended_charge_power_kw | round(2)) ~ ' kW'
             if plan.attributes.recommended_charge_power_kw is number else 'Brak danych' }}<br>
          **Limit eksportu:**
          {{ (plan.attributes.recommended_export_limit_percent | round(1)) ~ '%'
             if plan.attributes.recommended_export_limit_percent is number else 'Brak danych' }}<br>
          **Działanie:** {{ action_labels.get(action, action) }}
          {% elif plan is not none %}
          **Ostatni plan — bez prawa wykonania.** RCEm oczekuje na wynik zgodny
          z bieżącymi wejściami. Nieaktualne wartości nie są pokazywane jako
          gotowość ani bieżąca decyzja.
          {% else %}
          **Brak danych.** RCEm czeka na własny aktualny plan; pozostałe polityki
          mogą nadal pracować niezależnie.
          {% endif %}

      - type: custom:hoymiles-aurora-disclosure-card
        title: Pokaż pełne obliczenia RCEm
        accent: warning
        content: |-
          {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
          {% if plan is not none %}
          {% set windows = plan.attributes.risk_windows | default([], true) %}
          {% set window_details = plan.attributes.risk_window_details
             | default([], true) %}
          {% set planned = plan.attributes.planned_grid_discharge_kwh
             | default(0) | float(0) %}
          {% set horizon = plan.attributes.risk_surplus_horizon
             | default('missing') %}
          {% set horizon_labels = {
            'today': 'dzisiaj', 'tomorrow': 'jutro', 'none': 'brak',
            'missing': 'brak danych' } %}
          **Tryb:** planowanie dla EMS; fizyczne wykonanie wyłącznie
          w trybie wykonawczym po przyznaniu właściciela<br>
          **Wynik:** {{ plan.state }}<br>
          **Bieżące działanie:** {{ plan.attributes.action | default('brak') }}<br>
          **Najwyższe napięcie:**
          {{ plan.attributes.maximum_voltage_v | default(0) }} V<br>
          **Średnia 10 min:**
          {{ plan.attributes.rolling_10m_voltage_v | default(0) }} V<br>
          **Ryzyko napięciowe:**
          {{ plan.attributes.voltage_risk_score_percent | default(0) }}%<br>
          **Najbliższe przewidywane okno ryzyka:**
          {{ plan.attributes.next_risk_start | default('brak') }}<br>
          **Prognoza użyta do następnego okna:**
          {{ plan.attributes.selected_forecast_kwh | default(0) }} kWh ·
          {{ horizon_labels.get(horizon, horizon) }}<br>
          **Przewidywana nadwyżka PV w oknie ryzyka:**
          {{ plan.attributes.expected_risk_surplus_kwh | default(0) }} kWh<br>
          **Chroniony minimalny SOC domu i rezerwy:**
          {{ plan.attributes.protected_minimum_soc_percent | default(0) }}%<br>
          **Wolne miejsce potrzebne na szczyt:**
          {{ plan.attributes.required_headroom_kwh | default(0) }} kWh<br>
          **Dostępne wolne miejsce:**
          {{ plan.attributes.available_headroom_kwh | default(0) }} kWh<br>
          **Brakujące wolne miejsce:**
          {{ plan.attributes.headroom_shortfall_kwh | default(0) }} kWh<br>
          {% if planned > 0.1 %}
          **Zaplanowane poranne rozładowanie do sieci:**
          {{ planned | round(2) }} kWh<br>
          **Docelowy SOC po porannym rozładowaniu:**
          {{ plan.attributes.pre_discharge_target_soc_percent | default(0) }}%<br>
          **Automatycznie dobrana moc rozładowania:**
          {{ plan.attributes.pre_discharge_power_kw | default(0) }} kW ·
          {{ plan.attributes.pre_discharge_power_percent | default(0) }}%<br>
          **Czas do dzisiejszego okna ryzyka:**
          {% set minutes = plan.attributes.minutes_to_risk %}
          {{ ((minutes | int(0)) // 60) ~ ' h ' ~ ((minutes | int(0)) % 60) ~ ' min'
             if minutes is number else 'brak dzisiejszego okna' }}<br>
          {% else %}
          **Poranne rozładowanie:** nie jest potrzebne lub brak dzisiejszego
          okna ryzyka.<br>
          {% endif %}
          **Docelowy maksymalny SOC przed szczytem:**
          {{ plan.attributes.target_soc_before_risk_percent | default(0) }}%<br>
          **Zalecany globalny limit ładowania:**
          {{ plan.attributes.recommended_charge_limit_percent | default(0) }}% ·
          {{ plan.attributes.recommended_charge_power_kw | default(0) }} kW<br>
          **Zalecany bieżący limit eksportu:**
          {{ plan.attributes.recommended_export_limit_percent | default(0) }}%<br>
          **Szacowana bezpieczna moc eksportu:**
          {{ plan.attributes.estimated_safe_export_power_kw
             if plan.attributes.estimated_safe_export_power_kw is number
             else '— (brak produkcji lub eksportu)' }}
          {{ 'kW' if plan.attributes.estimated_safe_export_power_kw is number else '' }}

          {% if is_state('input_boolean.hoymiles_rcm_advanced_view', 'on') %}
          ---
          **Historia:** {{ plan.attributes.history_days | default(0) }} dni ·
          {{ plan.attributes.history_samples | default(0) }} próbek<br>
          **P90 napięcia dla bieżącego kwadransa:**
          {{ plan.attributes.historical_p90_voltage_v | default(0) }} V<br>
          **Źródło profilu PV:**
          {{ plan.attributes.pv_profile_source | default('profil zastępczy') }} ·
          pewność {{ plan.attributes.pv_profile_confidence_percent
             | default(0) }}%<br>
          **Profil zużycia domu:**
          {{ plan.attributes.load_profile_mode | default('profil zastępczy') }}<br>
          **Zapotrzebowanie domu w oknie ryzyka:**
          {{ plan.attributes.expected_risk_load_kwh | default(0) }} kWh<br>
          **Naturalne miejsce zasilając dom przed szczytem:**
          {{ plan.attributes.expected_natural_headroom_kwh | default(0) }} kWh<br>
          **Nieuniknione ładowanie do chwili szczytu:**
          {{ plan.attributes.unavoidable_charge_before_risk_kwh | default(0) }} kWh<br>
          **Efektywny twardy limit eksportu:**
          {{ plan.attributes.effective_export_cap_percent | default(0) }}%<br>
          **Powtarzalne okna ryzyka z ostatnich czterech dni:**
          {% if window_details %}
          {% for window in window_details %}
          - {{ window.start | default('—') }}–{{ window.end | default('—') }} ·
            nadwyżka {{ window.expected_surplus_kwh | default(0) }} kWh ·
            wymagane miejsce {{ window.required_headroom_kwh | default(0) }} kWh
          {% endfor %}
          {% elif windows %}
          {% for window in windows %}
          - {{ window }}
          {% endfor %}
          {% else %}
          - Nie wykryto jeszcze powtarzalnego okna wysokiego napięcia.
          {% endif %}
          {% endif %}
          {% endif %}

      - type: custom:hoymiles-zebra-entities-card
        title: Regulator — wartości bieżące
        show_header_toggle: false
        state_color: true
        safe_off_entities:
          - number.hoymiles_hit_battery_max_charge_power
          - number.hoymiles_hit_maximum_export_power_limit
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        entities:
          - entity: binary_sensor.hoymiles_rcem_risk_window_active
            name: Historyczne okno ryzyka aktywne
          - entity: sensor.hoymiles_rcem_voltage_risk
            name: Ryzyko napięciowe
          - entity: sensor.hoymiles_rcem_required_battery_headroom
            name: Wymagane wolne miejsce w magazynie
          - entity: sensor.hoymiles_rcem_headroom_shortfall
            name: Brakujące wolne miejsce w magazynie
          - entity: sensor.hoymiles_rcem_natural_headroom_before_risk
            name: Naturalne miejsce zasilając dom przed szczytem
          - entity: sensor.hoymiles_rcem_planned_grid_discharge
            name: Zaplanowane poranne rozładowanie do sieci
          - entity: sensor.hoymiles_rcem_pre_discharge_target_soc
            name: Docelowy SOC porannego rozładowania
          - entity: sensor.hoymiles_rcem_pre_discharge_power
            name: Automatycznie dobrana moc rozładowania
          - entity: sensor.hoymiles_rcem_recommended_battery_charge_limit
            name: Zalecany globalny limit ładowania
          - entity: number.hoymiles_hit_battery_max_charge_power
            name: Rzeczywisty globalny limit ładowania magazynu
          - entity: sensor.hoymiles_rcem_recommended_export_limit
            name: Zalecany limit eksportu
          - entity: number.hoymiles_hit_maximum_export_power_limit
            name: Rzeczywisty maksymalny limit eksportu
          - entity: sensor.hoymiles_hit_maximum_charge_current
            name: Maksymalny prąd ładowania BMS
          - entity: sensor.hoymiles_hit_overview_battery_soc
            name: SOC magazynu

      - type: custom:hoymiles-aurora-disclosure-card
        title: Jak RCEm reaguje na napięcie
        accent: warning
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        content: |-
          W czasie normalnej regulacji automatyka pozostaje w
          **autokonsumpcji**. Łączy prognozę Solcast na dziś i jutro,
          rzeczywisty profil zużycia domu z czterech dni, SOC, pojemność
          magazynu i historyczne napięcia L1/L2/L3. Najwyższa z faz ma zawsze
          pierwszeństwo. Przy wzroście napięcia RCEm dobiera bezpieczny limit
          ładowania lub eksportu zgodnie z bieżącym planem i odczytami.

      - type: custom:hoymiles-aurora-disclosure-card
        title: Jak chroni rezerwę magazynu
        accent: warning
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        content: |-
          Od prognozy PV odejmowane jest zużycie domu; dopiero pozostała
          nadwyżka wymaga miejsca w magazynie. RCEm uwzględnia miejsce, które
          powstanie naturalnie, gdy magazyn zasila dom przed szczytem. Cykl
          przygotowawczy kończy się po osiągnięciu docelowego SOC albo
          wcześniej, gdy najwyższa faza wzrośnie do 248,4 V lub średnia
          10-minutowa do 249,2 V. Nigdy nie schodzi poniżej chronionego SOC
          domu i rezerwy.

      - type: custom:hoymiles-aurora-disclosure-card
        title: Jak uwzględnia zero-export
        accent: warning
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        content: |-
          Poranne rozładowanie wymaga trybu wykonawczego EMS, zgody na
          RCEm, aktywnego GCF, potwierdzonego limitu eksportu większego od 0%
          i braku blokady sprzedaży. Gdy limit wynosi 0%, rozładowanie do sieci
          nie uzyskuje prawa wykonania, a wskazanie planu pozostaje wyłącznie
          informacją. RCEm nie włącza GCF — użytkownik ustawia go świadomie.

          Opcjonalna regulacja eksportu zmienia wyłącznie maksymalny limit
          eksportu i nigdy nie przekracza mniejszej z wartości: limitu
          zastanego przy uruchomieniu oraz pola **Maksymalny eksport zgodny ze
          zgłoszeniem**.

      - type: custom:hoymiles-aurora-disclosure-card
        title: Jak przygotowuje miejsce na PV
        accent: warning
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        content: |-
          Jeżeli po uwzględnieniu zasilania domu nadal brakuje pojemności,
          opcja **Przygotowanie miejsca przed dużą produkcją PV** może
          zaplanować rozładowanie wyłącznie o obliczony brak. Moc wynika z
          wymaganej energii i czasu do okna, z 30-minutowym zapasem.

          Przed przewidywanym szczytem RCEm może ograniczyć maksymalną moc
          ładowania magazynu, aby nie napełnić go za wcześnie. Wyliczony plan
          nie jest potwierdzeniem fizycznego wykonania.

      - type: custom:hoymiles-aurora-disclosure-card
        title: Jak współpracuje z EMS
        accent: warning
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        content: |-
          Planer RCEm nie zapisuje falownika. EMS niezależnie sprawdza
          gotowość, przyznaje jednego właściciela, wykonuje komendę, potwierdza
          odczyt fizyczny i po zakończeniu odtwarza ustawienia sprzed transakcji.

          RCE, ładowanie taryfowe i ochrona napięciowa mogą być włączone jednocześnie. EMS
          wybiera jedną bezpieczną akcję; balansowanie magazynu i ręczne plany
          EMS zachowują własne bramki pierwszeństwa.

      - type: custom:hoymiles-aurora-disclosure-card
        title: Co dzieje się przy braku danych
        accent: warning
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        content: |-
          Brak aktualnego planu, historii napięć, prognozy albo wymaganego
          odczytu blokuje wyłącznie działanie RCEm, które potrzebuje tej danej.
          Nie wyłącza EMS i nie blokuje aktualnej, bezpiecznej polityki
          ładowania taryfowego ani RCE. Wartości niepewne są pokazywane jako
          **Brak danych**, bez nadawania prawa wykonania.

      - type: custom:hoymiles-aurora-disclosure-card
        title: Ograniczenia i diagnostyka
        accent: warning
        visibility:
          - condition: state
            entity: input_boolean.hoymiles_rcm_advanced_view
            state: "on"
        view_layout:
          position: sidebar
        content: |-
          RCEm nie zmienia asymetrii trójfazowej, Q(U), P(U), współczynnika
          mocy ani progów zabezpieczeń. To automatyka zarządzania energią, nie
          certyfikowane zabezpieczenie sieciowe.

          Jedyny wykonawca może zmieniać limit ładowania najwyżej o 10 punktów
          procentowych na minutę, a limit eksportu o 5–15 punktów zależnie od
          napięcia. Przy 253 V eksport może zostać natychmiast ograniczony do
          0%, a magazyn użyje pełnego bezpiecznego limitu BMS. Pełne profile,
          równania, okna historyczne i wartości regulatora pozostają w sekcji
          **Pokaż pełne obliczenia RCEm** oraz w diagnostyce eksperckiej.

